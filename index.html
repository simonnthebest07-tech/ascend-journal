/* =========================================================
   ASCEND ELECTRON — WINDOW RESIZE ZONES
   ========================================================= */

#resize-top,
#resize-bottom,
#resize-left,
#resize-right,
#resize-top-left,
#resize-top-right,
#resize-bottom-left,
#resize-bottom-right {
    position: fixed;
    z-index: 1000000;

    -webkit-app-region: no-drag;

    pointer-events: auto;
}


/* -----------------------------------------
   TOP
   ----------------------------------------- */

#resize-top {
    top: 0;
    left: 8px;
    right: 8px;
    height: 5px;

    cursor: ns-resize;
}


/* -----------------------------------------
   BOTTOM
   ----------------------------------------- */

#resize-bottom {
    bottom: 0;
    left: 8px;
    right: 8px;
    height: 8px;

    cursor: ns-resize;
}


/* -----------------------------------------
   LEFT
   ----------------------------------------- */

#resize-left {
    top: 8px;
    bottom: 8px;
    left: 0;
    width: 5px;

    cursor: ew-resize;
}


/* -----------------------------------------
   RIGHT
   ----------------------------------------- */

#resize-right {
    top: 8px;
    bottom: 8px;
    right: 0;
    width: 5px;

    cursor: ew-resize;
}


/* -----------------------------------------
   CORNERS
   ----------------------------------------- */

#resize-top-left {
    top: 0;
    left: 0;

    width: 8px;
    height: 8px;

    cursor: nwse-resize;
}

#resize-top-right {
    top: 0;
    right: 0;

    width: 8px;
    height: 8px;

    cursor: nesw-resize;
}

#resize-bottom-left {
    bottom: 0;
    left: 0;

    width: 8px;
    height: 8px;

    cursor: nesw-resize;
}

#resize-bottom-right {
    bottom: 0;
    right: 0;

    width: 8px;
    height: 8px;

    cursor: nwse-resize;
}

/* Web mode deliberately exposes no Electron window controls or resize targets. */
body:not(.ascend-electron) #ascend-titlebar,
body:not(.ascend-electron) #resize-top,
body:not(.ascend-electron) #resize-bottom,
body:not(.ascend-electron) #resize-left,
body:not(.ascend-electron) #resize-right,
body:not(.ascend-electron) #resize-top-left,
body:not(.ascend-electron) #resize-top-right,
body:not(.ascend-electron) #resize-bottom-left,
body:not(.ascend-electron) #resize-bottom-right { display:none !important; }

/* ========================================================================

:root{
  --asc-content-max:1540px;
  --asc-page-pad-x:clamp(20px,4vw,56px);
  --asc-page-pad-y:clamp(28px,4vw,44px);

  --asc-section-gap:clamp(28px,4vw,52px);
  --asc-grid-gap:clamp(12px,1.6vw,22px);
  --asc-ink-subtle:color-mix(in srgb,var(--text) 74%,transparent);

}
html[data-asc-palette="ascend-original"]{

html[data-asc-palette="obsidian-luxury"]{

}

}
html[data-asc-palette="ios-future"]{
  --asc-ice:#8fbeff; --asc-ice-rgb:143,190,255; --accent:#8fbeff; --accent-rgb:143,190,255; --accent-dim:#c3dcff; --accent-hover:#ecf3ff; --accent-ink:#0a1729;
}
html[data-asc-palette="minimal-mono"]{
  --asc-ice:#f1f4f6; --asc-ice-rgb:241,244,246; --accent:#f1f4f6; --accent-rgb:241,244,246; --accent-dim:#ffffff; --accent-hover:#ffffff; --accent-ink:#101316; --positive:#98b7a7; --negative:#d9a2aa; --warning:#c9bc9c;

html[data-theme="light"][data-asc-palette="ascend-original"]{--asc-ice:#137b5b;--asc-ice-rgb:19,123,91;--accent:#137b5b;--accent-rgb:19,123,91;--accent-dim:#0f6047;--accent-hover:#0b4a37;--accent-ink:#fff;}
html[data-theme="light"][data-asc-palette="obsidian-luxury"]{--asc-ice:#9a6c18;--asc-ice-rgb:154,108,24;--accent:#9a6c18;--accent-rgb:154,108,24;--accent-dim:#79530d;--accent-hover:#5f4108;--accent-ink:#fff;}
html[data-theme="light"][data-asc-palette="arctic-modern"]{--asc-ice:#176cac;--asc-ice-rgb:23,108,172;--accent:#176cac;--accent-rgb:23,108,172;--accent-dim:#125786;--accent-hover:#0c4268;--accent-ink:#fff;}
html[data-theme="light"][data-asc-palette="ios-future"]{--asc-ice:#356ed1;--asc-ice-rgb:53,110,209;--accent:#356ed1;--accent-rgb:53,110,209;--accent-dim:#2455a8;--accent-hover:#1b437f;--accent-ink:#fff;}
html[data-theme="light"][data-asc-palette="minimal-mono"]{--asc-ice:#17202a;--asc-ice-rgb:23,32,42;--accent:#17202a;--accent-rgb:23,32,42;--accent-dim:#26323d;--accent-hover:#0d1218;--accent-ink:#fff;}

body[data-asc-style="luxury"]{--asc-radius-control:12px;--asc-radius-surface:20px;--asc-radius-floating:24px;--glass-blur:22px;--shadow-sm:0 19px 42px -28px rgba(0,0,0,.72);}

body[data-asc-style="minimal"]{--asc-radius-control:6px;--asc-radius-surface:8px;--asc-radius-floating:10px;--glass-blur:0px;--shadow-sm:none;--asc-line-strong:var(--asc-line);}
body[data-asc-style="technical"]{--asc-radius-control:4px;--asc-radius-surface:6px;--asc-radius-floating:8px;--glass-blur:8px;--density-pad:16px;}
body[data-animation-level="minimal"] *{transition-duration:0ms!important;animation-duration:0ms!important;animation-iteration-count:1!important;}
body[data-animation-level="immersive"]{--asc-motion-fast:150ms;--asc-motion-standard:240ms;--asc-motion-emphasis:340ms;}

body.ascend-v18 #topbar{position:sticky;top:42px;min-height:66px;padding:0 var(--asc-page-pad-x);background:color-mix(in srgb,var(--asc-shell-surface) 86%,transparent);border-bottom:1px solid var(--asc-shell-line);box-shadow:0 10px 28px -30px rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,.035);}

body.ascend-v18 .topbar-right{position:relative;z-index:1;}
body.ascend-v18 .rail-mode{margin:0;padding:0;border-top:0;}
body.ascend-v18 .rail-collapse-bar{order:4;}

.asc-page-shell{display:flex;flex-direction:column;gap:var(--asc-section-gap);max-width:var(--asc-content-max);}
.asc-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--asc-line-readable);}

.asc-page-kicker{font:600 9px var(--font-mono);letter-spacing:.16em;color:var(--asc-meta-readable);}
.asc-page-title{margin:8px 0 0;font:650 var(--asc-type-h1)/1 var(--font-display);letter-spacing:-.06em;font-size:clamp(31px,3.1vw,42px);}
.asc-page-subtitle{margin:9px 0 0;max-width:720px;color:var(--text-muted);font-size:13px;line-height:1.6;}
.asc-action-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.asc-section{display:flex;flex-direction:column;gap:16px;}
.asc-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--asc-line-readable);padding-bottom:11px;}
.asc-section-head h2{margin:0;font:650 var(--asc-type-h2)/1.1 var(--font-display);letter-spacing:-.04em;}
.asc-section-head p{margin:6px 0 0;color:var(--text-muted);font-size:12px;}
.asc-kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--asc-line);border-bottom:1px solid var(--asc-line);}
.asc-kpi-strip>div{padding:16px 18px;border-right:1px solid var(--asc-line);min-width:0;}
.asc-kpi-strip>div:last-child{border-right:0;}
.asc-kpi-strip span,.asc-metric-label{display:block;font:600 8px var(--font-mono);letter-spacing:.14em;color:var(--text-faint);}
.asc-kpi-strip b,.asc-metric-value{display:block;margin-top:8px;font:600 var(--asc-type-data-m)/1 var(--font-mono);letter-spacing:-.055em;font-variant-numeric:tabular-nums;}
.asc-kpi-strip small{display:block;margin-top:7px;color:var(--text-faint);font-size:10px;}
.asc-insight{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:18px 0;border-top:1px solid var(--asc-line);border-bottom:1px solid var(--asc-line);}
.asc-insight-index{display:flex;align-items:flex-start;justify-content:center;width:34px;height:28px;border:1px solid var(--asc-line-strong);border-radius:9px;color:var(--accent);font:600 9px var(--font-mono);padding-top:8px;}
.asc-insight h3{margin:0;font:650 17px/1.2 var(--font-display);letter-spacing:-.035em;}
.asc-insight-grid{display:grid;grid-template-columns:1.35fr 1fr .85fr;gap:18px;margin-top:12px;}
.asc-insight-grid span{display:block;font:600 8px var(--font-mono);letter-spacing:.14em;color:var(--text-faint);margin-bottom:6px;}
.asc-insight-grid p{margin:0;color:var(--text-muted);font-size:12px;line-height:1.55;}
.asc-empty{padding:48px 0;border-top:1px solid var(--asc-line);border-bottom:1px solid var(--asc-line);max-width:680px;}
.asc-empty-index{font:600 9px var(--font-mono);letter-spacing:.15em;color:var(--accent);}
.asc-empty h3{margin:13px 0 8px;font:650 24px/1.05 var(--font-display);letter-spacing:-.045em;}

.asc-metric-row{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(92px,.55fr));gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--asc-line);}

.asc-data-table{border-top:1px solid var(--asc-line);border-bottom:1px solid var(--asc-line);}

.asc-data-table th{font:600 8px var(--font-mono);letter-spacing:.14em;color:var(--text-faint);text-align:left;padding:10px 8px;border-bottom:1px solid var(--asc-line);}

.asc-theme-preview{margin-top:22px;border:1px solid var(--asc-line);border-radius:var(--asc-radius-surface);overflow:hidden;background:var(--asc-frost);}
.asc-theme-preview-bar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--asc-line);background:rgba(var(--accent-rgb),.055);}

.asc-theme-preview-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0;}
.asc-theme-preview-kpis>div{padding:10px;border:1px solid var(--asc-line);border-radius:var(--asc-radius-control);background:rgba(255,255,255,.025);}
.asc-theme-preview-kpis span{display:block;font:600 7px var(--font-mono);letter-spacing:.1em;color:var(--text-faint);}
.asc-theme-preview-kpis b{display:block;margin-top:7px;font:600 15px var(--font-mono);}
.asc-theme-preview-table{display:grid;grid-template-columns:1fr .55fr .55fr;gap:8px;padding-top:8px;border-top:1px solid var(--asc-line);font-size:10px;color:var(--text-muted);}
body.ascend-v18 .asc-evidence-grid{gap:32px;}
body.ascend-v18 .asc-evidence-card{padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;}

body.ascend-v18 .asc-evidence-card header{padding-bottom:14px;border-bottom:1px solid var(--asc-line);}
body.ascend-v18 .asc-evidence-card-charts{gap:14px;margin:16px 0 0;}

@media(max-width:900px){

  .asc-theme-preview-core{grid-template-columns:1fr;}
  .asc-metric-row{grid-template-columns:1fr 1fr;}

/* ========================================================================
   ASCEND PHASE 3 — DECISION WORKSPACES
   Dashboard, capital, model library, preparation and continuous analytics.

body.ascend-v18 .asc-command-dashboard{max-width:var(--asc-content-max);}
body.ascend-v18 .asc-command-grid{margin-top:0;}
.asc-dashboard-read{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:18px 0;border-top:1px solid var(--asc-line);border-bottom:1px solid var(--asc-line);}

.asc-capital-panel{display:flex;flex-direction:column;gap:18px;text-align:left;padding:22px;border:1px solid var(--asc-line);border-radius:var(--asc-radius-surface);background:var(--asc-frost);color:var(--text);cursor:pointer;transition:border-color var(--asc-motion-standard) var(--asc-ease),background var(--asc-motion-standard) var(--asc-ease),transform var(--asc-motion-standard) var(--asc-ease);}
.asc-capital-panel:hover{border-color:var(--border-accent);background:rgba(var(--accent-rgb),.055);transform:translateY(-2px);}

.asc-capital-track b{font:600 10px var(--font-mono);color:var(--text);}
.asc-capital-rule{display:flex;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--asc-line);font-size:11px;color:var(--text-muted);}

.asc-playbook-body{display:flex;flex:1;flex-direction:column;gap:14px;padding:18px;}

.asc-prep-today{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(360px,1.35fr) minmax(200px,.65fr);border:1px solid var(--asc-line);border-radius:var(--asc-radius-surface);background:var(--asc-frost);overflow:hidden;}

<script>
'use strict';
/* =========================================================
   ASCEND TraderOS — single-file local-first application
   ========================================================= */

// ===================== CONSTANTS =====================
// Single source of truth for the app version shown in the UI (Settings → Updates, etc).
// Do not hardcode a version string anywhere else — reference ASCEND_APP_VERSION instead.
const ASCEND_APP_VERSION = '1.10.0';
// Rank 5 client-side migration registry. The canonical production ledger and SQL
// checksums live in migrations/; this runtime map makes local cache compatibility
// explicit without exposing or querying Supabase's internal migration ledger.
const CLIENT_MIGRATION_REGISTRY = Object.freeze({
  formatVersion: 1,
  localDatabaseVersion: '1.7.0',
  minimumCloudMigration: '20260820150000',
  capabilities: Object.freeze({
    tradeModeColumn: '20260817172130',
    accountModeAndGuard: '20260817194443',
    recordRevisions: '20260818080238',
    recoveryAudit: '20260818082559',
    completeModeOwnership: '20260818085430',
    securityPrivacyHardening: '20260818092757',
    transactionalWorkspaceOperations: '20260819115302',
    transactionalRestoreAuditFix: '20260819120122',
    transactionalWorkspaceRevisionGuard: '20260820150000'
  })
});
const ASCEND_DB_VERSION = CLIENT_MIGRATION_REGISTRY.localDatabaseVersion;
const LEGACY_DB_KEY = 'ascend_db_v1';
const LEGACY_MEDIA_DB = 'ascend_media_v1';
const DB_KEY = LEGACY_DB_KEY;

// ===================== DATA BOUNDARIES =====================
// Journal data is durable and cloud-synced. Interface preferences belong to this
// device and are intentionally stored separately, so switching a theme never
// causes an unrelated journal-data sync.
const UI_PREFERENCE_FIELDS = ['theme', 'density', 'animationIntensity', 'animationLevel', 'palette', 'styleVariant', 'contrast', 'motionPreference', 'navCollapsed'];
const DEFAULT_UI_PREFERENCES = Object.freeze({
  theme: 'light', density: 'comfortable', animationIntensity: 'normal', animationLevel: 'balanced', palette: 'ascend-original', styleVariant: 'ascend-core', contrast: 'standard', motionPreference: 'system', navCollapsed: true
});
const ASCEND_PALETTES = Object.freeze([
  {id:'ascend-original',name:'ASCEND Original',detail:'Black, deep emerald, and neutral graphite.'},
  {id:'obsidian-luxury',name:'Obsidian Luxury',detail:'Black, warm champagne, and graphite.'},
  {id:'arctic-modern',name:'Arctic Modern',detail:'Deep graphite, cool blue, and silver.'},
  {id:'ios-future',name:'iOS Future',detail:'Soft blue with restrained translucent layers.'},
  {id:'minimal-mono',name:'Minimal Mono',detail:'Black, white, and disciplined grey.'}
]);
const ASCEND_STYLE_VARIANTS = Object.freeze([
  {id:'ascend-core',name:'ASCEND Core',detail:'Balanced Ice-Frost operating system.'},
  {id:'luxury',name:'Luxury',detail:'More depth, softer geometry, and composed elevation.'},
  {id:'future-glass',name:'Future Glass',detail:'Translucent layers, broader radii, and cool depth.'},
  {id:'minimal',name:'Minimal',detail:'Reduced decoration and visual noise.'},
  {id:'technical',name:'Technical',detail:'Sharper surfaces and denser analytical presentation.'}
]);
const ASCEND_ANIMATION_LEVELS = Object.freeze([
  {id:'minimal',name:'Minimal',detail:'Functional state changes only.'},
  {id:'balanced',name:'Balanced',detail:'Normal ASCEND feedback and drawer motion.'},
  {id:'immersive',name:'Immersive',detail:'More pronounced but professional micro-interactions.'}
]);
function preferencesKeyFor(userId){ return `ascend_ui_preferences_v1_${userId || 'local'}`; }
const UIStore = {
  normalize(raw){
    const value = Object.assign({}, DEFAULT_UI_PREFERENCES, raw || {});
    if(!['light','dark'].includes(value.theme)) value.theme = DEFAULT_UI_PREFERENCES.theme;
    if(!['comfortable','compact'].includes(value.density)) value.density = DEFAULT_UI_PREFERENCES.density;
    if(!['normal','off'].includes(value.animationIntensity)) value.animationIntensity = DEFAULT_UI_PREFERENCES.animationIntensity;
    if(!['minimal','balanced','immersive'].includes(value.animationLevel)) value.animationLevel = value.animationIntensity==='off' ? 'minimal' : DEFAULT_UI_PREFERENCES.animationLevel;
    if(!['ascend-original','obsidian-luxury','arctic-modern','ios-future','minimal-mono'].includes(value.palette)) value.palette = DEFAULT_UI_PREFERENCES.palette;
    if(!['ascend-core','luxury','future-glass','minimal','technical'].includes(value.styleVariant)) value.styleVariant = DEFAULT_UI_PREFERENCES.styleVariant;
    if(!['standard','high'].includes(value.contrast)) value.contrast = DEFAULT_UI_PREFERENCES.contrast;
    if(!['system','reduce','full'].includes(value.motionPreference)) value.motionPreference = DEFAULT_UI_PREFERENCES.motionPreference;
    value.navCollapsed = !!value.navCollapsed;
    return value;
  },
  fromLegacySettings(settings){
    const legacy = {};
    UI_PREFERENCE_FIELDS.forEach(key=>{ if(settings && settings[key] !== undefined) legacy[key] = settings[key]; });
    return this.normalize(legacy);
  },
  load(userId){
    try{
      const raw = localStorage.getItem(preferencesKeyFor(userId));
      return raw ? this.normalize(JSON.parse(raw)) : null;
    }catch(e){ return null; }
  },
  persist(userId, preferences){
    try{
      localStorage.setItem(preferencesKeyFor(userId), JSON.stringify(this.normalize(preferences)));
      return true;
    }catch(e){
      console.error('ASCEND preference write error', e);
      return false;
    }
  },
  migrateLegacy(userId, settings){
    const existing = this.load(userId);
    if(existing) return existing;
    const migrated = this.fromLegacySettings(settings);
    this.persist(userId, migrated);
    return migrated;
  },
  stripFrom(settings){
    UI_PREFERENCE_FIELDS.forEach(key=>delete settings[key]);
    return settings;
  }
};
function sharedSettings(settings){
  const shared = UIStore.stripFrom(Object.assign({}, settings || {}));
  // Last-save is device-local cache metadata. It must not create a profile cloud
  // mutation whenever a journal record is saved or enter the durable sync queue.
  delete shared.lastSave;
  return shared;
}
function profileSnapshot(db){
  return JSON.stringify({ settings: sharedSettings(db.settings), tags: db.tags, savedFilters: db.savedFilters, processTargets: db.processTargets });
}

// ===================== DUAL MODE FOUNDATION =====================
// Application mode is a durable, device-local workspace choice. It is not a
// theme, profile preference, or cloud setting, and it never changes trade data.
const APP_MODES = Object.freeze({ LIVE:'live', BACKTEST:'backtest' });
const DEFAULT_APP_MODE = APP_MODES.LIVE;
function normalizeAppMode(mode){ return mode===APP_MODES.BACKTEST ? APP_MODES.BACKTEST : APP_MODES.LIVE; }
function appModeLabel(mode){ return normalizeAppMode(mode)===APP_MODES.BACKTEST ? 'Backtesting' : 'Live Trading'; }
function appModeStorageKey(userId){ return `ascend_app_mode_v1_${userId || 'local'}`; }
const AppModeStore = {
  load(userId){
    try{ return normalizeAppMode(localStorage.getItem(appModeStorageKey(userId))); }
    catch(e){ return DEFAULT_APP_MODE; }
  },
  persist(userId, mode){
    try{ localStorage.setItem(appModeStorageKey(userId), normalizeAppMode(mode)); return true; }
    catch(e){ console.error('ASCEND mode write error', e); return false; }
  }
};
// Trade records are classified independently from the active workspace. The
// selector is the single safe way for pages to retrieve live or backtest data.
function normalizeTradeMode(mode){ return normalizeAppMode(mode); }
function getTradesForMode(trades, mode){
  const activeMode = normalizeAppMode(mode===undefined ? State.appMode : mode);
  return (trades||[]).filter(trade=>normalizeTradeMode(trade.mode)===activeMode);
}
function getCurrentModeTrades(){ return getModeSafeTrades(State.db, State.appMode); }

// ===================== RANK 6: COMPLETE MODE OWNERSHIP =====================
// Accounts/trades have exact workspace ownership already. Every remaining entity
// now declares an explicit mode; only reference entities may be deliberately Shared.
const MODE_SCOPE_SHARED = 'shared';
const MODE_OWNED_ENTITY_KEYS = Object.freeze(['premarket','dailyReviews','weeklyReviews','monthlyReviews','playbooks','notes']);
const EXECUTION_MODE_ENTITY_KEYS = Object.freeze(['premarket','dailyReviews','weeklyReviews','monthlyReviews']);
const REFERENCE_MODE_ENTITY_KEYS = Object.freeze(['playbooks','notes']);
const PROFILE_SCOPED_COLLECTIONS = Object.freeze(['tags','savedFilters','processTargets']);
function isModeOwnedEntity(key){ return MODE_OWNED_ENTITY_KEYS.includes(key); }
function allowsSharedMode(key){ return REFERENCE_MODE_ENTITY_KEYS.includes(key); }
function legacyModeForEntity(key){ return allowsSharedMode(key) ? MODE_SCOPE_SHARED : APP_MODES.LIVE; }
function normalizeOwnedMode(key, value){
  if(value===APP_MODES.LIVE || value===APP_MODES.BACKTEST) return value;
  return allowsSharedMode(key) && value===MODE_SCOPE_SHARED ? MODE_SCOPE_SHARED : legacyModeForEntity(key);
}
const MODE_SCOPE_REPAIR = 'repair_required';
function canonicalModeOwnedRecord(key, record){
  if(!isModeOwnedEntity(key)) return Object.assign({}, record||{});
  const source=Object.assign({},record||{});
  // A legacy review whose workspace cannot be inferred must remain outside both
  // execution workspaces until the owner resolves it; silently defaulting it to
  // Live would contaminate Live review status with Backtest evidence.
  if(source.mode!==MODE_SCOPE_REPAIR) source.mode=normalizeOwnedMode(key,source.mode);
  return key==='playbooks'?canonicalPlaybookRecord(source):source;
}
function canonicalizeModeOwnedCollection(key, records){ return (records||[]).map(record=>canonicalModeOwnedRecord(key,record)); }

// Rank 16 — a Playbook is a logical model with immutable user-authored versions.
// Trade links store their own version snapshot so future model edits cannot rewrite
// the process context that was recorded with an historic trade.
const PLAYBOOK_SNAPSHOT_FIELDS=Object.freeze(['name','description','market','direction','session','htfScreenshot','entryCriteria','confirmationCriteria','entryConditions','confirmation','stopPlacement','targetLogic','riskRules','invalidations','notes','customFields','mode']);
function cloneJournalValue(value){ return value===undefined ? undefined : JSON.parse(JSON.stringify(value)); }
function playbookSnapshot(playbook){
  const source=playbook&&typeof playbook==='object'?playbook:{};
  return PLAYBOOK_SNAPSHOT_FIELDS.reduce((snapshot,key)=>{ snapshot[key]=source[key]===undefined?(key==='mode'?normalizeOwnedMode('playbooks',source.mode):''):cloneJournalValue(source[key]); return snapshot; },{});
}
function playbookVersionId(playbookId,number){ return `${String(playbookId||'playbook')}:v${Number(number)||1}`; }
function canonicalPlaybookVersion(version,playbook,fallbackNumber){
  const source=version&&typeof version==='object'?version:{};
  const number=Number.isInteger(Number(source.number))&&Number(source.number)>0?Number(source.number):fallbackNumber;
  const snapshot=Object.assign(playbookSnapshot(playbook),source.snapshot&&typeof source.snapshot==='object'?cloneJournalValue(source.snapshot):{});
  snapshot.mode=normalizeOwnedMode('playbooks',snapshot.mode);
  return {id:String(source.id||playbookVersionId(playbook&&playbook.id,number)),number,createdAt:source.createdAt||playbook&&playbook.updatedAt||playbook&&playbook.createdAt||null,changeNote:String(source.changeNote||''),snapshot};
}

// Content 22 — strategy-agnostic schema migration. Legacy field names are copied
// once into neutral keys, retained in an explicit archival payload for import/export
// traceability, and removed from active records so current renderers never depend on
// HTF/LTF or liquidity-specific architecture. This migration is idempotent.
const STRATEGY_AGNOSTIC_TRADE_FIELD_MAP=Object.freeze({
  htfBias:'contextBias', htfStructure:'contextStructure', htfLiquidity:'contextKeyFactors',
  htfKeyLevels:'keyLevels', htfConfluences:'contextConfluences', htfFollowed:'contextFollowed',
  htfNotes:'contextNotes', ltfBias:'entryBias', ltfStructure:'entryStructure',
  ltfLiquidity:'entryKeyFactors', ltfKeyLevels:'entryKeyLevels', ltfEntryTrigger:'entryTrigger',
  ltfConfluences:'entryConfluences', ltfNotes:'entryNotes'
});
const STRATEGY_AGNOSTIC_PLAYBOOK_FIELD_MAP=Object.freeze({htfRequirements:'entryCriteria',ltfRequirements:'confirmationCriteria'});
function hasStoredJournalValue(value){ return value!==undefined&&value!==null&&!(typeof value==='string'&&value===''); }
function migrateMappedJournalFields(source, fieldMap, archiveKey){
  const record=Object.assign({},source&&typeof source==='object'?source:{}), archive=Object.assign({},record[archiveKey]&&typeof record[archiveKey]==='object'?record[archiveKey]:{});
  Object.entries(fieldMap).forEach(([legacyKey,nextKey])=>{
    if(!Object.prototype.hasOwnProperty.call(record,legacyKey)) return;
    if(!hasStoredJournalValue(record[nextKey])) record[nextKey]=record[legacyKey];
    archive[legacyKey]=record[legacyKey];
    delete record[legacyKey];
  });
  if(Object.keys(archive).length) record[archiveKey]=archive;
  return record;
}
function migrateStrategyAgnosticTradeFields(trade){
  const record=migrateMappedJournalFields(trade,STRATEGY_AGNOSTIC_TRADE_FIELD_MAP,'legacyStrategyFields');
  ['contextBias','contextStructure','contextKeyFactors','keyLevels','contextConfluences','contextNotes','entryBias','entryStructure','entryKeyFactors','entryKeyLevels','entryTrigger','entryConfluences','entryNotes'].forEach(key=>{ if(record[key]===undefined) record[key]=''; });
  if(record.contextFollowed===undefined) record.contextFollowed=null;
  if(!record.customFieldValues||typeof record.customFieldValues!=='object'||Array.isArray(record.customFieldValues)) record.customFieldValues={};
  return record;
}
function migrateStrategyAgnosticPlaybookFields(playbook){
  const record=migrateMappedJournalFields(playbook,STRATEGY_AGNOSTIC_PLAYBOOK_FIELD_MAP,'legacyPlaybookFields');
  if(record.entryCriteria===undefined) record.entryCriteria='';
  if(record.confirmationCriteria===undefined) record.confirmationCriteria='';
  if(!Array.isArray(record.customFields)) record.customFields=[];
  return record;
}
function applyContent22Migrations(db){
  if(!db||typeof db!=='object') return db;
  db.settings=Object.assign({},db.settings||{});
  if(db.settings.tradeBySession===undefined) db.settings.tradeBySession=true;
  if(db.settings.showPremarketNav===undefined) db.settings.showPremarketNav=true;
  if(db.settings.traderProfile===undefined) db.settings.traderProfile='';
  const report={trades:[],playbooks:[]};
  db.trades=(db.trades||[]).map(trade=>{ const before=JSON.stringify(trade||{}), migrated=migrateStrategyAgnosticTradeFields(trade); if(JSON.stringify(migrated)!==before) report.trades.push(migrated.id||null); return migrated; });
  db.playbooks=(db.playbooks||[]).map(playbook=>{ const before=JSON.stringify(playbook||{}), migrated=migrateStrategyAgnosticPlaybookFields(playbook); if(JSON.stringify(migrated)!==before) report.playbooks.push(migrated.id||null); return migrated; });
  db._content22MigrationReport=report;
  return db;
}

function canonicalPlaybookRecord(playbook){
  const record=migrateStrategyAgnosticPlaybookFields(playbook);
  record.mode=normalizeOwnedMode('playbooks',record.mode);

function repairTradeAccountLinks(db){

function dataURLtoBlob(dataURL){
  const [meta, b64] = dataURL.split(',');
  const mime = (meta.match(/data:(.*?);base64/) || [,'application/octet-stream'])[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function extractIndexedCols(entityKey, record){
  // Small set of columns pulled out of the record for FKs/filtering/indexes.
  // The full record always lives in payload; Rank 6 mirrors explicit scope into
  // indexed entity columns when the formal migration capability is available.
  const modeCols=isModeOwnedEntity(entityKey)&&CloudCapabilities.completeModeOwnership===true?{mode:canonicalModeOwnedRecord(entityKey,record).mode}:{};

    case 'trades': {
      const canonical = canonicalTradeRecord(record);
      const cols = { account_id: canonical.accountId || null, date: canonical.date || null, result: canonical.result || null };
      if(CloudCapabilities.tradeModeColumn===true) cols.mode = canonical.mode;
      return cols;
    }
    case 'premarket': return Object.assign({ date: record.date || null },modeCols);
    case 'dailyReviews': return Object.assign({ date: record.date || null },modeCols);
    case 'weeklyReviews': return Object.assign({ week_start: record.weekStart || null },modeCols);
    case 'monthlyReviews': return Object.assign({ month_key: record.monthKey || null },modeCols);
    case 'accounts': {
      const canonical = canonicalAccountRecord(record);
      const cols = { status: canonical.status || null };
      if(CloudCapabilities.accountModeColumn===true) cols.mode = canonical.mode;
      return cols;
    }
    case 'notes': return Object.assign({ category: record.category || null },modeCols);
    case 'playbooks': return modeCols;

  }
}
function cloudRecord(entityKey, record, userId){
  const payload = entityKey==='trades' ? canonicalTradeRecord(record) : (entityKey==='accounts' ? canonicalAccountRecord(record) : (isModeOwnedEntity(entityKey)?canonicalModeOwnedRecord(entityKey,record):record));

}
function workspaceRevisionBaseline(revisions){
  const source=revisions&&typeof revisions==='object'?revisions:{};
  const entities={};
  ENTITY_KEYS.forEach(key=>{
    const values=source.entities&&source.entities[key];
    const entries=[];
    if(values&&typeof values.forEach==='function') values.forEach((revision,id)=>{ const normalized=Number(revision); if(normalized>0&&Number.isFinite(normalized)) entries.push({id:String(id),revision:normalized}); });

  });

  return {profile:Number.isFinite(profileRevision)&&profileRevision>0?profileRevision:0,entities};
}

// Diff-based sync: only changed/removed records are pushed to Supabase, so a save
// never has to reload or rewrite the whole database.
function snapshotEntities(db){
  const snap = {};
  ENTITY_KEYS.forEach(k=>{ snap[k] = new Map((db[k]||[]).map(r=>[r.id, JSON.stringify(r)])); });
  snap.profile = profileSnapshot(db);
  return snap;
}
const CloudSync = {
  _lastSynced: null,
  _pending: false,
  _queued: false,
  setBaseline(db){ this._lastSynced = snapshotEntities(db); },
  setStatus(state){
    const dot = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    if(!dot || !label) return;
    dot.className = 'sync-dot ' + state;
    label.textContent = state==='saving' ? 'Saving…' : state==='error' ? 'Offline' : 'Synced';
  },
  async push(db){
    if(!CURRENT_USER_ID) return;
    if(this._pending){ this._queued = true; return; }
    this._pending = true;
    this.setStatus('saving');
    try{
      const before = this._lastSynced || { profile: null };
      const next = snapshotEntities(db);
      const ops = [];
      ENTITY_KEYS.forEach(k=>{
        const prevMap = before[k] || new Map();
        const nextMap = next[k];
        nextMap.forEach((json, id)=>{ if(prevMap.get(id) !== json) ops.push(CloudDB.upsertRecord(k, JSON.parse(json), CURRENT_USER_ID)); });
        prevMap.forEach((json, id)=>{ if(!nextMap.has(id)) ops.push(CloudDB.deleteRecord(k, id, CURRENT_USER_ID)); });
      });
      if(before.profile !== next.profile) ops.push(CloudDB.saveProfile(CURRENT_USER_ID, db));
      await Promise.all(ops);
      this._lastSynced = next;
      this.setStatus('synced');
    }catch(e){
      console.error('ASCEND cloud sync error', e);
      this.setStatus('error');
      toast('Could not sync to the cloud — your data is safe locally, will retry on next save', 'error');
    }finally{
      this._pending = false;
      if(this._queued){ this._queued = false; this.push(db); }
    }
  }
};

// Revision metadata is deliberately held outside every journal payload. This keeps
// exports/imports backward compatible while allowing every ordinary sync write to
// require the revision observed at the last confirmed cloud hydration.
CloudCapabilities.revisionSupport = null;
CloudCapabilities.detectRevisionSupport = async function(){
  if(this.revisionSupport !== null) return this.revisionSupport;
  const tables = ['profiles'].concat(Object.values(ENTITY_TABLES));
  const checks = await Promise.all(tables.map(table=>sb.from(table).select('revision').limit(1)));
  this.revisionSupport = checks.every(result=>!result.error);
  if(!this.revisionSupport) console.info('ASCEND sync: revision columns unavailable; using the legacy unprotected sync path until Rank 2 migration is present.');
  return this.revisionSupport;
};

CloudDB.loadFullState = async function(userId){
  const [hasTradeModeColumn,hasAccountModeColumn,hasRevision] = await Promise.all([CloudCapabilities.detectTradeModeColumn(),CloudCapabilities.detectAccountModeColumn(),CloudCapabilities.detectRevisionSupport()]);
  const selects = ENTITY_KEYS.map(k=> k==='trades' ? this.loadTradeRows(userId,hasTradeModeColumn,hasRevision) : (k==='accounts' ? this.loadAccountRows(userId,hasAccountModeColumn,hasRevision) : sb.from(ENTITY_TABLES[k]).select(hasRevision ? 'payload,revision,created_at' : 'payload,created_at').eq('user_id',userId).order('created_at',{ascending:true})));

  const [profileRes,...results] = await Promise.all([sb.from('profiles').select(profileFields).eq('id',userId).maybeSingle(),...selects]);
  results.forEach(result=>{ if(result.error) throw result.error; });
  if(profileRes.error) throw profileRes.error;

  const revisions = { profile: hasRevision && profileRes.data ? Number(profileRes.data.revision)||1 : null, entities:{} };

      if(k==='trades') return Object.assign({},payload,{mode:normalizeTradeMode(payload.mode!==undefined?payload.mode:row.mode)});

    db.savedFilters=profileRes.data.saved_filters||[];
    db.processTargets=(profileRes.data.process_targets&&profileRes.data.process_targets.length)?profileRes.data.process_targets:db.processTargets;
  }

CloudDB.fetchRemoteRecord = async function(entityKey,id,userId){

  const ownerField = entityKey==='profile' ? 'id' : 'id';

  if(entityKey!=='profile') query=query.eq('user_id',userId);
  const { data,error } = await query.maybeSingle();
  if(error) throw error;
  if(!data) return null;
  if(entityKey==='profile') return { record:{settings:data.settings||{},tags:data.tags||[],savedFilters:data.saved_filters||[],processTargets:data.process_targets||[]}, revision:Number(data.revision)||1, updatedAt:data.updated_at||null };

CloudDB.writeRecord = async function(entityKey,record,userId,expectedRevision){
  if(isModeOwnedEntity(entityKey) && !isRecordModeValid(entityKey,record)) throw new Error('Record scope is invalid for this journal entity');
  if(entityKey==='trades' && record.accountId && !isTradeAccountModeCompatible(record,State.db)) throw new Error('Trade and account modes must match before cloud sync');
  if(!(await CloudCapabilities.detectRevisionSupport())){ await this._rank1UpsertRecord(entityKey,record,userId); return { applied:true,revision:null,legacy:true }; }
  if(entityKey==='trades') await CloudCapabilities.detectTradeModeColumn();
  if(entityKey==='accounts') await CloudCapabilities.detectAccountModeColumn();
  if(isModeOwnedEntity(entityKey)) await CloudCapabilities.detectCompleteModeOwnership();
  const table=ENTITY_TABLES[entityKey];
  const row=cloudRecord(entityKey,record,userId);
  if(expectedRevision===null || expectedRevision===undefined){
    const {data,error}=await sb.from(table).insert(row).select('revision').maybeSingle();
    if(error){ const remote=await this.fetchRemoteRecord(entityKey,record.id,userId); if(remote) return {applied:false,remote}; throw error; }
    if(!data) return {applied:false,remote:await this.fetchRemoteRecord(entityKey,record.id,userId)};
    return {applied:true,revision:Number(data.revision)||1};
  }
  const {data,error}=await sb.from(table).update(row).eq('id',record.id).eq('user_id',userId).eq('revision',expectedRevision).select('revision').maybeSingle();
  if(error) throw error;
  if(!data) return {applied:false,remote:await this.fetchRemoteRecord(entityKey,record.id,userId)};
  return {applied:true,revision:Number(data.revision)||Number(expectedRevision)+1};
};
CloudDB.deleteRecord = async function(entityKey,id,userId,expectedRevision){

};

CloudSync._conflicts=[];
CloudSync._revisions={profile:null,entities:{}};
CloudSync.setBaseline=function(db,revisions){
  this._lastSynced=snapshotEntities(db);
  const source=revisions||{profile:null,entities:{}};
  // Revision 1 is the additive migration's default for existing cloud rows. The
  // fallback is used only by deterministic fixtures or immediately after a bulk
  // push; hydrated production rows always supply their authoritative revision.
  this._revisions={profile:source.profile===undefined||source.profile===null?1:source.profile,entities:{}};
  ENTITY_KEYS.forEach(key=>{
    this._revisions.entities[key]=new Map();
    const values=source.entities&&source.entities[key];
    if(values&&typeof values.forEach==='function') values.forEach((revision,id)=>this._revisions.entities[key].set(id,revision));
    (db[key]||[]).forEach(record=>{ if(!this._revisions.entities[key].has(record.id)) this._revisions.entities[key].set(record.id,1); });
  });
};
CloudSync.revisionFor=function(entityKey,id){ return entityKey==='profile' ? this._revisions.profile : ((this._revisions.entities[entityKey]||new Map()).has(id)?this._revisions.entities[entityKey].get(id):null); };

CloudSync._upsertBaseline=function(entityKey,id,json,revision){

  (this._lastSynced[entityKey]||new Map()).set(id,json);

CloudSync._removeBaseline=function(entityKey,id){
  if(entityKey==='profile'){ this._lastSynced.profile=null; this._revisions.profile=null; return; }

CloudSync._recordConflict=function(context,result){

CloudSync.setStatus=function(state){
  const dot=document.getElementById('sync-dot'); const label=document.getElementById('sync-label'); const chip=document.getElementById('sync-status');

  dot.className='sync-dot '+state;

CloudSync._applyRemote=function(conflict,remote){
  const key=conflict.entityKey;
  if(key==='profile'){
    const source=remote&&remote.record;
    if(source){ State.db.settings=Object.assign(defaultDB().settings,source.settings||{}); State.db.tags=source.tags||[]; State.db.savedFilters=source.savedFilters||[]; State.db.processTargets=source.processTargets||defaultDB().processTargets; this._upsertBaseline('profile',conflict.id,profileSnapshot(State.db),remote.revision); }
    return;
  }
  const collection=State.db[key]||[]; const index=collection.findIndex(record=>idEq(record.id,conflict.id));
  if(remote&&remote.record){ if(index>=0) collection[index]=remote.record; else collection.push(remote.record); this._upsertBaseline(key,conflict.id,JSON.stringify(remote.record),remote.revision); }
  else { if(index>=0) collection.splice(index,1); this._removeBaseline(key,conflict.id); }

CloudSync._finishConflict=function(conflict){

CloudSync.resolveConflict=async function(entityKey,id,action){
  const conflict=this._conflicts.find(item=>item.entityKey===entityKey&&item.id===id);
  if(!conflict) return;
  if(action==='cloud'){ this._applyRemote(conflict,conflict.remote); this._finishConflict(conflict); router(); return; }
  const localRecord=conflict.localRecord;
  const current=await CloudDB.fetchRemoteRecord(entityKey,id,CURRENT_USER_ID);
  if(action==='both' && entityKey!=='profile' && localRecord){
    const copy=Object.assign({},localRecord,{id:uid('conf'),notes:((localRecord.notes||'')+' [Conflict copy]').trim()});
    const copyResult=await CloudDB.writeRecord(entityKey,copy,CURRENT_USER_ID,null);
    if(!copyResult.applied){ conflict.remote=copyResult.remote; this.setStatus('conflict'); return; }
    State.db[entityKey].push(copy);
    this._upsertBaseline(entityKey,copy.id,JSON.stringify(copy),copyResult.revision);
    this._applyRemote(conflict,current);
    this._finishConflict(conflict); router(); return;
  }
  let result;
  if(entityKey==='profile'){
    result=await CloudDB.saveProfile(CURRENT_USER_ID,State.db,current?current.revision:null);
  }else if(localRecord===null){
    result=current?await CloudDB.deleteRecord(entityKey,id,CURRENT_USER_ID,current.revision):{applied:true,revision:null};
  }else{
    result=await CloudDB.writeRecord(entityKey,localRecord,CURRENT_USER_ID,current?current.revision:null);
  }
  if(!result.applied){ conflict.remote=result.remote; this.setStatus('conflict'); return; }
  if(entityKey==='profile') this._upsertBaseline('profile',id,profileSnapshot(State.db),result.revision);

CloudSync.openConflictResolver=function(){
  const conflict=this._conflicts[0];
  if(!conflict){ toast('No sync conflicts need review','success'); return; }
  const remote=conflict.remote&&conflict.remote.record;
  const localText=conflict.localRecord===null?'Deleted locally':JSON.stringify(conflict.localRecord,null,2).slice(0,900);
  const remoteText=remote?JSON.stringify(remote,null,2).slice(0,900):'Deleted remotely or unavailable';
  const entityLabel=conflict.entityKey==='profile'?'Shared settings':conflict.entityKey.replace(/([A-Z])/g,' $1').replace(/^./,letter=>letter.toUpperCase());
  const allowBoth=conflict.entityKey!=='profile'&&conflict.localRecord!==null;
  Modal.open({
    title:'Sync conflict needs review',
    bodyHTML:'<p class="muted" style="font-size:13px;">'+esc(entityLabel)+' changed on another device. ASCEND kept both copies safe and did not overwrite either one.</p><div class="field-row" style="align-items:stretch;"><div class="card" style="flex:1;min-width:0;"><div class="field-label">Your local version</div><pre style="white-space:pre-wrap;max-height:220px;overflow:auto;font-size:11px;">'+esc(localText)+'</pre></div><div class="card" style="flex:1;min-width:0;"><div class="field-label">Cloud version</div><pre style="white-space:pre-wrap;max-height:220px;overflow:auto;font-size:11px;">'+esc(remoteText)+'</pre></div></div><p class="hint" style="margin-top:12px;">Choose a safe resolution. “Keep mine” rechecks the latest cloud revision before writing; it never forces an overwrite.</p>',
    footerHTML:'<button class="btn" data-close>Decide later</button><button class="btn" id="conf-cloud">Keep cloud</button><button class="btn btn-primary" id="conf-mine">Keep mine</button>'+(allowBoth?'<button class="btn" id="conf-both">Keep both</button>':''),
    onMount:(overlay,close)=>{
      const resolve=async action=>{ try{ await this.resolveConflict(conflict.entityKey,conflict.id,action); close(); if(this._conflicts.length) setTimeout(()=>this.openConflictResolver(),200); }catch(error){ console.error('ASCEND conflict resolution error',error); toast('Could not resolve this conflict — both copies remain safe locally','error'); } };
      overlay.querySelector('#conf-cloud').onclick=()=>resolve('cloud');

    }
  });

CloudSync.push=async function(db){
  if(!CURRENT_USER_ID) return;
  if(this._pending){ this._queued=true; return; }
  this._pending=true; this.setStatus('saving');
  try{
    const protectedSync=await CloudCapabilities.detectRevisionSupport();
    const before=this._lastSynced||{profile:null}; const next=snapshotEntities(db);
    if(!protectedSync){
      const legacyOps=[];
      ENTITY_KEYS.forEach(key=>{ const prev=before[key]||new Map(); const future=next[key]; future.forEach((json,id)=>{ if(prev.get(id)!==json) legacyOps.push(this._rank1Write?this._rank1Write(key,JSON.parse(json)):CloudDB._rank1UpsertRecord(key,JSON.parse(json),CURRENT_USER_ID)); }); prev.forEach((json,id)=>{ if(!future.has(id)) legacyOps.push(CloudDB._rank1DeleteRecord(key,id,CURRENT_USER_ID)); }); });
      if(before.profile!==next.profile) legacyOps.push(CloudDB._rank1SaveProfile(CURRENT_USER_ID,db));
      await Promise.all(legacyOps); this._lastSynced=next; this.setStatus('unprotected'); return;
    }
    const operations=[];
    ENTITY_KEYS.forEach(key=>{
      const prev=before[key]||new Map(); const future=next[key];
      future.forEach((json,id)=>{
        if(prev.get(id)===json) return;
        if(this._hasConflict(key,id)){ const conflict=this._conflicts.find(item=>item.entityKey===key&&item.id===id); conflict.localRecord=JSON.parse(json); return; }
        operations.push({entityKey:key,id,localRecord:JSON.parse(json),baseRecord:prev.has(id)?JSON.parse(prev.get(id)):null,json,run:()=>CloudDB.writeRecord(key,JSON.parse(json),CURRENT_USER_ID,this.revisionFor(key,id))});
      });
      prev.forEach((json,id)=>{
        if(future.has(id)) return;
        if(this._hasConflict(key,id)){ const conflict=this._conflicts.find(item=>item.entityKey===key&&item.id===id); conflict.localRecord=null; return; }
        operations.push({entityKey:key,id,localRecord:null,baseRecord:JSON.parse(json),json:null,run:()=>CloudDB.deleteRecord(key,id,CURRENT_USER_ID,this.revisionFor(key,id))});
      });
    });
    if(before.profile!==next.profile && !this._hasConflict('profile',CURRENT_USER_ID)) operations.push({entityKey:'profile',id:CURRENT_USER_ID,localRecord:{settings:sharedSettings(db.settings),tags:db.tags||[],savedFilters:db.savedFilters||[],processTargets:db.processTargets||[]},baseRecord:before.profile?JSON.parse(before.profile):null,json:next.profile,run:()=>CloudDB.saveProfile(CURRENT_USER_ID,db,this.revisionFor('profile',CURRENT_USER_ID))});

    results.forEach(({operation,result})=>{

      if(operation.entityKey==='profile') this._upsertBaseline('profile',operation.id,operation.json,result.revision);
      else if(operation.localRecord===null) this._removeBaseline(operation.entityKey,operation.id);
      else this._upsertBaseline(operation.entityKey,operation.id,operation.json,result.revision);
    });
    this.setStatus(this._conflicts.length?'conflict':'synced');
    if(this._conflicts.length) toast(this._conflicts.length===1?'A cloud conflict needs your review':'Cloud conflicts need your review','error');
  }catch(error){ console.error('ASCEND cloud sync error',error); this.setStatus('error'); toast('Could not sync to the cloud — your data is safe locally, will retry on next save','error'); }
  finally{ this._pending=false; if(this._queued){ this._queued=false; this.push(db); } }
};
// ===================== RANK 3 — PERSISTENT OFFLINE SYNC QUEUE =====================
// Rank 2 protects the individual cloud operation; Rank 3 makes the intent to perform
// that operation durable. Queue metadata remains outside journal payloads and is scoped
// to the authenticated user, so it cannot travel through export/import or another user’s cache.
const RANK3_QUEUE_VERSION = 1;
const RANK3_RETRY_CAP_MS = 60000;
const RANK3_RETRY_INITIAL_MS = 2000;
function rank3QueueKey(userId){ return 'ascend_sync_queue_v1_'+userId; }
function rank3BaselineKey(userId){ return 'ascend_sync_baseline_v1_'+userId; }
function rank3LastSuccessKey(userId){ return 'ascend_last_successful_sync_v1_'+userId; }
function rank3Clone(value){ return value===undefined ? undefined : JSON.parse(JSON.stringify(value)); }
function rank3SafeError(error){ return String((error&&error.message)||error||'Connection unavailable').replace(/[\r\n]+/g,' ').slice(0,180); }
function rank3RecordLabel(entityKey){ return entityKey==='profile' ? 'Shared settings' : entityKey.replace(/([A-Z])/g,' $1').replace(/^./,letter=>letter.toUpperCase()); }

const Rank3QueueStore = {
  load(userId){
    if(!userId) return [];
    try{
      const parsed=JSON.parse(localStorage.getItem(rank3QueueKey(userId))||'[]');
      if(!Array.isArray(parsed)) return [];
      const seen=new Set();
      return parsed.filter(entry=>{
        const valid=entry && entry.userId===userId && typeof entry.entityKey==='string' && typeof entry.recordId==='string' && ['write','delete','profile'].includes(entry.kind) && !seen.has(entry.entityKey+':'+entry.recordId);
        if(valid) seen.add(entry.entityKey+':'+entry.recordId);
        return valid;
      }).map(entry=>Object.assign({attempts:0,nextAttemptAt:nowISO(),createdAt:nowISO(),updatedAt:nowISO(),lastError:null},entry));
    }catch(error){ console.warn('ASCEND sync queue could not be read; retained local journal cache is untouched.',error); return []; }
  },
  save(userId, entries){
    if(!userId) return false;
    try{ localStorage.setItem(rank3QueueKey(userId),JSON.stringify(entries||[])); return true; }
    catch(error){ console.error('ASCEND sync queue could not be persisted',error); return false; }
  },
  clear(userId){ if(userId) try{ localStorage.removeItem(rank3QueueKey(userId)); }catch(error){} },
  loadBaseline(userId){
    if(!userId) return null;
    try{ const parsed=JSON.parse(localStorage.getItem(rank3BaselineKey(userId))||'null'); return parsed&&parsed.version===RANK3_QUEUE_VERSION?parsed:null; }
    catch(error){ return null; }
  },
  saveBaseline(userId, value){ if(userId) try{ localStorage.setItem(rank3BaselineKey(userId),JSON.stringify(value)); }catch(error){ console.warn('ASCEND sync baseline cache could not be persisted',error); } },
  loadLastSuccess(userId){ if(!userId) return null; try{return localStorage.getItem(rank3LastSuccessKey(userId))||null;}catch(error){return null;} },
  saveLastSuccess(userId, value){ if(userId) try{localStorage.setItem(rank3LastSuccessKey(userId),value);}catch(error){} }
};

CloudSync._retryTimer=null;
CloudSync._lastSuccessfulSync=null;

CloudSync._serializeBaseline=function(){

CloudSync.restoreBaseline=function(userId){

// ===================== MEDIA (Supabase Storage, IndexedDB as local cache only) =====================
// Same public interface as the old local-only IDB, so every screenshot call site
// (upload fields, previews, import/export, reset) is untouched. Supabase Storage
// (bucket "media", path `${user_id}/${mediaId}`) is now the source of truth;
// IndexedDB just makes repeat reads instant and gives an offline cache.
const IDB = {
  _db: null,
  dbName: LEGACY_MEDIA_DB,

    return new Promise((resolve,reject)=>{
      if(this._db && this._db.name === this.dbName) return resolve(this._db);

  async _cachePut(id, dataURL, meta){
    const db = await this.open();

      const tx = db.transaction('media','readwrite');
      tx.objectStore('media').put({ id, dataURL, meta: meta||{}, createdAt: nowISO() });
      tx.oncomplete = ()=>resolve(id);
      tx.onerror = (e)=>reject(e);
    });
  },
  async _cacheGet(id){
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readonly');
      const req = tx.objectStore('media').get(id);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>resolve(null);
    });
  },
  async _cacheDelete(id){
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readwrite');
      tx.objectStore('media').delete(id);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  },
  async _cacheAll(){
    // Raw local-only listing, used only for first-login legacy migration.
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readonly');
      const req = tx.objectStore('media').getAll();
      req.onsuccess = ()=>resolve(req.result||[]);
      req.onerror = ()=>resolve([]);

  },
  async put(id, dataURL, meta){
    await this._cachePut(id, dataURL, meta); // instant local preview

      try{
        const blob = dataURLtoBlob(dataURL);
        const { error } = await sb.storage.from('media').upload(`${CURRENT_USER_ID}/${id}`, blob, { upsert:true, contentType: blob.type||'image/png' });
        if(error) throw error;
      }catch(e){

      }
    }
    return id;
  },
  async get(id){
    if(!id) return null;
    const cached = await this._cacheGet(id);
    if(cached) return cached;
    if(!CURRENT_USER_ID) return null;
    try{
      const { data, error } = await sb.storage.from('media').download(`${CURRENT_USER_ID}/${id}`);
      if(error || !data) return null;
      const dataURL = await blobToDataURL(data);
      await this._cachePut(id, dataURL, {});

    }catch(e){ return null; }
  },
  async delete(id){
    await this._cacheDelete(id);

      try{ await sb.storage.from('media').remove([`${CURRENT_USER_ID}/${id}`]); }
      catch(e){ console.error('ASCEND media delete error', e); }
    }
    return true;
  },
  async enumerateForBackup(referenceIds){

    const localById=new Map(), remoteIds=new Set(), mediaById=new Map(), missing=[]; let localError=null, remoteError=null, remoteAvailable=false;
    try{ (await this._cacheAll()).forEach(record=>{ if(record&&record.id&&(wanted.size===0||wanted.has(String(record.id)))) localById.set(String(record.id),record); }); }
    catch(error){ localError=error; }
    localById.forEach((record,id)=>mediaById.set(id,record));

      try{ const {data:files,error}=await sb.storage.from('media').list(CURRENT_USER_ID,{limit:1000}); if(error) throw error; remoteAvailable=true; (files||[]).forEach(file=>{ if(file&&file.name) remoteIds.add(String(file.name)); }); }
      catch(error){ remoteError=error; }
    }

      if(remoteIds.has(id)){

        catch(error){ missing.push({id,reason:'Remote screenshot could not be downloaded.'}); }
      } else missing.push({id,reason:CURRENT_USER_ID&&remoteAvailable?'Screenshot is not available locally or in cloud storage.':'Screenshot is not available in the local cache while cloud storage could not be verified.'});
    }

  },
  async all(){ const result=await this.enumerateForBackup(referencedMediaIds(State&&State.db)); return result.media; },
  async count(){
    if(!CURRENT_USER_ID) return 0;
    try{
      const { data: files, error } = await sb.storage.from('media').list(CURRENT_USER_ID, { limit: 1000 });
      if(error || !files) return 0;
      return files.length;
    }catch(e){ return 0; }
  }
};
// Storage calls cannot join a Postgres transaction. A successful reset/replace
// therefore records an owner-scoped job in the transaction, then this bounded
// processor performs real object removal and reports success only after it returns.
const MediaCleanup = {
  async listPending(){
    if(!CURRENT_USER_ID || !(await CloudCapabilities.detectWorkspaceTransactions())) return [];
    const {data,error}=await sb.from('ascend_media_cleanup_jobs').select('*').eq('user_id',CURRENT_USER_ID).order('created_at',{ascending:true}).limit(20);
    if(error) throw new Error(error.message||'Could not load media cleanup status.');
    return (data||[]).filter(job=>job.status==='pending'||job.status==='failed');
  },
  async updateJob(job,patch){
    const {error}=await sb.from('ascend_media_cleanup_jobs').update(Object.assign({},patch,{updated_at:nowISO()})).eq('id',job.id).eq('user_id',CURRENT_USER_ID);
    if(error) throw new Error(error.message||'Could not update media cleanup status.');
  },
  async processJob(job){
    if(!job || !CURRENT_USER_ID) return {ok:false,removed:0};
    try{
      await this.updateJob(job,{status:'processing',attempted_at:nowISO(),attempts:Number(job.attempts||0)+1,last_error:null});
      const {data:files,error:listError}=await sb.storage.from('media').list(CURRENT_USER_ID,{limit:1000});
      if(listError) throw listError;
      const retained=new Set((Array.isArray(job.retained_media_ids)?job.retained_media_ids:[]).map(value=>String(value)));
      const names=(files||[]).map(file=>String(file.name||'')).filter(name=>name&&!retained.has(name));
      if(names.length){
        const {error:removeError}=await sb.storage.from('media').remove(names.map(name=>`${CURRENT_USER_ID}/${name}`));
        if(removeError) throw removeError;
      }
      await this.updateJob(job,{status:'completed',completed_at:nowISO(),last_error:null});
      return {ok:true,removed:names.length};
    }catch(error){
      try{ await this.updateJob(job,{status:'failed',attempted_at:nowISO(),attempts:Number(job.attempts||0)+1,last_error:String(error&&error.message||error).slice(0,500)}); }catch(updateError){ console.error('ASCEND media cleanup status update error',updateError); }
      return {ok:false,removed:0,error};
    }
  },
  async processJobById(jobId){
    const jobs=await this.listPending(); const job=jobs.find(item=>String(item.id)===String(jobId));
    return job?this.processJob(job):{ok:false,removed:0,error:new Error('Media cleanup job is unavailable.')};
  },
  async pendingCount(){ try{return (await this.listPending()).length;}catch(error){return 0;} }
};

// Reusable async media-preview mounter: fills a `[data-media-id]` container
// with an <img> loaded from IndexedDB. Removes the container entirely if the
// media record is missing so no empty placeholder is left behind.
async function mountMediaPreview(el, onMissing){
  const mediaId = el && el.dataset ? el.dataset.mediaId : null;
  if(!el) return;
  if(!mediaId){ el.remove(); return; }
  try{
    const rec = await IDB.get(mediaId);
    if(rec && rec.dataURL){
      const img = document.createElement('img');
      img.src = rec.dataURL;
      img.alt = '';
      el.appendChild(img);
    } else if(typeof onMissing==='function'){
      onMissing(el);
    } else {
      el.remove();
    }
  }catch(e){
    if(typeof onMissing==='function') onMissing(el); else el.remove();
  }
}
function mountMediaPreviews(root, onMissing){
  if(!root) return;
  root.querySelectorAll('[data-media-id]').forEach(el=>mountMediaPreview(el, onMissing));
}

// ===================== CALCULATION ENGINE =====================
// Canonical closed-trade eligibility is intentionally derived without mutating
// historic records. A recorded open/pending/cancelled state remains excluded
// even if an imported working P&L is present; contradictory Win/Loss labels are
// resolved from authoritative finite account-currency P&L.
const NON_CLOSED_TRADE_STATES=Object.freeze(['open','pending','active','working','cancelled','canceled','failed','rejected']);
function explicitTradePnl(trade){
  if(!trade||typeof trade!=='object') return null;
  for(const key of ['netPnl','pnl']){
    const value=trade[key];
    if(isEnteredValue(value)&&Number.isFinite(Number(value))) return financialRound(Number(value),null);
  }
  return null;
}
function tradeHasNonClosedState(trade){
  return ['tradeStatus','status','state','result'].some(key=>NON_CLOSED_TRADE_STATES.includes(String(trade&&trade[key]||'').trim().toLowerCase()));
}
function canonicalTradeResult(trade){
  if(!trade||tradeHasNonClosedState(trade)) return null;
  const pnl=explicitTradePnl(trade);
  if(pnl!=null) return pnl>0?'Win':pnl<0?'Loss':'Breakeven';
  return RESULTS.includes(trade.result)?trade.result:null;
}
function isClosedTrade(trade){ return canonicalTradeResult(trade)!=null&&explicitTradePnl(trade)!=null; }
function closedTradeCollection(trades){ return (trades||[]).filter(isClosedTrade); }
function closedTradePnl(trade){ const pnl=explicitTradePnl(trade); return pnl==null?null:pnl; }

  if(explicit!=null) return explicit;
  const legacy=positiveFiniteAmount(account&&account.accountSize);
  return legacy!=null?legacy:0;
}
function brokerReportedEquity(account){
  const value=account&&account.currentBalance;
  return isEnteredValue(value)&&Number.isFinite(Number(value))&&Number(value)>=0?financialRound(Number(value),null):null;
}
const Calc = {
  pnl(t){ const position=calculatePositionManagement(t); if(position.completeExitEconomics && !position.overClosed) return position.realizedNetPnl; const raw=t&&t.netPnl, net=Number(raw); return raw!=='' && raw!==null && raw!==undefined && Number.isFinite(net) ? financialRound(net) : financialRound(Number(t&&t.pnl)||0); },
  rMultiple(t){

    if(!validation.ok) return null;
    const risk=canonicalTradeRiskAmount(t);
    if(risk!=null){ const position=calculatePositionManagement(t); return financialDivide(position.completeExitEconomics&&!position.overClosed ? position.realizedNetPnl : Calc.pnl(t),risk); }
    // Historical records can contain a deliberately recorded finite R while their
    // original currency-risk denominator was never stored. Preserve that explicit
    // evidence only when both risk fields are absent. An invalid or conflicting
    // entered denominator must never be overridden by a stale stored R.
    const hasEnteredRisk=isEnteredValue(t&&t.riskAmount)||isEnteredValue(t&&t.plannedRiskAmount);

  },
  plannedRR(t){

    if(!Number.isFinite(entry)||!Number.isFinite(sl)||!Number.isFinite(tp)||entry===0||sl===0||tp===0) return null;

    return financialDivide(reward,risk);
  },
  // Derives Win/Loss/Breakeven from P&L when a number has been entered — used to
  // suggest (not force) the Result field so the user isn't asked to state the
  // obvious twice.

  // Risk as a % of account equity at the time of the trade. Only returned when both

  // Trade duration in minutes — only when both an entry and exit time are present.
  durationMinutes(t){

// ===================== REVIEW LIFECYCLE (Phase 1) =====================
// Shared across Daily/Weekly/Monthly reviews. A review is `Pending` until it has
// something to show (no trades yet), `In Progress` once the auto-generated
// performance exists but the required reflection fields are still empty, and
// `Complete` only once every required reflection field has been written.
const REVIEW_STATUSES = ['Pending','In Progress','Complete'];
function reviewReflectionComplete(obj, requiredFields){
  return requiredFields.every(k => obj[k] && String(obj[k]).trim().length>0);
}
function computeReviewStatus(obj, tradeCount, requiredFields){
  if(!tradeCount) return 'Pending';
  return reviewReflectionComplete(obj, requiredFields) ? 'Complete' : 'In Progress';
}
const DAILY_REVIEW_REQUIRED = ['whatWorked','whatDidntWork','biggestMistake','mainLesson','focusTomorrow'];
const WEEKLY_REVIEW_REQUIRED = ['whatWorked','whatDidntWork','focusNextWeek'];
const MONTHLY_REVIEW_REQUIRED = ['whatWorked','whatDidntWork','mainLesson','focusNextMonth'];
function statusBadgeClass(status){
  return status==='Complete' ? 'b-pos' : status==='In Progress' ? 'b-progress' : 'b-pending';
}

}
function renderWorkspaceContext(){
  const meta=workspaceContextMeta(); const context=document.getElementById('workspace-context');
  if(context){ const next=State.appMode===APP_MODES.LIVE?APP_MODES.BACKTEST:APP_MODES.LIVE; context.setAttribute('aria-label',`${meta.label}. ${meta.description} Activate to switch to ${appModeLabel(next)}.`); context.title=`Switch to ${appModeLabel(next)}`; context.dataset.mode=meta.mode; const label=context.querySelector('#workspace-context-label'), copy=context.querySelector('#workspace-context-copy'); if(label) label.textContent=meta.label; if(copy) copy.textContent=meta.description; }
  const app=document.getElementById('app'); if(app){ app.dataset.workspaceLabel=meta.label; app.setAttribute('aria-label',`${meta.label}. ${meta.description}`); }
  document.documentElement.dataset.workspaceLabel=meta.label;
  return meta;
}
function modalFocusableElements(modal){
  return [...modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.hidden && el.getClientRects().length>0);
}
const Modal = {
  stack: [],
  open({ title, bodyHTML, footerHTML, size, tabs, onMount, className }){
    const opener = document.activeElement && typeof document.activeElement.focus==='function' ? document.activeElement : null;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const modal = document.createElement('div');
    const titleId = `modal-title-${Date.now()}-${Modal.stack.length}`;
    modal.className = 'modal' + (size==='lg' ? ' modal-lg':'') + (className? ' '+className : '');
    modal.setAttribute('role','dialog');
    modal.setAttribute('aria-modal','true');
    modal.setAttribute('aria-labelledby',titleId);
    let tabsHTML = '';
    if(tabs && tabs.length){
      tabsHTML = `<div class="modal-tabs" role="tablist" aria-label="${esc(title)} sections">` + tabs.map((t,i)=>`<button type="button" class="modal-tab ${i===0?'active':''}" role="tab" aria-selected="${i===0?'true':'false'}" data-tabidx="${i}">${esc(t.label)}</button>`).join('') + `</div>`;
    }
    modal.innerHTML = `
      <div class="modal-header"><div class="modal-title-wrap"><h3 id="${titleId}" tabindex="-1">${esc(title)}</h3><div class="modal-workspace-context" data-testid="modal-workspace-context">${esc(workspaceContextMeta().shortLabel)}</div></div><button class="btn btn-icon btn-ghost" data-close aria-label="Close dialog" title="Close dialog">✕</button></div>
      ${tabsHTML}
      <div class="modal-body">${bodyHTML||''}</div>
      ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
    `;
    overlay.appendChild(modal);
    document.getElementById('modal-root').appendChild(overlay);
    requestAnimationFrame(()=>overlay.classList.add('show'));
    const close = ()=>{
      if(!overlay.isConnected) return;
      overlay.classList.remove('show');
      const index=Modal.stack.findIndex(entry=>entry.overlay===overlay);
      if(index>=0) Modal.stack.splice(index,1);
      setTimeout(()=>{
        overlay.remove();
        if(opener && opener.isConnected) opener.focus();
      }, 180);
    };
    overlay.querySelectorAll('[data-close]').forEach(btn=>{ btn.onclick = close; });
    overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });
    overlay.addEventListener('keydown', (e)=>{
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); return; }
      if(e.key!=='Tab') return;
      const focusable=modalFocusableElements(modal);
      if(!focusable.length){ e.preventDefault(); modal.querySelector('h3')?.focus(); return; }
      const first=focusable[0], last=focusable[focusable.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    });
    if(tabs && tabs.length){
      overlay.querySelectorAll('.modal-tab').forEach(tabEl=>{
        tabEl.onclick = ()=>{
          overlay.querySelectorAll('.modal-tab').forEach(x=>{ x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
          overlay.querySelectorAll('.modal-tabpanel').forEach(x=>x.classList.remove('active'));
          tabEl.classList.add('active');
          tabEl.setAttribute('aria-selected','true');
          const idx = tabEl.dataset.tabidx;
          overlay.querySelectorAll('.modal-tabpanel').forEach(panel=>{
            const groups=String(panel.dataset.tabpanel||'').split(',').map(value=>value.trim());
            if(groups.includes(String(idx))) panel.classList.add('active');
          });
        };
      });
    }
    Modal.stack.push({overlay, close});
    if(onMount) onMount(overlay, close);
    requestAnimationFrame(()=>{
      const preferred=modal.querySelector('[data-autofocus]');
      const focusable=modalFocusableElements(modal);
      (preferred || focusable[0] || modal.querySelector('h3'))?.focus();
    });
    return { overlay, close };
  },
  closeTop(){ const top = Modal.stack[Modal.stack.length-1]; if(top) top.close(); },
  confirm({ title, message, confirmLabel, danger, onConfirm }){
    Modal.open({
      title: title||'Are you sure?',
      bodyHTML: `<p class="muted">${esc(message||'')}</p>`,
      footerHTML: `<button class="btn" data-close>Cancel</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirm-yes">${esc(confirmLabel||'Confirm')}</button>`,
      onMount:(overlay, close)=>{
        overlay.querySelector('#confirm-yes').onclick = ()=>{ close(); onConfirm && onConfirm(); };
      }
    });
  }
};

function bindInteractiveTableRows(container, onActivate){
  if(!container || typeof onActivate!=='function') return;
  container.querySelectorAll('tbody tr[data-id]').forEach(row=>{
    row.setAttribute('role','button');
    row.tabIndex=0;
    const activate=()=>onActivate(row.dataset.id);
    row.onclick=activate;
    row.onkeydown=(event)=>{
      if(event.key==='Enter' || event.key===' '){ event.preventDefault(); activate(); }
    };
  });
}

// ===================== SVG CHARTS =====================
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const Charts = {
  equityCurve(container, points, opts){
    opts = opts||{};
    container.innerHTML = '';
    const w = container.clientWidth || 600, h = opts.height || 220;
    if(!points.length){ container.innerHTML = `<div class="empty-state" style="padding:30px;"><p>No equity data for this range yet.</p></div>`; return; }
    const svg = svgEl('svg', { viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, preserveAspectRatio:'none' });
    const pad = 8;
    const vals = points.map(p=>p.balance);
    const min = Math.min(...vals, points[0].balance), max = Math.max(...vals, points[0].balance);
    const range = (max-min) || 1;
    const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
    const x = (i)=> pad + i*stepX;
    const y = (v)=> h - pad - ((v-min)/range)*(h-pad*2);
    let path = '', area = '';
    points.forEach((p,i)=>{ const cmd = i===0?'M':'L'; path += `${cmd}${x(i).toFixed(1)},${y(p.balance).toFixed(1)} `; });
    area = `M${x(0).toFixed(1)},${h-pad} ` + path.replace('M','L') + ` L${x(points.length-1).toFixed(1)},${h-pad} Z`;
    const positive = points[points.length-1].balance >= points[0].balance;
    const muted = opts.tone==='muted';
    const color = muted ? 'var(--text-muted)' : (positive ? 'var(--positive)' : 'var(--negative)');
    const gradId = 'grad_'+Math.random().toString(36).slice(2,8);
    const defs = svgEl('defs',{});
    const fillColor = muted ? cssVar('--text-muted') : (positive ? cssVar('--positive') : cssVar('--negative'));
    defs.innerHTML = `<linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${fillColor}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${fillColor}" stop-opacity="0"/></linearGradient>`;
    svg.appendChild(defs);
    svg.appendChild(svgEl('path', { d:area, fill:`url(#${gradId})`, stroke:'none' }));
    const filterId = 'glow_'+gradId;
    defs.innerHTML += `<filter id="${filterId}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
    svg.appendChild(svgEl('path', { d:path.trim(), fill:'none', stroke:color, 'stroke-width':1.8, 'stroke-linejoin':'round', 'stroke-linecap':'round', filter:`url(#${filterId})` }));
    // hover dots layer
    const hoverLine = svgEl('line', {x1:0,y1:0,x2:0,y2:h, stroke:'var(--border)', 'stroke-width':1, opacity:0});
    svg.appendChild(hoverLine);
    container.appendChild(svg);
    const tip = document.createElement('div');
    tip.style.cssText = 'position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:11px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;';
    container.style.position='relative';
    container.appendChild(tip);
    svg.addEventListener('mousemove', (e)=>{
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX-rect.left)/rect.width*w;
      let idx = Math.round((mx-pad)/(stepX||1));
      idx = clamp(idx,0,points.length-1);
      const p = points[idx];
      hoverLine.setAttribute('x1', x(idx)); hoverLine.setAttribute('x2', x(idx)); hoverLine.setAttribute('opacity',1);
      tip.style.left = Math.min(Math.max(0,(x(idx)/w*rect.width)-60),rect.width-130)+'px';
      tip.style.top = '0px';
      tip.style.opacity = 1;
      tip.innerHTML = `<b>${fmtDateShort(p.date)}</b><br><span class="${p.pnl>=0?'pos':'neg'}">${fmtMoney(p.pnl)}</span> · Bal ${fmtMoney(p.balance)}`;
    });
    svg.addEventListener('mouseleave', ()=>{ hoverLine.setAttribute('opacity',0); tip.style.opacity=0; });
  },
  donut(container, data, opts){
    opts = opts||{};
    container.innerHTML='';
    const size = opts.size||120, stroke = opts.stroke||14, r=(size-stroke)/2, c=2*Math.PI*r;
    const total = data.reduce((s,d)=>s+d.value,0);
    const svg = svgEl('svg',{viewBox:`0 0 ${size} ${size}`, width:size, height:size});
    let offset=0;
    if(total===0){
      svg.appendChild(svgEl('circle',{cx:size/2,cy:size/2,r, fill:'none', stroke:'var(--surface-3)', 'stroke-width':stroke}));
    } else {
      data.forEach(d=>{
        const frac = d.value/total; const len = frac*c;
        const circ = svgEl('circle',{cx:size/2,cy:size/2,r, fill:'none', stroke:d.color, 'stroke-width':stroke,
          'stroke-dasharray':`${len} ${c-len}`, 'stroke-dashoffset':-offset, transform:`rotate(-90 ${size/2} ${size/2})`, 'stroke-linecap':'butt'});
        svg.appendChild(circ);
        offset += len;
      });
    }
    container.appendChild(svg);
  },
  bars(container, data, opts){
    opts=opts||{};
    container.innerHTML='';
    const w = container.clientWidth||400, h = opts.height||140, pad=20;
    const svg = svgEl('svg',{viewBox:`0 0 ${w} ${h}`, width:'100%', height:h});
    if(!data.length){ container.innerHTML = '<div class="empty-state" style="padding:20px;"><p>Not enough data yet.</p></div>'; return; }
    const max = Math.max(...data.map(d=>Math.abs(d.value)),1);
    const bw = (w-pad*2)/data.length;
    const zeroY = h/2;
    data.forEach((d,i)=>{
      const bh = (Math.abs(d.value)/max)*(h/2-14);
      const x = pad + i*bw + bw*0.18;
      const bwidth = bw*0.64;
      const y = d.value>=0 ? zeroY-bh : zeroY;
      svg.appendChild(svgEl('rect',{x,y,width:bwidth,height:Math.max(bh,1.5), rx:3, fill: d.value>=0?'var(--positive)':'var(--negative)', opacity:0.85}));
      const label = svgEl('text',{x:x+bwidth/2, y:h-4, 'text-anchor':'middle', fill:'var(--text-faint)', 'font-size':'9'});
      label.textContent = d.label; svg.appendChild(label);
    });
    svg.appendChild(svgEl('line',{x1:pad,x2:w-pad,y1:zeroY,y2:zeroY, stroke:'var(--border)', 'stroke-width':1}));
    container.appendChild(svg);
  },
  heatmap(container, year, month, dayDataMap, onDayClick){
    container.innerHTML='';
    const first = new Date(year, month, 1);
    const startDow = (first.getDay()+6)%7; // Monday start
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:6px;';

      const lbl = document.createElement('div'); lbl.textContent=d; lbl.style.cssText='font-size:10px;color:var(--text-faint);text-align:center;font-weight:700;'; grid.appendChild(lbl);
    });
    for(let i=0;i<startDow;i++){ const sp=document.createElement('div'); grid.appendChild(sp); }
    let maxAbs = 1;
    Object.values(dayDataMap).forEach(d=>{ maxAbs = Math.max(maxAbs, Math.abs(d.pnl||0)); });
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const info = dayDataMap[dateStr];
      const cell = document.createElement('div');
      cell.className='day-cell';
      let bg = 'var(--surface-2)', txt='var(--text-faint)';
      if(info && info.pnl!==0){
        const intensity = clamp(Math.abs(info.pnl)/maxAbs, 0.18, 1);
        // Pull RGB triplets from theme tokens so heatmap tracks dark/light tonal
        // variants. Falls back to profit/loss defaults if tokens are unavailable.
        const posRgb = cssVar('--positive-rgb') || '114,214,173';
        const negRgb = cssVar('--negative-rgb') || '255,102,120';
        const alpha = (intensity*0.55+0.1).toFixed(3);
        bg = info.pnl>0 ? `rgba(${posRgb},${alpha})` : `rgba(${negRgb},${alpha})`;
        txt = '#fff';
      } else if(info){ bg='var(--surface-3)'; }
      cell.style.background = bg; cell.style.color = txt;
      if(info && info.trades){
        const pnlStr = (info.pnl>0?'+':'') + fmtMoney(info.pnl);
        cell.innerHTML = `<div class="day-cell-day">${d}</div><div class="day-cell-pnl mono">${pnlStr}</div>`;
      } else {
        cell.textContent = d;
      }
      cell.title = info ? `${dateStr}: ${fmtMoney(info.pnl)} · ${info.trades} trades` : dateStr;
      cell.onclick = ()=> onDayClick && onDayClick(dateStr);
      grid.appendChild(cell);
    }
    container.appendChild(grid);
  }
};

const QuickCreate = {
  el:null,
  open(anchor, items){
    this.close();
    const pop = document.createElement('div');
    pop.className = 'quick-create-pop';
    pop.innerHTML = items.map((it,i)=>`<div class="cmd-item" data-qi="${i}">${icon(it.icon,15)}<span>${esc(it.label)}</span></div>`).join('');
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.round(r.left) + 'px';
    pop.style.top = Math.round(r.bottom + 6) + 'px';
    requestAnimationFrame(()=> pop.classList.add('show'));
    pop.querySelectorAll('[data-qi]').forEach(elm=> elm.onclick = (e)=>{ e.stopPropagation(); this.close(); items[Number(elm.dataset.qi)].action(); });
    this.el = pop;
    setTimeout(()=> document.addEventListener('click', this._onDocClick = ()=>this.close(), { once:true }), 0);
  },
  close(){ if(this.el){ this.el.remove(); this.el=null; } if(this._onDocClick){ document.removeEventListener('click', this._onDocClick); this._onDocClick=null; } }
};

// ===================== NOTIFICATION CENTER (data-integrity: unlinked trades) =====================
// Never a separate data store — the badge/panel/persistence-across-reload are all
// derived live from getUnresolvedTrades(State.db) each time render()/toggle() runs,
// so the notification can never drift from the actual trade/account relationships.
const NotifCenter = {
  open: false,
  render(){
    const badge = document.getElementById('notif-badge');
    const btn = document.getElementById('notif-btn');
    if(!badge || !btn) return;
    const unresolved = getUnresolvedTrades(State.db);
    if(unresolved.length>0){
      badge.hidden = false;
      badge.textContent = unresolved.length>9 ? '9+' : String(unresolved.length);
      btn.classList.add('has-notif');
    } else {
      badge.hidden = true;
      btn.classList.remove('has-notif');
      this.close(); // nothing left to resolve — don't leave a stale open panel
    }
    if(this.open) this.renderPanel(unresolved);
  },
  renderPanel(unresolved){
    const panel = document.getElementById('notif-panel');
    if(!panel) return;
    const db = State.db;
    if(!unresolved.length){
      panel.innerHTML = `<div class="notif-empty">No action required — everything's linked.</div>`;
    } else {
      panel.innerHTML = `
        <div class="notif-panel-head">Action Required</div>
        ${unresolved.map(t=>`
          <div class="notif-item">

              <button class="btn btn-sm btn-primary notif-resolve" data-tid="${esc(t.id)}">Resolve</button>
            </div>
          </div>
        `).join('')}
      `;
      panel.querySelectorAll('.notif-resolve').forEach(b=>{
        b.onclick = ()=> resolveUnlinkedTrade(b.dataset.tid);
      });
    }
  },
  toggle(){
    this.open = !this.open;
