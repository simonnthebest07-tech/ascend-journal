<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ASCEND · Journal v7</title>
<style>
@import url('https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root, html[data-theme="dark"]{
  /* ---- Obsidian backgrounds ---- */
  --bg-0:#050608;
  --bg-1:#080A0D;
  --bg-2:#0C0F12;
  --bg: var(--bg-0);
  --bg-ambient: radial-gradient(ellipse at top left, rgba(243,248,252,.05) 0%, rgba(243,248,252,.02) 30%, transparent 60%);
  /* ---- Surfaces (translucent, blurred by consuming components) ---- */
  --surface: rgba(10,13,16,.80);
  --surface-2: rgba(14,18,22,.82);
  --surface-3: rgba(19,24,29,.90);
  /* ---- Glass material levels ---- */
  --glass-1: rgba(255,255,255,.035);
  --glass-2: rgba(255,255,255,.055);
  --glass-3: rgba(255,255,255,.075);
  /* ---- Borders ---- */
  --border-subtle: rgba(255,255,255,.055);
  --border-default: rgba(255,255,255,.085);
  --border-strong: rgba(255,255,255,.13);
  --border-accent: rgba(243,248,252,.20);
  --border: var(--border-default);
  --border-soft: var(--border-subtle);
  /* ---- Text ---- */
  --text:#F3F8FC;
  --text-muted:#AAB3BB;
  --text-faint:#68717A;
  --text-disabled:#454B51;
  /* ---- Brand (ASCEND identity — the "light source") ---- */
  --accent:#F3F8FC;
  --accent-rgb: 243,248,252;
  --accent-dim:#C9D3DA;
  --accent-hover:#FFFFFF;
  --accent-soft: rgba(243,248,252,.10);
  --accent-glow:rgba(243,248,252,.12);
  --accent-ink:#0A0D10;
  /* ---- Trading semantic colors (kept separate from brand) ---- */
  --positive:#72D6AD;
  --positive-rgb: 114,214,173;
  --positive-dim:rgba(114,214,173,.14);
  --negative:#FF6678;
  --negative-rgb: 255,102,120;
  --negative-dim:rgba(255,102,120,.14);
  --warning:#E5B85C;
  --warning-rgb: 229,184,92;
  --warning-dim:rgba(229,184,92,.14);
  --info:#82AFFF;
  --info-rgb: 130,175,255;
  --info-dim:rgba(130,175,255,.14);
  /* ---- Radius scale ---- */
  --radius-xs:6px;
  --radius-s:8px;
  --radius-sm:8px;
  --radius-m:12px;
  --radius-md:12px;
  --radius-l:16px;
  --radius-lg:16px;
  --radius-xl:20px;
  --radius-pill:999px;
  /* ---- Spacing scale ---- */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-7:32px; --space-8:40px; --space-9:48px; --space-10:64px; --space-11:80px;
  /* ---- Typography ---- */
  --font-display: 'Switzer', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  --font-ui: 'Switzer', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  --font-serif: 'Playfair Display', 'Times New Roman', Georgia, serif;
  --font-mono: 'JetBrains Mono', "SF Mono", Consolas, monospace;
  /* ---- Shadows (used sparingly — reserved for floating elements) ---- */
  --shadow-sm: 0 2px 8px -4px rgba(0,0,0,.45);
  --shadow-md: 0 8px 24px -10px rgba(0,0,0,.55);
  --shadow-lg: 0 24px 70px -16px rgba(0,0,0,.60);
  --shadow-card: var(--shadow-sm);
  --card-bg: var(--glass-1);
  --card-bg-hover: var(--glass-2);
  --card-border: var(--border-subtle);
  --card-border-hover: var(--border-accent);
  --glass-blur: 16px;
  --density-pad: 18px;
  --anim: 200ms ease;
  --anim-fast: 110ms ease;
  --anim-emphasis: 280ms cubic-bezier(.4,0,.2,1);
  --nav-width: 264px;
  --nav-collapsed-width: 72px;
  --rail-anim: 240ms cubic-bezier(.4,0,.2,1);
  color-scheme: dark;
}
html[data-theme="light"]{
  /* A slightly raised obsidian variant — not a true light theme, matching the app's original dark-only shell */
  --bg-0:#0B0E12; --bg-1:#0E1217; --bg-2:#12161C;
  --bg: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  --bg-ambient: radial-gradient(ellipse at top left, rgba(243,248,252,.07) 0%, rgba(243,248,252,.03) 30%, transparent 60%);
  --surface: rgba(16,20,25,.82);
  --surface-2: rgba(20,25,31,.85);
  --surface-3: rgba(26,32,39,.92);
  --glass-1: rgba(255,255,255,.045);
  --glass-2: rgba(255,255,255,.065);
  --glass-3: rgba(255,255,255,.085);
  --border-subtle: rgba(255,255,255,.07);
  --border-default: rgba(255,255,255,.10);
  --border-strong: rgba(255,255,255,.15);
  --border-accent: rgba(243,248,252,.24);
  --border: var(--border-default);
  --border-soft: var(--border-subtle);
  --text:#F3F8FC;
  --text-muted:#B7C0C8;
  --text-faint:#767F88;
  --text-disabled:#4C525A;
  --accent:#F3F8FC;
  --accent-rgb: 243,248,252;
  --accent-dim:#C9D3DA;
  --accent-hover:#FFFFFF;
  --accent-soft: rgba(243,248,252,.12);
  --accent-glow:rgba(243,248,252,.16);
  --accent-ink:#0A0D10;
  --positive:#7CDDB4;
  --positive-rgb: 124,221,180;
  --positive-dim:rgba(124,221,180,.16);
  --negative:#FF7688;
  --negative-rgb: 255,118,136;
  --negative-dim:rgba(255,118,136,.16);
  --warning:#EBC172;
  --warning-rgb: 235,193,114;
  --warning-dim:rgba(235,193,114,.16);
  --info:#8FBAFF;
  --info-rgb: 143,186,255;
  --info-dim:rgba(143,186,255,.16);
  --radius-xs:6px; --radius-s:8px; --radius-sm:8px; --radius-m:12px; --radius-md:12px;
  --radius-l:16px; --radius-lg:16px; --radius-xl:20px; --radius-pill:999px;
  --font-display: 'Switzer', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  --font-ui: 'Switzer', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  --font-serif: 'Playfair Display', 'Times New Roman', Georgia, serif;
  --font-mono: 'JetBrains Mono', "SF Mono", Consolas, monospace;
  --shadow-sm: 0 2px 8px -4px rgba(0,0,0,.45);
  --shadow-md: 0 8px 24px -10px rgba(0,0,0,.55);
  --shadow-lg: 0 24px 70px -16px rgba(0,0,0,.60);
  --shadow-card: var(--shadow-sm);
  --card-bg: var(--glass-1);
  --card-bg-hover: var(--glass-2);
  --card-border: var(--border-subtle);
  --card-border-hover: var(--border-accent);
  --glass-blur: 18px;
  color-scheme: dark;
}
[data-density="compact"]{ --density-pad: 10px; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  position:relative;
  transition:background .35s ease, color .25s ease;
}
body::before{
  content:''; position:fixed; top:0; left:0; width:70vw; height:70vh; pointer-events:none; z-index:-1;
  background:var(--bg-ambient); transition:background .35s ease;
}
body::after{
  content:''; position:fixed; bottom:-20vh; right:-10vw; width:60vw; height:60vh; pointer-events:none; z-index:-1;
  background:radial-gradient(ellipse at bottom right, var(--accent-glow), transparent 60%);
  transition:background .35s ease;
}
body.anim-off *{ transition:none !important; animation:none !important; }
@media (prefers-reduced-motion: reduce){
  .card, #page-content, .toggle .knob{ transition:none !important; animation:none !important; }
}
::selection{ background:var(--accent-glow); color:var(--text); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-xs); }
.btn:focus-visible, .nav-item:focus-visible, .card:focus-visible{ outline-offset:1px; }
input:focus-visible, select:focus-visible, textarea:focus-visible{ outline-offset:0; }
a{ color:inherit; }
button{ font-family:inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:8px; border:2px solid transparent; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---------- Layout shell ---------- */
#app{ display:flex; min-height:100vh; }
#sidebar-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); z-index:39; opacity:0; pointer-events:none; transition:opacity var(--anim); }
#sidebar-scrim.show{ opacity:1; pointer-events:auto; }
#sidebar{
  width:var(--nav-width); flex:0 0 var(--nav-width); background:var(--surface); border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; padding:16px 0 12px; position:fixed; top:42px; bottom:0; left:0; z-index:40;
  transition:width var(--rail-anim), transform var(--anim), background .35s ease, border-color .35s ease;
  backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  -webkit-overflow-scrolling:touch; overflow:hidden;
}
#sidebar::before{ content:''; position:absolute; top:-40%; left:-30%; width:70%; height:60%; pointer-events:none; z-index:-1; background:radial-gradient(ellipse at top left, rgba(var(--accent-rgb),.06), transparent 70%); }
#sidebar.is-locked{ transform:translateX(0) !important; }

/* ---------- Rail: brand ---------- */
.rail-brand{ display:flex; align-items:center; gap:10px; padding:2px 14px 16px; }
.rail-brand-icon{ width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg, var(--accent), var(--accent-dim)); display:flex; align-items:center; justify-content:center; flex:0 0 26px; }
.rail-brand-icon svg{ width:14px; height:14px; color:var(--accent-ink); }
.rail-brand-text{ min-width:0; flex:1; overflow:hidden; white-space:nowrap; }
.rail-brand-text .rail-mark{ font-family:var(--font-serif); font-style:italic; font-size:17px; font-weight:500; letter-spacing:.03em; color:var(--text); line-height:1.15; }
.rail-brand-text .rail-sub{ font-family:var(--font-display); font-size:9px; letter-spacing:.2em; color:var(--text-faint); font-weight:500; margin-top:2px; display:flex; align-items:center; gap:8px; }
.rail-brand-text .rail-sub .rail-meta{ font-family:var(--font-mono); letter-spacing:.06em; color:var(--text-faint); opacity:.7; }

/* ---------- Rail: search trigger ---------- */
.rail-search{
  display:flex; align-items:center; gap:9px; margin:0 10px 14px; padding:8px 10px; border-radius:var(--radius-s);
  background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-faint); cursor:pointer;
  font-family:var(--font-ui); font-size:12px; transition:background .18s ease, border-color .18s ease, color .18s ease;
}
.rail-search:hover{ background:var(--surface-3); color:var(--text-muted); border-color:var(--border); }
.rail-search svg{ width:13px; height:13px; flex:0 0 13px; opacity:.8; }
.rail-search-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail-search-kbd{ font-family:var(--font-mono); font-size:9px; letter-spacing:.04em; color:var(--text-faint); background:var(--surface-3); border:1px solid var(--border-soft); border-radius:4px; padding:1px 5px; flex:0 0 auto; }

/* ---------- Rail: nav ---------- */
#nav-root{ flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 10px 8px; }
#nav-root::-webkit-scrollbar{ width:0; }
.nav-group{ margin-bottom:14px; }
.nav-group-label{
  display:flex; align-items:baseline; gap:7px; padding:0 8px 7px; font-family:var(--font-display);
  color:var(--text-faint); font-weight:500; white-space:nowrap; overflow:hidden;
}
.nav-group-label .grp-num{ font-family:var(--font-mono); font-size:10px; letter-spacing:.02em; color:var(--text-faint); opacity:.65; flex:0 0 auto; }
.nav-group-label .grp-text{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.85; flex:1; }
.nav-group-add{ flex:0 0 auto; width:16px; height:16px; display:flex; align-items:center; justify-content:center; border-radius:4px; color:var(--text-faint); cursor:pointer; opacity:0; transition:opacity .15s ease, background .15s ease, color .15s ease; }
.nav-group-add svg{ width:11px; height:11px; }
.nav-group:hover .nav-group-add{ opacity:1; }
.nav-group-add:hover{ background:rgba(var(--accent-rgb),.12); color:var(--accent); }
#sidebar.rail-collapsed .nav-group-add{ display:none; }
.quick-create-pop{ position:fixed; z-index:110; min-width:190px; background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:0 20px 60px -14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); padding:6px; opacity:0; transform:translateY(-4px) scale(.98); pointer-events:none; transition:opacity .14s ease, transform .14s ease; }
.quick-create-pop.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.nav-item{
  position:relative; display:flex; align-items:center; gap:11px; padding:7px 8px; border-radius:var(--radius-s);
  color:var(--text-muted); font-size:13px; font-weight:500; cursor:pointer; user-select:none;
  transition:background .18s ease, color .18s ease, transform .18s ease; margin-bottom:1px; white-space:nowrap;
}
.nav-item .nav-icon{ display:none; flex:0 0 16px; width:16px; height:16px; align-items:center; justify-content:center; opacity:.8; }
.nav-item .nav-icon svg{ width:15px; height:15px; }
.nav-item .nav-label{ overflow:hidden; text-overflow:ellipsis; }
.nav-item:hover{ background:rgba(var(--accent-rgb),.05); color:var(--text); transform:translateX(2px); }
.nav-item:hover .nav-icon{ opacity:1; }
.nav-item.active{ background:rgba(var(--accent-rgb),.07); color:var(--text); transform:translateX(2px); }
.nav-item.active::before{
  content:''; position:absolute; left:-10px; top:50%; transform:translateY(-50%); width:2px; height:14px;
  border-radius:2px; background:var(--accent); box-shadow:0 0 8px 1px rgba(var(--accent-rgb),.6);
}
.nav-item.active .nav-icon{ opacity:1; color:var(--accent); }
.nav-dot{ display:none; }

/* ---------- Rail: system area (market / account / workspace) ---------- */
.rail-system{ flex:0 0 auto; padding:10px 10px 4px; border-top:1px solid var(--border-soft); margin-top:auto; }
.rail-block{ padding:9px 4px; }
.rail-block-label{ font-family:var(--font-display); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px; white-space:nowrap; overflow:hidden; }
.rail-market-row{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; }
.rail-market-row .rail-dot{ width:5px; height:5px; border-radius:50%; background:var(--text-faint); flex:0 0 5px; }
.rail-market-row .rail-dot.live{ background:var(--positive); box-shadow:0 0 0 3px var(--positive-dim); animation:dotPulse 2.4s ease-in-out infinite; }
.rail-market-sub{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:12px; }
.rail-account-name{ font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rail-account-row{ display:flex; align-items:baseline; gap:8px; margin-top:3px; white-space:nowrap; overflow:hidden; }
.rail-account-row .rail-bal{ font-family:var(--font-mono); font-size:13px; color:var(--text); }
.rail-account-row .rail-pct{ font-family:var(--font-mono); font-size:11px; }
.rail-account-empty{ font-size:11px; color:var(--text-faint); }
.rail-account-empty a{ color:var(--accent); cursor:pointer; font-weight:600; }
.rail-divider-line{ height:1px; background:var(--border-soft); margin:2px 0 8px; }
.rail-workspace{ display:flex; align-items:center; gap:9px; padding:6px 4px; }
.rail-workspace-avatar{ width:24px; height:24px; border-radius:50%; background:var(--accent-glow); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex:0 0 24px; }
.rail-workspace-text{ min-width:0; flex:1; overflow:hidden; }
.rail-workspace-text .rail-ws-name{ font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rail-workspace-text .rail-ws-sub{ font-size:10px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rail-workspace-signout{ flex:0 0 auto; width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); cursor:pointer; background:transparent; border:none; transition:background .15s ease, color .15s ease; }
.rail-workspace-signout:hover{ background:var(--surface-2); color:var(--text); }
.rail-workspace-signout svg{ width:13px; height:13px; }
.rail-settings-link{ margin-top:2px; }

/* ---------- Rail: collapse control ---------- */
.rail-collapse-bar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:7px; margin:8px 10px 0; padding:7px 0;
  border-top:1px solid var(--border-soft); color:var(--text-faint); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  cursor:pointer; user-select:none; transition:color .15s ease;
}
.rail-collapse-bar:hover{ color:var(--text-muted); }
.rail-collapse-bar svg{ width:12px; height:12px; transition:transform var(--rail-anim); }

/* ---------- Rail: collapsed-mode overrides + tooltips (desktop only) ---------- */
@media (min-width: 981px){
  #sidebar.rail-collapsed{ width:var(--nav-collapsed-width); flex:0 0 var(--nav-collapsed-width); }
  #sidebar.rail-collapsed .rail-brand{ justify-content:center; padding:2px 0 16px; }
  #sidebar.rail-collapsed .rail-brand-text,
  #sidebar.rail-collapsed .rail-search-label,
  #sidebar.rail-collapsed .rail-search-kbd,
  #sidebar.rail-collapsed .nav-group-label .grp-text,
  #sidebar.rail-collapsed .nav-item .nav-label,
  #sidebar.rail-collapsed .rail-block-label,
  #sidebar.rail-collapsed .rail-market-sub,
  #sidebar.rail-collapsed .rail-account-row,
  #sidebar.rail-collapsed .rail-account-empty,
  #sidebar.rail-collapsed .rail-workspace-text,
  #sidebar.rail-collapsed .rail-collapse-bar span{ display:none; }
  #sidebar.rail-collapsed .rail-search{ justify-content:center; padding:8px; }
  #sidebar.rail-collapsed .nav-group-label{ justify-content:center; padding:0 0 7px; }
  #sidebar.rail-collapsed .nav-item{ justify-content:center; padding:8px; }
  #sidebar.rail-collapsed .nav-item .nav-icon{ display:flex; }
  #sidebar.rail-collapsed .nav-item.active::before{ left:2px; }
  #sidebar.rail-collapsed .rail-market-row{ justify-content:center; }
  #sidebar.rail-collapsed .rail-market-row .rail-dot{ margin:0; }
  #sidebar.rail-collapsed .rail-account-name{ display:none; }
  #sidebar.rail-collapsed .rail-block{ display:flex; justify-content:center; padding:9px 0; }
  #sidebar.rail-collapsed .rail-workspace{ justify-content:center; padding:6px 0; }
  #sidebar.rail-collapsed .rail-workspace-avatar{ margin:0; }
  #sidebar.rail-collapsed .rail-collapse-bar{ margin:8px 0 0; }
  #sidebar.rail-collapsed .rail-collapse-bar svg{ transform:rotate(180deg); }
  #sidebar.rail-collapsed [data-tooltip]{ position:relative; }
  #sidebar.rail-collapsed [data-tooltip]:hover::after{
    content:attr(data-tooltip); position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%);
    background:var(--surface-3); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:5px 9px; font-size:11px; font-weight:500; white-space:pre-line; line-height:1.4; z-index:60;
    box-shadow:var(--shadow-card); pointer-events:none; animation:railTooltipIn .12s ease;
  }
  @keyframes railTooltipIn{ from{ opacity:0; transform:translateY(-50%) translateX(-3px); } to{ opacity:1; transform:translateY(-50%); } }
  #sidebar.rail-collapsed ~ #main{ margin-left:var(--nav-collapsed-width); }
  #main{ transition:margin-left var(--rail-anim); }
}
@media (prefers-reduced-motion: reduce){
  #sidebar, #main, .nav-item, .rail-collapse-bar svg{ transition:none !important; }
}

.sidebar-footer{ display:none; } /* legacy — replaced by .rail-workspace */

#main{
  flex:1;
  margin-left:var(--nav-width);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-top:42px; /* Electron custom title bar */
}
/* ---------- Application topbar ---------- */
#topbar{
  height:60px;
  flex:0 0 60px;
  border-bottom:1px solid var(--border-soft);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:42px; /* stay below Electron title bar */
  background:var(--surface);
  backdrop-filter:blur(calc(var(--glass-blur) + 4px)) saturate(180%);
  -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 4px)) saturate(180%);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.04), 0 4px 18px -10px rgba(0,0,0,.4);
  z-index:30;
  transition:background .35s ease, border-color .35s ease;
}
#menu-toggle{ display:none; }
.topbar-left{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-faint); }
.breadcrumb b{ color:var(--text-muted); font-weight:600; }
.session-chip{ display:flex; align-items:center; gap:7px; padding:6px 12px; border:1px solid var(--border); border-radius:999px; font-size:11px; color:var(--text-muted); background:var(--surface-2); font-family:var(--font-mono); letter-spacing:.03em; }
.session-dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); }
.session-dot.live{ background:var(--positive); box-shadow:0 0 0 3px var(--positive-dim), 0 0 8px rgba(var(--accent-rgb),.45); animation:dotPulse 2.4s ease-in-out infinite; }
@keyframes dotPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
.topbar-right{ display:flex; align-items:center; gap:8px; }
#theme-toggle{ position:relative; overflow:hidden; }
#theme-toggle svg{ transition:transform .35s ease, opacity .2s ease; }
#page-content{ padding:28px 36px 80px; max-width:1440px; width:100%; margin:0 auto; position:relative; z-index:1; }
#page-content.page-enter{ animation:pageIn .28s ease; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

/* Session status hero card */
.session-status-card{ position:relative; overflow:hidden; padding:22px 26px; margin-bottom:22px; }
.session-status-card::before{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 15% 20%, rgba(var(--accent-rgb),.14), transparent 55%); pointer-events:none; }
.session-status-inner{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.session-status-eyebrow{ font-family:var(--font-display); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); font-weight:500; margin-bottom:8px; }
.session-status-title{ font-family:var(--font-display); font-size:20px; font-weight:500; }
.session-status-title .live-tag{ color:var(--positive); font-size:13px; letter-spacing:.06em; margin-left:6px; text-shadow:0 0 12px rgba(var(--accent-rgb),.50); }
.session-status-sub{ font-size:12px; color:var(--text-muted); margin-top:4px; }
.session-status-stats{ display:flex; gap:34px; }
.session-status-stat{ text-align:right; }
.session-status-stat .lbl{ font-family:var(--font-display); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:5px; }
.session-status-stat .val{ font-family:var(--font-mono); font-size:15px; font-weight:600; }

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-s);
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:13px; font-weight:500;
  cursor:pointer; transition:all var(--anim);
}
.btn:hover{ background:var(--surface-3); border-color:var(--card-border-hover); }
.btn:active{ transform:scale(.98); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); transition:all .15s ease; box-shadow:0 0 14px -4px var(--accent-glow); }
.btn-primary:hover{ background:var(--accent-dim); border-color:var(--accent-dim); transform:translateY(-1px); box-shadow:0 0 22px -4px var(--accent-glow); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ background:transparent; border-color:var(--negative); color:var(--negative); }
.btn-danger:hover{ background:var(--negative-dim); }
.btn-sm{ padding:5px 10px; font-size:12px; }
.btn-icon{ width:32px; height:32px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.icon{ width:15px; height:15px; }

input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],
select,textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:9px 11px; border-radius:var(--radius-s); font-size:13px; font-family:inherit; outline:none;
  transition:border-color var(--anim), background var(--anim);
}
input:focus,select:focus,textarea:focus{ border-color:var(--accent); background:var(--surface-3); }
textarea{ resize:vertical; min-height:70px; }
label.field-label{ display:block; font-size:11px; color:var(--text-muted); margin-bottom:6px; font-weight:600; letter-spacing:.02em; }
.field{ margin-bottom:14px; }
.field-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
.hint{ font-size:11px; color:var(--text-faint); margin-top:4px; }

/* slider */
input[type=range]{ width:100%; accent-color:var(--accent); background:transparent; }

/* checkbox / toggle */
.toggle{ position:relative; width:38px; height:22px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); cursor:pointer; flex:0 0 38px; transition:background var(--anim); }
.toggle.on{ background:var(--accent); border-color:var(--accent); }
.toggle .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform var(--anim); }
.toggle.on .knob{ transform:translateX(16px); }

/* ---------- Cards / KPIs ---------- */
.grid{ display:grid; gap:14px; }
.kpi-row{ grid-template-columns:repeat(5,1fr); }
.kpi-row2{ grid-template-columns:repeat(5,1fr); }
.card{
  position:relative;
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-l);
  padding:var(--density-pad); box-shadow:var(--shadow-card);
  transition:background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
  overflow:hidden;
}
.card::before{
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
  background:linear-gradient(180deg, rgba(var(--accent-rgb),.14), rgba(var(--accent-rgb),0) 40%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none; opacity:.8;
}
/* Premium cursor-following light — desktop hover only, subtle frost glow */
.has-hover .card::after{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%), rgba(var(--accent-rgb),.055), transparent 70%);
  opacity:0; transition:opacity .2s ease;
}
.has-hover .card:hover::after{ opacity:1; }
.card:hover{ background:var(--card-bg-hover); border-color:var(--card-border-hover); box-shadow:0 0 18px -8px var(--accent-soft), var(--shadow-card); }
.kpi-card .kpi-label{ font-family:var(--font-display); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-weight:500; margin-bottom:10px; }
.kpi-card .kpi-value{ font-family:var(--font-mono); font-size:22px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.kpi-card .kpi-value.pos{ text-shadow:0 0 18px rgba(var(--accent-rgb),.30); }
.kpi-card .kpi-value.neg{ text-shadow:0 0 14px rgba(var(--negative-rgb),.18); }
.kpi-card .kpi-sub{ font-size:11px; color:var(--text-muted); margin-top:6px; }
.kpi-card{ padding:18px 20px; }
.pos{ color:var(--positive); } .neg{ color:var(--negative); } .warn{ color:var(--warning); }

.section-header{ display:flex; align-items:center; justify-content:space-between; margin:32px 0 14px; }
.section-header h2{ font-family:var(--font-display); font-size:13px; font-weight:500; margin:0; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); }
.section-header .desc{ font-size:12px; color:var(--text-faint); margin-top:2px; }

.page-header{ margin-bottom:24px; }
.page-header h1{ font-family:var(--font-serif); font-style:italic; font-size:32px; font-weight:700; margin:0 0 6px; letter-spacing:-.045em; line-height:1.12; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.page-header .sub{ font-size:13px; color:var(--text-muted); }
.page-header-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.page-eyebrow{ font-family:var(--font-display); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:500; margin-bottom:10px; }
.count-pill{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px; background:var(--accent-glow); color:var(--accent); font-size:12px; font-weight:600; font-family:var(--font-mono); letter-spacing:.02em; border:1px solid rgba(var(--accent-rgb),.30); box-shadow:0 0 12px -4px var(--accent-glow); }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin:0 0 14px; }
.card-head h3{ font-family:var(--font-display); font-size:12px; font-weight:500; margin:0; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
.grid-2{ grid-template-columns:1.3fr 1fr; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }

/* ---------- Settings: Control Center ---------- */
.settings-landing-list{ display:flex; flex-direction:column; }
.settings-row{
  display:flex; align-items:center; gap:20px; padding:22px 4px; border-bottom:1px solid var(--border-soft);
  cursor:pointer; transition:padding-left .18s ease;
}
.settings-row:first-child{ border-top:1px solid var(--border-soft); }
.settings-row:hover{ padding-left:8px; }
.settings-row-main{ flex:1; min-width:0; }
.settings-row-cat{ font-family:var(--font-display); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
.settings-row-title{ font-family:var(--font-serif); font-style:italic; font-size:19px; font-weight:500; color:var(--text); letter-spacing:-.005em; margin-bottom:4px; }
.settings-row-desc{ font-size:12.5px; color:var(--text-muted); }
.settings-row-state{ flex:0 0 auto; font-family:var(--font-mono); font-size:12px; color:var(--text-faint); white-space:nowrap; }
.settings-row-arrow{ flex:0 0 auto; color:var(--text-faint); transition:transform .18s ease, color .18s ease; }
.settings-row:hover .settings-row-arrow{ transform:translateX(3px); color:var(--accent); }
.settings-row-arrow svg{ width:15px; height:15px; }

.settings-two-col{ display:grid; grid-template-columns:236px minmax(0,1fr); gap:0; margin-top:8px; border:1px solid var(--border-soft); border-radius:var(--radius-l); overflow:hidden; background:var(--card-bg); backdrop-filter:blur(var(--glass-blur)) saturate(180%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%); }
.settings-sidebar{ border-right:1px solid var(--border-soft); padding:16px 10px; max-height:74vh; overflow-y:auto; }
.settings-search{ display:flex; align-items:center; gap:8px; padding:8px 10px; margin:0 2px 14px; border-radius:var(--radius-s); background:var(--surface-2); border:1px solid var(--border-soft); }
.settings-search svg{ width:13px; height:13px; color:var(--text-faint); flex:0 0 auto; }
.settings-search input{ border:none; background:transparent; padding:2px 0; font-size:12.5px; }
.settings-search input:focus{ border:none; background:transparent; }
.settings-nav-group{ margin-bottom:12px; }
.settings-nav-group-label{ font-family:var(--font-display); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); padding:0 10px 6px; }
.settings-nav-item{ padding:8px 10px; border-radius:var(--radius-s); font-size:13px; color:var(--text-muted); cursor:pointer; transition:background .15s ease, color .15s ease; margin-bottom:1px; }
.settings-nav-item:hover{ background:rgba(var(--accent-rgb),.06); color:var(--text); }
.settings-nav-item.active{ background:rgba(var(--accent-rgb),.10); color:var(--text); font-weight:600; }
.settings-nav-item.hidden-by-search{ display:none; }
.settings-panel{ padding:28px 32px; max-height:74vh; overflow-y:auto; }
.settings-panel-head{ margin-bottom:22px; }
.settings-panel-head .page-eyebrow{ margin-bottom:8px; }
.settings-panel-head h2{ font-family:var(--font-serif); font-style:italic; font-size:24px; font-weight:700; margin:0 0 6px; letter-spacing:-.04em; }
.settings-panel-head .sub{ font-size:12.5px; color:var(--text-muted); }
.settings-back{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-faint); cursor:pointer; margin-bottom:18px; transition:color .15s ease; }
.settings-back:hover{ color:var(--accent); }
.settings-back svg{ width:13px; height:13px; }
@media (max-width: 900px){
  .settings-two-col{ grid-template-columns:1fr; }
  .settings-sidebar{ border-right:none; border-bottom:1px solid var(--border-soft); max-height:none; }
  /* Mobile: the category list (renderSettingsLanding) is already the root screen —
     once a section is open, don't also show the desktop split-view list; just the
     panel + back nav, matching the rest of the app's single-column mobile pattern. */
  .settings-two-col.is-detail .settings-sidebar{ display:none; }
  .settings-panel{ padding:20px 18px; max-height:none; }
}

/* ---------- Dashboard cockpit (redesigned) ---------- */
.asc-dashboard-grid{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(300px,.55fr); gap:16px; margin-top:22px; }
.asc-equity-panel{ display:flex; flex-direction:column; padding:24px; }
.asc-equity-value{ font-family:var(--font-mono); font-size:38px; font-weight:600; line-height:1; margin:14px 0 6px; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.asc-equity-delta{ font-family:var(--font-mono); font-size:13px; font-weight:500; }
.asc-today-strip{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0 4px; }
.asc-metric{ padding:14px; border:1px solid var(--border-soft); border-radius:var(--radius-m); background:var(--surface-2); }
.asc-metric .kpi-label{ font-family:var(--font-display); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); font-weight:500; }
.asc-metric-value{ font-family:var(--font-mono); font-size:19px; font-weight:600; margin-top:8px; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.asc-kpi-panel{ padding:22px; display:flex; flex-direction:column; }
.asc-kpi-primary{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
.asc-kpi-primary .asc-metric-value{ font-size:21px; }
.asc-process-list{ display:grid; gap:0; margin-top:8px; }
.asc-process-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:12px; color:var(--text-muted); }
.asc-process-row:last-child{ border-bottom:0; }
.asc-process-row b{ color:var(--text); font-weight:600; font-size:12.5px; }
@media(max-width:1180px){ .asc-dashboard-grid{ grid-template-columns:1fr; } }
@media(max-width:640px){ .asc-today-strip, .asc-kpi-primary{ grid-template-columns:1fr 1fr; } }

/* badges/tags */
.badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--border); color:var(--text-muted); }
.badge.b-pos{ background:var(--positive-dim); color:var(--positive); border-color:transparent; }
.badge.b-neg{ background:var(--negative-dim); color:var(--negative); border-color:transparent; }
.badge.b-warn{ background:var(--warning-dim); color:var(--warning); border-color:transparent; }
.badge.b-accent{ background:var(--accent-glow); color:var(--accent); border-color:transparent; }
.tag{ display:inline-flex; padding:3px 8px; border-radius:6px; font-size:11px; background:var(--surface-3); color:var(--text-muted); margin:0 4px 4px 0; }

/* table */
.table-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius:var(--radius-m); }
table{ width:100%; border-collapse:collapse; font-size:13px; }
thead th{ text-align:left; font-family:var(--font-display); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); font-weight:500; padding:10px 14px; border-bottom:1px solid var(--border-soft); background:transparent; white-space:nowrap; cursor:pointer; }
tbody td{ padding:11px 14px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
tbody tr{ transition:background var(--anim); cursor:pointer; }
tbody tr:hover{ background:var(--surface-2); }
tbody tr:last-child td{ border-bottom:none; }

/* filter bar */
.filter-bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
.filter-bar select, .filter-bar input{ width:auto; min-width:110px; padding:7px 10px; font-size:12px; }
.filter-bar .search-wrap{ position:relative; flex:1; min-width:180px; }
.filter-bar .search-wrap input{ padding-left:30px; width:100%; }
.filter-bar .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; opacity:.5; }

/* empty state */
.empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty-state .icon-wrap{ width:52px; height:52px; border-radius:var(--radius-md); background:var(--surface-2); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.empty-state h3{ font-family:var(--font-serif); font-style:italic; font-weight:500; margin:0 0 6px; color:var(--text); font-size:22px; letter-spacing:-.005em; }
.empty-state p{ margin:0 0 18px; font-size:13px; max-width:340px; margin-left:auto; margin-right:auto; }

/* modal / drawer */
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(8px) saturate(140%); -webkit-backdrop-filter:blur(8px) saturate(140%); z-index:100; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity var(--anim); }
.overlay.show{ opacity:1; pointer-events:auto; }
.modal{ position:relative; background:var(--surface-3); backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); border:1px solid var(--border); border-radius:var(--radius-l); width:560px; max-width:92vw; max-height:88vh; display:flex; flex-direction:column; transform:translateY(8px) scale(.98); opacity:0; transition:transform var(--anim), opacity var(--anim); box-shadow:0 24px 80px -16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); overflow:hidden; }
.modal::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 35%); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
.overlay.show .modal{ transform:translateY(0) scale(1); opacity:1; }
.modal.modal-lg{ width:820px; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft); }
.modal-header h3{ font-family:var(--font-serif); font-style:italic; margin:0; font-size:22px; font-weight:500; letter-spacing:-.005em; line-height:1.2; }
.modal-body{ padding:20px; overflow-y:auto; }
.modal-footer{ padding:16px 20px; border-top:1px solid var(--border-soft); display:flex; justify-content:flex-end; gap:8px; }
.modal-tabs{ display:flex; gap:2px; padding:0 20px; border-bottom:1px solid var(--border-soft); overflow-x:auto; }
.modal-tab{ padding:12px 12px; font-size:12px; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-weight:600; }
.modal-tab.active{ color:var(--text); border-color:var(--accent); }
.modal-tabpanel{ display:none; }
.modal-tabpanel.active{ display:block; }

/* toast */
#toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--surface-3); border:1px solid var(--border); padding:11px 16px; border-radius:var(--radius-s); font-size:13px; box-shadow:var(--shadow-card); display:flex; align-items:center; gap:8px; animation:toastIn .2s ease; }
.toast.t-success{ border-color:rgba(62,207,142,.4); }
.toast.t-error{ border-color:rgba(232,93,93,.4); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* notification center */
.notif-wrap{ position:relative; }
#notif-btn{ position:relative; }
#notif-btn.has-notif{ color:var(--negative); }
.notif-badge{ position:absolute; top:1px; right:1px; min-width:14px; height:14px; padding:0 3px; border-radius:999px; background:var(--negative); color:#fff; font-size:9px; font-weight:700; font-family:var(--font-mono); line-height:14px; text-align:center; box-shadow:0 0 0 2px var(--surface); }
.notif-panel{ position:absolute; top:calc(100% + 10px); right:0; width:320px; max-height:70vh; overflow-y:auto; background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:0 24px 60px -16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); z-index:60; padding:6px; animation:toastIn .16s ease; }
.notif-panel-head{ font-family:var(--font-display); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); font-weight:500; padding:8px 10px 6px; }
.notif-item{ display:flex; align-items:flex-start; gap:10px; padding:10px; border-radius:var(--radius-s); border:1px solid var(--border-soft); background:var(--surface-2); margin-bottom:6px; }
.notif-item:last-child{ margin-bottom:0; }
.notif-item-icon{ flex:0 0 28px; width:28px; height:28px; border-radius:8px; background:var(--negative-dim); color:var(--negative); display:flex; align-items:center; justify-content:center; }
.notif-item-icon svg{ width:14px; height:14px; }
.notif-item-body{ flex:1; min-width:0; }
.notif-item-title{ font-size:12.5px; font-weight:600; color:var(--text); }
.notif-item-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; line-height:1.4; }
.notif-item .notif-resolve{ margin-top:8px; }
.notif-empty{ padding:26px 14px; text-align:center; font-size:12.5px; color:var(--text-faint); }
.field-alert label.field-label{ color:var(--negative); }
.field-alert select{ border-color:var(--negative); box-shadow:0 0 0 1px var(--negative-dim); animation:fieldAlertPulse 1.6s ease-in-out 2; }
@keyframes fieldAlertPulse{ 0%,100%{ box-shadow:0 0 0 1px var(--negative-dim); } 50%{ box-shadow:0 0 0 3px var(--negative-dim); } }
.field-alert-note{ font-size:11px; color:var(--negative); margin-top:4px; }

/* command menu */
#command-overlay{ background:rgba(4,5,7,.72); backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%); }
#command-overlay .modal{ width:620px; max-width:92vw; align-self:flex-start; margin-top:12vh; background:var(--surface-3); box-shadow:0 30px 100px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(var(--accent-rgb),.06), inset 0 1px 0 rgba(255,255,255,.08); }
.cmd-input{ display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border-soft); }
.cmd-input svg{ width:17px; height:17px; color:var(--text-faint); flex:0 0 auto; }
.cmd-input input{ border:none; background:transparent; font-size:16px; padding:4px 0; letter-spacing:.005em; }
.cmd-input input:focus{ border:none; background:transparent; }
.cmd-input input::placeholder{ color:var(--text-faint); }
.cmd-list{ max-height:420px; overflow-y:auto; padding:10px 10px 6px; }
.cmd-group{ margin-bottom:10px; }
.cmd-group:last-child{ margin-bottom:0; }
.cmd-group-label{ font-family:var(--font-display); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); padding:8px 10px 6px; }
.cmd-item{ display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:var(--radius-s); cursor:pointer; font-size:13px; color:var(--text-muted); transition:background .12s ease, color .12s ease; }
.cmd-item span:not(.k){ color:var(--text); }
.cmd-item svg{ opacity:.75; flex:0 0 auto; }
.cmd-item.sel, .cmd-item:hover{ background:rgba(var(--accent-rgb),.08); }
.cmd-item.sel svg, .cmd-item:hover svg{ opacity:1; color:var(--accent); }
.cmd-item .k{ margin-left:auto; font-size:10px; color:var(--text-faint); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-family:var(--font-mono); }
.cmd-empty{ padding:28px 14px; text-align:center; color:var(--text-faint); font-size:13px; }
.cmd-footer{ display:flex; align-items:center; gap:16px; padding:12px 20px; border-top:1px solid var(--border-soft); }
.cmd-footer .cmd-hint{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-faint); }
.cmd-footer .cmd-hint kbd{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
@media (max-width: 640px){
  #command-overlay{ align-items:flex-end; }
  #command-overlay .modal{ width:100vw; max-width:100vw; margin-top:0; align-self:flex-end; max-height:88vh; border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
  .cmd-input{ padding:16px 16px calc(14px + env(safe-area-inset-top)); }
  .cmd-input input{ font-size:16px; } /* prevents iOS auto-zoom on focus */
  .cmd-item{ padding:13px 12px; }
  .cmd-footer{ display:none; } /* keyboard hints are meaningless on touch */
}

/* misc */
.muted{ color:var(--text-muted); }

.faint{ color:var(--text-faint); }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.flex{ display:flex; align-items:center; }
.flex-between{ display:flex; align-items:center; justify-content:space-between; }
.gap-8{ gap:8px; } .gap-12{ gap:12px; } .gap-16{ gap:16px; }
hr.divider{ border:none; border-top:1px solid var(--border-soft); margin:16px 0; }
.two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
.trade-grid{ grid-template-columns:repeat(3,1fr); gap:16px; }
.trade-card{ display:flex; flex-direction:column; padding:18px 18px; cursor:pointer; }
.trade-card:hover{ border-color:var(--card-border-hover); }
.trade-card-top{ display:flex; align-items:center; gap:10px; }
.trade-card-pnl{ margin-left:auto; font-size:18px; font-weight:600; }
.trade-card-meta, .trade-card-prices{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
.trade-card-tags{ display:flex; flex-wrap:wrap; }
.trade-card-lesson{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--border-soft); }
.trade-card-actions{ display:flex; gap:6px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft); }
.trade-card-actions .btn{ flex:1; justify-content:center; }
.chart-container{ width:100%; }
.progress-bar{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.progress-bar .fill{ height:100%; border-radius:999px; background:var(--accent); transition:width .3s ease; }

/* Updates panel — spinning icon reuses the app's existing reduced-motion rules above */
@keyframes updSpin{ to{ transform:rotate(360deg); } }
.upd-spin{ animation:updSpin .9s linear infinite; }
.slider-row{ display:flex; align-items:center; gap:10px; }
.slider-row .val{ width:26px; text-align:right; font-weight:650; font-variant-numeric:tabular-nums; }
.tab-chip-group{ display:flex; gap:6px; flex-wrap:wrap; }
.tab-chip{ padding:6px 12px; border-radius:999px; border:1px solid var(--border); font-size:12px; cursor:pointer; color:var(--text-muted); }
.tab-chip.active{ background:var(--accent-glow); border-color:rgba(var(--accent-rgb),.55); color:var(--accent); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.12); }
.day-cell{ aspect-ratio:1; min-height:38px; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; cursor:pointer; position:relative; border:1px solid transparent; padding:2px; }
.day-cell:hover{ border-color:var(--border); }
.day-cell-day{ font-size:10.5px; font-weight:700; line-height:1; }
.day-cell-pnl{ font-size:8.5px; font-weight:600; line-height:1; letter-spacing:.01em; }
.screenshot-thumb{ width:100%; border-radius:var(--radius-s); border:1px solid var(--border-soft); cursor:zoom-in; display:block; }
.upload-drop{ border:1.5px dashed var(--border); border-radius:var(--radius-s); padding:18px; text-align:center; font-size:12px; color:var(--text-faint); cursor:pointer; }
.upload-drop:hover{ border-color:var(--accent); color:var(--text-muted); }
.media-preview{ width:100%; aspect-ratio:16/9; border-radius:var(--radius-s); overflow:hidden; background:var(--surface-2); margin-bottom:12px; }
.media-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
.trade-card-preview{ margin:-2px -2px 12px; }
.pb-card-preview{ margin-bottom:10px; }
.pm-thumb{ width:44px; height:30px; border-radius:5px; overflow:hidden; background:var(--surface-2); display:inline-block; vertical-align:middle; }
.pm-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

@media (max-width: 980px){
  #sidebar, #sidebar-scrim, #menu-toggle, #quick-add-btn{
    display:none !important;
  }

  #main{
    margin-left:0;
    padding-top:42px;
  }

  .kpi-row, .kpi-row2{ grid-template-columns:repeat(2,1fr); }
  .two-col{ grid-template-columns:1fr; }
  .trade-grid{ grid-template-columns:repeat(2,1fr); }
  #page-content{ padding:22px 22px calc(96px + env(safe-area-inset-bottom)); }
  table thead{ display:none; }
  .modal{ width:94vw; }
}
@media (max-width: 640px){
  .kpi-row, .kpi-row2, .grid-2, .grid-3, .grid-4{ grid-template-columns:1fr; }
  .trade-grid{ grid-template-columns:1fr; }
  #page-content{ padding:18px 16px calc(92px + env(safe-area-inset-bottom)); }
  .page-header h1{ font-size:24px; }
}

/* ===================================================================
   MOBILE COMMAND DOCK + MORE SHEET
   Mobile's own navigation system — not a shrunk Command Rail.
   Hidden entirely above 980px (desktop/tablet keep the Command Rail).
   =================================================================== */
#mobile-dock{ display:none; }
@media (max-width: 980px){
  #mobile-dock{
    display:flex; align-items:stretch; justify-content:space-between;
    position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
    height:60px; padding:0 4px; z-index:45; border-radius:var(--radius-xl);
    background:var(--surface-3); border:1px solid var(--border);
    backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%);
    -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%);
    box-shadow:0 16px 50px -14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
}
.dock-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--text-faint); cursor:pointer; padding:6px 2px; min-width:44px;
  font-family:var(--font-ui); transition:color .15s ease;
}
.dock-item svg{ width:19px; height:19px; }
.dock-item .dock-label{ font-size:9.5px; font-weight:500; letter-spacing:.01em; }
.dock-item:active{ opacity:.7; }
.dock-item.active{ color:var(--accent); }
.dock-item.active .dock-label{ font-weight:600; }
.dock-create{
  flex:0 0 50px; align-self:center; width:50px; height:50px; border-radius:50%; margin-top:-22px;
  background:linear-gradient(135deg, var(--accent), var(--accent-dim)); color:var(--accent-ink);
  box-shadow:0 8px 22px -6px rgba(var(--accent-rgb),.45), 0 0 0 4px var(--bg-0, #050608);
}
html[data-theme="light"] .dock-create{ box-shadow:0 8px 22px -6px rgba(var(--accent-rgb),.45), 0 0 0 4px #0B0E12; }
.dock-create svg{ width:20px; height:20px; }
.dock-create .dock-label{ display:none; }
.dock-create:active{ transform:scale(.94); }

#mobile-sheet-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.45); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); z-index:91; opacity:0; pointer-events:none; transition:opacity .2s ease; }
#mobile-sheet-scrim.show{ opacity:1; pointer-events:auto; }
#mobile-more-sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:92; max-height:88vh; display:flex; flex-direction:column;
  background:var(--surface-3); border-top:1px solid var(--border); border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%);
  box-shadow:0 -20px 60px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); padding-bottom:env(safe-area-inset-bottom);
}
#mobile-more-sheet.show{ transform:translateY(0); }
.msheet-handle{ flex:0 0 auto; display:flex; justify-content:center; padding:10px 0 4px; }
.msheet-handle::before{ content:''; width:36px; height:4px; border-radius:999px; background:var(--border); }
.msheet-brand{ flex:0 0 auto; padding:6px 20px 12px; font-family:var(--font-serif); font-style:italic; font-size:17px; font-weight:500; color:var(--text); }
.msheet-search{ flex:0 0 auto; margin:0 16px 14px; display:flex; align-items:center; gap:9px; padding:11px 13px; border-radius:var(--radius-m); background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-faint); font-size:13px; }
.msheet-search svg{ width:14px; height:14px; flex:0 0 auto; }
.msheet-body{ flex:1; overflow-y:auto; padding:0 12px 18px; -webkit-overflow-scrolling:touch; }
.msheet-group{ margin-bottom:16px; }
.msheet-group-label{ display:flex; align-items:baseline; gap:8px; padding:0 8px 8px; font-family:var(--font-display); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
.msheet-group-label .grp-num{ font-family:var(--font-mono); font-size:10px; opacity:.65; }
.msheet-nav-item{ display:flex; align-items:center; gap:13px; padding:13px 10px; border-radius:var(--radius-m); color:var(--text-muted); font-size:14.5px; font-weight:500; cursor:pointer; min-height:44px; transition:background .15s ease, color .15s ease; }
.msheet-nav-item svg{ width:17px; height:17px; opacity:.8; flex:0 0 17px; }
.msheet-nav-item.active{ background:rgba(var(--accent-rgb),.09); color:var(--text); }
.msheet-nav-item.active svg{ opacity:1; color:var(--accent); }
.msheet-nav-item:active{ background:rgba(var(--accent-rgb),.06); }
.msheet-system{ margin-top:4px; padding-top:14px; border-top:1px solid var(--border-soft); }
.msheet-context{ display:flex; gap:10px; padding:2px 8px 4px; }
.msheet-context .rail-block{ flex:1; padding:12px; border-radius:var(--radius-m); background:var(--surface-2); border:1px solid var(--border-soft); }


/* ===================================================================
   APPLE-STYLE DASHBOARD
   Scoped to .apple-dash so it never affects other pages.
   Design language: Switzer / SF Pro, generous whitespace, frosted glass,
   very large numeric display, soft shadows, no harsh borders, 16-22px
   rounded corners, pill chips, and #F3F8FC frost as the identity color.
   =================================================================== */
.apple-dash{
  --ad-radius-lg: 22px;
  --ad-radius-md: 16px;
  --ad-radius-sm: 12px;
  --ad-pad-lg: 28px;
  --ad-pad-md: 22px;
  --ad-pad-sm: 16px;
  --ad-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px -16px rgba(0,0,0,.55), 0 2px 8px -2px rgba(0,0,0,.35);
  --ad-divider: rgba(255,255,255,.06);
  --ad-tile-bg: rgba(255,255,255,.035);
  --ad-tile-bg-hover: rgba(255,255,255,.055);
  font-family: var(--font-ui);
}

/* HERO CARD — Apple's "Apple Card" / Wallet-style balance card */
.apple-dash .ad-hero{
  position: relative;
  border-radius: var(--ad-radius-lg);
  padding: 36px 36px 32px;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(var(--accent-rgb),.18) 0%, transparent 55%),
    radial-gradient(80% 60% at 0% 100%, rgba(var(--accent-rgb),.08) 0%, transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: var(--ad-shadow);
  overflow: hidden;
  margin-bottom: 22px;
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
}
.apple-dash .ad-hero::before{
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, transparent 30%);
  pointer-events: none; border-radius: inherit;
}
.apple-dash .ad-hero-row{
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
  flex-wrap: wrap; position: relative; z-index: 1;
}
.apple-dash .ad-hero-greeting{
  font-family: var(--font-ui);
  font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 6px;
}
.apple-dash .ad-hero-name{
  font-family: var(--font-serif); font-style: italic; font-weight: 700;
  font-size: 30px; line-height: 1.15; letter-spacing: -.045em;
  color: var(--text); margin-bottom: 28px;
}
.apple-dash .ad-hero-balance-label{
  font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 6px;
}
.apple-dash .ad-hero-balance{
  font-family: var(--font-mono);
  font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  margin-bottom: 8px;
}
.apple-dash .ad-hero-balance.pos{ color: var(--positive); text-shadow: 0 0 32px rgba(var(--accent-rgb),.25); }
.apple-dash .ad-hero-balance.neg{ color: var(--negative); text-shadow: 0 0 28px rgba(var(--negative-rgb),.18); }
.apple-dash .ad-hero-delta{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  background: rgba(255,255,255,.05);
  font-size: 12px; font-weight: 600; font-family: var(--font-mono);
  color: var(--text-muted);
}
.apple-dash .ad-hero-delta.pos{ background: var(--positive-dim); color: var(--positive); }
.apple-dash .ad-hero-delta.neg{ background: var(--negative-dim); color: var(--negative); }

/* Hero right column: session + time */
.apple-dash .ad-hero-right{
  display: flex; flex-direction: column; align-items: flex-end; gap: 18px;
  min-width: 220px;
}
.apple-dash .ad-session{
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 999px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.06);
  font-size: 12px; font-weight: 600;
  color: var(--text);
}
.apple-dash .ad-session .dot{
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-faint);
  box-shadow: 0 0 0 0 rgba(var(--accent-rgb),.6);
}
.apple-dash .ad-session.live .dot{
  background: var(--positive);
  animation: ad-pulse 1.8s ease-out infinite;
}
.apple-dash .ad-session.live{
  background: var(--positive-dim);
  color: var(--positive);
  border-color: transparent;
}
@keyframes ad-pulse{
  0%   { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),.55); }
  70%  { box-shadow: 0 0 0 10px rgba(var(--accent-rgb),0); }
  100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0); }
}
.apple-dash .ad-time{
  text-align: right;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.apple-dash .ad-time-clock{
  font-size: 28px; font-weight: 600; letter-spacing: -.01em; color: var(--text); line-height: 1;
}
.apple-dash .ad-time-tz{
  font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-faint); margin-top: 4px;
}

/* CONTROL ROW — segmented range + account picker (Apple-style segmented control) */
.apple-dash .ad-controls{
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-bottom: 22px; flex-wrap: wrap;
}
.apple-dash .ad-section-title{
  font-family: var(--font-display);
  font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 14px;
}
.apple-dash .ad-segmented{
  display: inline-flex; padding: 3px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 999px;
  gap: 2px;
}
.apple-dash .ad-segmented .ad-seg{
  padding: 6px 13px; border-radius: 999px;
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  cursor: pointer; transition: all .18s ease;
  font-family: var(--font-mono); letter-spacing: .02em;
}
.apple-dash .ad-segmented .ad-seg:hover{ color: var(--text); }
.apple-dash .ad-segmented .ad-seg.active{
  background: rgba(255,255,255,.10);
  color: var(--text);
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 1px 3px rgba(0,0,0,.25);
}
.apple-dash .ad-select{
  padding: 7px 14px; border-radius: 999px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.06);
  color: var(--text); font-size: 12px; font-weight: 600; font-family: var(--font-ui);
  cursor: pointer; outline: none;
  appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238FA39C' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center;
  padding-right: 30px;
}
.apple-dash .ad-select:hover{ background-color: rgba(255,255,255,.08); }

/* KPI TILE GRID — Apple Health rings style */
.apple-dash .ad-kpi-grid{
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
  margin-bottom: 28px;
}
.apple-dash .ad-kpi{
  position: relative;
  border-radius: var(--ad-radius-md);
  padding: var(--ad-pad-md) var(--ad-pad-md) 18px;
  background: var(--ad-tile-bg);
  border: 1px solid rgba(255,255,255,.06);
  box-shadow: var(--ad-shadow);
  transition: all .2s ease;
  cursor: default;
  overflow: hidden;
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
}
.apple-dash .ad-kpi:hover{
  background: var(--ad-tile-bg-hover);
  transform: translateY(-1px);
}
.apple-dash .ad-kpi-label{
  font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
}
.apple-dash .ad-kpi-label .ad-kpi-icon{
  width: 14px; height: 14px; opacity: .55;
}
.apple-dash .ad-kpi-value{
  font-family: var(--font-mono);
  font-size: 30px; font-weight: 600; line-height: 1.05; letter-spacing: -.015em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.apple-dash .ad-kpi-value.pos{ color: var(--positive); }
.apple-dash .ad-kpi-value.neg{ color: var(--negative); }
.apple-dash .ad-kpi-sub{
  font-size: 11.5px; color: var(--text-muted); margin-top: 8px;
  font-weight: 500;
}

/* TWO-COLUMN ROWS */
.apple-dash .ad-row{
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 22px;
}

const idEq = (a,b) => a!=null && b!=null && String(a).trim()===String(b).trim();
const nowISO = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function fmtMoney(n){
  const cur = State.db.settings.currency || 'USD';
  const symbols = {USD:'$',EUR:'€',GBP:'£'};
  const sym = symbols[cur] || cur+' ';
  const v = Number(n)||0;
  const sign = v<0 ? '-' : '';
  return sign + sym + Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPct(n,d=1){ return (Number(n)||0).toFixed(d)+'%'; }
function fmtR(n){ const v=Number(n)||0; return (v>=0?'+':'')+v.toFixed(2)+'R'; }
function fmtDate(d, opts){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined, opts || {month:'short', day:'numeric', year:'numeric'}); }
function fmtDateShort(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function weekRangeOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const sow = (State.db && State.db.settings && State.db.settings.startOfWeek) || 'Monday';
  // targetDow: 0=Mon, 1=Tue ... 6=Sun when sow is Monday; shift if sow is Sunday (treating Sun as start).
  const sowSunday = sow === 'Sunday';
  const raw = d.getDay(); // 0=Sun..6=Sat
  const dow = sowSunday ? raw : (raw + 6) % 7; // 0=SOW ... 6=day before SOW
  const start = new Date(d); start.setDate(d.getDate() - dow);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const iso = (x)=>x.toISOString().slice(0,10);
  return { start: iso(start), end: iso(end), key: iso(start) };
}
function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast '+(type==='error'?'t-error':type==='success'?'t-success':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 2600);
}
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
