// Rank 26: timezone changes only the displayed clock and session context. Trade
// date/time fields remain the journal values entered by the trader; no conversion
// or historical record mutation is performed.
const DISPLAY_TIMEZONES = Object.freeze(['Europe/Rome','UTC','Europe/London','America/New_York','America/Chicago','America/Los_Angeles','Asia/Tokyo','Asia/Singapore','Australia/Sydney']);
function displayTimezone(){
  const candidate=((State.db&&State.db.settings&&State.db.settings.timezone)||'Europe/Rome');
  try{ return new Intl.DateTimeFormat('en-GB',{timeZone:candidate}).resolvedOptions().timeZone||candidate; }
  catch(e){ return 'Europe/Rome'; }
}
function romeNow(){
  const fmt = new Intl.DateTimeFormat('en-GB',{ timeZone:displayTimezone(), hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short' });
  const parts = fmt.formatToParts(new Date());
  const h = parts.find(p=>p.type==='hour').value, m = parts.find(p=>p.type==='minute').value;
  return { h:+h, m:+m, minutes:(+h)*60+(+m) };
}
function toMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function getSessionInfo(){
  const sessions = (State.db && State.db.settings.sessions) || SESSIONS_DEFAULT;
  const now = romeNow();
  let active = null, next = null, nextDelta = Infinity;
  sessions.forEach(s=>{
    const start = toMinutes(s.start), end = toMinutes(s.end);
    const inSession = start<end ? (now.minutes>=start && now.minutes<end) : (now.minutes>=start || now.minutes<end);
    if(inSession) active = s;
    let delta = start - now.minutes; if(delta<0) delta += 1440;
    if(delta < nextDelta){ nextDelta = delta; next = s; }
  });
  return { now, active, next, nextDelta };
}
function updateSessionChip(){
  const info = getSessionInfo();
  const { now, active, next, nextDelta } = info;
  const timeStr = String(now.h).padStart(2,'0')+':'+String(now.m).padStart(2,'0');
  const chip = document.getElementById('session-chip');
  if(chip){
    if(active){
      chip.innerHTML = `<span class="session-dot live"></span><span><b>${esc(active.name.toUpperCase())}</b> · LIVE</span>`;
    } else {
      const nh = Math.floor(nextDelta/60), nm = nextDelta%60;
      chip.innerHTML = `<span class="session-dot"></span><span>QUIET · next ${esc(next?next.name:'')} ${nh}h${nm}m</span>`;
    }
  }
  const card = document.getElementById('session-status-card');
  if(card){
    const nh = Math.floor(nextDelta/60), nm = nextDelta%60;
    card.querySelector('#sess-title').innerHTML = active ? `${esc(active.name)} <span class="live-tag">● LIVE</span>` : `Market Quiet`;
    card.querySelector('#sess-sub').textContent = active ? 'Current trading window is active.' : `Next session in ${nh}h ${nm}m.`;
    card.querySelector('#sess-current').textContent = timeStr;
    card.querySelector('#sess-next').textContent = next ? `${next.name} · ${next.start}` : '—';
  }
  return info;
}

function rangeToDates(rangeKey, customStart, customEnd){
  const end=todayStr(); let start=end;
  switch(rangeKey){
    case '7D': start=shiftDateOnly(end,-7); break;
    case '30D': start=shiftDateOnly(end,-30); break;
    case '90D': start=shiftDateOnly(end,-90); break;
    case '6M': start=shiftDateOnlyMonths(end,-6); break;
    case 'YTD': start=`${end.slice(0,4)}-01-01`; break;
    case 'ALL': start='2000-01-01'; break;
    case 'CUSTOM': return {start:isDateOnly(customStart)?customStart:'2000-01-01',end:isDateOnly(customEnd)?customEnd:end};
    default: start=shiftDateOnly(end,-30);
  }
  return {start:start||end,end};
}
function filterTradesByRange(trades, rangeKey, accountId){
  const { start, end } = rangeToDates(rangeKey);
  return trades.filter(t=> t.date>=start && t.date<=end && (!accountId || accountId==='all' || idEq(t.accountId, accountId)));
}

    ? allAccounts.reduce((sum,account)=>sum+Number(account.accountSize||0),0)

// Rank 27: retain the entire filtered journal result for calculations while
// materialising a bounded visible page. This is deliberately client-side only:
// it never truncates exports, analytics, cloud state, or mode-owned records.
const TRADE_RENDER_PAGE_SIZE = 50;
function tradeAccountIndex(accounts){ return new Map((accounts||[]).map(account=>[String(account.id),account])); }
function tradeSearchText(trade, account){
  return [trade.date,trade.timeEntered,trade.instrument,trade.direction,trade.session,trade.entryModel,trade.result,trade.reviewStatus,trade.tradeNotes,trade.lessonLearned,trade.contextBias,trade.contextStructure,trade.contextKeyFactors,trade.keyLevels,trade.contextConfluences,trade.contextNotes,trade.entryBias,trade.entryStructure,trade.entryKeyFactors,trade.entryKeyLevels,trade.entryTrigger,trade.entryConfluences,trade.entryNotes,...((trade.playbookLink&&trade.playbookLink.snapshot&&trade.playbookLink.snapshot.customFields)||[]).flatMap(field=>[field&&field.label,...(field&&field.options||[])]),...Object.values(trade.customFieldValues||{}),account&&account.accountName,(trade.behaviourFlags||[]).join(' ')]
    .filter(value=>value!==undefined&&value!==null).join(' ').toLowerCase();
}
function tradePageWindow(items, page, pageSize=TRADE_RENDER_PAGE_SIZE){
  const totalItems=(items||[]).length, size=Math.max(1,Number(pageSize)||TRADE_RENDER_PAGE_SIZE), totalPages=Math.max(1,Math.ceil(totalItems/size));
  const current=Math.min(totalPages,Math.max(1,Number(page)||1)), start=(current-1)*size;
  return { page:current, pageSize:size, totalItems, totalPages, start, end:Math.min(totalItems,start+size), items:(items||[]).slice(start,start+size) };
}
function queryTradeCollection(trades, filters, accountById){
  const f=filters||{}, accounts=accountById||new Map(); let list=[...(trades||[])];
  if(Array.isArray(f.selectedIds)){ const selected=new Set(f.selectedIds.map(String)); list=list.filter(t=>selected.has(String(t.id))); }
  if(f.search){ const search=String(f.search).toLowerCase(); list=list.filter(t=>tradeSearchText(t,accounts.get(String(t.accountId))).includes(search)); }
  if(f.account&&f.account!=='all') list=list.filter(t=>idEq(t.accountId,f.account));
  if(f.direction&&f.direction!=='all') list=list.filter(t=>t.direction===f.direction);
  if(f.session&&f.session!=='all') list=list.filter(t=>t.session===f.session);
  if(f.result&&f.result!=='all') list=list.filter(t=>t.result===f.result);
  const [sortKey='date',sortDir='desc']=String(f.sort||'date_desc').split('_');
  list.sort((a,b)=>{
    let av,bv;
    if(sortKey==='date'){ av=(a.date||'')+(a.timeEntered||''); bv=(b.date||'')+(b.timeEntered||''); }
    else if(sortKey==='pnl'){ av=Calc.pnl(a); bv=Calc.pnl(b); }
    else { av=a[sortKey]; bv=b[sortKey]; }
    if(av<bv) return sortDir==='asc'?-1:1;
    if(av>bv) return sortDir==='asc'?1:-1;
    return 0;
  });
  return list;
}

const PLAYBOOK_CUSTOM_FIELD_TYPES=Object.freeze(['text','number','select','boolean']);
function normalizePlaybookCustomFields(fields){
  const used=new Set();
  return (Array.isArray(fields)?fields:[]).slice(0,5).map((field,index)=>{
    const raw=field&&typeof field==='object'?field:{};
    let id=String(raw.id||`custom_field_${index+1}`).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,80)||`custom_field_${index+1}`;
    while(used.has(id)) id=`${id}_${index+1}`;
    used.add(id);
    const type=PLAYBOOK_CUSTOM_FIELD_TYPES.includes(raw.type)?raw.type:'text';
    const options=type==='select'?[...new Set((Array.isArray(raw.options)?raw.options:String(raw.options||'').split(',')).map(item=>String(item).trim()).filter(Boolean))].slice(0,20):[];
    return {id,label:String(raw.label||'').trim().slice(0,80),type,options};
  });
}
function validatePlaybookCustomFields(fields){
  const normalized=normalizePlaybookCustomFields(fields), ids=new Set(), errors=[];
  normalized.forEach(field=>{ if(!field.label) errors.push('Each custom field needs a label.'); if(ids.has(field.id)) errors.push('Custom field IDs must be unique.'); ids.add(field.id); if(field.type==='select'&&!field.options.length) errors.push(`${field.label||'A select custom field'} needs at least one option.`); });
  return {ok:errors.length===0,errors,fields:normalized};
}
function playbookForTrade(trade,playbooks){ return (playbooks||[]).map(canonicalPlaybookRecord).find(playbook=>idEq(playbook.id,trade&&trade.playbookId))||null; }
function playbookAdherenceItems(playbook){
  const p=playbook?canonicalPlaybookRecord(playbook):null;
  if(!p) return [];
  const items=[];
  if(String(p.entryCriteria||'').trim()) items.push({id:'entryCriteria',label:'Entry criteria reviewed'});
  if(String(p.confirmationCriteria||'').trim()) items.push({id:'confirmationCriteria',label:'Confirmation criteria reviewed'});
  normalizePlaybookCustomFields(p.customFields).filter(field=>field.type==='boolean').forEach(field=>items.push({id:`custom:${field.id}`,label:field.label||'Custom condition'}));
  return items;
}
function sanitizeTradeCustomFieldValues(trade,playbook){
  const record=trade||{}, fields=normalizePlaybookCustomFields(playbook&&playbook.customFields), values=record.customFieldValues&&typeof record.customFieldValues==='object'?record.customFieldValues:{};
  record.customFieldValues=fields.reduce((next,field)=>{ const raw=values[field.id]; if(field.type==='boolean') next[field.id]=raw===true; else if(field.type==='number') next[field.id]=raw===''||raw==null?'':Number.isFinite(Number(raw))?Number(raw):''; else if(field.type==='select') next[field.id]=field.options.includes(String(raw||''))?String(raw):''; else next[field.id]=String(raw||''); return next; },{});
  const allowed=new Set(playbookAdherenceItems(playbook).map(item=>item.id)), prior=record.playbookAdherence&&typeof record.playbookAdherence==='object'?record.playbookAdherence:{};
  record.playbookAdherence=[...allowed].reduce((next,id)=>{ next[id]=prior[id]===true; return next; },{});

}

Forms.fastCapture = function(){
  const db = State.db;
  const t = createTradeDraft(db,State.appMode);
  const modeAccounts = getAccountsForMode(db,t.mode);
  const modeLabel = t.mode===APP_MODES.BACKTEST ? 'BACKTEST' : 'LIVE';
  const accountLabel = t.mode===APP_MODES.BACKTEST ? 'Backtest Account' : 'Live Account';
  const body = `
    <div class="fast-capture-intro"><div class="mode-context">${modeLabel}</div><p class="hint">Capture the outcome now. Add context, analysis, and reflection later in the detailed editor.</p></div>
    <div class="form-section" style="margin-top:12px;">
      <div class="form-section-title">Trade essentials</div>
      <div class="field-row">
        <div class="field" id="fast-capture-account-field"><label class="field-label">${accountLabel}</label><select data-field="accountId" id="fast-capture-account">${!modeAccounts.length ? `<option value="" selected disabled>No ${modeLabel==='BACKTEST'?'Backtest':'Live'} accounts — create one first</option>` : modeAccounts.map(a=>`<option value="${esc(a.id)}" ${idEq(t.accountId,a.id)?'selected':''}>${esc(a.accountName)}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Instrument</label><select data-field="instrument" id="fast-capture-instrument">${INSTRUMENTS.map(i=>`<option ${t.instrument===i?'selected':''}>${i}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Direction</label><select data-field="direction" id="fast-capture-direction">${DIRECTIONS.map(d=>`<option ${t.direction===d?'selected':''}>${d}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">Entry</label><input type="number" step="any" data-field="entryPrice" id="fast-capture-entry" placeholder="0.00"></div>
        <div class="field"><label class="field-label">Exit</label><input type="number" step="any" data-field="exitPrice" id="fast-capture-exit" placeholder="0.00"></div>
        <div class="field"><label class="field-label">Size</label><input type="number" step="any" data-field="positionSize" id="fast-capture-size" placeholder="lots / units"></div>
        <div class="field"><label class="field-label">P&amp;L</label><input type="number" step="any" data-field="pnl" id="fast-capture-pnl" placeholder="0.00"></div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">One chart and one tag</div>
      <div class="field">${uploadField('entryScreenshot', t.entryScreenshot, 'Screenshot')}</div>
      <div class="field"><label class="field-label">Tag</label><select id="fast-capture-tag"><option value="" selected disabled>Select one tag</option>${BEHAVIOUR_FLAGS.map(tag=>`<option value="${esc(tag)}">${esc(tag)}</option>`).join('')}</select><p class="hint" style="margin-top:7px;">Fast Capture stores one tag. You can add fuller context later in the detailed editor.</p></div>
    </div>
  `;
  const { overlay, close } = Modal.open({
    title:'Fast Capture', size:'md', className:'fast-capture-modal', bodyHTML: body,
    footerHTML:'<button class="btn btn-ghost" id="fast-capture-detailed">Open detailed editor</button><button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="fast-capture-save">Save Fast Capture</button>',
    onMount:(overlay)=>{
      wireCommonFormBits(overlay,t);
      const tagSelect=overlay.querySelector('#fast-capture-tag');
      tagSelect.onchange=()=>{ t.behaviourFlags=tagSelect.value ? [tagSelect.value] : []; };
      overlay.querySelector('#fast-capture-detailed').onclick=()=>{ close(); Forms.logTrade(t); };
      overlay.querySelector('#fast-capture-save').onclick=()=>{
        const required = [
          [t.accountId,accountLabel], [t.instrument,'Instrument'], [t.direction,'Direction'], [t.entryPrice,'Entry'],
          [t.exitPrice,'Exit'], [t.positionSize,'Size'], [t.pnl,'P&L'], [t.entryScreenshot,'Screenshot'], [t.behaviourFlags[0],'Tag']
        ];
        const missing=required.find(([value])=>value===undefined || value===null || String(value).trim()==='');
        if(missing){ toast(`${missing[1]} is required for Fast Capture`,'error'); return; }
        const selectedAccount=findAccount(db,t.accountId);
        if(!selectedAccount || normalizeAccountMode(selectedAccount.mode)!==normalizeTradeMode(t.mode)){
          toast('A trade can only be linked to an account in the same workspace','error'); return;
        }
        State.setSelectedAccountId(t.mode,selectedAccount.id);
        t.accountCurrency=normalizeCurrency(selectedAccount.currency,db.settings.currency);
        t.pnlCurrency=t.accountCurrency;
        t.sourcePnl=moneyNumber(t.pnl,0);
        t.grossPnl=moneyNumber(t.pnl,0);
        t.netPnl=moneyNumber(t.pnl,0);
        t.commission=0; t.fees=0; t.swap=0; t.slippage=0;
        t.currencyConversionRate=1;
        t.reportingCurrency=normalizeCurrency(db.settings.currency,t.accountCurrency);
        t.reportingConversionRate=t.reportingCurrency===t.accountCurrency?1:null;
        t.economicsSource='fast_capture_net';
        t.reviewStatus='captured';
        t.reviewStartedAt=null;
        t.reviewCompletedAt=null;
        t.reviewReminderAt=new Date(Date.now()+24*60*60*1000).toISOString();
        const riskValidation=validateTradeRisk(t);
        if(!riskValidation.ok){ toast('Risk must be a positive finite amount before a trade can show R','error'); return; }
        t.result=Calc.resultFromPnl(t)||t.result;
        t.rMultiple=Calc.rMultiple(t);
        db.trades.push(t);
        State.saveNow();
        toast('Fast Capture saved — add detail whenever you are ready','success');
        close();
        router();
      };
    }
  });
};
function uploadField(fieldKey, mediaId, label){
  return `<label class="field-label">${label}</label>
    <div class="upload-drop" data-upload="${fieldKey}">${mediaId? 'Screenshot attached — click to replace' : 'Click to upload screenshot'}</div>
    <img class="screenshot-thumb" id="thumb-${fieldKey}" style="display:none;margin-top:8px;max-height:140px;object-fit:cover;">
    <input type="file" accept="image/png,image/jpeg,image/webp" data-fileinput="${fieldKey}" style="display:none;">`;
}
function wireCommonFormBits(overlay, obj){
  overlay.querySelectorAll('[data-field]').forEach(el=>{
    const key = el.dataset.field;
    const evt = (el.tagName==='SELECT' || el.type==='date' || el.type==='time') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{ obj[key] = el.type==='number' ? (el.value===''? '' : Number(el.value)) : el.value; if(el.classList.contains('sl-input')){ const disp=overlay.querySelector('#sl-'+key); if(disp) disp.textContent = el.value; } });
  });
  overlay.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{ const key = el.dataset.toggle; obj[key] = !obj[key]; el.classList.toggle('on', obj[key]); };
  });
  overlay.querySelectorAll('[data-upload]').forEach(dz=>{
    const key = dz.dataset.upload;
    const input = overlay.querySelector(`[data-fileinput="${key}"]`);
    const thumb = overlay.querySelector(`#thumb-${key}`);
    if(obj[key]){ IDB.get(obj[key]).then(rec=>{ if(rec){ thumb.src = rec.dataURL; thumb.style.display='block'; } }); }
    dz.onclick = ()=> input.click();
    input.onchange = async ()=>{
      const file = input.files[0]; if(!file) return;
      const validation=validateScreenshotFile(file);
      if(!validation.ok){ input.value=''; toast(validation.message,'error'); return; }
      const reader = new FileReader();
      reader.onload = async ()=>{
        const id = obj[key] && obj[key].startsWith('media_') ? obj[key] : uid('media');
        await IDB.put(id, reader.result, { name:file.name });
        obj[key] = id;
        thumb.src = reader.result; thumb.style.display='block';
        dz.textContent = 'Screenshot attached — click to replace';
        toast('Screenshot attached','success');
      };
      reader.readAsDataURL(file);
    };
  });
}

</div><div><span class="label">WIN RATE</span><b class="mono">${fmtPct(Calc.winRate(rows))}</b><small>${progress.tradeCount} trade${progress.tradeCount===1?'':'s'}</small></div></div><div>${account.profitTarget?`<div class="asc-capital-track"><span>Target</span><div><i style="width:${targetPct}%;"></i></div><b>${fmtMoney(account.profitTarget)}</b></div>`:''}${account.maxDailyLoss?`<div class="asc-capital-track risk"><span>Daily loss</span><div><i style="width:${dailyPct}%;"></i></div><b>${fmtMoney(progress.dailyLossUsed)} / ${fmtMoney(account.maxDailyLoss)}</b></div>`:''}</div><div class="asc-capital-rule"><span class="asc-review-dot ${monitor.status===ACCOUNT_RULE_STATUSES.COMPLIANT?'complete':monitor.status===ACCOUNT_RULE_STATUSES.WARNING?'captured':'needed'}"></span><span>${esc(monitor.reason||'Account rule context unavailable.')}</span><span class="asc-capital-open">OPEN →</span></div></button>`;}).join('');

Forms.account = function(existing){

    <div class="field-row"><div class="field"><label class="field-label">Account Name</label><input type="text" data-field="accountName" value="${esc(a.accountName)}" placeholder="${isBacktest?'XAUUSD 100K Backtest':'FTMO 100K'}"></div>
    <div class="field"><label class="field-label">Provider</label><input type="text" data-field="provider" value="${esc(a.provider)}" placeholder="FTMO / Funding Pips"></div></div>
    <div class="field-row">
      <div class="field"><label class="field-label">Type</label><select data-field="accountType">${ACCOUNT_TYPES.map(t=>`<option ${a.accountType===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Status</label><select data-field="status">${ACCOUNT_STATUS.map(t=>`<option ${a.status===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Account Currency</label><select data-field="currency">${CURRENCIES.map(currency=>`<option value="${currency}" ${normalizeCurrency(a.currency,db.settings.currency)===currency?'selected':''}>${currency}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Start Date</label><input type="date" data-field="startDate" value="${a.startDate}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label class="field-label">${isBacktest?'Starting Balance':'Account Size'}</label><input type="number" data-field="accountSize" value="${a.accountSize}"></div>
      <div class="field"><label class="field-label">Default Risk %</label><input type="number" step="0.1" data-field="defaultRiskPct" value="${a.defaultRiskPct}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label class="field-label">Profit Target (account currency)</label><input type="number" data-field="profitTarget" value="${a.profitTarget}"></div>
      <div class="field"><label class="field-label">${isBacktest?'Simulated Drawdown Limit':'Max Total Loss'} (account currency)</label><input type="number" data-field="maxLoss" value="${a.maxLoss}"></div>
      <div class="field"><label class="field-label">${isBacktest?'Simulated Daily Loss':'Max Daily Loss'} (account currency)</label><input type="number" data-field="maxDailyLoss" value="${a.maxDailyLoss}"></div>
    </div>
    <div class="field-row"><div class="field"><label class="field-label">Warning Threshold %</label><input type="number" min="1" max="99" step="1" data-field="warningThresholdPct" value="${a.warningThresholdPct}" placeholder="e.g. 80"><div class="hint">Warning at this percentage of each configured limit.</div></div><div class="field"><label class="field-label">Maximum Planned Risk %</label><input type="number" min="0" step="0.1" data-field="maxRiskPct" value="${a.maxRiskPct}" placeholder="Optional"><div class="hint">Highest entered planned risk today ÷ account balance.</div></div></div>
    <div class="field-row"><div class="field flex-between"><label class="field-label" style="margin:0;">Consistency Rule</label><div class="toggle ${a.consistencyRule?'on':''}" data-toggle="consistencyRule"><div class="knob"></div></div></div><div class="field"><label class="field-label">Maximum Positive-Day Consistency %</label><input type="number" min="1" max="100" step="0.1" data-field="consistencyPct" value="${a.consistencyPct}" placeholder="Required when enabled"><div class="hint">Largest positive day ÷ total positive P&amp;L.</div></div></div>
    <p class="hint">ASCEND evaluates user-entered journal values only. It cannot verify, enforce, or certify broker or prop-firm rules.</p>
    <div class="field"><label class="field-label">Notes</label><textarea data-field="notes">${esc(a.notes||'')}</textarea></div>
  `;
  const footer = `${isEdit?`<button class="btn btn-danger" id="acc-delete" style="margin-right:auto;">Delete</button>`:''}<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="acc-save">${isEdit?'Save':'Create '+(isBacktest?'Backtest':'Live')+' Account'}</button>`;
  Modal.open({ title:isEdit?`Edit ${isBacktest?'Backtest':'Live'} Account`:`New ${isBacktest?'Backtest':'Live'} Account`, bodyHTML:body, footerHTML:footer, onMount:(overlay,close)=>{
    wireCommonFormBits(overlay, a);
    overlay.querySelector('#acc-save').onclick = ()=>{
      if(!a.accountName){ toast('Account name is required','error'); return; }
      if(!a.accountSize || Number(a.accountSize)<=0){ toast(isBacktest?'Starting balance must be greater than zero':'Account size must be greater than zero','error'); return; }
      const nonNegative=['defaultRiskPct','profitTarget','maxLoss','maxDailyLoss','maxRiskPct'];
      if(nonNegative.some(key=>a[key]!==''&&a[key]!=null&&(!Number.isFinite(Number(a[key]))||Number(a[key])<0))){ toast('Risk and account-rule values cannot be negative.','error'); return; }
      const hasRule=['profitTarget','maxLoss','maxDailyLoss','maxRiskPct'].some(key=>a[key]!==''&&a[key]!=null&&Number(a[key])>0) || !!a.consistencyRule;
      if(hasRule&&(!Number.isFinite(Number(a.warningThresholdPct))||Number(a.warningThresholdPct)<=0||Number(a.warningThresholdPct)>=100)){ toast('Set a warning threshold from 1 to 99% for configured rules.','error'); return; }
      if(a.consistencyRule&&(!Number.isFinite(Number(a.consistencyPct))||Number(a.consistencyPct)<=0||Number(a.consistencyPct)>100)){ toast('Set a maximum positive-day consistency percentage from 1 to 100.','error'); return; }
      a.mode=activeMode;
      const idx=db.accounts.findIndex(x=>x.id===a.id);
      if(idx>=0) db.accounts[idx]=canonicalAccountRecord(a); else db.accounts.push(canonicalAccountRecord(a));
      State.setSelectedAccountId(activeMode,a.id);
      State.saveNow(); toast(isEdit?'Account updated':`${isBacktest?'Backtest':'Live'} account created`,'success'); close(); router();
    };
    if(isEdit) overlay.querySelector('#acc-delete').onclick = ()=>{
      const linkedCount = getModeSafeTrades(db,activeMode).filter(t=>idEq(t.accountId,a.id)).length;
      if(linkedCount===0){
        Modal.confirm({ title:'Move account to Trash?', message:'This empty account can be restored from Trash for 30 days.', danger:true, confirmLabel:'Move to Trash', onConfirm:async()=>{
          try{ if(await Trash.move('accounts',a.id)){ if(idEq(State.selectedAccountIds[activeMode],a.id)) State.setSelectedAccountId(activeMode,getValidSelectedAccountId(db,activeMode)); toast('Account moved to Trash for 30 days','success'); close(); router(); } }catch(error){toast(error.message||'Could not move account to Trash','error');}
        }});
      } else {
        Modal.confirm({ title:'Archive account?', message:`This account has ${linkedCount} linked ${isBacktest?'backtest':'trade'} record${linkedCount===1?'':'s'} and cannot be deleted. It will be archived instead: its history stays intact, but it will no longer be selected for new records.`, danger:true, confirmLabel:'Archive', onConfirm:()=>{
          const idx2 = db.accounts.findIndex(x=>x.id===a.id);
          if(idx2>=0) db.accounts[idx2].status = 'Archived';
          if(idEq(State.selectedAccountIds[activeMode],a.id)) State.setSelectedAccountId(activeMode,getValidSelectedAccountId(db,activeMode));
          State.saveNow(); toast('Account archived'); close(); router();
        }});
      }
    };
  }});
};

Pages.analytics = function(){
  const db=State.db, root=pageContent(), scope=analyticsScope(), trades=scopedAnalyticsTrades(scope), range=analyticsScopeRange(scope), models=getModeOwnedRecords(db,'playbooks',State.appMode), sessions=Calc.sessionPerformance(trades), modelsPerf=Calc.modelPerformance(trades,models), isBacktest=State.appMode===APP_MODES.BACKTEST;

  const qualifiedSessions=sessions.filter(item=>item.trades>=3).map(item=>({name:item.session,trades:item.trades,pnl:item.pnl,avgR:item.avgR,winRate:item.winRate})).sort((a,b)=>(b.avgR||-Infinity)-(a.avgR||-Infinity));

  const maxSample=rows=>Math.max(0,...(rows||[]).map(row=>Number(row.trades)||0));
  const modelSample=maxSample(modelsPerf), sessionSample=maxSample(sessions), instrumentSample=maxSample([...new Map(trades.map(trade=>[String(trade.instrument||'Unassigned'),0])).keys()].map(name=>({trades:trades.filter(trade=>String(trade.instrument||'Unassigned')===name).length}))), directionSample=maxSample([...new Map(trades.map(trade=>[String(trade.direction||'Unassigned'),0])).keys()].map(name=>({trades:trades.filter(trade=>String(trade.direction||'Unassigned')===name).length})));
  const bestSetup=qualifiedModels[0], weakestSession=[...qualifiedSessions].sort((a,b)=>(a.avgR||Infinity)-(b.avgR||Infinity))[0];
  const behaviorFlags=[['Plan deviations',trades.filter(trade=>trade.followedPlan===false).length],['FOMO flags',trades.filter(trade=>Number(trade.fomo)>0).length],['Revenge flags',trades.filter(trade=>Number(trade.revenge)>0).length],['Impulsive entries',trades.filter(trade=>Number(trade.impulsivity)>0).length]].sort((a,b)=>b[1]-a[1]);

t has a qualified sample yet.',instrumentSample)}${renderAnalyticsBreakdown('DIRECTION',directions,'No direction has a qualified sample yet.',directionSample)}</div><div class="asc-analytics-trajectory"><div class="asc-analytics-breakdown-head"><span>RECORDED EQUITY PROGRESSION</span><small>Chronological journal sequence</small></div><div id="analytics-equity"></div></div></section><section class="asc-section">${sectionHead({kicker:`03 / EXECUTION & BEHAVIOUR`,title:`Where am I making mistakes?`,description:'Counts are based on explicit recorded flags and review fields, not inferred trade quality.'})}${renderAnalyticsBehaviorRows(trades)}</section><section class="asc-section">${sectionHead({kicker:`04 / PATTERNS & INSIGHTS`,title:`What deserves attention?`,description:'These are descriptive prompts from the current workspace, not trading instructions.'})}<div class="asc-analytics-insight-ledger"><div class="asc-analytics-insight-row"><span>BEST PERFORMING SETUP</span><b>${bestSetup?esc(bestSetup.name):'Build the sample'}</b><small>${bestSetup?`${bestSetup.trades} trades · ${fmtR(bestSetup.avgR)} average R`:'No setup has a qualified sample yet.'}</small></div><div class="asc-analytics-insight-row"><span>WEAKEST SESSION</span><b>${weakestSession?esc(weakestSession.name):'No qualified comparison'}</b><small>${weakestSession?`${weakestSession.trades} trades · ${fmtR(weakestSession.avgR)} average R`:'Continue recording session context.'}</small></div><div class="asc-analytics-insight-row"><span>PRIMARY ISSUE</span><b>${primaryIssue?esc(primaryIssue[0]):'No recorded issue flag'}</b><small>${primaryIssue?`${primaryIssue[1]} recorded occurrence${primaryIssue[1]===1?'':'s'}`:'Record execution flags only when they actually occur.'}</small></div></div></section><section class="asc-analytics-next-action"><div><span class="asc-page-kicker">05 / NEXT ACTION</span><h2>${bestSetup?`Review ${esc(bestSetup.name)} before changing rules.`:'Build a consistent record before changing rules.'}</h2><p>${esc(nextAction)}</p></div><button class="btn btn-primary" id="analytics-open-evidence">Open Evidence</button></section>`}</div>`;
  bindAnalyticsScope(root);
  if(!trades.length){root.querySelector('#analytics-log-trade').onclick=()=>Forms.logTrade();return;}
  const equity=root.querySelector('#analytics-equity');if(equity)Charts.equityCurve(equity,Calc.equityCurve(trades,0));
  root.querySelector('#analytics-open-evidence').onclick=()=>{Pages._tradeFilters=Object.assign({},Pages._tradeFilters,{view:'evidence',page:1});location.hash='#/trades';};
};

Pages.psychology = function(){
  const db = State.db;
  const root = pageContent();
  const trades = getCurrentModeTrades();
  root.innerHTML = `${pageHead({kicker:`BEHAVIORAL SIGNAL LAB <span class="mode-context">${State.appMode===APP_MODES.BACKTEST?'BACKTESTING':'LIVE TRADING'}</span>`,title:'Psychology',subtitle:'Recorded associations between state, behavior, trade context, and outcome. These comparisons never establish causation.'})}`;
  if(trades.length < 5){
    root.innerHTML += `<div class="card"><div class="empty-state"><div class="icon-wrap">${icon('brain',22)}</div><h3>Not enough data yet</h3><p>Log at least 5 trades with psychology ratings to see correlations.</p></div></div>`;
    return;
  }
  const avgOf = (key)=>{ const v = trades.map(t=>Number(t[key])).filter(x=>!isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const traits = ['discipline','emotionalControl','patience','confidence','mindsetState'];
  root.innerHTML += `
    ${renderSampleCoverageSummary(trades, State.appMode)}
    <div class="grid kpi-row">
      ${traits.map(k=>`<div class="card kpi-card"><div class="kpi-label">${k.replace(/([A-Z])/g,' $1')}</div><div class="kpi-value">${avgOf(k)!=null?avgOf(k).toFixed(1):'—'}<span class="faint" style="font-size:12px;">/10</span></div></div>`).join('')}
    </div>
    ${sectionHead({title:`Behavior → outcome`,description:`Flagged occurrences compared with the current active-workspace baseline`})}
    <div class="card" id="flag-impact"></div>
    ${sectionHead({title:`Discipline vs P&L`})}
    <div class="card"><div id="discipline-scatter" style="padding:6px;"></div></div>
  `;
  const flagWrap = root.querySelector('#flag-impact');
  const flagsUsed = [...new Set(trades.flatMap(t=>t.behaviourFlags||[]))];
  if(!flagsUsed.length){ flagWrap.innerHTML = `<div class="empty-state" style="padding:20px;"><p>No behaviour flags tagged yet.</p></div>`; }
  else {
    flagWrap.innerHTML = flagsUsed.map(f=>{
      const corr = Calc.psychologyCorrelation(trades, f);
      if(!corr) return `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border-soft);"><span>${esc(f)}</span><span class="faint" style="font-size:11px;">fewer than 3 trades tagged</span></div>`;
      const diff = corr.flagWinRate - corr.baseWinRate;
      const flagged=trades.filter(trade=>(trade.behaviourFlags||[]).includes(f));
      const flaggedAvgR=flagged.length?Calc.averageRealizedR(flagged):null;
      return `<div class="asc-behavior-row"><div><span>BEHAVIOR FLAG</span><b>${esc(f)}</b><small>${sampleEvidenceBadge(corr.count)} · ${flagged.length} tagged occurrence${flagged.length===1?'':'s'}</small></div><div><span>RECORDED DELTA</span><b class="${diff<0?'neg':'pos'}">${diff>=0?'+':''}${diff.toFixed(0)}% win rate</b><small>${flaggedAvgR==null?'R unavailable':`${fmtR(flaggedAvgR)} average R`} · baseline ${fmtPct(corr.baseWinRate)}</small></div></div>`;
    }).join('');
  }
  // simple discipline scatter as bar buckets
  const buckets = {'0-3':[],'4-6':[],'7-8':[],'9-10':[]};
  trades.forEach(t=>{ const d = Number(t.discipline); if(isNaN(d)) return; const key = d<=3?'0-3':d<=6?'4-6':d<=8?'7-8':'9-10'; buckets[key].push(t); });
  Charts.bars(root.querySelector('#discipline-scatter'), Object.entries(buckets).map(([k,v])=>({label:k, value: sumPnl(v)})));
};

Forms.researchStudy = function(existing){

  if(existing&&normalizeOwnedMode('notes',existing.mode)!==APP_MODES.BACKTEST){ toast('Open this study from Backtesting','error'); return; }
  const isEdit=!!existing;
  let note=existing?canonicalModeOwnedRecord('notes',existing):{id:uid('study'),title:'',date:todayStr(),category:'Backtest Research',content:'',linkedTradeId:'',linkedPlaybookId:'',mode:APP_MODES.BACKTEST,backtestResearch:createBacktestResearchDraft()};
  let research=canonicalBacktestResearch(note.backtestResearch,db)||createBacktestResearchDraft();
  const trades=getTradesForMode(db.trades,APP_MODES.BACKTEST).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const playbooks=getModeOwnedRecords(db,'playbooks',APP_MODES.BACKTEST);
  const tradeRows=trades.length?trades.map(trade=>`<label class="flex-between" style="gap:10px;padding:8px 0;border-top:1px solid var(--border-soft);cursor:pointer;"><span class="flex" style="gap:8px;min-width:0;"><input type="checkbox" data-research-trade value="${esc(trade.id)}" ${research.selectedTradeIds.includes(String(trade.id))?'checked':''}><span>${esc(trade.date||'—')} · ${esc(trade.instrument||'Trade')} · ${esc(trade.direction||'')}</span></span><span class="mono ${Calc.pnl(trade)>=0?'pos':'neg'}">${fmtMoney(Calc.pnl(trade))}</span></label>`).join(''):'<p class="hint">No Backtest trades exist yet. Log Backtest Trades before collecting a study sample.</p>';
  const body=`
    <div class="card" style="padding:12px;margin-bottom:14px;background:var(--surface-2);"><div class="field-label">Research boundary</div><div class="hint">A study records your hypothesis and selected journal sample. Sample metrics are descriptive only; ASCEND does not validate a strategy or recommend a decision.</div></div>
    <div class="field"><label class="field-label">Study Title</label><input id="research-title" type="text" value="${esc(note.title||'')}" placeholder="Breakout confirmation study"></div>
    <div class="field"><label class="field-label">Hypothesis</label><textarea id="research-hypothesis" placeholder="When… then… because…">${esc(research.hypothesis)}</textarea></div>

// ===================== UPDATES (wired to electron/main.js via preload's window.ascend) =====================
// Finite state model driving the Updates settings panel. `state` is one of UPDATE_STATES.
// State transitions are driven by 'updater-event' messages pushed from the main process
// (see electron/main.js autoUpdater listeners) — checkForUpdates()/installUpdate() below
// only kick things off, they don't set the resulting state themselves.
const UPDATE_STATES = ['idle','checking','up-to-date','update-available','downloading','ready-to-install','error'];

// Release notes are remote content. Convert Markdown/HTML to small, plain-text
// sections and escape it at render time; never insert the GitHub release body as HTML.
function normalizeReleaseNotes(value){
  if(Array.isArray(value)) return value.map(item=>{
    if(typeof item === 'string') return item;
    return item && typeof item.note === 'string' ? item.note : '';
  }).filter(Boolean).join('\n\n');
  return typeof value === 'string' ? value : '';
}
function decodeReleaseEntities(value){
  const entities = { amp:'&', apos:"'", '#39':"'", quot:'\"', lt:'<', gt:'>', nbsp:' ' };
  return String(value||'').replace(/&(#39|amp|apos|quot|lt|gt|nbsp);/gi, (match,name)=>entities[String(name).toLowerCase()] || match);
}
function releaseSummaryFrom(rawNotes){
  const raw = normalizeReleaseNotes(rawNotes);
  if(!raw.trim()) return { intro:'Release notes are not available for this update.', highlights:[] };
  const marked = raw
    .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
    .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, '')
    .replace(/<h([1-6])\b[^>]*>/gi, '\n@@ASCEND_H$1@@')
    .replace(/<\/h[1-6]>/gi, '\n')
    .replace(/<li\b[^>]*>/gi, '\n- ')
    .replace(/<\/li>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|section|article|tr|table)>/gi, '\n')
    .replace(/<[^>]+>/g, ' ')
    .replace(/(^|\n)\s*(#{1,6})\s+/g, (match,prefix,hashes)=>`${prefix}@@ASCEND_H${hashes.length}@@`);
  const preamble = [];
  const sections = [];
  let current = null;
  marked.split(/\n+/).map(line=>decodeReleaseEntities(line).replace(/\s+/g,' ').trim()).forEach(line=>{
    if(!line || /^[|:\-\s]+$/.test(line)) return;
    const heading = line.match(/^@@ASCEND_H([1-6])@@\s*(.*)$/);
    if(heading){
      const level = Number(heading[1]);
      const title = heading[2].replace(/^[-*]\s*/, '').trim();
      if(!title) return;
      if(level === 1) return;
      current = { title, entries:[] };
      sections.push(current);
      return;
    }
    const clean = line.replace(/^[-*•]\s*/, '').replace(/^\d+[.)]\s*/, '').trim();
    if(!clean || /^version\s+\d+/i.test(clean)) return;
    (current ? current.entries : preamble).push(clean);
  });
  const intro = preamble.find(line=>line.length>36) || sections.flatMap(section=>section.entries).find(line=>line.length>36) || 'This update is ready to install.';
  const ignored = /^(verification|preserved behavior|upgrade note|references?)$/i;
  const highlights = sections.filter(section=>!ignored.test(section.title) && section.entries.length)
    .slice(0,3)
    .map(section=>({ title:section.title, detail:section.entries.slice(0,2).join(' ') }));
  if(!highlights.length && preamble.length){
    highlights.push({ title:'Release highlights', detail:preamble.slice(1,3).join(' ') || preamble[0] });
  }
  return { intro, highlights };
}
function updateSummaryMarkup(rawNotes){
  const summary = releaseSummaryFrom(rawNotes);
  const cards = summary.highlights.map((item,index)=>`
    <article class="asc-update-highlight">
      <span class="asc-update-highlight-index">${String(index+1).padStart(2,'0')}</span>
      <div><h4>${esc(item.title)}</h4><p>${esc(item.detail)}</p></div>
    </article>`).join('');
  return `<section class="asc-update-summary" aria-label="Release summary">
    <div class="asc-update-summary-lead">
      <div class="asc-update-eyebrow">UPDATE SUMMARY</div>
      <p>${esc(summary.intro)}</p>
    </div>
    ${cards ? `<div class="asc-update-highlights">${cards}</div>` : ''}
  </section>`;
}
const UpdateManager = {
  state: 'idle',
  currentVersion: ASCEND_APP_VERSION,
  latestVersion: null,
  releaseNotes: '',
  progress: 0,
  error: null,
  onUpdate: null, // set by the Updates panel while it's mounted; called on every state change
  _emit(){ if(typeof this.onUpdate === 'function') this.onUpdate(); },
  async checkForUpdates(){
    if(this.state === 'checking' || this.state === 'downloading') return;
    if(!window.ascend || !window.ascend.isElectron){
      // Running outside Electron (e.g. a plain browser tab) — nothing to check against.
      this.state = 'error'; this.error = 'Updates are only available in the desktop app.'; this._emit();
      return;
    }
    this.state = 'checking'; this.error = null; this._emit();
    await window.ascend.checkForUpdates();
    // Result arrives asynchronously as an 'updater-event' (checking/update-available/
    // update-not-available/error) handled by the listener registered below.
  },
  installUpdate(){
    if(this.state !== 'ready-to-install') return;
    if(!window.ascend || !window.ascend.isElectron) return;
    window.ascend.quitAndInstallUpdate();
  },
};
if(window.ascend && typeof window.ascend.onUpdaterEvent === 'function'){
  window.ascend.onUpdaterEvent((payload)=>{
    if(!payload || !payload.status) return;
    switch(payload.status){
      case 'checking':
        UpdateManager.state = 'checking'; UpdateManager.error = null;
        break;
      case 'update-available':
        UpdateManager.state = 'update-available';
        UpdateManager.latestVersion = (payload.info && payload.info.version) || null;
        UpdateManager.releaseNotes = normalizeReleaseNotes(payload.info && payload.info.releaseNotes);
        break;
      case 'update-not-available':
        UpdateManager.state = 'up-to-date'; UpdateManager.latestVersion = null; UpdateManager.releaseNotes = '';
        State.db.settings.lastUpdateCheck = nowISO(); State.saveNow();
        break;
      case 'download-progress':
        UpdateManager.state = 'downloading';
        UpdateManager.progress = Math.round((payload.progress && payload.progress.percent) || 0);
        break;
      case 'update-downloaded':
        UpdateManager.state = 'ready-to-install'; UpdateManager.progress = 100;
        State.db.settings.lastUpdateCheck = nowISO(); State.saveNow();
        break;
      case 'error':
        UpdateManager.state = 'error';
        UpdateManager.error = payload.message || 'Could not check for updates. Please try again.';
        break;
    }
    UpdateManager._emit();
  });
}

  recovery(body){
    async function render(){
      if(!CURRENT_USER_ID){ body.innerHTML='<div class="card"><p class="muted">Sign in to use cloud Trash and import history.</p></div>'; return; }
      body.innerHTML='<div class="card"><p class="muted">Loading recoverable records and import history…</p></div>';
      try{
        if(!(await RecoveryDB.detect())){ body.innerHTML='<div class="card"><p class="muted">Recovery storage is unavailable until the Rank 4 migration is installed.</p></div>'; return; }
        const [trash,audits]=await Promise.all([RecoveryDB.listTrash(CURRENT_USER_ID),RecoveryDB.listAudits(CURRENT_USER_ID)]);
        const now=Date.now(); const active=trash.filter(item=>new Date(item.expires_at).getTime()>=now); const expired=trash.filter(item=>new Date(item.expires_at).getTime()<now);
        body.innerHTML='<div class="card"><div class="flex-between" style="gap:12px;"><div><div class="field-label">Trash</div><p class="hint" style="margin:4px 0 0;">Deleted journal records remain restorable for 30 days. Restore never overwrites an existing record.</p></div><span class="badge '+(active.length?'b-warn':'b-pos')+'">'+active.length+' active</span></div>'+ (active.length?'<div style="margin-top:12px;">'+active.map(item=>'<div class="flex-between" style="gap:12px;padding:10px 0;border-top:1px solid var(--border-soft);"><div style="min-width:0;"><b>'+esc(item.metadata&&item.metadata.title||RANK4_ENTITY_LABELS[item.entity_key]||item.entity_key)+'</b><div class="hint">'+esc(RANK4_ENTITY_LABELS[item.entity_key]||item.entity_key)+' · deleted '+esc(new Date(item.deleted_at).toLocaleString())+' · restore by '+esc(new Date(item.expires_at).toLocaleString())+'</div></div><button class="btn btn-sm" data-trash-restore="'+esc(item.id)+'">Restore</button></div>').join('')+'</div>':'<div class="hint" style="margin-top:12px;">Trash is empty.</div>')+(expired.length?'<div class="hint" style="margin-top:14px;">'+expired.length+' expired snapshot'+(expired.length===1?'':'s')+' can be permanently purged.</div><div style="margin-top:8px;">'+expired.map(item=>'<button class="btn btn-ghost btn-sm" data-trash-purge="'+esc(item.id)+'">Purge expired '+esc(item.metadata&&item.metadata.title||'record')+'</button>').join(' ')+'</div>':'')+'</div>'+sectionHead({title:'Import & Export History'})+'<div class="card">'+(audits.length?audits.map(event=>{const recoverable=event.event_type==='import'&&event.status==='completed'&&event.before_snapshot&&event.before_snapshot.db; return '<div class="flex-between" style="align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--border-soft);"><div><b>'+esc(event.event_type==='export'?'Export backup':event.event_type==='import_restore'?'Pre-import snapshot restored':'Import '+event.operation)+'</b><div class="hint">'+esc(event.status)+' · '+esc(new Date(event.created_at).toLocaleString())+(event.error_message?' · '+esc(event.error_message):'')+'</div></div>'+ (recoverable?'<button class="btn btn-sm" data-audit-restore="'+esc(event.id)+'">Restore pre-import state</button>':'')+'</div>';}).join(''):'<div class="hint">No import or export history yet.</div>')+'</div>';
        body.querySelectorAll('[data-trash-restore]').forEach(button=>button.onclick=async()=>{ button.disabled=true; try{ await Trash.restore(button.dataset.trashRestore); toast('Record restored from Trash','success'); await render(); router(); }catch(error){ toast(error.message||'Could not restore this record','error'); button.disabled=false; } });
        body.querySelectorAll('[data-trash-purge]').forEach(button=>button.onclick=()=>Modal.confirm({title:'Purge expired Trash snapshot?',message:'This expired recovery snapshot will be permanently removed. The active record is not affected.',danger:true,confirmLabel:'Purge',onConfirm:async()=>{try{await Trash.purgeExpired(button.dataset.trashPurge);toast('Expired snapshot purged','success');await render();}catch(error){toast(error.message||'Could not purge snapshot','error');}}}));
        body.querySelectorAll('[data-audit-restore]').forEach(button=>button.onclick=()=>Modal.confirm({title:'Restore pre-import state?',message:'This replaces the current structured journal state with the exact snapshot captured before that import. A new recovery audit will be recorded first.',danger:true,confirmLabel:'Restore snapshot',onConfirm:async()=>{try{await Recovery.restoreImportAudit(button.dataset.auditRestore);toast('Pre-import state restored','success');await render();router();}catch(error){toast(error.message||'Could not restore pre-import state','error');}}}));
      }catch(error){ console.error('ASCEND recovery panel error',error); body.innerHTML='<div class="card"><p class="muted">Could not load recovery history. Your active journal remains unchanged.</p></div>'; }
    }
    render();

function buildUnifiedBackupDatabase(db){
  // Backups must be a portable snapshot, never a live reference to application
  // state. Copy the full database and canonicalize every trade mode so both
  // datasets remain explicit even for legacy records.
  const snapshot = JSON.parse(JSON.stringify(db));
  snapshot.accounts = canonicalizeAccountCollection(snapshot.accounts);
  snapshot.trades = canonicalizeTradeCollection(snapshot.trades);
  delete snapshot._lastMigrationReport;
  delete snapshot._lastModeMigrationReport;
  delete snapshot._cacheRecoveryReport;
  return snapshot;
}
function modeCounts(trades){
  const canonical = canonicalizeTradeCollection(trades);
  return { live: canonical.filter(t=>t.mode===APP_MODES.LIVE).length, backtest: canonical.filter(t=>t.mode===APP_MODES.BACKTEST).length };
}
function buildBackupManifest(db,mediaResult){

  const media=mediaResult||{media:[],missing:[],coverage:{complete:false}};
  return {includedCollections:collections,modes:modeCounts(source.trades),mediaReferences:referencedMediaIds(source).length,mediaBytesIncluded:Array.isArray(media.media)?media.media.length:0,mediaMissing:Array.isArray(media.missing)?media.missing.length:0,mediaCoverage:media.coverage||null,mediaBytesAreIncluded:true,duplicatePolicy:'merge=stable-id-upsert; replace=full-snapshot'};
}

function handleImportFile(file){

const IMPORT_STATES=Object.freeze({COMPLETE:'COMPLETE',LOCAL_PENDING_SYNC:'LOCAL_PENDING_SYNC',FAILED_UNCHANGED:'FAILED_UNCHANGED',CONFLICT:'CONFLICT',ROLLBACK_REQUESTED:'ROLLBACK_REQUESTED',ROLLBACK_FAILED:'ROLLBACK_FAILED',ROLLED_BACK:'ROLLED_BACK'});
function rollbackComparableDatabase(db){
  const snapshot=buildUnifiedBackupDatabase(cloneImportDatabase(db||defaultDB()));
  delete snapshot._cacheRecoveryReport; delete snapshot._lastMigrationReport; delete snapshot._lastModeMigrationReport; delete snapshot._lastAccountModeMigrationReport; delete snapshot._lastModeOwnershipMigrationReport;
  // Device cache bookkeeping is not journal data and is deliberately updated by
  // State.saveNow after a confirmed restore. It must not make an otherwise exact
  // audited rollback look false, while every record, relationship, media reference,
  // and user-entered setting remains compared.
  if(snapshot.settings) delete snapshot.settings.lastSave;
  delete snapshot.createdAt;
  // Cloud reads order rows by database creation metadata while local backups retain
  // array insertion order. Entity identity is the canonical order-independent model;
  // sort by immutable ID solely for restoration verification, never for persistence.
  ENTITY_KEYS.forEach(key=>{ if(Array.isArray(snapshot[key])) snapshot[key].sort((a,b)=>String(a&&a.id||'').localeCompare(String(b&&b.id||''))); });
  return snapshot;
}
function verifyRollbackRestoration(beforeSnapshot,currentDb){
  const expected=rollbackComparableDatabase(beforeSnapshot&&beforeSnapshot.db?beforeSnapshot.db:beforeSnapshot);
  const actual=rollbackComparableDatabase(currentDb);
  const expectedMedia=referencedMediaIds(expected).sort(), actualMedia=referencedMediaIds(actual).sort();
  return {ok:JSON.stringify(expected)===JSON.stringify(actual)&&JSON.stringify(expectedMedia)===JSON.stringify(actualMedia),expectedMedia,actualMedia,expected,actual};
}
const ImportRecovery={
  current:null,
  stage(entry){ this.current=Object.assign({id:uid('import'),createdAt:nowISO(),attempts:0,rollbackAttempts:0},entry||{}); return this.current; },
  clear(){ this.current=null; },
  async retry(){
    const entry=this.current; if(!entry) throw new Error('No import recovery action is pending.');
    if(entry.state===IMPORT_STATES.ROLLED_BACK) return {state:IMPORT_STATES.ROLLED_BACK,alreadyRestored:true};
    if(entry.state===IMPORT_STATES.ROLLBACK_FAILED) return this.rollback();
    entry.attempts=Number(entry.attempts||0)+1;
    if(entry.state===IMPORT_STATES.LOCAL_PENDING_SYNC&&entry.media){ const result=await uploadImportMedia(entry.media); if(result.failed.length) return this.stage(Object.assign(entry,{state:IMPORT_STATES.LOCAL_PENDING_SYNC,media:result.failed,lastError:'Some screenshots are still waiting for cloud sync.'})); this.clear(); CloudSync.setStatus('synced'); toast('Pending screenshot sync completed.','success'); return {state:IMPORT_STATES.COMPLETE}; }
    return applyImport(entry.payload,entry.mode,Object.assign({},entry.recoveryOptions,{retryOf:entry.id}));
  },
  async rollback(){
    const entry=this.current; if(!entry||!entry.auditId) throw new Error('No recoverable import is pending rollback.');
    if(entry.state===IMPORT_STATES.ROLLED_BACK) return {state:IMPORT_STATES.ROLLED_BACK,alreadyRestored:true};
    this.stage(Object.assign(entry,{state:IMPORT_STATES.ROLLBACK_REQUESTED,rollbackRequestedAt:nowISO(),rollbackAttempts:Number(entry.rollbackAttempts||0)+1,lastError:null}));
    CloudSync.setStatus('saving');
    try{
      const restored=await Recovery.restoreImportAudit(entry.auditId);
      const verification=verifyRollbackRestoration(restored.snapshot,State.db);
      if(!verification.ok) throw new Error('Rollback verification failed: the active journal does not match the audited pre-import snapshot.');
      this.stage(Object.assign(entry,{state:IMPORT_STATES.ROLLED_BACK,rolledBackAt:nowISO(),rollbackVerification:{expectedMedia:verification.expectedMedia,actualMedia:verification.actualMedia}}));
      CloudSync.setStatus('synced'); toast('Import rollback confirmed.','success'); return {state:IMPORT_STATES.ROLLED_BACK,verification};
    }catch(error){
      const message=`Rollback failed. Imported data may still be active. Retry rollback or inspect recovery state. ${String(error&&error.message||error)}`;
      this.stage(Object.assign(entry,{state:IMPORT_STATES.ROLLBACK_FAILED,rollbackFailedAt:nowISO(),lastError:message}));
      CloudSync.setStatus('error'); toast(message,'error'); throw new Error(message);
    }
  }
};
function cloneImportDatabase(value){ return JSON.parse(JSON.stringify(value)); }
function mergeEntityCollection(current,incoming){

  (incoming||[]).forEach(record=>{ const key=String(record&&record.id||''); if(key) byId.set(key,record); });

}
function mergeJournalDatabase(current,incoming){
  const merged=cloneImportDatabase(current||defaultDB());
  ENTITY_KEYS.forEach(key=>{ merged[key]=mergeEntityCollection(merged[key],incoming[key]); });
  merged.settings=Object.assign({},merged.settings||{},incoming.settings||{});
  ['tags','savedFilters','processTargets'].forEach(key=>{ const source=Array.isArray(incoming[key])?incoming[key]:[]; merged[key]=mergeEntityCollection(merged[key],source); });

    const list = document.getElementById('cmd-list');
    const filtered = this.currentFiltered(query);
    if(!filtered.length){ list.innerHTML = `<div class="cmd-empty">No matches</div>`; return; }
    let flatIdx = 0;
    const byGroup = {};
    filtered.forEach(i=>{ (byGroup[i.group] = byGroup[i.group]||[]).push(i); });
    list.innerHTML = Object.keys(byGroup).map(g=>`
      <div class="cmd-group">
        <div class="cmd-group-label">${esc(g)}</div>
        ${byGroup[g].map(i=>{
          const idx = flatIdx++;
          return `<div class="cmd-item ${idx===this.selIdx?'sel':''}" data-idx="${idx}">${icon(i.icon,15)}<span>${esc(i.label)}</span>${i.key?`<span class="k">${i.key}</span>`:''}</div>`;
        }).join('')}
      </div>`).join('');
    list.querySelectorAll('.cmd-item').forEach(el=> el.onclick = ()=>{ this.close(); filtered[Number(el.dataset.idx)].action(); });
    const sel = list.querySelector('.cmd-item.sel');
    if(sel) sel.scrollIntoView({ block:'nearest' });
  },
  move(delta){
    const input = document.getElementById('cmd-search');
    const filtered = this.currentFiltered(input.value);
    if(!filtered.length) return;
    this.selIdx = (this.selIdx + delta + filtered.length) % filtered.length;
    this.render(input.value);
  },
  selectCurrent(){
    const input = document.getElementById('cmd-search');
    const filtered = this.currentFiltered(input.value);
    const item = filtered[this.selIdx];
    if(item){ this.close(); item.action(); }
  }
};

function handleGlobalShortcut(e){
  if(Modal.stack.length){
    if(e.key==='Escape'){ e.preventDefault(); Modal.closeTop(); }
    return;
  }
  const bridge = window.ascend;
  const isFullscreenShortcut = e.key==='F11' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='f');
  if(bridge && bridge.isElectron && isFullscreenShortcut && typeof bridge.toggleFullscreen==='function'){
    e.preventDefault(); bridge.toggleFullscreen(); return;
  }
  if(bridge && bridge.isElectron && e.key==='Escape' && typeof bridge.exitFullscreen==='function'){
    bridge.exitFullscreen(); return;
  }
  const cmdOpen = document.getElementById('command-overlay').classList.contains('show');
  if(cmdOpen){
    if(e.key==='Escape'){ CommandMenu.close(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); CommandMenu.move(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); CommandMenu.move(-1); return; }
    if(e.key==='Enter'){ e.preventDefault(); CommandMenu.selectCurrent(); return; }
    return;
  }
  if(e.key==='Escape' && typeof Sidebar!=='undefined' && Sidebar.isMobile() && Sidebar.isOpen()){
    Sidebar.close(); return;
  }
  const isMac = navigator.platform.toUpperCase().includes('MAC');
  if((isMac ? e.metaKey : e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); CommandMenu.open(); return; }
  if((isMac ? e.metaKey : e.ctrlKey) && e.key.toLowerCase()==='n'){ e.preventDefault(); Forms.logTrade(); return; }
  const tag = document.activeElement.tagName;
  const typing = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); CommandMenu.open(); }
  else if(e.key==='?'){ e.preventDefault(); openKeyboardShortcutHelp(); }
  else if(e.key.toLowerCase()==='n'){ Forms.fastCapture(); }
  else if(e.key.toLowerCase()==='p'){ Forms.premarket(); }
  else if(e.key.toLowerCase()==='d'){ location.hash='#/dashboard'; }
}
document.addEventListener('keydown', handleGlobalShortcut);

    sc.setAttribute('aria-hidden','false');

    document.body.style.overflow = 'hidden';
  },
  close(){
    const sb = document.getElementById('sidebar');
    const sc = document.getElementById('sidebar-scrim');
    const btn = document.getElementById('menu-toggle');
    sb.classList.remove('open');
    sc.classList.remove('show');
    sc.setAttribute('aria-hidden','true');
    btn && btn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  },
  toggle(){ this.isOpen() ? this.close() : this.open(); },
  isOpen(){ return document.getElementById('sidebar').classList.contains('open'); },
  attachResize(){
    const handler = (e)=>{
      const sb = document.getElementById('sidebar');
      const sc = document.getElementById('sidebar-scrim');
      if(!e.matches){
        // resized back to desktop — drop mobile open state, restore #main margin
        sb.classList.remove('open');
        sb.classList.add('is-locked');
        sc.classList.remove('show');
        document.body.style.overflow = '';

        if(this.isOpen()){
          sc.classList.add('show');
          document.body.style.overflow = 'hidden';
        }
      }
    };
    if(this.mq.addEventListener) this.mq.addEventListener('change', handler);
    else this.mq.addListener(handler);
    // initial pass so the sidebar is "locked visible" on desktop before user resizes
    handler(this.mq);
    // scrim click closes
    document.getElementById('sidebar-scrim').addEventListener('click', ()=> this.close());
  },

// User-facing translations are deliberately generic where Supabase may mask account
// existence. Do not surface raw recovery state, tokens, or URL fragments.
function authFriendlyError(error, action){
  const message=String(error&&error.message||'').toLowerCase();
  if(message.includes('invalid login')||message.includes('invalid credentials')) return 'Email or password is incorrect. Check your details or reset your password.';
  if(message.includes('email not confirmed')) return 'Confirm your email before signing in, then try again.';
  if(message.includes('captcha')||message.includes('captcha_token')) return 'Sign-in is blocked by a CAPTCHA setting that is not configured in ASCEND. Disable or configure CAPTCHA in Supabase, then try again.';
  if(message.includes('rate limit')||message.includes('too many')) return 'Too many attempts. Please wait a moment before trying again.';
  if(message.includes('same password')) return 'Choose a different password from your current password.';
  if(message.includes('session')||message.includes('jwt')) return 'Your secure session has expired. Sign in again, then retry.';
  if(action==='password') return 'We could not update your password. Your current session and journal data are unchanged.';
  if(action==='session') return 'We could not update your other sessions. This device remains signed in.';
  return 'We could not complete that request. Please try again.';
}

}

const Auth = {
  recoverySession:null,
  async init(){
    sb.auth.onAuthStateChange((event, session)=>{
      if(event === 'SIGNED_OUT'){
        CURRENT_USER_ID = null; CURRENT_USER_EMAIL = null; appEntered = false; CloudSync.resetQueueMemory(); this.recoverySession=null;
        showAuthScreen();
      } else if(event === 'PASSWORD_RECOVERY' && session && session.user){
        this.recoverySession=session; clearAuthUrlFragments(); showAuthScreen('update-password');
      } else if((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session && session.user && !this.recoverySession){
        startAppForUser(session.user);
      }
    });
    const { data:{ session } } = await sb.auth.getSession();
    return session;
  },
  async requestPasswordReset(email){
    const {error}=await sb.auth.resetPasswordForEmail(email);
    if(error) throw error;
    return true;
  },
  async updateRecoveryPassword(password){
    const {data,error}=await sb.auth.updateUser({password});
    if(error) throw error;
    const user=(data&&data.user)||(this.recoverySession&&this.recoverySession.user);
    this.recoverySession=null;
    if(!user) throw new Error('Recovery session missing');
    // The recovery event intentionally hides the app shell. Force a safe re-entry
    // after a successful password update even when this browser had been active.
    appEntered=false;
    await startAppForUser(user);
    await SecurityEvents.record('password_updated',{method:'recovery'});

// ===================== FIRST-LOGIN LEGACY MIGRATION =====================
async function migrateLegacyMedia(userId){
  let cached;
  try{ cached = await IDB._cacheAll(); }catch(e){ cached = []; }
  for(const rec of cached){
    try{
      const blob = dataURLtoBlob(rec.dataURL);
      await sb.storage.from('media').upload(`${userId}/${rec.id}`, blob, { upsert:false, contentType: blob.type||'image/png' });
    }catch(e){ /* best-effort: skip files that already exist or fail to upload */ }
  }
}
async function migrateLegacyLocalDataIfNeeded(userId){
  const flagKey = `ascend_migrated_${userId}`;
  if(localStorage.getItem(flagKey)) return false;
  let raw;
  try{ raw = localStorage.getItem(LEGACY_DB_KEY); }catch(e){ raw = null; }
  if(!raw){ localStorage.setItem(flagKey, '1'); return false; }
  let legacyDb;
  try{ legacyDb = JSON.parse(raw); }catch(e){ localStorage.setItem(flagKey, '1'); return false; }
  if(!validateDatabase(legacyDb)){ localStorage.setItem(flagKey, '1'); return false; }
  const alreadyInCloud = await CloudDB.hasAnyCloudData(userId);
  if(alreadyInCloud){ localStorage.setItem(flagKey, '1'); return false; } // don't clobber/duplicate an existing cloud account
  legacyDb = migrateDatabase(legacyDb);
  await CloudDB.pushFullState(userId, legacyDb);
  await migrateLegacyMedia(userId);
  localStorage.setItem(flagKey, '1');
  return true;
}

let appEntered = false;
async function startAppForUser(user){
  if(appEntered) return;
  appEntered = true;
  CURRENT_USER_ID = user.id;
  CURRENT_USER_EMAIL = user.email;
  State.hydrateAppMode();
  State.hydrateSelectedAccounts();
  CloudSync.loadQueue(user.id);
  CloudSync.restoreBaseline(user.id);
  showAppShell();
  applyApplicationMode();
  // Instant paint from local cache (if any) while the cloud load runs.
  const cached = DB.loadCache(user.id);
  if(cached){ State.db=cached; CloudSync.applyQueuedState(State.db); State.hydrateSelectedAccounts(); State.hydrateUI(cached.settings); applyAppearance(); applyNavigationMode(); updateSessionChip(); router(); }
  else { const pc = document.getElementById('page-content'); if(pc) pc.innerHTML = `<div class="empty-state"><p>Loading your journal…</p></div>`; }
  CloudSync.setStatus('saving');
  try{
    const migrated = await migrateLegacyLocalDataIfNeeded(user.id);
    State.db = await CloudDB.loadFullState(user.id);
    State.hydrateSelectedAccounts();
    State.hydrateUI(State.db.settings);
    CloudSync.setBaseline(State.db, CloudDB.consumeLastLoadedRevisions());
    CloudSync.applyQueuedState(State.db); // remote baseline first, then restore durable local intent
    DB.persist(State.db);
    CloudSync.setStatus('synced');
    CloudSync.push(State.db);
    applyAppearance();
    applyNavigationMode();
    updateSessionChip();
    router();
    maybeShowOnboarding();
    if(migrated) toast('Your local journal was migrated to your account', 'success');
    const migReport = State.db._lastMigrationReport;
    if(migReport){
      if(migReport.repaired>0) toast(`Fixed ${migReport.repaired} trade(s) that were unlinked from their account`, 'success');
      if(migReport.unresolved && migReport.unresolved.length>0) toast(`${migReport.unresolved.length} trade(s) still need their account reselected — open them and pick the account again`, 'error');
      delete State.db._lastMigrationReport;
      State.saveNow();
    }
  }catch(e){
    console.error('ASCEND cloud load error', e);
    CloudSync.setStatus('error');
    if(window.__ASCEND_CACHE_DIAGNOSTIC__){
      const pc=document.getElementById('page-content');
      if(pc) pc.innerHTML='<div class="empty-state"><h3>Journal data needs recovery</h3><p>Your local cache was preserved and quarantined because opening it could discard records. The cloud could not be reached, so no empty journal was created.</p><p class="hint">Export or restore a known-good backup, then retry when the connection is available.</p></div>';
      toast('Journal data was preserved for recovery; the cloud is currently unavailable.', 'error');
      return;
    }
    if(!State.db){ State.db=cached||defaultDB(); State.hydrateSelectedAccounts(); State.hydrateUI(State.db.settings); applyAppearance(); applyNavigationMode(); updateSessionChip(); router(); }
    toast('Could not reach the cloud — showing your last synced copy. Changes will sync once you\'re back online.', 'error');
  }
}

// ==========================================
// ASCEND WINDOW RESIZE ENGINE
// ==========================================

const resizeZones = {
    'resize-top': 'top',
    'resize-bottom': 'bottom',
    'resize-left': 'left',
    'resize-right': 'right',

    'resize-top-left': 'top-left',
    'resize-top-right': 'top-right',
    'resize-bottom-left': 'bottom-left',
    'resize-bottom-right': 'bottom-right'
};


let resizeState = null;
let resizeFrame = null;
let pendingResizeBounds = null;


// ------------------------------------------
// START RESIZE
// ------------------------------------------

Object.entries(resizeZones).forEach(
    ([elementId, direction]) => {

        const element =
            document.getElementById(elementId);

        if (!element) {
            return;
        }

        element.addEventListener(
            'mousedown',
            async (event) => {

                if (event.button !== 0) {
                    return;
                }

                const bridge = window.ascend;
                if (!bridge || !bridge.isElectron || typeof bridge.getWindowBounds !== 'function') {
                    return;
                }

                const bounds = await bridge.getWindowBounds();

                if (!bounds) {
                    return;
                }

                resizeState = {
                    direction,

                    startMouseX: event.screenX,
                    startMouseY: event.screenY,

                    startX: bounds.x,
                    startY: bounds.y,

                    startWidth: bounds.width,
                    startHeight: bounds.height
                };

                document.body.style.userSelect =
                    'none';

                document.body.style.cursor =
                    getResizeCursor(direction);

                event.preventDefault();
            }
        );
    }
);


// ------------------------------------------
// RESIZE CURSOR
// ------------------------------------------

function getResizeCursor(direction) {

    const cursors = {

        top: 'ns-resize',
        bottom: 'ns-resize',

        left: 'ew-resize',
        right: 'ew-resize',

        'top-left': 'nwse-resize',
        'bottom-right': 'nwse-resize',

        'top-right': 'nesw-resize',
        'bottom-left': 'nesw-resize'
    };

    return cursors[direction] || 'default';
}


// ------------------------------------------
// MOUSE MOVE
// ------------------------------------------

document.addEventListener(
    'mousemove',
    async (event) => {

        if (!resizeState) {
            return;
        }

        const state = resizeState;

        const deltaX =
            event.screenX - state.startMouseX;

        const deltaY =
            event.screenY - state.startMouseY;


        let x = state.startX;
        let y = state.startY;

        let width = state.startWidth;
        let height = state.startHeight;


        // -------------------------------
        // LEFT
        // -------------------------------

        if (
            state.direction === 'left' ||
            state.direction === 'top-left' ||
            state.direction === 'bottom-left'
        ) {

            width =
                state.startWidth - deltaX;

            x =
                state.startX + deltaX;
        }


        // -------------------------------
        // RIGHT
        // -------------------------------

        if (
            state.direction === 'right' ||
            state.direction === 'top-right' ||
            state.direction === 'bottom-right'
        ) {

            width =
                state.startWidth + deltaX;
        }


        // -------------------------------
        // TOP
        // -------------------------------

        if (
            state.direction === 'top' ||
            state.direction === 'top-left' ||
            state.direction === 'top-right'
        ) {

            height =
                state.startHeight - deltaY;

            y =
                state.startY + deltaY;
        }


        // -------------------------------
        // BOTTOM
        // -------------------------------

        if (
            state.direction === 'bottom' ||
            state.direction === 'bottom-left' ||
            state.direction === 'bottom-right'
        ) {

            height =
                state.startHeight + deltaY;
        }


        // -------------------------------
        // MINIMUM SIZE
        // -------------------------------

        const MIN_WIDTH = 1100;
        const MIN_HEIGHT = 700;


        if (width < MIN_WIDTH) {

            if (
                state.direction === 'left' ||
                state.direction === 'top-left' ||
                state.direction === 'bottom-left'
            ) {

                x =
                    state.startX +
                    (state.startWidth - MIN_WIDTH);
            }

            width = MIN_WIDTH;
        }


        if (height < MIN_HEIGHT) {

            if (
                state.direction === 'top' ||
                state.direction === 'top-left' ||
                state.direction === 'top-right'
            ) {

                y =
                    state.startY +
                    (state.startHeight - MIN_HEIGHT);
            }

            height = MIN_HEIGHT;
        }


      pendingResizeBounds = {
    x,
    y,
    width,
    height
};

if (!resizeFrame) {
    resizeFrame = requestAnimationFrame(() => {

        if (pendingResizeBounds) {
            const bridge = window.ascend;
            if (bridge && bridge.isElectron && typeof bridge.setWindowBounds === 'function') {
                bridge.setWindowBounds(pendingResizeBounds);
            }
        }

        pendingResizeBounds = null;
        resizeFrame = null;
    });
}
    }
);


// ------------------------------------------
// MOUSE UP
// ------------------------------------------

document.addEventListener(
    'mouseup',
    () => {

        if (!resizeState) {
            return;
        }

        resizeState = null;

        document.body.style.userSelect = '';

        document.body.style.cursor = '';
    }
);

<script>
(function initDesktopRendererBridge(){
  const bridge = window.ascend;
  if(!bridge || !bridge.isElectron) return;
  document.body.classList.add('ascend-electron');
  const minimizeButton = document.getElementById('window-minimize');
  const maximizeButton = document.getElementById('window-maximize');
  const closeButton = document.getElementById('window-close');
  const setMaximizeIcon = (isMaximized)=>{ if(maximizeButton) maximizeButton.textContent = isMaximized ? '❐' : '□'; };
  if(minimizeButton && typeof bridge.minimizeWindow === 'function') minimizeButton.addEventListener('click', ()=>bridge.minimizeWindow());
  if(maximizeButton && typeof bridge.maximizeWindow === 'function') maximizeButton.addEventListener('click', async()=>{
    await bridge.maximizeWindow();
    if(typeof bridge.isMaximized === 'function') setMaximizeIcon(await bridge.isMaximized());
  });
  if(closeButton && typeof bridge.closeWindow === 'function') closeButton.addEventListener('click', ()=>bridge.closeWindow());
  if(typeof bridge.isMaximized === 'function') Promise.resolve(bridge.isMaximized()).then(setMaximizeIcon).catch(()=>{});
  if(typeof bridge.onWindowMaximizedChange === 'function') bridge.onWindowMaximizedChange(setMaximizeIcon);
})();
</script>
