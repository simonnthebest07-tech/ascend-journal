function repairTradeAccountLinks(db){
  // Fixes trades whose accountId doesn't match any current account.id (e.g. left over
  // from an account being recreated, an older build that stored the account name
  // instead of its id, or a stale id from a prior export). Never guesses between
  // multiple candidate accounts — only resolves a trade when its intended account
  // can be determined unambiguously from the backup's own data.
  const accountsCount = (db.accounts||[]).length;
  const tradesCount = (db.trades||[]).length;
  if(!db.accounts || !db.trades) return { repaired: 0, unresolved: [], accountsCount, tradesCount, details: [] };
  const byId = new Map(db.accounts.map(a=>[String(a.id).trim(), a]));
  const byName = new Map();
  db.accounts.forEach(a=>{
    const name = (a.accountName||'').trim().toLowerCase();
    if(!name) return;
    byName.set(name, (byName.get(name)||[]).concat(a));
  });
  // Safe fallback: when the backup contains exactly one account, any trade in that
  // same backup can only ever have belonged to it — so an unmatched accountId
  // (stale id from a re-created account, corrupted value, etc.) can be remapped
  // to it without guessing. With 2+ accounts we never fall back like this.
  const singleAccount = db.accounts.length===1 ? db.accounts[0] : null;
  let repaired = 0;
  const unresolved = [];
  const details = [];
  db.trades.forEach(t=>{
    if(!t.accountId) return;
    const rawId = String(t.accountId).trim();
    if(byId.has(rawId)) return; // exact id match — already valid, nothing to do
    const nameMatch = byName.get(rawId.toLowerCase());
    if(nameMatch && nameMatch.length===1){
      // Legacy backup stored the account name in accountId, or the account was
      // recreated with a new id — the name uniquely identifies the account.
      details.push({ tradeId: t.id, from: t.accountId, to: nameMatch[0].id, reason: 'matched by account name' });
      t.accountId = nameMatch[0].id;
      repaired++;
      return;
    }
    if(nameMatch && nameMatch.length>1){
      unresolved.push(t.id);
      details.push({ tradeId: t.id, from: t.accountId, reason: `ambiguous: ${nameMatch.length} accounts share that name` });
      return;
    }
    if(singleAccount){
      details.push({ tradeId: t.id, from: t.accountId, to: singleAccount.id, reason: 'single-account fallback (only one account in backup)' });
      t.accountId = singleAccount.id;
      repaired++;
      return;
    }
    unresolved.push(t.id);
    details.push({ tradeId: t.id, from: t.accountId, reason: 'no id match, no name match, and more than one candidate account' });
  });
  return { repaired, unresolved, accountsCount, tradesCount, details };
}
function getUnresolvedTrades(db){
  // Trades whose accountId doesn't resolve to any current account — the same
  // condition repairTradeAccountLinks/import leave behind when a link can't be
  // repaired automatically. Recomputed from live state every time it's called,
  // so it always reflects the actual data (never cached/stale UI state).
  if(!db || !db.trades || !db.accounts) return [];
  return db.trades.filter(t=> t.accountId && !db.accounts.some(a=>idEq(a.id, t.accountId)));
}
function getValidDefaultAccountId(db){
  // Resolves the account to pre-select on a new trade: must exist and must not be archived.
  // Falls back to the first non-archived account if the stored default is stale/missing/archived.
  const def = db.settings.defaultAccountId;
  if(def){
    const acc = db.accounts.find(a=>idEq(a.id, def));
    if(acc && acc.status!=='Archived') return acc.id;
  }
  const fallback = db.accounts.find(a=>a.status!=='Archived');
  return fallback ? fallback.id : '';
}
function migrateDatabase(db){
  // Placeholder-safe forward migration chain. Each future version adds a step here.
  if(!db.version) db.version = '1.0.0';
  if(!db.processTargets) db.processTargets = defaultDB().processTargets;
  if(!db.savedFilters) db.savedFilters = [];
  if(!db.settings) db.settings = defaultDB().settings;
  if(!db.settings.sessions) db.settings.sessions = JSON.parse(JSON.stringify(SESSIONS_DEFAULT));
  if(!db.settings.readinessWeights) db.settings.readinessWeights = defaultDB().settings.readinessWeights;
  if(!db.settings.theme) db.settings.theme = 'light';
  if(typeof db.settings.navCollapsed !== 'boolean') db.settings.navCollapsed = false;
  if(typeof db.settings.autoUpdates !== 'boolean') db.settings.autoUpdates = true;
  if(typeof db.settings.lastUpdateCheck === 'undefined') db.settings.lastUpdateCheck = null;
  const { repaired, unresolved, accountsCount, tradesCount, details } = repairTradeAccountLinks(db);
  console.log(`ASCEND migration: ${accountsCount} account(s), ${tradesCount} trade(s) — checking account links.`);
  if(repaired>0) console.warn(`ASCEND migration: repaired ${repaired} account link(s).`, details.filter(d=>d.to));
  if(unresolved.length>0) console.warn(`ASCEND migration: ${unresolved.length} trade(s) still have an unlinked accountId and need manual reselection:`, details.filter(d=>!d.to));
  db._lastMigrationReport = { repaired, unresolved, accountsCount, tradesCount };
  db.version = ASCEND_DB_VERSION;
  return db;
}
function validateDatabase(db){
  const required = ['settings','accounts','trades','premarket','dailyReviews','weeklyReviews','monthlyReviews','playbooks','notes'];
  if(typeof db !== 'object' || db===null) return false;
  for(const k of required){ if(!(k in db)) return false; }
  return true;
}
function repairDatabase(db){
  const fresh = defaultDB();
  for(const k in fresh){ if(!(k in db)) db[k] = fresh[k]; }
  return db;
}
// `DB` now only manages a local CACHE (per user), used so the app can boot instantly
// and stay readable if the network drops. Supabase (CloudDB, below) is the source of
// truth: clearing this cache/localStorage/site-data never deletes real data.
function cacheKeyFor(userId){ return `ascend_cache_v1_${userId}`; }
const DB = {
  loadCache(userId){
    let raw;
    try{ raw = localStorage.getItem(cacheKeyFor(userId)); }catch(e){ raw = null; }
    if(!raw) return null;
    let db;
    try{ db = JSON.parse(raw); }catch(e){ return null; }
    if(!validateDatabase(db)) db = repairDatabase(db);
    if(db.version !== ASCEND_DB_VERSION) db = migrateDatabase(db);
    return db;
  },
  persist(db){
    // Local cache write only. Real persistence is CloudSync.push (Supabase).
    try{
      db.settings.lastSave = nowISO();
      if(CURRENT_USER_ID) localStorage.setItem(cacheKeyFor(CURRENT_USER_ID), JSON.stringify(db));
      return true;
    }catch(e){
      console.error('ASCEND cache write error', e);
      return false;
    }
  }
};
const persistDebounced = debounce((db)=>{ DB.persist(db); CloudSync.push(db); }, 600);

// ===================== CLOUD DATA SERVICE (Supabase) =====================
function dataURLtoBlob(dataURL){
  const [meta, b64] = dataURL.split(',');
  const mime = (meta.match(/data:(.*?);base64/) || [,'application/octet-stream'])[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
function extractIndexedCols(entityKey, record){
  // Small set of columns pulled out of the record for FKs/filtering/indexes.
  // The full record always lives in `payload` — these are query helpers only.
  switch(entityKey){
    case 'trades': return { account_id: record.accountId || null, date: record.date || null, result: record.result || null };
    case 'premarket': return { date: record.date || null };
    case 'dailyReviews': return { date: record.date || null };
    case 'weeklyReviews': return { week_start: record.weekStart || null };
    case 'monthlyReviews': return { month_key: record.monthKey || null };
    case 'accounts': return { status: record.status || null };
    case 'notes': return { category: record.category || null };
    default: return {};
  }
}
const CloudDB = {
  async loadFullState(userId){
    const selects = ENTITY_KEYS.map(k=>
      sb.from(ENTITY_TABLES[k]).select('payload').eq('user_id', userId).order('created_at', { ascending: true })
    );
    const [profileRes, ...results] = await Promise.all([
      sb.from('profiles').select('settings,tags,saved_filters,process_targets').eq('id', userId).maybeSingle(),
      ...selects
    ]);
    results.forEach((r,i)=>{ if(r.error) throw r.error; });
    if(profileRes.error) throw profileRes.error;
    const db = defaultDB();
    ENTITY_KEYS.forEach((k,i)=>{ db[k] = (results[i].data||[]).map(row=>row.payload); });
    if(profileRes.data){
      db.settings = Object.assign(db.settings, profileRes.data.settings||{});
      db.tags = profileRes.data.tags || [];
      db.savedFilters = profileRes.data.saved_filters || [];
      db.processTargets = (profileRes.data.process_targets && profileRes.data.process_targets.length) ? profileRes.data.process_targets : db.processTargets;
    }
    return migrateDatabase(db);
  },
  async upsertRecord(entityKey, record, userId){
    const table = ENTITY_TABLES[entityKey];
    const row = Object.assign({ id: record.id, user_id: userId, payload: record, updated_at: nowISO() }, extractIndexedCols(entityKey, record));
    const { error } = await sb.from(table).upsert(row, { onConflict: 'id' });
    if(error) throw error;
  },
  async deleteRecord(entityKey, id, userId){
    const table = ENTITY_TABLES[entityKey];
    const { error } = await sb.from(table).delete().eq('id', id).eq('user_id', userId);
    if(error) throw error;
  },
  async saveProfile(userId, db){
    const { error } = await sb.from('profiles').upsert({
      id: userId, settings: db.settings, tags: db.tags||[], saved_filters: db.savedFilters||[],
      process_targets: db.processTargets||[], updated_at: nowISO()
    }, { onConflict: 'id' });
    if(error) throw error;
  },
  async pushFullState(userId, db){
    // Bulk push (first-login migration / import "replace"). Chunked upserts per table.
    await this.saveProfile(userId, db);
    const validAccountIds = new Set((db.accounts||[]).map(a=>String(a.id).trim()));
    const fkSkipped = [];
    for(const k of ENTITY_KEYS){
      const rows = (db[k]||[]).map(rec => {
        const cols = Object.assign({ id: rec.id, user_id: userId, payload: rec, updated_at: nowISO() }, extractIndexedCols(k, rec));
        if(k==='trades' && cols.account_id && !validAccountIds.has(String(cols.account_id).trim())){
          // Never push an accountId Supabase can't satisfy the FK for (23503).
          // The trade's payload keeps its original accountId locally/in the
          // JSONB blob so it can still be repaired or manually reselected —
          // only the indexed FK column is nulled out for this push.
          fkSkipped.push(rec.id);
          cols.account_id = null;
        }
        return cols;
      });
      for(let i=0;i<rows.length;i+=200){
        const chunk = rows.slice(i, i+200);
        if(!chunk.length) continue;
        const { error } = await sb.from(ENTITY_TABLES[k]).upsert(chunk, { onConflict: 'id' });
        if(error) throw error;
      }
    }
    if(fkSkipped.length) console.warn(`ASCEND CloudDB.pushFullState: ${fkSkipped.length} trade(s) pushed with account_id=null to avoid an invalid foreign key:`, fkSkipped);
    return { fkSkipped };
  },
  async wipeAll(userId){
    for(const k of ENTITY_KEYS){
      const { error } = await sb.from(ENTITY_TABLES[k]).delete().eq('user_id', userId);
      if(error) throw error;
    }
    const fresh = defaultDB();
    await this.saveProfile(userId, fresh);
  },
  async hasAnyCloudData(userId){
    const { count, error } = await sb.from('accounts').select('id', { count: 'exact', head: true }).eq('user_id', userId);
    if(error) return false;
    return (count||0) > 0;
  }
};

// Diff-based sync: only changed/removed records are pushed to Supabase, so a save
// never has to reload or rewrite the whole database.
function snapshotEntities(db){
  const snap = {};
  ENTITY_KEYS.forEach(k=>{ snap[k] = new Map((db[k]||[]).map(r=>[r.id, JSON.stringify(r)])); });
  snap.profile = JSON.stringify({ settings: db.settings, tags: db.tags, savedFilters: db.savedFilters, processTargets: db.processTargets });
  return snap;
}
const CloudSync = {
  _lastSynced: null,
  _pending: false,
  _queued: false,
  setBaseline(db){ this._lastSynced = snapshotEntities(db); },
  setStatus(state){
    const dot = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    if(!dot || !label) return;
    dot.className = 'sync-dot ' + state;
    label.textContent = state==='saving' ? 'Saving…' : state==='error' ? 'Offline' : 'Synced';
  },
  async push(db){
    if(!CURRENT_USER_ID) return;
    if(this._pending){ this._queued = true; return; }
    this._pending = true;
    this.setStatus('saving');
    try{
      const before = this._lastSynced || { profile: null };
      const next = snapshotEntities(db);
      const ops = [];
      ENTITY_KEYS.forEach(k=>{
        const prevMap = before[k] || new Map();
        const nextMap = next[k];
        nextMap.forEach((json, id)=>{ if(prevMap.get(id) !== json) ops.push(CloudDB.upsertRecord(k, JSON.parse(json), CURRENT_USER_ID)); });
        prevMap.forEach((json, id)=>{ if(!nextMap.has(id)) ops.push(CloudDB.deleteRecord(k, id, CURRENT_USER_ID)); });
      });
      if(before.profile !== next.profile) ops.push(CloudDB.saveProfile(CURRENT_USER_ID, db));
      await Promise.all(ops);
      this._lastSynced = next;
      this.setStatus('synced');
    }catch(e){
      console.error('ASCEND cloud sync error', e);
      this.setStatus('error');
      toast('Could not sync to the cloud — your data is safe locally, will retry on next save', 'error');
    }finally{
      this._pending = false;
      if(this._queued){ this._queued = false; this.push(db); }
    }
  }
};

// ===================== MEDIA (Supabase Storage, IndexedDB as local cache only) =====================
// Same public interface as the old local-only IDB, so every screenshot call site
// (upload fields, previews, import/export, reset) is untouched. Supabase Storage
// (bucket "media", path `${user_id}/${mediaId}`) is now the source of truth;
// IndexedDB just makes repeat reads instant and gives an offline cache.
const IDB = {
  _db: null,
  dbName: LEGACY_MEDIA_DB,
  open(){
    return new Promise((resolve,reject)=>{
      if(this._db && this._db.name === this.dbName) return resolve(this._db);
      this._db = null;
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = (e)=>{ const db = e.target.result; if(!db.objectStoreNames.contains('media')) db.createObjectStore('media',{keyPath:'id'}); };
      req.onsuccess = (e)=>{ this._db = e.target.result; resolve(this._db); };
      req.onerror = (e)=>reject(e);
    });
  },
  async _cachePut(id, dataURL, meta){
    const db = await this.open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction('media','readwrite');
      tx.objectStore('media').put({ id, dataURL, meta: meta||{}, createdAt: nowISO() });
      tx.oncomplete = ()=>resolve(id);
      tx.onerror = (e)=>reject(e);
    });
  },
  async _cacheGet(id){
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readonly');
      const req = tx.objectStore('media').get(id);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>resolve(null);
    });
  },
  async _cacheDelete(id){
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readwrite');
      tx.objectStore('media').delete(id);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  },
  async _cacheAll(){
    // Raw local-only listing, used only for first-login legacy migration.
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readonly');
      const req = tx.objectStore('media').getAll();
      req.onsuccess = ()=>resolve(req.result||[]);
      req.onerror = ()=>resolve([]);
    });
  },
  async put(id, dataURL, meta){
    await this._cachePut(id, dataURL, meta); // instant local preview
    if(CURRENT_USER_ID){
      try{
        const blob = dataURLtoBlob(dataURL);
        const { error } = await sb.storage.from('media').upload(`${CURRENT_USER_ID}/${id}`, blob, { upsert:true, contentType: blob.type||'image/png' });
        if(error) throw error;
      }catch(e){
        console.error('ASCEND media upload error', e);
        toast('Screenshot saved locally but failed to sync to the cloud','error');
      }
    }
    return id;
  },
  async get(id){
    if(!id) return null;
    const cached = await this._cacheGet(id);
    if(cached) return cached;
    if(!CURRENT_USER_ID) return null;
    try{
      const { data, error } = await sb.storage.from('media').download(`${CURRENT_USER_ID}/${id}`);
      if(error || !data) return null;
      const dataURL = await blobToDataURL(data);
      await this._cachePut(id, dataURL, {});
      return { id, dataURL, meta:{}, createdAt: nowISO() };
    }catch(e){ return null; }
  },
  async delete(id){
    await this._cacheDelete(id);
    if(CURRENT_USER_ID){
      try{ await sb.storage.from('media').remove([`${CURRENT_USER_ID}/${id}`]); }
      catch(e){ console.error('ASCEND media delete error', e); }
    }
    return true;
  },
  async all(){
    // Full set for this user — used by export & reset, so it must include cloud-only
    // items too (not just whatever happens to be cached locally on this device).
    if(!CURRENT_USER_ID) return [];
    try{
      const { data: files, error } = await sb.storage.from('media').list(CURRENT_USER_ID, { limit: 1000 });
      if(error || !files) return [];
      const out = [];
      for(const f of files){
        const rec = await this.get(f.name);
        if(rec) out.push(rec);
      }
      return out;
    }catch(e){ return []; }
  },
  async count(){
    if(!CURRENT_USER_ID) return 0;
    try{
      const { data: files, error } = await sb.storage.from('media').list(CURRENT_USER_ID, { limit: 1000 });
      if(error || !files) return 0;
      return files.length;
    }catch(e){ return 0; }
  }
};

// Reusable async media-preview mounter: fills a `[data-media-id]` container
// with an <img> loaded from IndexedDB. Removes the container entirely if the
// media record is missing so no empty placeholder is left behind.
async function mountMediaPreview(el){
  const mediaId = el && el.dataset ? el.dataset.mediaId : null;
  if(!el) return;
  if(!mediaId){ el.remove(); return; }
  try{
    const rec = await IDB.get(mediaId);
    if(rec && rec.dataURL){
      const img = document.createElement('img');
      img.src = rec.dataURL;
      img.alt = '';
      el.appendChild(img);
    } else {
      el.remove();
    }
  }catch(e){
    el.remove();
  }
}
function mountMediaPreviews(root){
  if(!root) return;
  root.querySelectorAll('[data-media-id]').forEach(mountMediaPreview);
}

// ===================== CALCULATION ENGINE =====================
const Calc = {
  pnl(t){ return Number(t.pnl)||0; },
  rMultiple(t){
    if(t.rMultiple !== undefined && t.rMultiple !== null && t.rMultiple !== '') return Number(t.rMultiple);
    const risk = Number(t.riskAmount);
    if(risk){ return Number(t.pnl||0)/risk; }
    return 0;
  },
  plannedRR(t){
    const entry=Number(t.entryPrice), sl=Number(t.stopLoss), tp=Number(t.takeProfit);
    if(!entry||!sl||!tp) return null;
    const risk = Math.abs(entry-sl); if(!risk) return null;
    const reward = Math.abs(tp-entry);
    return reward/risk;
  },
  winRate(trades){
    const closed = trades.filter(t=>t.result==='Win'||t.result==='Loss');
    if(!closed.length) return 0;
    const wins = closed.filter(t=>t.result==='Win').length;
    return (wins/closed.length)*100;
  },
  dailyWinRate(trades){
    const byDay = groupBy(trades, t=>t.date);
    const days = Object.values(byDay);
    if(!days.length) return 0;
    const winDays = days.filter(d=> sumPnl(d) > 0 ).length;
    return (winDays/days.length)*100;
  },
  profitFactor(trades){
    let gp=0, gl=0;
    trades.forEach(t=>{ const p=Calc.pnl(t); if(p>0) gp+=p; else gl+=Math.abs(p); });
    if(gl===0) return gp>0 ? Infinity : 0;
    return gp/gl;
  },
  expectancy(trades){
    const closed = trades.filter(t=>t.result==='Win'||t.result==='Loss');
    if(!closed.length) return 0;
    const rs = closed.map(t=>Calc.rMultiple(t));
    return rs.reduce((a,b)=>a+b,0)/rs.length;
  },
  avgWin(trades){ const w = trades.filter(t=>t.result==='Win').map(t=>Calc.pnl(t)); return w.length? w.reduce((a,b)=>a+b,0)/w.length : 0; },
  avgLoss(trades){ const l = trades.filter(t=>t.result==='Loss').map(t=>Calc.pnl(t)); return l.length? l.reduce((a,b)=>a+b,0)/l.length : 0; },
  bestTrade(trades){ if(!trades.length) return null; return trades.reduce((a,b)=> Calc.pnl(b)>Calc.pnl(a)?b:a); },
  worstTrade(trades){ if(!trades.length) return null; return trades.reduce((a,b)=> Calc.pnl(b)<Calc.pnl(a)?b:a); },
  streak(trades){
    const sorted = [...trades].filter(t=>t.result==='Win'||t.result==='Loss').sort((a,b)=> (a.date+a.timeEntered).localeCompare(b.date+b.timeEntered));
    if(!sorted.length) return {count:0,type:'none'};
    let type = sorted[sorted.length-1].result; let count=0;
    for(let i=sorted.length-1;i>=0;i--){ if(sorted[i].result===type) count++; else break; }
    return { count, type: type==='Win'?'win':'loss' };
  },
  equityCurve(trades, startingBalance){
    const sorted = [...trades].sort((a,b)=> (a.date+(a.timeEntered||'')).localeCompare(b.date+(b.timeEntered||'')));
    let bal = startingBalance||0; const pts=[];
    sorted.forEach(t=>{ bal += Calc.pnl(t); pts.push({ date:t.date, balance:bal, pnl:Calc.pnl(t), id:t.id }); });
    return pts;
  },
  maxDrawdown(points){
    let peak = -Infinity, maxDD=0;
    points.forEach(p=>{ peak = Math.max(peak, p.balance); const dd = peak - p.balance; maxDD = Math.max(maxDD, dd); });
    return maxDD;
  },
  accountProgress(acc, trades){
    const accTrades = trades.filter(t=>idEq(t.accountId, acc.id));
    const pnlTotal = accTrades.reduce((s,t)=>s+Calc.pnl(t),0);
    const equity = Number(acc.currentBalance||acc.accountSize||0) + pnlTotal - (Number(acc.currentBalance? 0 : 0));
    const today = todayStr();
    const todayPnl = accTrades.filter(t=>t.date===today).reduce((s,t)=>s+Calc.pnl(t),0);
    const dailyLossUsed = todayPnl < 0 ? Math.abs(todayPnl) : 0;
    const totalLossUsed = pnlTotal < 0 ? Math.abs(pnlTotal) : 0;
    const target = Number(acc.profitTarget)||0;
    const targetProgress = target ? clamp((pnlTotal/target)*100,-999,999) : 0;
    let status = 'SAFE';
    if(acc.maxDailyLoss && dailyLossUsed >= Number(acc.maxDailyLoss)*0.85) status='WARNING';
    if(acc.maxLoss && totalLossUsed >= Number(acc.maxLoss)*0.85) status='WARNING';
    if(acc.maxDailyLoss && dailyLossUsed >= Number(acc.maxDailyLoss)) status='BREACHED';
    if(acc.maxLoss && totalLossUsed >= Number(acc.maxLoss)) status='BREACHED';
    return { equity, pnlTotal, todayPnl, dailyLossUsed, totalLossUsed, targetProgress, status, tradeCount: accTrades.length };
  },
  readinessScore(pm, weights){
    weights = weights || State.db.settings.readinessWeights;
    const parts = [];
    if(pm.mindsetNumeric!=null && pm.mindsetNumeric!=='') parts.push(['mindset', Number(pm.mindsetNumeric)/10]);
    if(pm.marketBias) parts.push(['marketClarity', 1]);
    if(pm.keyLevels) parts.push(['planClarity', 1]);
    if(pm.riskReadiness!=null && pm.riskReadiness!=='') parts.push(['riskReadiness', Number(pm.riskReadiness)/10]);
    if(pm.recovery!=null && pm.recovery!=='') parts.push(['recovery', Number(pm.recovery)/10]);
    if(!parts.length) return null;
    let wsum=0, total=0;
    parts.forEach(([k,v])=>{ const w = weights[k]!=null?weights[k]:0.2; wsum+=w; total += v*w; });
    if(!wsum) return null;
    return Math.round((total/wsum)*100)/10;
  },
  processScore(trades){
    const withRating = trades.filter(t=> t.ruleAdherence!=null && t.ruleAdherence!=='');
    if(!withRating.length) return null;
    return withRating.reduce((s,t)=>s+Number(t.ruleAdherence),0)/withRating.length;
  },
  modelPerformance(trades, playbooks){
    const map = {};
    trades.forEach(t=>{
      const key = t.playbookId || t.entryModel || 'Unassigned';
      if(!map[key]) map[key] = [];
      map[key].push(t);
    });
    return Object.entries(map).map(([key,list])=>{
      const pb = playbooks.find(p=>p.id===key);
      return {
        key, name: pb? pb.name : (key==='Unassigned'?'Unassigned':key),
        trades: list.length, winRate: Calc.winRate(list), pnl: list.reduce((s,t)=>s+Calc.pnl(t),0),
        avgR: Calc.expectancy(list), profitFactor: Calc.profitFactor(list),
        avgWin: Calc.avgWin(list), avgLoss: Calc.avgLoss(list),
        best: Calc.bestTrade(list), worst: Calc.worstTrade(list),
      };
    }).sort((a,b)=>b.trades-a.trades);
  },
  sessionPerformance(trades){
    const map = groupBy(trades, t=>t.session||'Unspecified');
    return Object.entries(map).map(([session,list])=>({ session, trades:list.length, winRate:Calc.winRate(list), pnl:list.reduce((s,t)=>s+Calc.pnl(t),0), avgR:Calc.expectancy(list) }));
  },
  psychologyCorrelation(trades, flag){
    const withFlag = trades.filter(t=> (t.behaviourFlags||[]).includes(flag));
    const withoutFlag = trades.filter(t=> !(t.behaviourFlags||[]).includes(flag));
    if(withFlag.length < 3) return null;
    return { flagWinRate: Calc.winRate(withFlag), baseWinRate: Calc.winRate(withoutFlag.length?withoutFlag:trades), count: withFlag.length };
  },
  weeklyAggregate(weekStart, trades, premarket, dailyReviews){
    const weekEnd = weekRangeOf(weekStart).end;
    const wt = trades.filter(t=> t.date>=weekStart && t.date<=weekEnd);
    const wp = premarket.filter(p=> p.date>=weekStart && p.date<=weekEnd);
    const wd = dailyReviews.filter(d=> d.date>=weekStart && d.date<=weekEnd);
    const readiness = wp.map(p=>Calc.readinessScore(p)).filter(x=>x!=null);
    const discipline = wd.map(d=>Number(d.selfDisciplineRating)).filter(x=>!isNaN(x)&&x!==0);
    return {
      trades: wt, pnl: wt.reduce((s,t)=>s+Calc.pnl(t),0), tradeCount: wt.length,
      winRate: Calc.winRate(wt), avgR: Calc.expectancy(wt), profitFactor: Calc.profitFactor(wt),
      best: Calc.bestTrade(wt), worst: Calc.worstTrade(wt),
      avgReadiness: readiness.length? readiness.reduce((a,b)=>a+b,0)/readiness.length : null,
      avgDiscipline: discipline.length? discipline.reduce((a,b)=>a+b,0)/discipline.length : null,
    };
  },
  monthlyAggregate(monthKey, trades, weeklyReviews){
    const mt = trades.filter(t=> monthKeyOf(t.date)===monthKey);
    const byDay = groupBy(mt, t=>t.date);
    const dayEntries = Object.entries(byDay).map(([date,list])=>({date, pnl:list.reduce((s,t)=>s+Calc.pnl(t),0)}));
    const bestDay = dayEntries.length? dayEntries.reduce((a,b)=> b.pnl>a.pnl?b:a) : null;
    const worstDay = dayEntries.length? dayEntries.reduce((a,b)=> b.pnl<a.pnl?b:a) : null;
    return {
      trades: mt, pnl: mt.reduce((s,t)=>s+Calc.pnl(t),0), tradeCount: mt.length,
      winRate: Calc.winRate(mt), avgR: Calc.expectancy(mt), profitFactor: Calc.profitFactor(mt),
      expectancy: Calc.expectancy(mt), bestDay, worstDay,
      best: Calc.bestTrade(mt), worst: Calc.worstTrade(mt),
    };
  }
};
function groupBy(arr, fn){ const o={}; arr.forEach(x=>{ const k=fn(x); (o[k]=o[k]||[]).push(x); }); return o; }
function sumPnl(list){ return list.reduce((s,t)=>s+Calc.pnl(t),0); }

// ===================== MODAL SYSTEM =====================
const Modal = {
  stack: [],
  open({ title, bodyHTML, footerHTML, size, tabs, onMount, className }){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const modal = document.createElement('div');
    modal.className = 'modal' + (size==='lg' ? ' modal-lg':'') + (className? ' '+className : '');
    let tabsHTML = '';
    if(tabs && tabs.length){
      tabsHTML = `<div class="modal-tabs">` + tabs.map((t,i)=>`<div class="modal-tab ${i===0?'active':''}" data-tabidx="${i}">${esc(t.label)}</div>`).join('') + `</div>`;
    }
    modal.innerHTML = `
      <div class="modal-header"><h3>${esc(title)}</h3><button class="btn btn-icon btn-ghost" data-close>✕</button></div>
      ${tabsHTML}
      <div class="modal-body">${bodyHTML||''}</div>
      ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
    `;
    overlay.appendChild(modal);
    document.getElementById('modal-root').appendChild(overlay);
    requestAnimationFrame(()=>overlay.classList.add('show'));
    const close = ()=>{
      overlay.classList.remove('show');
      setTimeout(()=>overlay.remove(), 180);
      Modal.stack.pop();
    };
    overlay.querySelectorAll('[data-close]').forEach(btn=>{ btn.onclick = close; });
    overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });
    if(tabs && tabs.length){
      overlay.querySelectorAll('.modal-tab').forEach(tabEl=>{
        tabEl.onclick = ()=>{
          overlay.querySelectorAll('.modal-tab').forEach(x=>x.classList.remove('active'));
          overlay.querySelectorAll('.modal-tabpanel').forEach(x=>x.classList.remove('active'));
          tabEl.classList.add('active');
          const idx = tabEl.dataset.tabidx;
          overlay.querySelector(`.modal-tabpanel[data-tabpanel="${idx}"]`)?.classList.add('active');
        };
      });
    }
    Modal.stack.push({overlay, close});
    if(onMount) onMount(overlay, close);
    return { overlay, close };
  },
  closeTop(){ const top = Modal.stack[Modal.stack.length-1]; if(top) top.close(); },
  confirm({ title, message, confirmLabel, danger, onConfirm }){
    Modal.open({
      title: title||'Are you sure?',
      bodyHTML: `<p class="muted">${esc(message||'')}</p>`,
      footerHTML: `<button class="btn" data-close>Cancel</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirm-yes">${esc(confirmLabel||'Confirm')}</button>`,
      onMount:(overlay, close)=>{
        overlay.querySelector('#confirm-yes').onclick = ()=>{ close(); onConfirm && onConfirm(); };
      }
    });
  }
};
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && Modal.stack.length) Modal.closeTop();
});

// ===================== SVG CHARTS =====================
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const Charts = {
  equityCurve(container, points, opts){
    opts = opts||{};
    container.innerHTML = '';
    const w = container.clientWidth || 600, h = opts.height || 220;
    if(!points.length){ container.innerHTML = `<div class="empty-state" style="padding:30px;"><p>No equity data for this range yet.</p></div>`; return; }
    const svg = svgEl('svg', { viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, preserveAspectRatio:'none' });
    const pad = 8;
    const vals = points.map(p=>p.balance);
    const min = Math.min(...vals, points[0].balance), max = Math.max(...vals, points[0].balance);
    const range = (max-min) || 1;
    const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
    const x = (i)=> pad + i*stepX;
    const y = (v)=> h - pad - ((v-min)/range)*(h-pad*2);
    let path = '', area = '';
    points.forEach((p,i)=>{ const cmd = i===0?'M':'L'; path += `${cmd}${x(i).toFixed(1)},${y(p.balance).toFixed(1)} `; });
    area = `M${x(0).toFixed(1)},${h-pad} ` + path.replace('M','L') + ` L${x(points.length-1).toFixed(1)},${h-pad} Z`;
    const positive = points[points.length-1].balance >= points[0].balance;
    const color = positive ? 'var(--positive)' : 'var(--negative)';
    const gradId = 'grad_'+Math.random().toString(36).slice(2,8);
    const defs = svgEl('defs',{});
    const fillColor = positive ? cssVar('--positive') : cssVar('--negative');
    defs.innerHTML = `<linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${fillColor}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${fillColor}" stop-opacity="0"/></linearGradient>`;
    svg.appendChild(defs);
    svg.appendChild(svgEl('path', { d:area, fill:`url(#${gradId})`, stroke:'none' }));
    const filterId = 'glow_'+gradId;
    defs.innerHTML += `<filter id="${filterId}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
    svg.appendChild(svgEl('path', { d:path.trim(), fill:'none', stroke:color, 'stroke-width':1.8, 'stroke-linejoin':'round', 'stroke-linecap':'round', filter:`url(#${filterId})` }));
    // hover dots layer
    const hoverLine = svgEl('line', {x1:0,y1:0,x2:0,y2:h, stroke:'var(--border)', 'stroke-width':1, opacity:0});
    svg.appendChild(hoverLine);
    container.appendChild(svg);
    const tip = document.createElement('div');
    tip.style.cssText = 'position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:11px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;';
    container.style.position='relative';
    container.appendChild(tip);
    svg.addEventListener('mousemove', (e)=>{
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX-rect.left)/rect.width*w;
      let idx = Math.round((mx-pad)/(stepX||1));
      idx = clamp(idx,0,points.length-1);
      const p = points[idx];
      hoverLine.setAttribute('x1', x(idx)); hoverLine.setAttribute('x2', x(idx)); hoverLine.setAttribute('opacity',1);
      tip.style.left = Math.min(Math.max(0,(x(idx)/w*rect.width)-60),rect.width-130)+'px';
      tip.style.top = '0px';
      tip.style.opacity = 1;
      tip.innerHTML = `<b>${fmtDateShort(p.date)}</b><br><span class="${p.pnl>=0?'pos':'neg'}">${fmtMoney(p.pnl)}</span> · Bal ${fmtMoney(p.balance)}`;
    });
    svg.addEventListener('mouseleave', ()=>{ hoverLine.setAttribute('opacity',0); tip.style.opacity=0; });
  },
  donut(container, data, opts){
    opts = opts||{};
    container.innerHTML='';
    const size = opts.size||120, stroke = opts.stroke||14, r=(size-stroke)/2, c=2*Math.PI*r;
    const total = data.reduce((s,d)=>s+d.value,0);
    const svg = svgEl('svg',{viewBox:`0 0 ${size} ${size}`, width:size, height:size});
    let offset=0;
    if(total===0){
      svg.appendChild(svgEl('circle',{cx:size/2,cy:size/2,r, fill:'none', stroke:'var(--surface-3)', 'stroke-width':stroke}));
    } else {
      data.forEach(d=>{
        const frac = d.value/total; const len = frac*c;
        const circ = svgEl('circle',{cx:size/2,cy:size/2,r, fill:'none', stroke:d.color, 'stroke-width':stroke,
          'stroke-dasharray':`${len} ${c-len}`, 'stroke-dashoffset':-offset, transform:`rotate(-90 ${size/2} ${size/2})`, 'stroke-linecap':'butt'});
        svg.appendChild(circ);
        offset += len;
      });
    }
    container.appendChild(svg);
  },
  bars(container, data, opts){
    opts=opts||{};
    container.innerHTML='';
    const w = container.clientWidth||400, h = opts.height||140, pad=20;
    const svg = svgEl('svg',{viewBox:`0 0 ${w} ${h}`, width:'100%', height:h});
    if(!data.length){ container.innerHTML = '<div class="empty-state" style="padding:20px;"><p>Not enough data yet.</p></div>'; return; }
    const max = Math.max(...data.map(d=>Math.abs(d.value)),1);
    const bw = (w-pad*2)/data.length;
    const zeroY = h/2;
    data.forEach((d,i)=>{
      const bh = (Math.abs(d.value)/max)*(h/2-14);
      const x = pad + i*bw + bw*0.18;
      const bwidth = bw*0.64;
      const y = d.value>=0 ? zeroY-bh : zeroY;
      svg.appendChild(svgEl('rect',{x,y,width:bwidth,height:Math.max(bh,1.5), rx:3, fill: d.value>=0?'var(--positive)':'var(--negative)', opacity:0.85}));
      const label = svgEl('text',{x:x+bwidth/2, y:h-4, 'text-anchor':'middle', fill:'var(--text-faint)', 'font-size':'9'});
      label.textContent = d.label; svg.appendChild(label);
    });
    svg.appendChild(svgEl('line',{x1:pad,x2:w-pad,y1:zeroY,y2:zeroY, stroke:'var(--border)', 'stroke-width':1}));
    container.appendChild(svg);
  },
  heatmap(container, year, month, dayDataMap, onDayClick){
    container.innerHTML='';
    const first = new Date(year, month, 1);
    const startDow = (first.getDay()+6)%7; // Monday start
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:6px;';
    ['M','T','W','T','F','S','S'].forEach(d=>{
      const lbl = document.createElement('div'); lbl.textContent=d; lbl.style.cssText='font-size:10px;color:var(--text-faint);text-align:center;font-weight:700;'; grid.appendChild(lbl);
    });
    for(let i=0;i<startDow;i++){ const sp=document.createElement('div'); grid.appendChild(sp); }
    let maxAbs = 1;
    Object.values(dayDataMap).forEach(d=>{ maxAbs = Math.max(maxAbs, Math.abs(d.pnl||0)); });
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const info = dayDataMap[dateStr];
      const cell = document.createElement('div');
      cell.className='day-cell';
      let bg = 'var(--surface-2)', txt='var(--text-faint)';
      if(info && info.pnl!==0){
        const intensity = clamp(Math.abs(info.pnl)/maxAbs, 0.18, 1);
        // Pull RGB triplets from theme tokens so heatmap tracks dark/light tonal
        // variants. Falls back to profit/loss defaults if tokens are unavailable.
        const posRgb = cssVar('--positive-rgb') || '114,214,173';
        const negRgb = cssVar('--negative-rgb') || '255,102,120';
        const alpha = (intensity*0.55+0.1).toFixed(3);
        bg = info.pnl>0 ? `rgba(${posRgb},${alpha})` : `rgba(${negRgb},${alpha})`;
        txt = '#fff';
      } else if(info){ bg='var(--surface-3)'; }
      cell.style.background = bg; cell.style.color = txt;
      if(info && info.trades){
        const pnlStr = (info.pnl>0?'+':'') + fmtMoney(info.pnl);
        cell.innerHTML = `<div class="day-cell-day">${d}</div><div class="day-cell-pnl mono">${pnlStr}</div>`;
      } else {
        cell.textContent = d;
      }
      cell.title = info ? `${dateStr}: ${fmtMoney(info.pnl)} · ${info.trades} trades` : dateStr;
      cell.onclick = ()=> onDayClick && onDayClick(dateStr);
      grid.appendChild(cell);
    }
    container.appendChild(grid);
  }
};

// Never a separate data store — the badge/panel/persistence-across-reload are all
// derived live from getUnresolvedTrades(State.db) each time render()/toggle() runs,
// so the notification can never drift from the actual trade/account relationships.
const NotifCenter = {
  open: false,
  render(){
    const badge = document.getElementById('notif-badge');
    const btn = document.getElementById('notif-btn');
    if(!badge || !btn) return;
    const unresolved = getUnresolvedTrades(State.db);
    if(unresolved.length>0){
      badge.hidden = false;
      badge.textContent = unresolved.length>9 ? '9+' : String(unresolved.length);
      btn.classList.add('has-notif');
    } else {
      badge.hidden = true;

      this.close(); // nothing left to resolve — don't leave a stale open panel
    }
    if(this.open) this.renderPanel(unresolved);
  },
  renderPanel(unresolved){
    const panel = document.getElementById('notif-panel');
    if(!panel) return;
    const db = State.db;

      panel.innerHTML = `<div class="notif-empty">No action required — everything's linked.</div>`;

// ===================== SESSION INDICATOR =====================
function romeNow(){
  const fmt = new Intl.DateTimeFormat('en-GB',{ timeZone:'Europe/Rome', hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short' });
  const parts = fmt.formatToParts(new Date());
  const h = parts.find(p=>p.type==='hour').value, m = parts.find(p=>p.type==='minute').value;
  return { h:+h, m:+m, minutes:(+h)*60+(+m) };
}
function toMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function getSessionInfo(){
  const sessions = (State.db && State.db.settings.sessions) || SESSIONS_DEFAULT;
  const now = romeNow();
  let active = null, next = null, nextDelta = Infinity;
  sessions.forEach(s=>{
    const start = toMinutes(s.start), end = toMinutes(s.end);
    const inSession = start<end ? (now.minutes>=start && now.minutes<end) : (now.minutes>=start || now.minutes<end);
    if(inSession) active = s;
    let delta = start - now.minutes; if(delta<0) delta += 1440;
    if(delta < nextDelta){ nextDelta = delta; next = s; }
  });
  return { now, active, next, nextDelta };
}
function updateSessionChip(){
  const info = getSessionInfo();
  const { now, active, next, nextDelta } = info;
  const timeStr = String(now.h).padStart(2,'0')+':'+String(now.m).padStart(2,'0');
  const chip = document.getElementById('session-chip');
  if(chip){
    if(active){
      chip.innerHTML = `<span class="session-dot live"></span><span><b>${esc(active.name.toUpperCase())}</b> · LIVE</span>`;
    } else {
      const nh = Math.floor(nextDelta/60), nm = nextDelta%60;
      chip.innerHTML = `<span class="session-dot"></span><span>QUIET · next ${esc(next?next.name:'')} ${nh}h${nm}m</span>`;
    }
  }
  const card = document.getElementById('session-status-card');
  if(card){
    const nh = Math.floor(nextDelta/60), nm = nextDelta%60;
    card.querySelector('#sess-title').innerHTML = active ? `${esc(active.name)} <span class="live-tag">● LIVE</span>` : `Market Quiet`;
    card.querySelector('#sess-sub').textContent = active ? 'Current trading window is active.' : `Next session in ${nh}h ${nm}m.`;
    card.querySelector('#sess-current').textContent = timeStr;
    card.querySelector('#sess-next').textContent = next ? `${next.name} · ${next.start}` : '—';
  }
  return info;
}

function rangeToDates(rangeKey, customStart, customEnd){
  const end = new Date();
  let start = new Date();
  switch(rangeKey){
    case '7D': start.setDate(end.getDate()-7); break;
    case '30D': start.setDate(end.getDate()-30); break;
    case '90D': start.setDate(end.getDate()-90); break;
    case '6M': start.setMonth(end.getMonth()-6); break;
    case 'YTD': start = new Date(end.getFullYear(),0,1); break;
    case 'ALL': start = new Date(2000,0,1); break;
    case 'CUSTOM': return { start: customStart||'2000-01-01', end: customEnd||todayStr() };
    default: start.setDate(end.getDate()-30);
  }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}
function filterTradesByRange(trades, rangeKey, accountId){
  const { start, end } = rangeToDates(rangeKey);
  return trades.filter(t=> t.date>=start && t.date<=end && (!accountId || accountId==='all' || idEq(t.accountId, accountId)));
}
function emptyState(iconName, title, msg, btnLabel, onClick){

  if(btnLabel){ const btn = document.createElement('button'); btn.className='btn btn-primary'; btn.textContent=btnLabel; btn.onclick=onClick; wrap.appendChild(btn); }
  return wrap.outerHTML.replace('</div></div>', '</div>'+(btnLabel?`<button class="btn btn-primary" id="es-btn">${esc(btnLabel)}</button>`:'')+'</div>');
}

function renderDashHeatmap(root, dateObj, db, accId){
  const y = dateObj.getFullYear(), m = dateObj.getMonth();
  root.querySelector('#heatmap-label').textContent = dateObj.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const heatmapTrades = (!accId || accId==='all') ? db.trades : db.trades.filter(t=>idEq(t.accountId, accId));
  const map = {};
  heatmapTrades.forEach(t=>{ if(monthKeyOf(t.date)===`${y}-${String(m+1).padStart(2,'0')}`){ if(!map[t.date]) map[t.date]={pnl:0,trades:0}; map[t.date].pnl+=Calc.pnl(t); map[t.date].trades++; } });
  Charts.heatmap(root.querySelector('#dash-heatmap'), y, m, map, (dateStr)=>{ location.hash = '#/day/'+dateStr; });
}
function renderBreakdown(root, type, trades){
  const el = root.querySelector('#breakdown-chart'); if(!el) return;
  // Centralized frost/obsidian palette. Reads theme tokens at render time so the
  // donut reflects dark/light tonal variants and any future token tweaks.
  const PALETTE = {
    accent:     cssVar('--accent')      || '#F3F8FC',
    accentDim:  cssVar('--accent-dim')  || '#C9D3DA',
    positive:   cssVar('--positive')    || '#72D6AD',
    negative:   cssVar('--negative')    || '#FF6678',
    warning:    cssVar('--warning')     || '#E5B85C',
    info:       cssVar('--info')        || '#82AFFF',
    textFaint:  cssVar('--text-faint')  || '#68717A',
    // Cool neutral tonal variants for additional categories — kept within the
    // frost/obsidian family so the chart reads as one system, not a rainbow.
    tealLight:  cssVar('--accent-glow') || 'rgba(243,248,252,.12)',
    deepTeal:   '#3A424B',
  };
  let data = [];
  if(type==='Win/Loss'){
    const w = trades.filter(t=>t.result==='Win').length, l = trades.filter(t=>t.result==='Loss').length, b = trades.filter(t=>t.result==='Breakeven').length;
    data = [
      {label:'Win',  value:w, color: PALETTE.positive},
      {label:'Loss', value:l, color: PALETTE.negative},
      {label:'BE',   value:b, color: PALETTE.textFaint},
    ];
  } else if(type==='Long/Short'){
    const lg = trades.filter(t=>t.direction==='Long').length, sh = trades.filter(t=>t.direction==='Short').length;
    data = [
      {label:'Long',  value:lg, color: PALETTE.accent},
      {label:'Short', value:sh, color: PALETTE.accentDim},
    ];
  } else if(type==='Session'){
    const map = groupBy(trades, t=>t.session||'—');
    // Frost-forward sequence: brand first, fading through info/warning/neutral for
    // categories that don't map to a semantic trading color.
    const colors = [PALETTE.accent, PALETTE.info, PALETTE.accentDim, PALETTE.deepTeal, PALETTE.warning, PALETTE.textFaint];
    data = Object.entries(map).map(([k,v],i)=>({label:k,value:v.length,color:colors[i%colors.length]}));
  } else {
    const map = groupBy(trades, t=>t.entryModel||'—');
    const colors = [PALETTE.accent, PALETTE.info, PALETTE.accentDim, PALETTE.deepTeal, PALETTE.warning, PALETTE.textFaint];
    data = Object.entries(map).map(([k,v],i)=>({label:k,value:v.length,color:colors[i%colors.length]}));
  }
  const donutOuter = document.createElement('div');
  donutOuter.style.cssText = 'position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;';
  const donutWrap = document.createElement('div'); Charts.donut(donutWrap, data.map(d=>({value:d.value,color:d.color})), {size:150,stroke:16});
  donutOuter.appendChild(donutWrap);
  if(type==='Win/Loss'){
    const total = data.reduce((s,d)=>s+d.value,0);
    const wr = total? (data[0].value/total*100) : 0;
    const centerLabel = document.createElement('div');
    centerLabel.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;';
    centerLabel.innerHTML = `<div class="mono" style="font-size:22px;font-weight:600;">${fmtPct(wr)}</div><div class="faint" style="font-size:9px;letter-spacing:.1em;">WIN RATE</div>`;
    donutOuter.appendChild(centerLabel);
  }
  const legend = data.map(d=>`<div class="flex gap-8" style="margin-bottom:8px;font-size:12px;"><span style="width:8px;height:8px;border-radius:2px;background:${d.color};display:inline-block;"></span><span class="muted">${esc(d.label)}</span><b style="margin-left:auto;">${d.value}</b></div>`).join('');
  el.innerHTML = ''; el.appendChild(donutOuter);
  const legendWrap = document.createElement('div'); legendWrap.style.cssText='flex:0 0 auto;min-width:100px;'; legendWrap.innerHTML = legend || '<div class="muted">No data</div>';
  el.appendChild(legendWrap);
}

Pages.trades = function(){

  let list = [...db.trades];
  if(f.search) list = list.filter(t=> JSON.stringify(t).toLowerCase().includes(f.search.toLowerCase()));
  if(f.account!=='all') list = list.filter(t=>idEq(t.accountId, f.account));
  if(f.direction!=='all') list = list.filter(t=>t.direction===f.direction);
  if(f.session!=='all') list = list.filter(t=>t.session===f.session);
  if(f.result!=='all') list = list.filter(t=>t.result===f.result);
  const [sortKey,sortDir] = f.sort.split('_');
  list.sort((a,b)=>{
    let av,bv;
    if(sortKey==='date'){ av=a.date+(a.timeEntered||''); bv=b.date+(b.timeEntered||''); }
    else if(sortKey==='pnl'){ av=Calc.pnl(a); bv=Calc.pnl(b); }
    else { av=a[sortKey]; bv=b[sortKey]; }
    if(av<bv) return sortDir==='asc'?-1:1;
    if(av>bv) return sortDir==='asc'?1:-1;
    return 0;
  });

function renderTradeCard(t, db){

    <div class="trade-card-meta">
      <div><div class="faint" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;">Date</div><div style="font-size:12px;">${fmtDateShort(t.date)}</div></div>

    </div>

    ${lesson ? `<div class="trade-card-lesson"><div class="faint" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;">Lesson</div><div style="font-size:12px;color:var(--text-muted);">${esc(lesson).slice(0,160)}${lesson.length>160?'…':''}</div></div>` : ''}
    <div class="trade-card-actions">

}
function exportTradesCSV(list){
  if(!list.length){ toast('No trades to export','error'); return; }
  const cols = ['date','instrument','direction','session','entryModel','entryPrice','stopLoss','takeProfit','exitPrice','riskAmount','pnl','result','rMultiple','notes'];
  const rows = [cols.join(',')].concat(list.map(t=> cols.map(c=>{
    let v = c==='rMultiple' ? Calc.rMultiple(t) : t[c];
    v = v==null? '' : String(v).replace(/"/g,'""');
    return /[,"\n]/.test(v) ? `"${v}"` : v;
  }).join(',')));
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `ascend-trades-${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function uploadField(fieldKey, mediaId, label){
  return `<label class="field-label">${label}</label>
    <div class="upload-drop" data-upload="${fieldKey}">${mediaId? 'Screenshot attached — click to replace' : 'Click to upload screenshot'}</div>
    <img class="screenshot-thumb" id="thumb-${fieldKey}" style="display:none;margin-top:8px;max-height:140px;object-fit:cover;">
    <input type="file" accept="image/*" data-fileinput="${fieldKey}" style="display:none;">`;
}
function wireCommonFormBits(overlay, obj){
  overlay.querySelectorAll('[data-field]').forEach(el=>{
    const key = el.dataset.field;
    const evt = (el.tagName==='SELECT' || el.type==='date' || el.type==='time') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{ obj[key] = el.type==='number' ? (el.value===''? '' : Number(el.value)) : el.value; if(el.classList.contains('sl-input')){ const disp=overlay.querySelector('#sl-'+key); if(disp) disp.textContent = el.value; } });
  });
  overlay.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{ const key = el.dataset.toggle; obj[key] = !obj[key]; el.classList.toggle('on', obj[key]); };
  });
  overlay.querySelectorAll('[data-upload]').forEach(dz=>{
    const key = dz.dataset.upload;
    const input = overlay.querySelector(`[data-fileinput="${key}"]`);
    const thumb = overlay.querySelector(`#thumb-${key}`);
    if(obj[key]){ IDB.get(obj[key]).then(rec=>{ if(rec){ thumb.src = rec.dataURL; thumb.style.display='block'; } }); }
    dz.onclick = ()=> input.click();
    input.onchange = async ()=>{
      const file = input.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        const id = obj[key] && obj[key].startsWith('media_') ? obj[key] : uid('media');
        await IDB.put(id, reader.result, { name:file.name });
        obj[key] = id;
        thumb.src = reader.result; thumb.style.display='block';
        dz.textContent = 'Screenshot attached — click to replace';
        toast('Screenshot attached','success');
      };
      reader.readAsDataURL(file);
    };
  });
}

      if(!a.accountName){ toast('Account name is required','error'); return; }
      if(!a.accountSize || Number(a.accountSize)<=0){ toast('Account size must be greater than zero','error'); return; }

      if(idx>=0) db.accounts[idx]=a; else db.accounts.push(a);
      if(!db.settings.defaultAccountId && a.status!=='Archived') db.settings.defaultAccountId = a.id;
      State.saveNow(); toast(isEdit?'Account updated':'Account created','success'); close(); router();
    };
    if(isEdit) overlay.querySelector('#acc-delete').onclick = ()=>{
      const linkedCount = db.trades.filter(t=>idEq(t.accountId, a.id)).length;
      if(linkedCount===0){
        Modal.confirm({ title:'Delete account?', message:'This account has no linked trades and will be permanently removed.', danger:true, confirmLabel:'Delete', onConfirm:()=>{

          State.saveNow(); toast('Account deleted'); close(); router();
        }});
      } else {
        Modal.confirm({ title:'Archive account?', message:`This account has ${linkedCount} linked trade${linkedCount===1?'':'s'} and cannot be deleted. It will be archived instead: its history stays intact, but it will no longer be offered as the default for new trades.`, danger:true, confirmLabel:'Archive', onConfirm:()=>{
          const idx2 = db.accounts.findIndex(x=>x.id===a.id);
          if(idx2>=0) db.accounts[idx2].status = 'Archived';
          if(db.settings.defaultAccountId===a.id) db.settings.defaultAccountId = getValidDefaultAccountId(db);
          State.saveNow(); toast('Account archived'); close(); router();
        }});
      }
    };
  }});
};

function renderExecutionTable(trades){
  const rows = [
    ['Followed Plan', trades.filter(t=>t.followedPlan), trades.filter(t=>!t.followedPlan)],
    ['HTF Followed', trades.filter(t=>t.htfFollowed), trades.filter(t=>!t.htfFollowed)],
  ];
  return `<div class="table-wrap"><table><thead><tr><th>Factor</th><th>Yes — Win Rate</th><th>Yes — Avg R</th><th>No — Win Rate</th><th>No — Avg R</th></tr></thead><tbody>
    ${rows.map(([label,yes,no])=>`<tr><td>${label}</td><td>${yes.length?fmtPct(Calc.winRate(yes)):'—'}</td><td>${yes.length?fmtR(Calc.expectancy(yes)):'—'}</td><td>${no.length?fmtPct(Calc.winRate(no)):'—'}</td><td>${no.length?fmtR(Calc.expectancy(no)):'—'}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function renderPerfTable(rows){
  if(!rows.length) return `<div class="empty-state" style="padding:20px;"><p>No data yet.</p></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Trades</th><th>Win %</th><th>P&amp;L</th><th>Avg R</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.trades}</td><td>${fmtPct(r.winRate)}</td><td class="${r.pnl>=0?'pos':'neg'}">${fmtMoney(r.pnl)}</td><td>${fmtR(r.avgR)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function renderAccountCompareTable(accounts, trades){
  if(!accounts.length) return `<div class="empty-state" style="padding:20px;"><p>No accounts yet.</p></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Account</th><th>Trades</th><th>Win %</th><th>P&amp;L</th><th>Status</th></tr></thead><tbody>
    ${accounts.map(a=>{ const t = trades.filter(x=>idEq(x.accountId,a.id)); const prog = Calc.accountProgress(a,trades); return `<tr><td>${esc(a.accountName)}</td><td>${t.length}</td><td>${fmtPct(Calc.winRate(t))}</td><td class="${prog.pnlTotal>=0?'pos':'neg'}">${fmtMoney(prog.pnlTotal)}</td><td><span class="badge ${prog.status==='SAFE'?'':prog.status==='WARNING'?'b-warn':'b-neg'}">${prog.status}</span></td></tr>`; }).join('')}
  </tbody></table></div>`;
}

// ===================== PSYCHOLOGY =====================
Pages.psychology = function(){
  const db = State.db;
  const root = pageContent();
  const trades = db.trades;
  root.innerHTML = `<div class="page-header"><div class="page-eyebrow">INSIGHTS</div><h1>Psychology</h1><div class="sub">How mental state correlates with results.</div></div>`;
  if(trades.length < 5){
    root.innerHTML += `<div class="card"><div class="empty-state"><div class="icon-wrap">${icon('brain',22)}</div><h3>Not enough data yet</h3><p>Log at least 5 trades with psychology ratings to see correlations.</p></div></div>`;
    return;
  }
  const avgOf = (key)=>{ const v = trades.map(t=>Number(t[key])).filter(x=>!isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const traits = ['discipline','emotionalControl','patience','confidence','mindsetState'];
  root.innerHTML += `
    <div class="grid kpi-row">
      ${traits.map(k=>`<div class="card kpi-card"><div class="kpi-label">${k.replace(/([A-Z])/g,' $1')}</div><div class="kpi-value">${avgOf(k)!=null?avgOf(k).toFixed(1):'—'}<span class="faint" style="font-size:12px;">/10</span></div></div>`).join('')}
    </div>
    <div class="section-header"><h2>Behaviour Flag Impact</h2><div class="desc">Compared against your baseline win rate</div></div>
    <div class="card" id="flag-impact"></div>
    <div class="section-header"><h2>Discipline vs P&amp;L</h2></div>
    <div class="card"><div id="discipline-scatter" style="padding:6px;"></div></div>
  `;
  const flagWrap = root.querySelector('#flag-impact');
  const flagsUsed = [...new Set(trades.flatMap(t=>t.behaviourFlags||[]))];
  if(!flagsUsed.length){ flagWrap.innerHTML = `<div class="empty-state" style="padding:20px;"><p>No behaviour flags tagged yet.</p></div>`; }
  else {
    flagWrap.innerHTML = flagsUsed.map(f=>{
      const corr = Calc.psychologyCorrelation(trades, f);
      if(!corr) return `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border-soft);"><span>${esc(f)}</span><span class="faint" style="font-size:11px;">fewer than 3 trades tagged</span></div>`;
      const diff = corr.flagWinRate - corr.baseWinRate;
      return `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border-soft);">
        <span>${esc(f)}</span>
        <span style="font-size:12px;" class="muted">Trades tagged <b>${esc(f)}</b> have a ${Math.abs(diff).toFixed(0)}% ${diff<0?'lower':'higher'} win rate than baseline <span class="faint">(n=${corr.count})</span></span>
      </div>`;
    }).join('');
  }
  // simple discipline scatter as bar buckets
  const buckets = {'0-3':[],'4-6':[],'7-8':[],'9-10':[]};
  trades.forEach(t=>{ const d = Number(t.discipline); if(isNaN(d)) return; const key = d<=3?'0-3':d<=6?'4-6':d<=8?'7-8':'9-10'; buckets[key].push(t); });
  Charts.bars(root.querySelector('#discipline-scatter'), Object.entries(buckets).map(([k,v])=>({label:k, value: sumPnl(v)})));
};

Forms.note = function(existing){
  const db = State.db;
  const isEdit = !!existing;
  const n = existing? {...existing} : { id: uid('note'), title:'', date: todayStr(), category:'Market Study', content:'', linkedTradeId:'', linkedPlaybookId:'' };
  const body = `
    <div class="field"><label class="field-label">Title</label><input type="text" data-field="title" value="${esc(n.title)}"></div>
    <div class="field-row">
      <div class="field"><label class="field-label">Date</label><input type="date" data-field="date" value="${n.date}"></div>
      <div class="field"><label class="field-label">Category</label><select data-field="category">${NOTE_CATEGORIES.map(c=>`<option ${n.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label class="field-label">Content</label><textarea data-field="content" style="min-height:160px;">${esc(n.content||'')}</textarea></div>
    <div class="field"><label class="field-label">Linked Playbook</label><select data-field="linkedPlaybookId"><option value="">— None —</option>${db.playbooks.map(p=>`<option value="${p.id}" ${n.linkedPlaybookId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  `;
  const footer = `${isEdit?`<button class="btn btn-danger" id="note-delete" style="margin-right:auto;">Delete</button>`:''}<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="note-save">${isEdit?'Save':'Create Note'}</button>`;
  Modal.open({ title:isEdit?'Edit Note':'New Note', bodyHTML:body, footerHTML:footer, onMount:(overlay,close)=>{
    wireCommonFormBits(overlay, n);
    overlay.querySelector('#note-save').onclick = ()=>{
      if(!n.title){ toast('Title is required','error'); return; }
      const idx = db.notes.findIndex(x=>x.id===n.id);
      if(idx>=0) db.notes[idx]=n; else db.notes.push(n);
      State.saveNow(); toast(isEdit?'Note updated':'Note created','success'); close(); router();
    };
    if(isEdit) overlay.querySelector('#note-delete').onclick = ()=>Modal.confirm({title:'Delete note?',danger:true,confirmLabel:'Delete',onConfirm:()=>{ db.notes=db.notes.filter(x=>x.id!==n.id); State.saveNow(); toast('Deleted'); close(); router(); }});
  }});
};

// ===================== UPDATES (frontend mock — no Electron auto-update wired up yet) =====================
// Finite state model driving the Updates settings panel. `state` is one of UPDATE_STATES.
// checkForUpdates() / downloadUpdate() / installUpdate() are deliberately isolated here so this
// object is the ONLY thing that needs to change when the real Electron IPC updater is added later
// (e.g. swap the mocked bodies below for ipcRenderer.invoke('updates:check') etc).
const UPDATE_STATES = ['idle','checking','up-to-date','update-available','downloading','ready-to-install','error'];
const UpdateManager = {
  state: 'idle',
  currentVersion: ASCEND_APP_VERSION,
  latestVersion: null,
  releaseNotes: '',
  progress: 0,
  error: null,
  onUpdate: null, // set by the Updates panel while it's mounted; called on every state change
  _emit(){ if(typeof this.onUpdate === 'function') this.onUpdate(); },
  async checkForUpdates(){
    if(this.state === 'checking' || this.state === 'downloading') return;
    this.state = 'checking'; this.error = null; this._emit();
    // MOCK ONLY — no network or IPC call is made. Always resolves to "up to date".
    // Replace this block with the real check, e.g.:
    //   const result = await window.ascend.checkForUpdates();
    await new Promise(r=>setTimeout(r, 1100));
    this.state = 'up-to-date'; this.latestVersion = null; this.releaseNotes = '';
    State.db.settings.lastUpdateCheck = nowISO();
    State.saveNow();
    this._emit();
  },
  async downloadUpdate(){
    if(this.state !== 'update-available') return;
    this.state = 'downloading'; this.progress = 0; this._emit();
    // MOCK ONLY — simulated progress, no real download. Replace with real IPC progress events later.
    for(let p=10; p<=100; p+=10){ await new Promise(r=>setTimeout(r,140)); this.progress = p; this._emit(); }
    this.state = 'ready-to-install'; this._emit();
  },
  installUpdate(){
    // Placeholder — will call the real Electron "quit and install" IPC handler once wired up.
    toast('Restart & Install will be available once auto-updates are connected.', 'success');
  },
};

async function exportBackup(){
  const db = State.db;
  const media = await IDB.all();
  const payload = { schemaVersion: ASCEND_DB_VERSION, exportedAt: nowISO(), db, media };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').slice(0,12);
  a.href = url; a.download = `ASCEND-backup-${todayStr()}-${stamp.slice(8)}.json`; a.click();
  URL.revokeObjectURL(url);
  db.settings.lastBackup = nowISO(); State.saveNow();
  toast('Backup exported','success');
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let payload;
    try{ payload = JSON.parse(reader.result); }catch(e){ toast('Invalid backup file','error'); return; }
    if(!payload.db || !validateDatabase(payload.db)){ toast('Backup file failed validation','error'); return; }
    const counts = { Accounts: payload.db.accounts.length, Trades: payload.db.trades.length, Reviews: payload.db.dailyReviews.length+payload.db.weeklyReviews.length+payload.db.monthlyReviews.length, Playbooks: payload.db.playbooks.length };
    Modal.open({
      title:'Import Backup', bodyHTML: `
        <p class="muted" style="font-size:13px;">Preview of this backup:</p>
        <div class="card" style="background:var(--surface-2);"><div class="grid" style="grid-template-columns:repeat(4,1fr);text-align:center;">
          ${Object.entries(counts).map(([k,v])=>`<div><div class="faint" style="font-size:10px;">${k.toUpperCase()}</div><div class="mono" style="font-size:16px;">${v}</div></div>`).join('')}
        </div></div>
        <p class="hint" style="margin-top:14px;">Choose how to apply this backup. This cannot be undone — export your current data first if unsure.</p>
      `,
      footerHTML: `<button class="btn" data-close>Cancel</button><button class="btn" id="imp-merge">Merge</button><button class="btn btn-primary" id="imp-replace">Replace</button>`,
      onMount:(overlay, close)=>{
        overlay.querySelector('#imp-merge').onclick = async ()=>{ await applyImport(payload, 'merge'); close(); };
        overlay.querySelector('#imp-replace').onclick = ()=>{
          Modal.confirm({ title:'Replace all data?', message:'Your current database will be fully overwritten.', danger:true, confirmLabel:'Replace', onConfirm: async ()=>{ await applyImport(payload,'replace'); close(); } });
        };
      }
    });
  };
  reader.readAsText(file);
}
async function importMediaItem(id, dataURL, meta){
  // Same as IDB.put, but reports cloud-upload success/failure instead of
  // swallowing it into a toast — a full backup import needs to know whether
  // every screenshot actually made it to Supabase Storage before it can claim
  // the import is cloud-persisted.
  try{ await IDB._cachePut(id, dataURL, meta); }catch(e){ console.error('ASCEND media cache error', e); }
  if(!CURRENT_USER_ID) return true;
  try{
    const blob = dataURLtoBlob(dataURL);
    const { error } = await sb.storage.from('media').upload(`${CURRENT_USER_ID}/${id}`, blob, { upsert:true, contentType: blob.type||'image/png' });
    if(error) throw error;
    return true;
  }catch(e){
    console.error('ASCEND media import upload error', e);
    return false;
  }
}
async function applyImport(payload, mode){
  const incoming = migrateDatabase(payload.db);
  const migReport = incoming._lastMigrationReport || { repaired:0, unresolved:[], accountsCount:(incoming.accounts||[]).length, tradesCount:(incoming.trades||[]).length };
  delete incoming._lastMigrationReport;
  console.log(`ASCEND import: backup contains ${migReport.accountsCount} account(s), ${migReport.tradesCount} trade(s) — ${migReport.repaired} link(s) repaired, ${migReport.unresolved.length} unresolved.`);
  if(mode==='replace'){
    State.db = incoming;
  } else {
    const db = State.db;
    const keys = ['accounts','trades','premarket','dailyReviews','weeklyReviews','monthlyReviews','playbooks','notes'];
    keys.forEach(k=>{
      const existingIds = new Set(db[k].map(x=>x.id));
      incoming[k].forEach(rec=>{ if(!existingIds.has(rec.id)) db[k].push(rec); else { const idx = db[k].findIndex(x=>x.id===rec.id); db[k][idx] = rec; } });
    });
  }
  // Apply locally right away so the UI reflects the import while cloud
  // persistence runs — the local cache write never depends on cloud success.
  DB.persist(State.db);

  let mediaFailed = false;
  if(payload.media && payload.media.length){
    for(const m of payload.media){
      const ok = await importMediaItem(m.id, m.dataURL, m.meta);
      if(!ok) mediaFailed = true;
    }
  }

  const unresolvedCount = migReport.unresolved.length;
  const restoredLabel = mode==='replace' ? 'Backup restored' : 'Backup merged';

  if(!CURRENT_USER_ID){
    // No authenticated user (shouldn't normally happen behind the auth gate,
    // but keep the app usable if it ever does): local-only, old behavior.
    State.saveNow();
    if(unresolvedCount>0){
      toast(`${restoredLabel} — ${unresolvedCount} trade(s) couldn't be linked to an account and need manual reselection`, 'error');
      console.warn('ASCEND import: unresolved trade(s) needing manual account reselection:', migReport.unresolved);
    } else {
      toast(restoredLabel,'success');
    }
    location.hash='#/dashboard'; router();
    return;
  }

  // Full-backup import is cloud-first: push the complete resulting state with
  // CloudDB.pushFullState (NOT the normal diff-based CloudSync.push used by
  // State.saveNow), and only report success once Supabase has actually
  // persisted it. Otherwise a refresh reloads the old/partial cloud state and
  // the "imported" data quietly disappears — this is the bug being fixed.
  CloudSync.setStatus('saving');
  try{
    if(mode==='replace') await CloudDB.wipeAll(CURRENT_USER_ID); // explicit Replace only — safe to fully overwrite
    await CloudDB.pushFullState(CURRENT_USER_ID, State.db); // accounts before trades, handled inside; unresolved trades are pushed with account_id=null rather than an invalid FK
    CloudSync.setBaseline(State.db); // next normal save won't re-push everything
    CloudSync.setStatus('synced');
    if(unresolvedCount>0){
      console.warn('ASCEND import: unresolved trade(s) needing manual account reselection:', migReport.unresolved);
      toast(`${restoredLabel} — ${unresolvedCount} trade(s) couldn't be linked to an account and need manual reselection${mediaFailed?' (some screenshots also failed to sync)':''}`, 'error');
    } else if(mediaFailed){
      toast('Backup restored, but some screenshots failed to sync to the cloud — they remain saved on this device', 'error');
    } else {
      toast(restoredLabel,'success');
    }
  }catch(e){
    console.error('ASCEND import cloud persistence error', e);
    CloudSync.setStatus('error');
    toast('Cloud import failed — your local data is preserved', 'error');
  }
  location.hash='#/dashboard'; router();
}

      ]},
      { label:'System', items:[
        { label:'Settings', icon:'gear', action:()=>location.hash='#/settings' },
      ]},
    ];
  },
  flat(){ return this.groups().flatMap(g=>g.items.map(i=>({...i, group:g.label}))); },
  selIdx:0,
  open(){
    const overlay = document.getElementById('command-overlay');
    overlay.classList.add('show');
    const input = document.getElementById('cmd-search');
    input.value=''; input.focus();
    this.selIdx = 0;
    this.render('');
    input.oninput = ()=>{ this.selIdx = 0; this.render(input.value); };
  },
  close(){ document.getElementById('command-overlay').classList.remove('show'); },
  currentFiltered(query){
    const q = (query||'').toLowerCase();
    return this.flat().filter(i=> i.label.toLowerCase().includes(q));
  },
  render(query){
    const list = document.getElementById('cmd-list');
    const filtered = this.currentFiltered(query);
    if(!filtered.length){ list.innerHTML = `<div class="cmd-empty">No matches</div>`; return; }
    let flatIdx = 0;
    const byGroup = {};
    filtered.forEach(i=>{ (byGroup[i.group] = byGroup[i.group]||[]).push(i); });
    list.innerHTML = Object.keys(byGroup).map(g=>`
      <div class="cmd-group">
        <div class="cmd-group-label">${esc(g)}</div>
        ${byGroup[g].map(i=>{
          const idx = flatIdx++;
          return `<div class="cmd-item ${idx===this.selIdx?'sel':''}" data-idx="${idx}">${icon(i.icon,15)}<span>${esc(i.label)}</span>${i.key?`<span class="k">${i.key}</span>`:''}</div>`;
        }).join('')}
      </div>`).join('');
    list.querySelectorAll('.cmd-item').forEach(el=> el.onclick = ()=>{ this.close(); filtered[Number(el.dataset.idx)].action(); });
    const sel = list.querySelector('.cmd-item.sel');
    if(sel) sel.scrollIntoView({ block:'nearest' });
  },
  move(delta){
    const input = document.getElementById('cmd-search');
    const filtered = this.currentFiltered(input.value);
    if(!filtered.length) return;
    this.selIdx = (this.selIdx + delta + filtered.length) % filtered.length;
    this.render(input.value);
  },
  selectCurrent(){
    const input = document.getElementById('cmd-search');
    const filtered = this.currentFiltered(input.value);
    const item = filtered[this.selIdx];
    if(item){ this.close(); item.action(); }
  }
};

  const isMac = navigator.platform.toUpperCase().includes('MAC');
  if((isMac ? e.metaKey : e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); CommandMenu.open(); return; }
  const cmdOpen = document.getElementById('command-overlay').classList.contains('show');
  if(cmdOpen){
    if(e.key==='Escape'){ CommandMenu.close(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); CommandMenu.move(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); CommandMenu.move(-1); return; }
    if(e.key==='Enter'){ e.preventDefault(); CommandMenu.selectCurrent(); return; }
    return;
  }
  const tag = document.activeElement.tagName;
  const typing = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(typing || Modal.stack.length) return;
  if(e.key==='/'){ e.preventDefault(); CommandMenu.open(); }
  else if(e.key.toLowerCase()==='n'){ Forms.trade(); }
  else if(e.key.toLowerCase()==='p'){ Forms.premarket(); }
  else if(e.key.toLowerCase()==='d'){ location.hash='#/dashboard'; }
});

const Sidebar = {
  mq: window.matchMedia('(max-width: 980px)'),
  isMobile(){ return this.mq.matches; },
  open(){
    const sb = document.getElementById('sidebar');
    const sc = document.getElementById('sidebar-scrim');
    const btn = document.getElementById('menu-toggle');
    sb.classList.add('open');
    sb.classList.remove('is-locked');
    sc.classList.add('show');
    sc.setAttribute('aria-hidden','false');
    btn && btn.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
  },
  close(){
    const sb = document.getElementById('sidebar');
    const sc = document.getElementById('sidebar-scrim');
    const btn = document.getElementById('menu-toggle');
    sb.classList.remove('open');
    sc.classList.remove('show');
    sc.setAttribute('aria-hidden','true');
    btn && btn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  },
  toggle(){ this.isOpen() ? this.close() : this.open(); },
  isOpen(){ return document.getElementById('sidebar').classList.contains('open'); },
  attachResize(){
    const handler = (e)=>{
      const sb = document.getElementById('sidebar');
      const sc = document.getElementById('sidebar-scrim');
      if(!e.matches){
        // resized back to desktop — drop mobile open state, restore #main margin
        sb.classList.remove('open');
        sb.classList.add('is-locked');
        sc.classList.remove('show');
        document.body.style.overflow = '';
      } else {
        sb.classList.remove('is-locked');
        if(this.isOpen()){
          sc.classList.add('show');
          document.body.style.overflow = 'hidden';
        }
      }
    };
    if(this.mq.addEventListener) this.mq.addEventListener('change', handler);
    else this.mq.addListener(handler);
    // initial pass so the sidebar is "locked visible" on desktop before user resizes
    handler(this.mq);
    // scrim click closes
    document.getElementById('sidebar-scrim').addEventListener('click', ()=> this.close());
    // escape closes when open in mobile
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && this.isMobile() && this.isOpen()) this.close();
    });
  },
};

// initialise sidebar state (after DOM and after this object's definition)
Sidebar.close();
Sidebar.attachResize();
