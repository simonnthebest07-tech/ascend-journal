// ===================== CALCULATION ENGINE =====================
const Calc = {
  pnl(t){ const position=calculatePositionManagement(t); if(position.completeExitEconomics && !position.overClosed) return position.realizedNetPnl; const raw=t&&t.netPnl, net=Number(raw); return raw!=='' && raw!==null && raw!==undefined && Number.isFinite(net) ? net : (Number(t&&t.pnl)||0); },
  rMultiple(t){
    const position=calculatePositionManagement(t);
    if(position.completeExitEconomics && !position.overClosed && position.plannedRisk>0) return position.realizedNetPnl/position.plannedRisk;
    if(t.rMultiple !== undefined && t.rMultiple !== null && t.rMultiple !== '') return Number(t.rMultiple);
    const risk = position.plannedRisk>0 ? position.plannedRisk : Number(t.riskAmount);
    if(risk){ return Calc.pnl(t)/risk; }
    return 0;
  },
  plannedRR(t){
    const entry=Number(t.entryPrice), sl=Number(t.stopLoss), tp=Number(t.takeProfit);
    if(!entry||!sl||!tp) return null;
    const risk = Math.abs(entry-sl); if(!risk) return null;
    const reward = Math.abs(tp-entry);
    return reward/risk;
  },
  // Derives Win/Loss/Breakeven from P&L when a number has been entered — used to
  // suggest (not force) the Result field so the user isn't asked to state the
  // obvious twice.
  resultFromPnl(t){
    const canonical=Calc.pnl(t);
    if(t.pnl===''&&t.netPnl==='' || t.pnl===null&&t.netPnl==null || t.pnl===undefined&&t.netPnl===undefined || !Number.isFinite(canonical)) return null;
    const v = canonical;
    if(v>0) return 'Win';
    if(v<0) return 'Loss';
    return 'Breakeven';
  },
  // Risk as a % of account equity at the time of the trade. Only returned when both
  // a risk amount and a resolvable account balance exist — never guessed.
  riskPercent(t, accounts){
    const risk = Number(t.riskAmount);
    if(!risk) return null;
    const acc = (accounts||[]).find(a=>idEq(a.id, t.accountId));
    const base = acc ? Number(acc.currentBalance||acc.accountSize) : null;
    if(!base) return null;
    return (risk/base)*100;
  },
  // Trade duration in minutes — only when both an entry and exit time are present.
  durationMinutes(t){
    if(!t.date || !t.timeEntered || !t.timeExited) return null;
    const start = new Date(`${t.date}T${t.timeEntered}:00`);
    let end = new Date(`${t.date}T${t.timeExited}:00`);
    if(end < start) end = new Date(end.getTime() + 24*60*60*1000); // crossed midnight
    const mins = Math.round((end-start)/60000);
    return mins>=0 ? mins : null;
  },
  fmtDuration(mins){
    if(mins==null) return '—';
    if(mins < 60) return mins+'m';
    const h = Math.floor(mins/60), m = mins%60;
    return h+'h'+(m? ' '+m+'m' : '');
  },
  winRate(trades){
    const closed = trades.filter(t=>t.result==='Win'||t.result==='Loss');
    if(!closed.length) return 0;
    const wins = closed.filter(t=>t.result==='Win').length;
    return (wins/closed.length)*100;
  },
  dailyWinRate(trades){
    const byDay = groupBy(trades, t=>t.date);
    const days = Object.values(byDay);
    if(!days.length) return 0;
    const winDays = days.filter(d=> sumPnl(d) > 0 ).length;
    return (winDays/days.length)*100;
  },
  profitFactor(trades){
    let gp=0, gl=0;
    trades.forEach(t=>{ const p=Calc.pnl(t); if(p>0) gp+=p; else gl+=Math.abs(p); });
    if(gl===0) return gp>0 ? Infinity : 0;
    return gp/gl;
  },
  expectancy(trades){
    const closed = trades.filter(t=>t.result==='Win'||t.result==='Loss');
    if(!closed.length) return 0;
    const rs = closed.map(t=>Calc.rMultiple(t));
    return rs.reduce((a,b)=>a+b,0)/rs.length;
  },
  avgWin(trades){ const w = trades.filter(t=>t.result==='Win').map(t=>Calc.pnl(t)); return w.length? w.reduce((a,b)=>a+b,0)/w.length : 0; },
  avgLoss(trades){ const l = trades.filter(t=>t.result==='Loss').map(t=>Calc.pnl(t)); return l.length? l.reduce((a,b)=>a+b,0)/l.length : 0; },
  bestTrade(trades){ if(!trades.length) return null; return trades.reduce((a,b)=> Calc.pnl(b)>Calc.pnl(a)?b:a); },
  worstTrade(trades){ if(!trades.length) return null; return trades.reduce((a,b)=> Calc.pnl(b)<Calc.pnl(a)?b:a); },
  streak(trades){
    const sorted = [...trades].filter(t=>t.result==='Win'||t.result==='Loss').sort((a,b)=> (a.date+a.timeEntered).localeCompare(b.date+b.timeEntered));
    if(!sorted.length) return {count:0,type:'none'};
    let type = sorted[sorted.length-1].result; let count=0;
    for(let i=sorted.length-1;i>=0;i--){ if(sorted[i].result===type) count++; else break; }
    return { count, type: type==='Win'?'win':'loss' };
  },
  equityCurve(trades, startingBalance){
    const sorted = [...trades].sort((a,b)=> (a.date+(a.timeEntered||'')).localeCompare(b.date+(b.timeEntered||'')));
    let bal = startingBalance||0; const pts=[];
    sorted.forEach(t=>{ bal += Calc.pnl(t); pts.push({ date:t.date, balance:bal, pnl:Calc.pnl(t), id:t.id }); });
    return pts;
  },
  maxDrawdown(points){
    let peak = -Infinity, maxDD=0;
    points.forEach(p=>{ peak = Math.max(peak, p.balance); const dd = peak - p.balance; maxDD = Math.max(maxDD, dd); });
    return maxDD;
  },
  accountProgress(acc, trades){
    const accTrades = trades.filter(t=>idEq(t.accountId, acc.id));
    const pnlTotal = accTrades.reduce((s,t)=>s+Calc.pnl(t),0);
    const equity = Number(acc.currentBalance||acc.accountSize||0) + pnlTotal - (Number(acc.currentBalance? 0 : 0));
    const today = todayStr();
    const todayPnl = accTrades.filter(t=>t.date===today).reduce((s,t)=>s+Calc.pnl(t),0);
    const dailyLossUsed = todayPnl < 0 ? Math.abs(todayPnl) : 0;
    const totalLossUsed = pnlTotal < 0 ? Math.abs(pnlTotal) : 0;
    const target = Number(acc.profitTarget)||0;
    const targetProgress = target ? clamp((pnlTotal/target)*100,-999,999) : 0;
    let status = 'SAFE';
    if(acc.maxDailyLoss && dailyLossUsed >= Number(acc.maxDailyLoss)*0.85) status='WARNING';
    if(acc.maxLoss && totalLossUsed >= Number(acc.maxLoss)*0.85) status='WARNING';
    if(acc.maxDailyLoss && dailyLossUsed >= Number(acc.maxDailyLoss)) status='BREACHED';
    if(acc.maxLoss && totalLossUsed >= Number(acc.maxLoss)) status='BREACHED';
    return { equity, pnlTotal, todayPnl, dailyLossUsed, totalLossUsed, targetProgress, status, tradeCount: accTrades.length };
  },
  readinessScore(pm, weights){
    weights = weights || State.db.settings.readinessWeights;
    const parts = [];
    if(pm.mindsetNumeric!=null && pm.mindsetNumeric!=='') parts.push(['mindset', Number(pm.mindsetNumeric)/10]);
    if(pm.marketBias) parts.push(['marketClarity', 1]);
    if(pm.keyLevels) parts.push(['planClarity', 1]);
    if(pm.riskReadiness!=null && pm.riskReadiness!=='') parts.push(['riskReadiness', Number(pm.riskReadiness)/10]);
    if(pm.recovery!=null && pm.recovery!=='') parts.push(['recovery', Number(pm.recovery)/10]);
    if(!parts.length) return null;
    let wsum=0, total=0;
    parts.forEach(([k,v])=>{ const w = weights[k]!=null?weights[k]:0.2; wsum+=w; total += v*w; });
    if(!wsum) return null;
    return Math.round((total/wsum)*100)/10;
  },
  processScore(trades){
    const withRating = trades.filter(t=> t.ruleAdherence!=null && t.ruleAdherence!=='');
    if(!withRating.length) return null;
    return withRating.reduce((s,t)=>s+Number(t.ruleAdherence),0)/withRating.length;
  },
  modelPerformance(trades, playbooks){
    const map = {};
    trades.forEach(t=>{
      const key = t.playbookId || t.entryModel || 'Unassigned';
      if(!map[key]) map[key] = [];
      map[key].push(t);
    });
    return Object.entries(map).map(([key,list])=>{
      const pb = playbooks.find(p=>p.id===key);
      return {
        key, name: pb? pb.name : (key==='Unassigned'?'Unassigned':key),
        trades: list.length, winRate: Calc.winRate(list), pnl: list.reduce((s,t)=>s+Calc.pnl(t),0),
        avgR: Calc.expectancy(list), profitFactor: Calc.profitFactor(list),
        avgWin: Calc.avgWin(list), avgLoss: Calc.avgLoss(list),
        best: Calc.bestTrade(list), worst: Calc.worstTrade(list),
      };
    }).sort((a,b)=>b.trades-a.trades);
  },
  sessionPerformance(trades){
    const map = groupBy(trades, t=>t.session||'Unspecified');
    return Object.entries(map).map(([session,list])=>({ session, trades:list.length, winRate:Calc.winRate(list), pnl:list.reduce((s,t)=>s+Calc.pnl(t),0), avgR:Calc.expectancy(list) }));
  },
  psychologyCorrelation(trades, flag){
    const withFlag = trades.filter(t=> (t.behaviourFlags||[]).includes(flag));
    const withoutFlag = trades.filter(t=> !(t.behaviourFlags||[]).includes(flag));
    if(withFlag.length < 3) return null;
    return { flagWinRate: Calc.winRate(withFlag), baseWinRate: Calc.winRate(withoutFlag.length?withoutFlag:trades), count: withFlag.length };
  },
  // Full stat bundle for a single day's trades — the automatically generated
  // "Daily Performance" block a Daily Review is built from. Never asks the user
  // for anything ASCEND can already compute from db.trades.
  dailyAggregate(date, trades){
    const dt = trades.filter(t=>t.date===date);
    const closed = dt.filter(t=>t.result==='Win'||t.result==='Loss');
    const wins = dt.filter(t=>t.result==='Win').length;
    const losses = dt.filter(t=>t.result==='Loss').length;
    return {
      trades: dt, tradeCount: dt.length,
      pnl: dt.reduce((s,t)=>s+Calc.pnl(t),0),
      winRate: Calc.winRate(dt),
      netR: closed.reduce((s,t)=>s+Calc.rMultiple(t),0),
      avgR: Calc.expectancy(dt),
      best: Calc.bestTrade(dt), worst: Calc.worstTrade(dt),
      wins, losses, breakeven: dt.length-wins-losses,
    };
  },
  // Process-side signal derived from the trades themselves — no separate manual
  // entry. ruleBreaks counts trades explicitly marked as not following the plan.
  processMetrics(trades, playbooks){
    const withAdherence = trades.filter(t=> t.ruleAdherence!=null && t.ruleAdherence!=='');
    const adherenceAvg = withAdherence.length ? withAdherence.reduce((s,t)=>s+Number(t.ruleAdherence),0)/withAdherence.length : null;
    const ruleBreaks = trades.filter(t=> t.followedPlan===false).length;
    return {
      adherenceAvg, ruleBreaks,
      bySetup: Calc.modelPerformance(trades, playbooks||[]),
      bySession: Calc.sessionPerformance(trades),
    };
  },
  weeklyAggregate(weekStart, trades, premarket, dailyReviews){
    const weekEnd = weekRangeOf(weekStart).end;
    const wt = trades.filter(t=> t.date>=weekStart && t.date<=weekEnd);
    const wp = premarket.filter(p=> p.date>=weekStart && p.date<=weekEnd);
    const wd = dailyReviews.filter(d=> d.date>=weekStart && d.date<=weekEnd);
    const readiness = wp.map(p=>Calc.readinessScore(p)).filter(x=>x!=null);
    const discipline = wd.map(d=>Number(d.selfDisciplineRating)).filter(x=>!isNaN(x)&&x!==0);
    return {
      trades: wt, pnl: wt.reduce((s,t)=>s+Calc.pnl(t),0), tradeCount: wt.length,
      winRate: Calc.winRate(wt), avgR: Calc.expectancy(wt), profitFactor: Calc.profitFactor(wt),
      best: Calc.bestTrade(wt), worst: Calc.worstTrade(wt),
      avgReadiness: readiness.length? readiness.reduce((a,b)=>a+b,0)/readiness.length : null,
      avgDiscipline: discipline.length? discipline.reduce((a,b)=>a+b,0)/discipline.length : null,
    };
  },
  monthlyAggregate(monthKey, trades, weeklyReviews){
    const mt = trades.filter(t=> monthKeyOf(t.date)===monthKey);
    const byDay = groupBy(mt, t=>t.date);
    const dayEntries = Object.entries(byDay).map(([date,list])=>({date, pnl:list.reduce((s,t)=>s+Calc.pnl(t),0)}));
    const bestDay = dayEntries.length? dayEntries.reduce((a,b)=> b.pnl>a.pnl?b:a) : null;
    const worstDay = dayEntries.length? dayEntries.reduce((a,b)=> b.pnl<a.pnl?b:a) : null;
    return {
      trades: mt, pnl: mt.reduce((s,t)=>s+Calc.pnl(t),0), tradeCount: mt.length,
      winRate: Calc.winRate(mt), avgR: Calc.expectancy(mt), profitFactor: Calc.profitFactor(mt),
      expectancy: Calc.expectancy(mt), bestDay, worstDay,
      best: Calc.bestTrade(mt), worst: Calc.worstTrade(mt),
    };
  }
};
function groupBy(arr, fn){ const o={}; arr.forEach(x=>{ const k=fn(x); (o[k]=o[k]||[]).push(x); }); return o; }

// Review-to-trade relationships are transparent date-range snapshots. Current review

function reviewTradeRange(kind,value){

// ===================== REVIEW LIFECYCLE (Phase 1) =====================
// Shared across Daily/Weekly/Monthly reviews. A review is `Pending` until it has
// something to show (no trades yet), `In Progress` once the auto-generated
// performance exists but the required reflection fields are still empty, and
// `Complete` only once every required reflection field has been written.
const REVIEW_STATUSES = ['Pending','In Progress','Complete'];
function reviewReflectionComplete(obj, requiredFields){
  return requiredFields.every(k => obj[k] && String(obj[k]).trim().length>0);
}
function computeReviewStatus(obj, tradeCount, requiredFields){
  if(!tradeCount) return 'Pending';
  return reviewReflectionComplete(obj, requiredFields) ? 'Complete' : 'In Progress';
}
const DAILY_REVIEW_REQUIRED = ['whatWorked','whatDidntWork','biggestMistake','mainLesson','focusTomorrow'];
const WEEKLY_REVIEW_REQUIRED = ['whatWorked','whatDidntWork','focusNextWeek'];
const MONTHLY_REVIEW_REQUIRED = ['whatWorked','whatDidntWork','mainLesson','focusNextMonth'];
function statusBadgeClass(status){
  return status==='Complete' ? 'b-pos' : status==='In Progress' ? 'b-progress' : 'b-pending';
}

}
function renderWorkspaceContext(){
  const meta=workspaceContextMeta(); const context=document.getElementById('workspace-context');
  if(context){ context.setAttribute('aria-label',`${meta.label}. ${meta.description}`); context.dataset.mode=meta.mode; const label=context.querySelector('#workspace-context-label'), copy=context.querySelector('#workspace-context-copy'); if(label) label.textContent=meta.label; if(copy) copy.textContent=meta.description; }

  document.documentElement.dataset.workspaceLabel=meta.label;
  return meta;
}
function modalFocusableElements(modal){
  return [...modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.hidden && el.getClientRects().length>0);
}
const Modal = {
  stack: [],
  open({ title, bodyHTML, footerHTML, size, tabs, onMount, className }){
    const opener = document.activeElement && typeof document.activeElement.focus==='function' ? document.activeElement : null;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const modal = document.createElement('div');
    const titleId = `modal-title-${Date.now()}-${Modal.stack.length}`;
    modal.className = 'modal' + (size==='lg' ? ' modal-lg':'') + (className? ' '+className : '');
    modal.setAttribute('role','dialog');
    modal.setAttribute('aria-modal','true');
    modal.setAttribute('aria-labelledby',titleId);
    let tabsHTML = '';
    if(tabs && tabs.length){
      tabsHTML = `<div class="modal-tabs" role="tablist" aria-label="${esc(title)} sections">` + tabs.map((t,i)=>`<button type="button" class="modal-tab ${i===0?'active':''}" role="tab" aria-selected="${i===0?'true':'false'}" data-tabidx="${i}">${esc(t.label)}</button>`).join('') + `</div>`;
    }
    modal.innerHTML = `
      <div class="modal-header"><div class="modal-title-wrap"><h3 id="${titleId}" tabindex="-1">${esc(title)}</h3><div class="modal-workspace-context" data-testid="modal-workspace-context">${esc(workspaceContextMeta().shortLabel)}</div></div><button class="btn btn-icon btn-ghost" data-close aria-label="Close dialog" title="Close dialog">✕</button></div>
      ${tabsHTML}
      <div class="modal-body">${bodyHTML||''}</div>
      ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
    `;
    overlay.appendChild(modal);
    document.getElementById('modal-root').appendChild(overlay);
    requestAnimationFrame(()=>overlay.classList.add('show'));
    const close = ()=>{
      if(!overlay.isConnected) return;
      overlay.classList.remove('show');
      const index=Modal.stack.findIndex(entry=>entry.overlay===overlay);
      if(index>=0) Modal.stack.splice(index,1);
      setTimeout(()=>{
        overlay.remove();
        if(opener && opener.isConnected) opener.focus();
      }, 180);
    };
    overlay.querySelectorAll('[data-close]').forEach(btn=>{ btn.onclick = close; });
    overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });
    overlay.addEventListener('keydown', (e)=>{
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); return; }
      if(e.key!=='Tab') return;
      const focusable=modalFocusableElements(modal);
      if(!focusable.length){ e.preventDefault(); modal.querySelector('h3')?.focus(); return; }
      const first=focusable[0], last=focusable[focusable.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    });
    if(tabs && tabs.length){
      overlay.querySelectorAll('.modal-tab').forEach(tabEl=>{
        tabEl.onclick = ()=>{
          overlay.querySelectorAll('.modal-tab').forEach(x=>{ x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
          overlay.querySelectorAll('.modal-tabpanel').forEach(x=>x.classList.remove('active'));
          tabEl.classList.add('active');
          tabEl.setAttribute('aria-selected','true');
          const idx = tabEl.dataset.tabidx;
          overlay.querySelectorAll('.modal-tabpanel').forEach(panel=>{
            const groups=String(panel.dataset.tabpanel||'').split(',').map(value=>value.trim());
            if(groups.includes(String(idx))) panel.classList.add('active');
          });
        };
      });
    }
    Modal.stack.push({overlay, close});
    if(onMount) onMount(overlay, close);
    requestAnimationFrame(()=>{
      const preferred=modal.querySelector('[data-autofocus]');
      const focusable=modalFocusableElements(modal);
      (preferred || focusable[0] || modal.querySelector('h3'))?.focus();
    });
    return { overlay, close };
  },
  closeTop(){ const top = Modal.stack[Modal.stack.length-1]; if(top) top.close(); },
  confirm({ title, message, confirmLabel, danger, onConfirm }){
    Modal.open({
      title: title||'Are you sure?',
      bodyHTML: `<p class="muted">${esc(message||'')}</p>`,
      footerHTML: `<button class="btn" data-close>Cancel</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirm-yes">${esc(confirmLabel||'Confirm')}</button>`,
      onMount:(overlay, close)=>{
        overlay.querySelector('#confirm-yes').onclick = ()=>{ close(); onConfirm && onConfirm(); };
      }
    });
  }
};

function bindInteractiveTableRows(container, onActivate){
  if(!container || typeof onActivate!=='function') return;
  container.querySelectorAll('tbody tr[data-id]').forEach(row=>{
    row.setAttribute('role','button');
    row.tabIndex=0;
    const activate=()=>onActivate(row.dataset.id);
    row.onclick=activate;
    row.onkeydown=(event)=>{
      if(event.key==='Enter' || event.key===' '){ event.preventDefault(); activate(); }
    };
  });
}

// ===================== SVG CHARTS =====================
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const Charts = {
  equityCurve(container, points, opts){
    opts = opts||{};
    container.innerHTML = '';
    const w = container.clientWidth || 600, h = opts.height || 220;
    if(!points.length){ container.innerHTML = `<div class="empty-state" style="padding:30px;"><p>No equity data for this range yet.</p></div>`; return; }
    const svg = svgEl('svg', { viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, preserveAspectRatio:'none' });
    const pad = 8;
    const vals = points.map(p=>p.balance);
    const min = Math.min(...vals, points[0].balance), max = Math.max(...vals, points[0].balance);
    const range = (max-min) || 1;
    const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
    const x = (i)=> pad + i*stepX;
    const y = (v)=> h - pad - ((v-min)/range)*(h-pad*2);
    let path = '', area = '';
    points.forEach((p,i)=>{ const cmd = i===0?'M':'L'; path += `${cmd}${x(i).toFixed(1)},${y(p.balance).toFixed(1)} `; });
    area = `M${x(0).toFixed(1)},${h-pad} ` + path.replace('M','L') + ` L${x(points.length-1).toFixed(1)},${h-pad} Z`;
    const positive = points[points.length-1].balance >= points[0].balance;
    const color = positive ? 'var(--positive)' : 'var(--negative)';
    const gradId = 'grad_'+Math.random().toString(36).slice(2,8);
    const defs = svgEl('defs',{});
    const fillColor = positive ? cssVar('--positive') : cssVar('--negative');
    defs.innerHTML = `<linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${fillColor}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${fillColor}" stop-opacity="0"/></linearGradient>`;
    svg.appendChild(defs);
    svg.appendChild(svgEl('path', { d:area, fill:`url(#${gradId})`, stroke:'none' }));
    const filterId = 'glow_'+gradId;
    defs.innerHTML += `<filter id="${filterId}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
    svg.appendChild(svgEl('path', { d:path.trim(), fill:'none', stroke:color, 'stroke-width':1.8, 'stroke-linejoin':'round', 'stroke-linecap':'round', filter:`url(#${filterId})` }));
    // hover dots layer
    const hoverLine = svgEl('line', {x1:0,y1:0,x2:0,y2:h, stroke:'var(--border)', 'stroke-width':1, opacity:0});
    svg.appendChild(hoverLine);
    container.appendChild(svg);
    const tip = document.createElement('div');
    tip.style.cssText = 'position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:11px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;';
    container.style.position='relative';
    container.appendChild(tip);
    svg.addEventListener('mousemove', (e)=>{
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX-rect.left)/rect.width*w;
      let idx = Math.round((mx-pad)/(stepX||1));
      idx = clamp(idx,0,points.length-1);
      const p = points[idx];
      hoverLine.setAttribute('x1', x(idx)); hoverLine.setAttribute('x2', x(idx)); hoverLine.setAttribute('opacity',1);
      tip.style.left = Math.min(Math.max(0,(x(idx)/w*rect.width)-60),rect.width-130)+'px';
      tip.style.top = '0px';
      tip.style.opacity = 1;
      tip.innerHTML = `<b>${fmtDateShort(p.date)}</b><br><span class="${p.pnl>=0?'pos':'neg'}">${fmtMoney(p.pnl)}</span> · Bal ${fmtMoney(p.balance)}`;
    });
    svg.addEventListener('mouseleave', ()=>{ hoverLine.setAttribute('opacity',0); tip.style.opacity=0; });
  },
  donut(container, data, opts){
    opts = opts||{};
    container.innerHTML='';
    const size = opts.size||120, stroke = opts.stroke||14, r=(size-stroke)/2, c=2*Math.PI*r;
    const total = data.reduce((s,d)=>s+d.value,0);
    const svg = svgEl('svg',{viewBox:`0 0 ${size} ${size}`, width:size, height:size});
    let offset=0;
    if(total===0){
      svg.appendChild(svgEl('circle',{cx:size/2,cy:size/2,r, fill:'none', stroke:'var(--surface-3)', 'stroke-width':stroke}));
    } else {
      data.forEach(d=>{
        const frac = d.value/total; const len = frac*c;
        const circ = svgEl('circle',{cx:size/2,cy:size/2,r, fill:'none', stroke:d.color, 'stroke-width':stroke,
          'stroke-dasharray':`${len} ${c-len}`, 'stroke-dashoffset':-offset, transform:`rotate(-90 ${size/2} ${size/2})`, 'stroke-linecap':'butt'});
        svg.appendChild(circ);
        offset += len;
      });
    }
    container.appendChild(svg);
  },
  bars(container, data, opts){
    opts=opts||{};
    container.innerHTML='';
    const w = container.clientWidth||400, h = opts.height||140, pad=20;
    const svg = svgEl('svg',{viewBox:`0 0 ${w} ${h}`, width:'100%', height:h});
    if(!data.length){ container.innerHTML = '<div class="empty-state" style="padding:20px;"><p>Not enough data yet.</p></div>'; return; }
    const max = Math.max(...data.map(d=>Math.abs(d.value)),1);
    const bw = (w-pad*2)/data.length;
    const zeroY = h/2;
    data.forEach((d,i)=>{
      const bh = (Math.abs(d.value)/max)*(h/2-14);
      const x = pad + i*bw + bw*0.18;
      const bwidth = bw*0.64;
      const y = d.value>=0 ? zeroY-bh : zeroY;
      svg.appendChild(svgEl('rect',{x,y,width:bwidth,height:Math.max(bh,1.5), rx:3, fill: d.value>=0?'var(--positive)':'var(--negative)', opacity:0.85}));
      const label = svgEl('text',{x:x+bwidth/2, y:h-4, 'text-anchor':'middle', fill:'var(--text-faint)', 'font-size':'9'});
      label.textContent = d.label; svg.appendChild(label);
    });
    svg.appendChild(svgEl('line',{x1:pad,x2:w-pad,y1:zeroY,y2:zeroY, stroke:'var(--border)', 'stroke-width':1}));
    container.appendChild(svg);
  },
  heatmap(container, year, month, dayDataMap, onDayClick){
    container.innerHTML='';
    const first = new Date(year, month, 1);
    const startDow = (first.getDay()+6)%7; // Monday start
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:6px;';
    ['M','T','W','T','F','S','S'].forEach(d=>{
      const lbl = document.createElement('div'); lbl.textContent=d; lbl.style.cssText='font-size:10px;color:var(--text-faint);text-align:center;font-weight:700;'; grid.appendChild(lbl);
    });
    for(let i=0;i<startDow;i++){ const sp=document.createElement('div'); grid.appendChild(sp); }
    let maxAbs = 1;
    Object.values(dayDataMap).forEach(d=>{ maxAbs = Math.max(maxAbs, Math.abs(d.pnl||0)); });
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const info = dayDataMap[dateStr];
      const cell = document.createElement('div');
      cell.className='day-cell';
      let bg = 'var(--surface-2)', txt='var(--text-faint)';
      if(info && info.pnl!==0){
        const intensity = clamp(Math.abs(info.pnl)/maxAbs, 0.18, 1);
        // Pull RGB triplets from theme tokens so heatmap tracks dark/light tonal
        // variants. Falls back to profit/loss defaults if tokens are unavailable.
        const posRgb = cssVar('--positive-rgb') || '114,214,173';
        const negRgb = cssVar('--negative-rgb') || '255,102,120';
        const alpha = (intensity*0.55+0.1).toFixed(3);
        bg = info.pnl>0 ? `rgba(${posRgb},${alpha})` : `rgba(${negRgb},${alpha})`;
        txt = '#fff';
      } else if(info){ bg='var(--surface-3)'; }
      cell.style.background = bg; cell.style.color = txt;
      if(info && info.trades){
        const pnlStr = (info.pnl>0?'+':'') + fmtMoney(info.pnl);
        cell.innerHTML = `<div class="day-cell-day">${d}</div><div class="day-cell-pnl mono">${pnlStr}</div>`;
      } else {
        cell.textContent = d;
      }
      cell.title = info ? `${dateStr}: ${fmtMoney(info.pnl)} · ${info.trades} trades` : dateStr;
      cell.onclick = ()=> onDayClick && onDayClick(dateStr);
      grid.appendChild(cell);
    }
    container.appendChild(grid);
  }
};

// Small contextual counts shown in collapsed-rail tooltips. Reads live state only — never invents data.
function navTooltipText(it){
  const db = State.db; if(!db) return it.label;
  let sub = '';
  switch(it.r){
    case '#/trades': sub = getCurrentModeTrades().length + (State.appMode===APP_MODES.BACKTEST ? ' backtests' : ' records'); break;
    case '#/accounts': sub = getAccountsForMode(db,State.appMode).length + (State.appMode===APP_MODES.BACKTEST ? ' backtest accounts' : ' live accounts'); break;
    case '#/inbox': { const count=getUnresolvedDataItemsForMode(db,State.appMode).length; sub = count + ' action item' + (count===1?'':'s'); break; }
    case '#/research': sub = getBacktestResearchStudies(db).length + ' study' + (getBacktestResearchStudies(db).length===1?'':'ies'); break;
    case '#/playbook': sub = (db.playbooks||[]).length + ' models'; break;
    case '#/notes': sub = (db.notes||[]).length + ' notes'; break;
    case '#/premarket': sub = (db.premarket||[]).length + ' sessions'; break;
    case '#/daily-review': sub = (db.dailyReviews||[]).length + ' logged'; break;
    case '#/weekly-review': sub = (db.weeklyReviews||[]).length + ' logged'; break;
    case '#/monthly-review': sub = (db.monthlyReviews||[]).length + ' logged'; break;
  }
  return sub ? `${it.label}\n${sub}` : it.label;
}

// Lightweight popover reused by every nav-group "+" — always calls existing Forms.* actions, never a parallel workflow.
const QuickCreate = {
  el:null,
  open(anchor, items){
    this.close();
    const pop = document.createElement('div');
    pop.className = 'quick-create-pop';
    pop.innerHTML = items.map((it,i)=>`<div class="cmd-item" data-qi="${i}">${icon(it.icon,15)}<span>${esc(it.label)}</span></div>`).join('');
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.round(r.left) + 'px';
    pop.style.top = Math.round(r.bottom + 6) + 'px';
    requestAnimationFrame(()=> pop.classList.add('show'));
    pop.querySelectorAll('[data-qi]').forEach(elm=> elm.onclick = (e)=>{ e.stopPropagation(); this.close(); items[Number(elm.dataset.qi)].action(); });
    this.el = pop;
    setTimeout(()=> document.addEventListener('click', this._onDocClick = ()=>this.close(), { once:true }), 0);
  },
  close(){ if(this.el){ this.el.remove(); this.el=null; } if(this._onDocClick){ document.removeEventListener('click', this._onDocClick); this._onDocClick=null; } }
};

function focusRenderedPage(){
  // Route changes replace the main region. Moving focus to its programmatic target
  // gives keyboard and screen-reader users the same clear navigation boundary.
  requestAnimationFrame(()=>pageContent()?.focus({preventScroll:true}));
}
function router(){
  if(!appEntered) return; // app not initialized yet
  let hash = location.hash || '#/dashboard';
  if(!ROUTES[hash]){
    // support sub-routes like #/day/2026-08-08
    if(hash.startsWith('#/day/')){ const d = hash.split('/')[2]; Pages.dayView(d); State.route='#/calendar'; renderNav(); updateBreadcrumb('Day View'); playPageEnter(); focusRenderedPage(); return; }
    if(hash.startsWith('#/settings/')){ const section = hash.split('/')[2]; Pages.settings(section); State.route='#/settings'; renderNav(); updateBreadcrumb('Settings'); playPageEnter(); focusRenderedPage(); return; }
    hash = '#/dashboard';
  }
  State.route = hash;
  renderNav();
  window.scrollTo(0,0);
  ROUTES[hash]();
  updateBreadcrumb(activeRouteLabel(hash));
  playPageEnter();
  focusRenderedPage();
  NotifCenter.render();
}
window.addEventListener('hashchange', router);

// ===================== NOTIFICATION CENTER (data-integrity: unlinked trades) =====================
// Never a separate data store — the badge/panel/persistence-across-reload are all
// derived live from getUnresolvedTrades(State.db) each time render()/toggle() runs,
// so the notification can never drift from the actual trade/account relationships.
const NotifCenter = {
  open: false,
  render(){
    const badge = document.getElementById('notif-badge');
    const btn = document.getElementById('notif-btn');
    if(!badge || !btn) return;
    const unresolved = getUnresolvedTrades(State.db);
    if(unresolved.length>0){
      badge.hidden = false;
      badge.textContent = unresolved.length>9 ? '9+' : String(unresolved.length);
      btn.classList.add('has-notif');
    } else {
      badge.hidden = true;
      btn.classList.remove('has-notif');
      this.close(); // nothing left to resolve — don't leave a stale open panel
    }
    if(this.open) this.renderPanel(unresolved);
  },
  renderPanel(unresolved){
    const panel = document.getElementById('notif-panel');
    if(!panel) return;
    const db = State.db;
    if(!unresolved.length){
      panel.innerHTML = `<div class="notif-empty">No action required — everything's linked.</div>`;
    } else {
      panel.innerHTML = `
        <div class="notif-panel-head">Action Required</div>
        ${unresolved.map(t=>`
          <div class="notif-item">
            <div class="notif-item-icon">${icon('wallet',14)}</div>

// Rank 26: timezone changes only the displayed clock and session context. Trade
// date/time fields remain the journal values entered by the trader; no conversion
// or historical record mutation is performed.
const DISPLAY_TIMEZONES = Object.freeze(['Europe/Rome','UTC','Europe/London','America/New_York','America/Chicago','America/Los_Angeles','Asia/Tokyo','Asia/Singapore','Australia/Sydney']);
function displayTimezone(){
  const candidate=((State.db&&State.db.settings&&State.db.settings.timezone)||'Europe/Rome');
  try{ return new Intl.DateTimeFormat('en-GB',{timeZone:candidate}).resolvedOptions().timeZone||candidate; }
  catch(e){ return 'Europe/Rome'; }
}
function romeNow(){
  const fmt = new Intl.DateTimeFormat('en-GB',{ timeZone:displayTimezone(), hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short' });
  const parts = fmt.formatToParts(new Date());
  const h = parts.find(p=>p.type==='hour').value, m = parts.find(p=>p.type==='minute').value;
  return { h:+h, m:+m, minutes:(+h)*60+(+m) };
}
function toMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function getSessionInfo(){
  const sessions = (State.db && State.db.settings.sessions) || SESSIONS_DEFAULT;
  const now = romeNow();
  let active = null, next = null, nextDelta = Infinity;
  sessions.forEach(s=>{
    const start = toMinutes(s.start), end = toMinutes(s.end);
    const inSession = start<end ? (now.minutes>=start && now.minutes<end) : (now.minutes>=start || now.minutes<end);
    if(inSession) active = s;
    let delta = start - now.minutes; if(delta<0) delta += 1440;
    if(delta < nextDelta){ nextDelta = delta; next = s; }
  });
  return { now, active, next, nextDelta };
}
function updateSessionChip(){
  const info = getSessionInfo();
  const { now, active, next, nextDelta } = info;
  const timeStr = String(now.h).padStart(2,'0')+':'+String(now.m).padStart(2,'0');
  const chip = document.getElementById('session-chip');
  if(chip){
    if(active){
      chip.innerHTML = `<span class="session-dot live"></span><span><b>${esc(active.name.toUpperCase())}</b> · LIVE</span>`;
    } else {
      const nh = Math.floor(nextDelta/60), nm = nextDelta%60;
      chip.innerHTML = `<span class="session-dot"></span><span>QUIET · next ${esc(next?next.name:'')} ${nh}h${nm}m</span>`;
    }
  }
  const card = document.getElementById('session-status-card');
  if(card){
    const nh = Math.floor(nextDelta/60), nm = nextDelta%60;
    card.querySelector('#sess-title').innerHTML = active ? `${esc(active.name)} <span class="live-tag">● LIVE</span>` : `Market Quiet`;
    card.querySelector('#sess-sub').textContent = active ? 'Current trading window is active.' : `Next session in ${nh}h ${nm}m.`;
    card.querySelector('#sess-current').textContent = timeStr;
    card.querySelector('#sess-next').textContent = next ? `${next.name} · ${next.start}` : '—';
  }
  return info;
}

function rangeToDates(rangeKey, customStart, customEnd){
  const end = new Date();
  let start = new Date();
  switch(rangeKey){
    case '7D': start.setDate(end.getDate()-7); break;
    case '30D': start.setDate(end.getDate()-30); break;
    case '90D': start.setDate(end.getDate()-90); break;
    case '6M': start.setMonth(end.getMonth()-6); break;
    case 'YTD': start = new Date(end.getFullYear(),0,1); break;
    case 'ALL': start = new Date(2000,0,1); break;
    case 'CUSTOM': return { start: customStart||'2000-01-01', end: customEnd||todayStr() };
    default: start.setDate(end.getDate()-30);
  }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}
function filterTradesByRange(trades, rangeKey, accountId){
  const { start, end } = rangeToDates(rangeKey);
  return trades.filter(t=> t.date>=start && t.date<=end && (!accountId || accountId==='all' || idEq(t.accountId, accountId)));
}

Pages.dashboard = function(){
  const db = State.db;

  const rangeKey = Pages._dashRange || '30D';

  const allAccounts = getAccountsForMode(db,State.appMode);
  const preferredId = getValidSelectedAccountId(db,State.appMode);

  const trades = filterTradesByRange(allModeTrades,rangeKey,accId);
  const startingBalance = accId==='all'
    ? allAccounts.reduce((sum,account)=>sum+Number(account.accountSize||0),0)
    : Number((allAccounts.find(account=>idEq(account.id,accId))||{}).accountSize||0);

  if(!allAccounts.length && !allModeTrades.length){

  const bestTrade = Calc.bestTrade(trades);
  const worstTrade = Calc.worstTrade(trades);
  const todayD = todayStr();
  const todayTrades = allModeTrades.filter(t=> t.date===todayD && (accId==='all' || idEq(t.accountId, accId)));
  const todayPnl = sumPnl(todayTrades);
  const todayCommandCenter=getTodayCommandCenter(db,State.appMode,accId==='all'?preferredId:accId,todayD);
  return renderMinimalDashboard(root,{db,rangeKey,allAccounts,accId,trades,pnl,winRate,avgR,totalTrades,todayCommandCenter,startingBalance,eqPoints,lastEquity,maxDD,pf,streak,todayTrades,todayPnl});

// ===================== TRADES PAGE =====================
// Rank 27: retain the entire filtered journal result for calculations while
// materialising a bounded visible page. This is deliberately client-side only:
// it never truncates exports, analytics, cloud state, or mode-owned records.
const TRADE_RENDER_PAGE_SIZE = 50;
function tradeAccountIndex(accounts){ return new Map((accounts||[]).map(account=>[String(account.id),account])); }
function tradeSearchText(trade, account){
  return [trade.date,trade.timeEntered,trade.instrument,trade.direction,trade.session,trade.entryModel,trade.result,trade.reviewStatus,trade.tradeNotes,trade.lessonLearned,account&&account.accountName,(trade.behaviourFlags||[]).join(' ')]
    .filter(value=>value!==undefined&&value!==null).join(' ').toLowerCase();
}
function tradePageWindow(items, page, pageSize=TRADE_RENDER_PAGE_SIZE){
  const totalItems=(items||[]).length, size=Math.max(1,Number(pageSize)||TRADE_RENDER_PAGE_SIZE), totalPages=Math.max(1,Math.ceil(totalItems/size));
  const current=Math.min(totalPages,Math.max(1,Number(page)||1)), start=(current-1)*size;
  return { page:current, pageSize:size, totalItems, totalPages, start, end:Math.min(totalItems,start+size), items:(items||[]).slice(start,start+size) };
}
function queryTradeCollection(trades, filters, accountById){
  const f=filters||{}, accounts=accountById||new Map(); let list=[...(trades||[])];
  if(Array.isArray(f.selectedIds)){ const selected=new Set(f.selectedIds.map(String)); list=list.filter(t=>selected.has(String(t.id))); }
  if(f.search){ const search=String(f.search).toLowerCase(); list=list.filter(t=>tradeSearchText(t,accounts.get(String(t.accountId))).includes(search)); }
  if(f.account&&f.account!=='all') list=list.filter(t=>idEq(t.accountId,f.account));
  if(f.direction&&f.direction!=='all') list=list.filter(t=>t.direction===f.direction);
  if(f.session&&f.session!=='all') list=list.filter(t=>t.session===f.session);
  if(f.result&&f.result!=='all') list=list.filter(t=>t.result===f.result);
  const [sortKey='date',sortDir='desc']=String(f.sort||'date_desc').split('_');
  list.sort((a,b)=>{
    let av,bv;
    if(sortKey==='date'){ av=(a.date||'')+(a.timeEntered||''); bv=(b.date||'')+(b.timeEntered||''); }
    else if(sortKey==='pnl'){ av=Calc.pnl(a); bv=Calc.pnl(b); }
    else { av=a[sortKey]; bv=b[sortKey]; }
    if(av<bv) return sortDir==='asc'?-1:1;
    if(av>bv) return sortDir==='asc'?1:-1;
    return 0;
  });
  return list;
}
Pages._tradeFilters = { search:'', account:'all', direction:'all', session:'all', result:'all', sort:'date_desc', view:'timeline', page:1, selectedIds:null, insightLabel:'' };
function openInsightTradeReview(insight){

}

function renderV18TradeTimeline(trades,accountById){
  const groups=groupBy(trades,trade=>trade.date||'Unknown date');
  return `<div class="asc-trade-timeline">${Object.entries(groups).map(([date,dayTrades])=>`<section class="asc-timeline-day"><div class="asc-timeline-date"><span>${esc(fmtDateShort(date))}</span><small>${dayTrades.length} execution${dayTrades.length===1?'':'s'}</small></div><div class="asc-timeline-events">${dayTrades.map(trade=>{const pnl=Calc.pnl(trade),account=accountById.get(String(trade.accountId)),review=normalizeTradeReviewStatus(trade.reviewStatus);return `<button class="asc-timeline-event trade-card" data-id="${esc(trade.id)}" data-asc-trade="${esc(trade.id)}"><span class="asc-timeline-time">${esc(trade.timeEntered||'—')}</span><span class="asc-timeline-rail ${pnl>=0?'pos':'neg'}"></span><span class="asc-timeline-identity"><b>${esc(trade.instrument||'—')}</b><small>${esc(trade.direction||'—')} · ${esc(trade.session||'Unassigned')} · ${esc(account?account.accountName:'Unlinked account')}</small></span><span class="asc-timeline-context">${esc(trade.entryModel||'No setup assigned')}<small>${review==='completed'?'REVIEWED':tradeReviewStatusLabel(review)}</small></span><strong class="mono ${pnl>=0?'pos':'neg'}">${fmtMoney(pnl)}<small>${fmtR(Calc.rMultiple(trade))}</small></strong></button>`;}).join('')}</div></section>`).join('')}</div>`;
}
function renderV18TradePerformanceStream(trades){
  const max=Math.max(...trades.map(trade=>Math.abs(Calc.pnl(trade))),1);
  return `<div class="asc-performance-stream"><div class="asc-stream-axis"><span>EXECUTION IMPACT</span><span>0</span></div><div class="asc-stream-points">${trades.map(trade=>{const pnl=Calc.pnl(trade),height=Math.max(9,Math.round(Math.abs(pnl)/max*100));return `<button class="asc-stream-point ${pnl>=0?'pos':'neg'}" data-asc-trade="${esc(trade.id)}" style="--stream-height:${height}%" aria-label="Open ${esc(trade.instrument||'trade')} on ${esc(trade.date||'unknown date')}, ${esc(fmtMoney(pnl))}"><span class="asc-stream-stem"></span><span class="asc-stream-tooltip"><b>${esc(trade.instrument||'—')}</b><em>${fmtMoney(pnl)} · ${fmtR(Calc.rMultiple(trade))}</em><small>${esc(trade.date||'')}</small></span></button>`;}).join('')}</div><div class="asc-stream-footer"><span>Each mark is one filtered record</span><span>${trades.length} records · ${fmtMoney(sumPnl(trades))}</span></div></div>`;
}
function renderTradeCard(t, db, accountById){
  const acc = accountById ? accountById.get(String(t.accountId)) : db.accounts.find(a=>idEq(a.id, t.accountId));
  const pnl = Calc.pnl(t);
  const r = Calc.rMultiple(t);
  const pnlCls = pnl>=0?'pos':'neg';
  const dirCls = t.direction==='Long'?'b-pos':'b-neg';
  const tags = [];
  if(t.entryModel) tags.push(`<span class="tag">${esc(t.entryModel)}</span>`);
  if(t.behaviourFlags && t.behaviourFlags.length) t.behaviourFlags.forEach(b=> tags.push(`<span class="tag">${esc(b)}</span>`));
  if(t.followedPlan) tags.push(`<span class="tag">Followed Plan</span>`);
  const lesson = t.tradeNotes || t.lessonLearned || '';
  const reviewStatus=normalizeTradeReviewStatus(t.reviewStatus);
  const reminderState=tradeReviewReminderState(t);
  return `
  <div class="card trade-card" data-id="${esc(t.id)}">
    ${t.htfScreenshot ? `<div class="media-preview trade-card-preview" data-media-id="${esc(t.htfScreenshot)}"></div>` : ''}
    <div class="trade-card-top">

        ];
        const missing=required.find(([value])=>value===undefined || value===null || String(value).trim()==='');
        if(missing){ toast(`${missing[1]} is required for Fast Capture`,'error'); return; }
        const selectedAccount=findAccount(db,t.accountId);

function uploadField(fieldKey, mediaId, label){
  return `<label class="field-label">${label}</label>
    <div class="upload-drop" data-upload="${fieldKey}">${mediaId? 'Screenshot attached — click to replace' : 'Click to upload screenshot'}</div>
    <img class="screenshot-thumb" id="thumb-${fieldKey}" style="display:none;margin-top:8px;max-height:140px;object-fit:cover;">
    <input type="file" accept="image/png,image/jpeg,image/webp" data-fileinput="${fieldKey}" style="display:none;">`;
}
function wireCommonFormBits(overlay, obj){
  overlay.querySelectorAll('[data-field]').forEach(el=>{
    const key = el.dataset.field;
    const evt = (el.tagName==='SELECT' || el.type==='date' || el.type==='time') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{ obj[key] = el.type==='number' ? (el.value===''? '' : Number(el.value)) : el.value; if(el.classList.contains('sl-input')){ const disp=overlay.querySelector('#sl-'+key); if(disp) disp.textContent = el.value; } });
  });
  overlay.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{ const key = el.dataset.toggle; obj[key] = !obj[key]; el.classList.toggle('on', obj[key]); };
  });
  overlay.querySelectorAll('[data-upload]').forEach(dz=>{
    const key = dz.dataset.upload;
    const input = overlay.querySelector(`[data-fileinput="${key}"]`);
    const thumb = overlay.querySelector(`#thumb-${key}`);
    if(obj[key]){ IDB.get(obj[key]).then(rec=>{ if(rec){ thumb.src = rec.dataURL; thumb.style.display='block'; } }); }
    dz.onclick = ()=> input.click();
    input.onchange = async ()=>{
      const file = input.files[0]; if(!file) return;
      const validation=validateScreenshotFile(file);
      if(!validation.ok){ input.value=''; toast(validation.message,'error'); return; }
      const reader = new FileReader();
      reader.onload = async ()=>{
        const id = obj[key] && obj[key].startsWith('media_') ? obj[key] : uid('media');
        await IDB.put(id, reader.result, { name:file.name });
        obj[key] = id;
        thumb.src = reader.result; thumb.style.display='block';
        dz.textContent = 'Screenshot attached — click to replace';
        toast('Screenshot attached','success');
      };
      reader.readAsDataURL(file);
    };
  });
}

function formatDecisionInsightValue(insight,value){ return insight.metric==='win_rate'?fmtPct(value):insight.metric==='pnl_per_trade'?fmtMoney(value):'—'; }

}
function advancedValue(value,kind){ if(value==null||!Number.isFinite(value)) return '—'; if(kind==='money') return fmtMoney(value); if(kind==='r') return fmtR(value); if(kind==='pct') return fmtPct(value); if(kind==='duration') return Calc.fmtDuration(value); return Number(value).toFixed(2); }
function renderAdvancedPerformanceAnalysis(analysis){

e aggregate starting balance was supplied.':`${advancedValue(analysis.drawdown.percent,'pct')} of explicit baseline ${advancedValue(analysis.drawdown.baseline,'money')}`,'money')}${metric('Top-win concentration',analysis.concentration.share,analysis.concentration.share==null?'Requires recorded positive canonical P&L.':`Largest positive record ${advancedValue(analysis.concentration.topPositive,'money')} · n=${analysis.concentration.eligible} positive records`,'pct')}</div></div>`;

px;"><button class="btn btn-sm btn-primary" id="mc-run">Run scenario</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">${metric('Terminal P&amp;L P10',scenario.terminal.p10,`${input.paths} paths · ${input.horizon} draws`)}${metric('Terminal P&amp;L P50',scenario.terminal.p50,'Median hypothetical terminal P&L')}${metric('Terminal P&amp;L P90',scenario.terminal.p90,'Upper hypothetical terminal P&L')}${metric('Paths ending above $0',scenario.terminal.positiveShare,`${input.paths} hypothetical paths`,'pct')}${metric('Path drawdown P50',-Math.abs(scenario.drawdown.p50),'Largest peak-to-trough P&L decline')}${metric('Path drawdown P90',-Math.abs(scenario.drawdown.p90),'Largest peak-to-trough P&L decline')}${input.drawdownThreshold!=null?metric('Threshold exceedance',scenario.drawdown.thresholdExceedanceShare,`${input.paths} paths exceeded ${fmtMoney(input.drawdownThreshold)} drawdown`,'pct'):metric('Threshold scenario','—','Enter an optional positive hypothetical P&L drawdown threshold','text')}</div></div>`;
}

function renderExecutionTable(trades){
  const rows = [
    ['Followed Plan', trades.filter(t=>t.followedPlan), trades.filter(t=>!t.followedPlan)],
    ['HTF Followed', trades.filter(t=>t.htfFollowed), trades.filter(t=>!t.htfFollowed)],
  ];
  return `<div class="table-wrap"><table><thead><tr><th>Factor</th><th>Yes — Win Rate</th><th>Yes — Avg R</th><th>No — Win Rate</th><th>No — Avg R</th></tr></thead><tbody>
    ${rows.map(([label,yes,no])=>`<tr><td>${label}</td><td>${yes.length?fmtPct(Calc.winRate(yes)):'—'}</td><td>${yes.length?fmtR(Calc.expectancy(yes)):'—'}</td><td>${no.length?fmtPct(Calc.winRate(no)):'—'}</td><td>${no.length?fmtR(Calc.expectancy(no)):'—'}</td></tr>`).join('')}

function renderPerfTable(rows){
  if(!rows.length) return `<div class="empty-state" style="padding:20px;"><p>No data yet.</p></div>`;

}
function renderAccountCompareTable(accounts, trades){
  if(!accounts.length) return `<div class="empty-state" style="padding:20px;"><p>No accounts yet.</p></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Account</th><th>Trades</th><th>Win %</th><th>P&amp;L</th><th>Status</th></tr></thead><tbody>
    ${accounts.map(a=>{ const t = trades.filter(x=>idEq(x.accountId,a.id)); const prog = Calc.accountProgress(a,trades); return `<tr><td>${esc(a.accountName)}</td><td>${t.length}<div style="margin-top:3px;">${sampleEvidenceBadge(t.length)}</div></td><td>${fmtPct(Calc.winRate(t))}</td><td class="${prog.pnlTotal>=0?'pos':'neg'}">${fmtMoney(prog.pnlTotal)}</td><td><span class="badge ${prog.status==='SAFE'?'':prog.status==='WARNING'?'b-warn':'b-neg'}">${prog.status}</span></td></tr>`; }).join('')}

Pages.psychology = function(){
  const db = State.db;
  const root = pageContent();
  const trades = getCurrentModeTrades();
  root.innerHTML = `<div class="page-header"><div class="page-eyebrow">BEHAVIORAL SIGNAL LAB <span class="mode-context">${State.appMode===APP_MODES.BACKTEST?'BACKTESTING':'LIVE TRADING'}</span></div><h1>Psychology</h1><div class="sub">Recorded associations between state, behavior, trade context, and outcome. These comparisons never establish causation.</div></div>`;
  if(trades.length < 5){
    root.innerHTML += `<div class="card"><div class="empty-state"><div class="icon-wrap">${icon('brain',22)}</div><h3>Not enough data yet</h3><p>Log at least 5 trades with psychology ratings to see correlations.</p></div></div>`;
    return;
  }
  const avgOf = (key)=>{ const v = trades.map(t=>Number(t[key])).filter(x=>!isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const traits = ['discipline','emotionalControl','patience','confidence','mindsetState'];
  root.innerHTML += `
    ${renderSampleCoverageSummary(trades, State.appMode)}
    <div class="grid kpi-row">
      ${traits.map(k=>`<div class="card kpi-card"><div class="kpi-label">${k.replace(/([A-Z])/g,' $1')}</div><div class="kpi-value">${avgOf(k)!=null?avgOf(k).toFixed(1):'—'}<span class="faint" style="font-size:12px;">/10</span></div></div>`).join('')}
    </div>
    <div class="section-header"><h2>Behavior → outcome</h2><div class="desc">Flagged occurrences compared with the current active-workspace baseline</div></div>
    <div class="card" id="flag-impact"></div>
    <div class="section-header"><h2>Discipline vs P&amp;L</h2></div>
    <div class="card"><div id="discipline-scatter" style="padding:6px;"></div></div>
  `;
  const flagWrap = root.querySelector('#flag-impact');
  const flagsUsed = [...new Set(trades.flatMap(t=>t.behaviourFlags||[]))];
  if(!flagsUsed.length){ flagWrap.innerHTML = `<div class="empty-state" style="padding:20px;"><p>No behaviour flags tagged yet.</p></div>`; }
  else {
    flagWrap.innerHTML = flagsUsed.map(f=>{
      const corr = Calc.psychologyCorrelation(trades, f);
      if(!corr) return `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border-soft);"><span>${esc(f)}</span><span class="faint" style="font-size:11px;">fewer than 3 trades tagged</span></div>`;
      const diff = corr.flagWinRate - corr.baseWinRate;
      const flagged=trades.filter(trade=>(trade.behaviourFlags||[]).includes(f));
      const flaggedAvgR=flagged.length?Calc.expectancy(flagged):null;
      return `<div class="asc-behavior-row"><div><span>BEHAVIOR FLAG</span><b>${esc(f)}</b><small>${sampleEvidenceBadge(corr.count)} · ${flagged.length} tagged occurrence${flagged.length===1?'':'s'}</small></div><div><span>RECORDED DELTA</span><b class="${diff<0?'neg':'pos'}">${diff>=0?'+':''}${diff.toFixed(0)}% win rate</b><small>${flaggedAvgR==null?'R unavailable':`${fmtR(flaggedAvgR)} average R`} · baseline ${fmtPct(corr.baseWinRate)}</small></div></div>`;
    }).join('');
  }
  // simple discipline scatter as bar buckets
  const buckets = {'0-3':[],'4-6':[],'7-8':[],'9-10':[]};
  trades.forEach(t=>{ const d = Number(t.discipline); if(isNaN(d)) return; const key = d<=3?'0-3':d<=6?'4-6':d<=8?'7-8':'9-10'; buckets[key].push(t); });
  Charts.bars(root.querySelector('#discipline-scatter'), Object.entries(buckets).map(([k,v])=>({label:k, value: sumPnl(v)})));
};

Forms.researchStudy = function(existing){
  const db=State.db;
  if(State.appMode!==APP_MODES.BACKTEST){ toast('Research Studies are available only in Backtesting','error'); return; }
  if(existing&&normalizeOwnedMode('notes',existing.mode)!==APP_MODES.BACKTEST){ toast('Open this study from Backtesting','error'); return; }
  const isEdit=!!existing;

// ===================== UPDATES (wired to electron/main.js via preload's window.ascend) =====================
// Finite state model driving the Updates settings panel. `state` is one of UPDATE_STATES.
// State transitions are driven by 'updater-event' messages pushed from the main process
// (see electron/main.js autoUpdater listeners) — checkForUpdates()/installUpdate() below
// only kick things off, they don't set the resulting state themselves.
const UPDATE_STATES = ['idle','checking','up-to-date','update-available','downloading','ready-to-install','error'];

// Release notes are remote content. Convert Markdown/HTML to small, plain-text
// sections and escape it at render time; never insert the GitHub release body as HTML.
function normalizeReleaseNotes(value){
  if(Array.isArray(value)) return value.map(item=>{
    if(typeof item === 'string') return item;
    return item && typeof item.note === 'string' ? item.note : '';
  }).filter(Boolean).join('\n\n');
  return typeof value === 'string' ? value : '';
}
function decodeReleaseEntities(value){
  const entities = { amp:'&', apos:"'", '#39':"'", quot:'\"', lt:'<', gt:'>', nbsp:' ' };
  return String(value||'').replace(/&(#39|amp|apos|quot|lt|gt|nbsp);/gi, (match,name)=>entities[String(name).toLowerCase()] || match);
}
function releaseSummaryFrom(rawNotes){
  const raw = normalizeReleaseNotes(rawNotes);
  if(!raw.trim()) return { intro:'Release notes are not available for this update.', highlights:[] };
  const marked = raw
    .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
    .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, '')
    .replace(/<h([1-6])\b[^>]*>/gi, '\n@@ASCEND_H$1@@')
    .replace(/<\/h[1-6]>/gi, '\n')
    .replace(/<li\b[^>]*>/gi, '\n- ')
    .replace(/<\/li>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|section|article|tr|table)>/gi, '\n')
    .replace(/<[^>]+>/g, ' ')
    .replace(/(^|\n)\s*(#{1,6})\s+/g, (match,prefix,hashes)=>`${prefix}@@ASCEND_H${hashes.length}@@`);
  const preamble = [];
  const sections = [];
  let current = null;
  marked.split(/\n+/).map(line=>decodeReleaseEntities(line).replace(/\s+/g,' ').trim()).forEach(line=>{
    if(!line || /^[|:\-\s]+$/.test(line)) return;
    const heading = line.match(/^@@ASCEND_H([1-6])@@\s*(.*)$/);
    if(heading){
      const level = Number(heading[1]);
      const title = heading[2].replace(/^[-*]\s*/, '').trim();
      if(!title) return;
      if(level === 1) return;
      current = { title, entries:[] };
      sections.push(current);
      return;
    }
    const clean = line.replace(/^[-*•]\s*/, '').replace(/^\d+[.)]\s*/, '').trim();
    if(!clean || /^version\s+\d+/i.test(clean)) return;
    (current ? current.entries : preamble).push(clean);
  });
  const intro = preamble.find(line=>line.length>36) || sections.flatMap(section=>section.entries).find(line=>line.length>36) || 'This update is ready to install.';
  const ignored = /^(verification|preserved behavior|upgrade note|references?)$/i;
  const highlights = sections.filter(section=>!ignored.test(section.title) && section.entries.length)
    .slice(0,3)
    .map(section=>({ title:section.title, detail:section.entries.slice(0,2).join(' ') }));
  if(!highlights.length && preamble.length){
    highlights.push({ title:'Release highlights', detail:preamble.slice(1,3).join(' ') || preamble[0] });
  }
  return { intro, highlights };
}
function updateSummaryMarkup(rawNotes){
  const summary = releaseSummaryFrom(rawNotes);
  const cards = summary.highlights.map((item,index)=>`
    <article class="asc-update-highlight">
      <span class="asc-update-highlight-index">${String(index+1).padStart(2,'0')}</span>
      <div><h4>${esc(item.title)}</h4><p>${esc(item.detail)}</p></div>
    </article>`).join('');
  return `<section class="asc-update-summary" aria-label="Release summary">
    <div class="asc-update-summary-lead">
      <div class="asc-update-eyebrow">UPDATE SUMMARY</div>
      <p>${esc(summary.intro)}</p>
    </div>
    ${cards ? `<div class="asc-update-highlights">${cards}</div>` : ''}
  </section>`;
}
const UpdateManager = {
  state: 'idle',
  currentVersion: ASCEND_APP_VERSION,
  latestVersion: null,
  releaseNotes: '',
  progress: 0,
  error: null,
  onUpdate: null, // set by the Updates panel while it's mounted; called on every state change
  _emit(){ if(typeof this.onUpdate === 'function') this.onUpdate(); },
  async checkForUpdates(){
    if(this.state === 'checking' || this.state === 'downloading') return;
    if(!window.ascend || !window.ascend.isElectron){
      // Running outside Electron (e.g. a plain browser tab) — nothing to check against.
      this.state = 'error'; this.error = 'Updates are only available in the desktop app.'; this._emit();
      return;
    }
    this.state = 'checking'; this.error = null; this._emit();
    await window.ascend.checkForUpdates();
    // Result arrives asynchronously as an 'updater-event' (checking/update-available/
    // update-not-available/error) handled by the listener registered below.
  },
  installUpdate(){
    if(this.state !== 'ready-to-install') return;
    if(!window.ascend || !window.ascend.isElectron) return;
    window.ascend.quitAndInstallUpdate();
  },
};
if(window.ascend && typeof window.ascend.onUpdaterEvent === 'function'){
  window.ascend.onUpdaterEvent((payload)=>{
    if(!payload || !payload.status) return;
    switch(payload.status){
      case 'checking':
        UpdateManager.state = 'checking'; UpdateManager.error = null;
        break;
      case 'update-available':
        UpdateManager.state = 'update-available';
        UpdateManager.latestVersion = (payload.info && payload.info.version) || null;
        UpdateManager.releaseNotes = normalizeReleaseNotes(payload.info && payload.info.releaseNotes);
        break;
      case 'update-not-available':
        UpdateManager.state = 'up-to-date'; UpdateManager.latestVersion = null; UpdateManager.releaseNotes = '';
        State.db.settings.lastUpdateCheck = nowISO(); State.saveNow();
        break;
      case 'download-progress':
        UpdateManager.state = 'downloading';
        UpdateManager.progress = Math.round((payload.progress && payload.progress.percent) || 0);
        break;
      case 'update-downloaded':
        UpdateManager.state = 'ready-to-install'; UpdateManager.progress = 100;
        State.db.settings.lastUpdateCheck = nowISO(); State.saveNow();
        break;
      case 'error':
        UpdateManager.state = 'error';
        UpdateManager.error = payload.message || 'Could not check for updates. Please try again.';
        break;
    }
    UpdateManager._emit();
  });
}

// ===================== IMPORT / EXPORT =====================
function buildUnifiedBackupDatabase(db){
  // Backups must be a portable snapshot, never a live reference to application
  // state. Copy the full database and canonicalize every trade mode so both
  // datasets remain explicit even for legacy records.
  const snapshot = JSON.parse(JSON.stringify(db));
  snapshot.accounts = canonicalizeAccountCollection(snapshot.accounts);
  snapshot.trades = canonicalizeTradeCollection(snapshot.trades);
  delete snapshot._lastMigrationReport;
  delete snapshot._lastModeMigrationReport;
  return snapshot;
}
function modeCounts(trades){
  const canonical = canonicalizeTradeCollection(trades);
  return { live: canonical.filter(t=>t.mode===APP_MODES.LIVE).length, backtest: canonical.filter(t=>t.mode===APP_MODES.BACKTEST).length };
}
async function exportBackup(){
  const db = State.db;
  const backupDb = buildUnifiedBackupDatabase(db);
  const media = await IDB.all();
  const modes = modeCounts(backupDb.trades);
  // Keep device-scoped preferences explicit in backups without mixing them into journal data.
  // `db` is a complete snapshot: it includes both Live and Backtest records
  // regardless of the active screen, route, filter, or application mode.
  const payload = { schemaVersion: ASCEND_DB_VERSION, backupType:'ascend-unified', exportedAt: nowISO(), db:backupDb, uiPreferences: State.ui, modeSummary:modes, media };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').slice(0,12);
  a.href = url; a.download = `ASCEND-backup-${todayStr()}-${stamp.slice(8)}.json`; a.click();
  URL.revokeObjectURL(url);
  db.settings.lastBackup = nowISO(); State.saveNow();
  Recovery.recordExport({ records:rank4Summary(db), mediaCount:(media||[]).length, exportedAt:nowISO() }).catch(error=>console.warn('ASCEND export audit deferred',error));
  toast('Backup exported','success');
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{

    try{ payload = JSON.parse(reader.result); }catch(e){ toast('Invalid backup file','error'); return; }
    if(!payload.db || !validateDatabase(payload.db)){ toast('Backup file failed validation','error'); return; }
    // Inspect all records in the file rather than the currently selected mode.
    const importedModes=modeCounts(payload.db.trades);

          ${Object.entries(counts).map(([k,v])=>`<div><div class="faint" style="font-size:10px;">${k.toUpperCase()}</div><div class="mono" style="font-size:16px;">${v}</div></div>`).join('')}
        </div></div>

async function importMediaItem(id, dataURL, meta){
  // Same as IDB.put, but reports cloud-upload success/failure instead of
  // swallowing it into a toast — a full backup import needs to know whether
  // every screenshot actually made it to Supabase Storage before it can claim
  // the import is cloud-persisted.
  try{ await IDB._cachePut(id, dataURL, meta); }catch(e){ console.error('ASCEND media cache error', e); }
  if(!CURRENT_USER_ID) return true;
  try{
    const blob = dataURLtoBlob(dataURL);
    const { error } = await sb.storage.from('media').upload(`${CURRENT_USER_ID}/${id}`, blob, { upsert:true, contentType: blob.type||'image/png' });
    if(error) throw error;
    return true;
  }catch(e){
    console.error('ASCEND media import upload error', e);
    return false;
  }
}
async function applyImport(payload, mode, recoveryOptions){
  // v1.2 stores interface preferences separately; legacy backups are supported by
  // extracting their old settings fields before the database migration strips them.
  const incomingUI = UIStore.normalize(payload.uiPreferences || UIStore.fromLegacySettings(payload.db.settings));
  const incoming = migrateDatabase(payload.db);
  const migReport = incoming._lastMigrationReport || { repaired:0, unresolved:[], accountsCount:(incoming.accounts||[]).length, tradesCount:(incoming.trades||[]).length };
  const modeReport = incoming._lastModeMigrationReport || { migrated:0, ids:[] };
  const accountModeReport = incoming._lastAccountModeMigrationReport || { migrated:0, ids:[], crossModeTradeIds:[] };
  if(accountModeReport.crossModeTradeIds.length){
    toast(`Backup contains ${accountModeReport.crossModeTradeIds.length} trade-account link(s) across modes. No data was imported.`,'error');
    console.warn('ASCEND import rejected cross-mode trade-account links:',accountModeReport.crossModeTradeIds);
    return;
  }
  delete incoming._lastMigrationReport;
  delete incoming._lastModeMigrationReport;
  delete incoming._lastAccountModeMigrationReport;
  console.log(`ASCEND import: backup contains ${migReport.accountsCount} account(s), ${migReport.tradesCount} trade(s) — ${migReport.repaired} link(s) repaired, ${migReport.unresolved.length} unresolved, ${modeReport.migrated} legacy trade mode(s) and ${accountModeReport.migrated} legacy account mode(s) classified as Live.`);
  const beforeSummary=rank4Summary(State.db);
  const incomingSummary=rank4Summary(incoming);
  let importAudit=null;
  if(CURRENT_USER_ID){
    try{ importAudit=await Recovery.startImportAudit(mode,incomingSummary,recoveryOptions); }
    catch(error){ console.error('ASCEND import audit start error',error); toast('Could not create recoverable import history. The backup was not applied.','error'); return; }
  }
  // Authenticated Replace Import must not mutate local state or cloud media before
  // the server confirms one validated structured-data transaction. Merge remains
  // additive and continues through the normal protected sync path.
  if(mode==='replace' && !CURRENT_USER_ID){
    State.db = incoming;
    State.setUI(incomingUI);
  } else if(mode!=='replace') {
    const db = State.db;
    const keys = ['accounts','trades','premarket','dailyReviews','weeklyReviews','monthlyReviews','playbooks','notes'];
    keys.forEach(k=>{
      const existingIds = new Set(db[k].map(x=>x.id));
      incoming[k].forEach(rec=>{ if(!existingIds.has(rec.id)) db[k].push(rec); else { const idx = db[k].findIndex(x=>x.id===rec.id); db[k][idx] = rec; } });
    });
  }
  // Apply locally right away so the UI reflects the import while cloud
  // persistence runs — the local cache write never depends on cloud success.
  syncSelectedAccounts(State.db);
  DB.persist(State.db);

  let mediaFailed = false;
  // A signed-in Replace Import uploads new media only after the server-side
  // replacement commits. This prevents an unconfirmed replacement from creating
  // orphaned replacement media.
  if(!(mode==='replace' && CURRENT_USER_ID) && payload.media && payload.media.length){
    for(const m of payload.media){
      const ok = await importMediaItem(m.id, m.dataURL, m.meta);
      if(!ok) mediaFailed = true;
    }
  }

  const unresolvedCount = migReport.unresolved.length;
  const restoredLabel = mode==='replace' ? 'Backup restored' : 'Backup merged';

  if(!CURRENT_USER_ID){
    // No authenticated user (shouldn't normally happen behind the auth gate,
    // but keep the app usable if it ever does): local-only, old behavior.
    State.saveNow();
    if(unresolvedCount>0){
      toast(`${restoredLabel} — ${unresolvedCount} trade(s) couldn't be linked to an account and need manual reselection`, 'error');
      console.warn('ASCEND import: unresolved trade(s) needing manual account reselection:', migReport.unresolved);
    } else {
      toast(restoredLabel,'success');
    }
    location.hash='#/dashboard'; router();
    return;
  }

  // Full-backup replacement is transaction-first: the database validates and
  // replaces the structured workspace in one RPC before local state changes.
  // Merge remains cloud-first through the established additive full-state path.
  CloudSync.setStatus('saving');
  let structuredCommitted=false;
  try{
    let cleanup={ok:true,removed:0};
    if(mode==='replace'){
      const mediaIds=(payload.media||[]).map(item=>item&&item.id).filter(Boolean);
      const remote=await CloudDB.replaceWorkspace(incoming,importAudit.id,mediaIds);
      structuredCommitted=true;
      State.db=incoming;
      State.setUI(incomingUI);
      syncSelectedAccounts(State.db);
      DB.persist(State.db);
      if(payload.media && payload.media.length){
        for(const media of payload.media){
          const ok=await importMediaItem(media.id,media.dataURL,media.meta);
          if(!ok) mediaFailed=true;
        }
      }
      cleanup=remote.mediaCleanupJobId?await MediaCleanup.processJobById(remote.mediaCleanupJobId):{ok:false,removed:0};
    } else {
      await CloudDB.pushFullState(CURRENT_USER_ID, State.db); // normal merge is additive, preserves cloud records not in the backup, and remains mode-validated
    }
    // Bulk operations deliberately bypass ordinary conditional writes. Reload once so
    // the next normal save uses database-assigned revisions rather than a guess.
    State.db = await CloudDB.loadFullState(CURRENT_USER_ID);
    CloudSync.setBaseline(State.db, CloudDB.consumeLastLoadedRevisions()); // next normal save won't re-push everything
    CloudSync.clearQueue(); // successful cloud-first import supersedes stale pre-import local intent
    CloudSync.setStatus('synced');
    if(importAudit && mode!=='replace') await RecoveryDB.completeAudit(importAudit.id,CURRENT_USER_ID,{change_summary:{before:beforeSummary,incoming:incomingSummary,after:rank4Summary(State.db),unresolvedTrades:unresolvedCount,mediaFailed}});
    if(unresolvedCount>0){
      console.warn('ASCEND import: unresolved trade(s) needing manual account reselection:', migReport.unresolved);
      toast(`${restoredLabel} — ${unresolvedCount} trade(s) couldn't be linked to an account and need manual reselection${mediaFailed?' (some screenshots also failed to sync)':''}`, 'error');
    } else if(mediaFailed){
      toast('Backup restored, but some screenshots failed to sync to the cloud — they remain saved on this device', 'error');
    } else if(!cleanup.ok){
      toast('Backup restored. Cloud media cleanup is pending review.', 'error');
    } else {
      toast(restoredLabel,'success');
    }
  }catch(e){
    console.error('ASCEND import cloud persistence error', e);
    if(importAudit && !structuredCommitted) try{ await RecoveryDB.failAudit(importAudit.id,CURRENT_USER_ID,e&&e.message); }catch(auditError){ console.warn('ASCEND import audit failure could not be recorded',auditError); }
    CloudSync.setStatus('error');
    toast('Cloud import failed — your local data is preserved', 'error');
  }
  location.hash='#/dashboard'; router();
}

async function applyCSVImport(preview,fileName,mode,account,mapping){
  const db=State.db, rows=preview.valid.map(item=>item.trade); if(!rows.length) throw new Error('No valid, nonduplicate CSV rows are available to import.');

  const previous={trades:db.trades.slice(),signatures:(db.settings.csvImportSignatures||[]).slice(),history:(db.settings.csvImportHistory||[]).slice()};

    const signatures=new Set(previous.signatures); rows.forEach(trade=>signatures.add(trade.csvImportSignature)); db.settings.csvImportSignatures=Array.from(signatures).slice(-10000);

    return history;
  }catch(error){
    db.trades=previous.trades; db.settings.csvImportSignatures=previous.signatures; db.settings.csvImportHistory=previous.history; State.saveNow();
    if(audit) try{ await RecoveryDB.failAudit(audit.id,CURRENT_USER_ID,error&&error.message); }catch(auditError){ console.warn('ASCEND CSV audit failure could not be recorded',auditError); }
    throw error;
  }
}

      ]},

        { label:'Settings', icon:'gear', action:()=>location.hash='#/settings' },
      ]},
    ];
  },
  flat(){ return this.groups().flatMap(g=>g.items.map(i=>({...i, group:g.label}))); },
  selIdx:0,
  open(){
    const overlay = document.getElementById('command-overlay');
    overlay.classList.add('show');
    const input = document.getElementById('cmd-search');
    input.value=''; input.focus();
    this.selIdx = 0;
    this.render('');
    input.oninput = ()=>{ this.selIdx = 0; this.render(input.value); };
  },
  close(){ document.getElementById('command-overlay').classList.remove('show'); },
  currentFiltered(query){
    const q = (query||'').toLowerCase();
    return this.flat().filter(i=> i.label.toLowerCase().includes(q));
  },
  render(query){
    const list = document.getElementById('cmd-list');
    const filtered = this.currentFiltered(query);
    if(!filtered.length){ list.innerHTML = `<div class="cmd-empty">No matches</div>`; return; }
    let flatIdx = 0;
    const byGroup = {};
    filtered.forEach(i=>{ (byGroup[i.group] = byGroup[i.group]||[]).push(i); });
    list.innerHTML = Object.keys(byGroup).map(g=>`
      <div class="cmd-group">
        <div class="cmd-group-label">${esc(g)}</div>
        ${byGroup[g].map(i=>{
          const idx = flatIdx++;
          return `<div class="cmd-item ${idx===this.selIdx?'sel':''}" data-idx="${idx}">${icon(i.icon,15)}<span>${esc(i.label)}</span>${i.key?`<span class="k">${i.key}</span>`:''}</div>`;
        }).join('')}
      </div>`).join('');
    list.querySelectorAll('.cmd-item').forEach(el=> el.onclick = ()=>{ this.close(); filtered[Number(el.dataset.idx)].action(); });
    const sel = list.querySelector('.cmd-item.sel');
    if(sel) sel.scrollIntoView({ block:'nearest' });
  },
  move(delta){
    const input = document.getElementById('cmd-search');
    const filtered = this.currentFiltered(input.value);
    if(!filtered.length) return;
    this.selIdx = (this.selIdx + delta + filtered.length) % filtered.length;
    this.render(input.value);
  },
  selectCurrent(){
    const input = document.getElementById('cmd-search');
    const filtered = this.currentFiltered(input.value);
    const item = filtered[this.selIdx];
    if(item){ this.close(); item.action(); }
  }
};

function handleGlobalShortcut(e){
  if(Modal.stack.length){
    if(e.key==='Escape'){ e.preventDefault(); Modal.closeTop(); }
    return;
  }
  const bridge = window.ascend;
  const isFullscreenShortcut = e.key==='F11' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='f');
  if(bridge && bridge.isElectron && isFullscreenShortcut && typeof bridge.toggleFullscreen==='function'){
    e.preventDefault(); bridge.toggleFullscreen(); return;
  }
  if(bridge && bridge.isElectron && e.key==='Escape' && typeof bridge.exitFullscreen==='function'){
    bridge.exitFullscreen(); return;
  }
  const cmdOpen = document.getElementById('command-overlay').classList.contains('show');
  if(cmdOpen){
    if(e.key==='Escape'){ CommandMenu.close(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); CommandMenu.move(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); CommandMenu.move(-1); return; }
    if(e.key==='Enter'){ e.preventDefault(); CommandMenu.selectCurrent(); return; }
    return;
  }
  if(e.key==='Escape' && typeof Sidebar!=='undefined' && Sidebar.isMobile() && Sidebar.isOpen()){
    Sidebar.close(); return;
  }
  const isMac = navigator.platform.toUpperCase().includes('MAC');
  if((isMac ? e.metaKey : e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); CommandMenu.open(); return; }
  const tag = document.activeElement.tagName;
  const typing = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); CommandMenu.open(); }
  else if(e.key.toLowerCase()==='n'){ Forms.trade(); }
  else if(e.key.toLowerCase()==='p'){ Forms.premarket(); }
  else if(e.key.toLowerCase()==='d'){ location.hash='#/dashboard'; }
}
document.addEventListener('keydown', handleGlobalShortcut);

    const sb = document.getElementById('sidebar');

    sb.classList.add('open');
    sb.classList.remove('is-locked');
    sc.classList.add('show');
    sc.setAttribute('aria-hidden','false');
    btn && btn.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
  },
  close(){
    const sb = document.getElementById('sidebar');
    const sc = document.getElementById('sidebar-scrim');
    const btn = document.getElementById('menu-toggle');
    sb.classList.remove('open');
    sc.classList.remove('show');
    sc.setAttribute('aria-hidden','true');
    btn && btn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
  },
  toggle(){ this.isOpen() ? this.close() : this.open(); },
  isOpen(){ return document.getElementById('sidebar').classList.contains('open'); },
  attachResize(){
    const handler = (e)=>{
      const sb = document.getElementById('sidebar');
      const sc = document.getElementById('sidebar-scrim');
      if(!e.matches){
        // resized back to desktop — drop mobile open state, restore #main margin
        sb.classList.remove('open');
        sb.classList.add('is-locked');
        sc.classList.remove('show');
        document.body.style.overflow = '';
      } else {
        sb.classList.remove('is-locked');
        if(this.isOpen()){
          sc.classList.add('show');
          document.body.style.overflow = 'hidden';
        }
      }
    };
    if(this.mq.addEventListener) this.mq.addEventListener('change', handler);
    else this.mq.addListener(handler);
    // initial pass so the sidebar is "locked visible" on desktop before user resizes
    handler(this.mq);
    // scrim click closes
    document.getElementById('sidebar-scrim').addEventListener('click', ()=> this.close());
  },
};

// User-facing translations are deliberately generic where Supabase may mask account

function authFriendlyError(error, action){
  const message=String(error&&error.message||'').toLowerCase();
  if(message.includes('invalid login')||message.includes('invalid credentials')) return 'Email or password is incorrect. Check your details or reset your password.';
  if(message.includes('email not confirmed')) return 'Confirm your email before signing in, then try again.';
  if(message.includes('captcha')||message.includes('captcha_token')) return 'Sign-in is blocked by a CAPTCHA setting that is not configured in ASCEND. Disable or configure CAPTCHA in Supabase, then try again.';
  if(message.includes('rate limit')||message.includes('too many')) return 'Too many attempts. Please wait a moment before trying again.';
  if(message.includes('same password')) return 'Choose a different password from your current password.';
  if(message.includes('session')||message.includes('jwt')) return 'Your secure session has expired. Sign in again, then retry.';
  if(action==='password') return 'We could not update your password. Your current session and journal data are unchanged.';
  if(action==='session') return 'We could not update your other sessions. This device remains signed in.';
  return 'We could not complete that request. Please try again.';
}
