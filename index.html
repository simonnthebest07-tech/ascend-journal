function renderAuthForm(mode){
  const body = document.getElementById('auth-body');
  const isSignup = mode === 'signup';
  body.innerHTML = `
    <h1>${isSignup ? 'Create your account' : 'Welcome back'}</h1>
    <p class="auth-sub">${isSignup ? 'Your journal, synced everywhere.' : 'Sign in to your ASCEND journal.'}</p>
    <form id="auth-form" autocomplete="on">
      <div class="field"><label class="field-label">Email</label><input type="email" id="auth-email" required autocomplete="email"></div>
      <div class="field"><label class="field-label">Password</label><input type="password" id="auth-password" required minlength="6" autocomplete="${isSignup?'new-password':'current-password'}"></div>
      <div class="auth-error" id="auth-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">${isSignup ? 'Sign up' : 'Sign in'}</button>
    </form>
    <div class="auth-switch">
      ${isSignup ? `Already have an account? <button id="auth-switch-btn">Sign in</button>` : `New here? <button id="auth-switch-btn">Create an account</button>`}
    </div>
  `;
  document.getElementById('auth-switch-btn').onclick = ()=> renderAuthForm(isSignup ? 'signin' : 'signup');
  document.getElementById('auth-form').onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    const submitBtn = document.getElementById('auth-submit');
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = isSignup ? 'Signing up…' : 'Signing in…';
    try{
      if(isSignup){
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){
          body.innerHTML = `<h1>Check your email</h1><p class="auth-sub">We sent a confirmation link to ${esc(email)}. Confirm it, then sign in.</p><button class="btn btn-block" id="auth-back">Back to sign in</button>`;
          document.getElementById('auth-back').onclick = ()=>renderAuthForm('signin');
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
      // onAuthStateChange picks up the session and starts the app.
    }catch(err){
      errEl.textContent = err && err.message ? err.message : 'Something went wrong — try again.';
      submitBtn.disabled = false;
      submitBtn.textContent = isSignup ? 'Sign up' : 'Sign in';
    }
  };
}
function showAuthScreen(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  renderAuthForm('signin');
}
function showAppShell(){
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
}

const Auth = {
  async init(){
    sb.auth.onAuthStateChange((event, session)=>{
      if(event === 'SIGNED_OUT'){
        CURRENT_USER_ID = null; CURRENT_USER_EMAIL = null; appEntered = false;
        showAuthScreen();
      } else if((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session && session.user){
        // Guarded by appEntered, so this is a no-op if we already booted from
        // the initial getSession() below — it only matters right after a
        // successful sign-in submitted from the auth form.
        startAppForUser(session.user);
      }
    });
    const { data:{ session } } = await sb.auth.getSession();
    return session;
  },
  async signOut(){
    try{ await sb.auth.signOut(); }
    catch(e){ console.error(e); }
    CURRENT_USER_ID = null; CURRENT_USER_EMAIL = null; appEntered = false; State.db = null;
    showAuthScreen();
  }
};

// ===================== FIRST-LOGIN LEGACY MIGRATION =====================
async function migrateLegacyMedia(userId){
  let cached;
  try{ cached = await IDB._cacheAll(); }catch(e){ cached = []; }
  for(const rec of cached){
    try{
      const blob = dataURLtoBlob(rec.dataURL);
      await sb.storage.from('media').upload(`${userId}/${rec.id}`, blob, { upsert:false, contentType: blob.type||'image/png' });
    }catch(e){ /* best-effort: skip files that already exist or fail to upload */ }
  }
}
async function migrateLegacyLocalDataIfNeeded(userId){
  const flagKey = `ascend_migrated_${userId}`;
  if(localStorage.getItem(flagKey)) return false;
  let raw;
  try{ raw = localStorage.getItem(LEGACY_DB_KEY); }catch(e){ raw = null; }
  if(!raw){ localStorage.setItem(flagKey, '1'); return false; }
  let legacyDb;
  try{ legacyDb = JSON.parse(raw); }catch(e){ localStorage.setItem(flagKey, '1'); return false; }
  if(!validateDatabase(legacyDb)){ localStorage.setItem(flagKey, '1'); return false; }
  const alreadyInCloud = await CloudDB.hasAnyCloudData(userId);
  if(alreadyInCloud){ localStorage.setItem(flagKey, '1'); return false; } // don't clobber/duplicate an existing cloud account
  legacyDb = migrateDatabase(legacyDb);
  await CloudDB.pushFullState(userId, legacyDb);
  await migrateLegacyMedia(userId);
  localStorage.setItem(flagKey, '1');
  return true;
}

// ===================== APP BOOTSTRAP (cloud-backed) =====================
let appEntered = false;
async function startAppForUser(user){
  if(appEntered) return;
  appEntered = true;
  CURRENT_USER_ID = user.id;
  CURRENT_USER_EMAIL = user.email;
  showAppShell();
  // Instant paint from local cache (if any) while the cloud load runs.
  const cached = DB.loadCache(user.id);
  if(cached){ State.db = cached; applyAppearance(); updateSessionChip(); router(); }
  else { const pc = document.getElementById('page-content'); if(pc) pc.innerHTML = `<div class="empty-state"><p>Loading your journal…</p></div>`; }
  CloudSync.setStatus('saving');
  try{
    const migrated = await migrateLegacyLocalDataIfNeeded(user.id);
    State.db = await CloudDB.loadFullState(user.id);
    CloudSync.setBaseline(State.db);
    DB.persist(State.db);
    CloudSync.setStatus('synced');
    applyAppearance();
    updateSessionChip();
    router();
    maybeShowOnboarding();
    if(migrated) toast('Your local journal was migrated to your account', 'success');
    const migReport = State.db._lastMigrationReport;
    if(migReport){
      if(migReport.repaired>0) toast(`Fixed ${migReport.repaired} trade(s) that were unlinked from their account`, 'success');
      if(migReport.unresolved && migReport.unresolved.length>0) toast(`${migReport.unresolved.length} trade(s) still need their account reselected — open them and pick the account again`, 'error');
      delete State.db._lastMigrationReport;
      State.saveNow();
    }
  }catch(e){
    console.error('ASCEND cloud load error', e);
    CloudSync.setStatus('error');
    if(!State.db){ State.db = cached || defaultDB(); applyAppearance(); updateSessionChip(); router(); }
    toast('Could not reach the cloud — showing your last synced copy. Changes will sync once you\'re back online.', 'error');
  }
}
async function bootstrap(){
  const session = await Auth.init();
  if(session && session.user){ await startAppForUser(session.user); }
  else { showAuthScreen(); }
}
window.addEventListener('DOMContentLoaded', bootstrap);
window.addEventListener('beforeunload', ()=>{ if(State.db) DB.persist(State.db); });

// ---------- Premium cursor-following light (desktop hover-capable devices only) ----------
(function initCursorGlow(){
  const canHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if(!canHover) return;
  document.documentElement.classList.add('has-hover');
  let ticking = false, lastX = 0, lastY = 0, activeCard = null;
  function apply(){
    ticking = false;
    if(!activeCard) return;
    const r = activeCard.getBoundingClientRect();
    activeCard.style.setProperty('--mx', (lastX - r.left) + 'px');
    activeCard.style.setProperty('--my', (lastY - r.top) + 'px');
  }

  let resizeFrame = null;
let pendingResizeBounds = null;

  document.addEventListener('mousemove', (e)=>{
    const card = e.target.closest && e.target.closest('.card');
    activeCard = card || null;
    if(!card) return;
    lastX = e.clientX; lastY = e.clientY;
    if(!ticking){ ticking = true; requestAnimationFrame(apply); }
  }, { passive:true });
})();

// ==========================================
// ASCEND WINDOW RESIZE ENGINE
// ==========================================

const resizeZones = {
    'resize-top': 'top',
    'resize-bottom': 'bottom',
    'resize-left': 'left',
    'resize-right': 'right',

    'resize-top-left': 'top-left',
    'resize-top-right': 'top-right',
    'resize-bottom-left': 'bottom-left',
    'resize-bottom-right': 'bottom-right'
};


let resizeState = null;


// ------------------------------------------
// START RESIZE
// ------------------------------------------

Object.entries(resizeZones).forEach(
    ([elementId, direction]) => {

        const element =
            document.getElementById(elementId);

        if (!element) {
            return;
        }

        element.addEventListener(
            'mousedown',
            async (event) => {

                if (event.button !== 0) {
                    return;
                }

                if (!window.ascend?.isElectron) {
                    return;
                }

                const bounds =
                    await window.ascend.getWindowBounds();

                if (!bounds) {
                    return;
                }

                resizeState = {
                    direction,

                    startMouseX: event.screenX,
                    startMouseY: event.screenY,

                    startX: bounds.x,
                    startY: bounds.y,

                    startWidth: bounds.width,
                    startHeight: bounds.height
                };

                document.body.style.userSelect =
                    'none';

                document.body.style.cursor =
                    getResizeCursor(direction);

                event.preventDefault();
            }
        );
    }
);


// ------------------------------------------
// RESIZE CURSOR
// ------------------------------------------

function getResizeCursor(direction) {

    const cursors = {

        top: 'ns-resize',
        bottom: 'ns-resize',

        left: 'ew-resize',
        right: 'ew-resize',

        'top-left': 'nwse-resize',
        'bottom-right': 'nwse-resize',

        'top-right': 'nesw-resize',
        'bottom-left': 'nesw-resize'
    };

    return cursors[direction] || 'default';
}


// ------------------------------------------
// MOUSE MOVE
// ------------------------------------------

document.addEventListener(
    'mousemove',
    async (event) => {

        if (!resizeState) {
            return;
        }

        const state = resizeState;

        const deltaX =
            event.screenX - state.startMouseX;

        const deltaY =
            event.screenY - state.startMouseY;


        let x = state.startX;
        let y = state.startY;

        let width = state.startWidth;
        let height = state.startHeight;


        // -------------------------------
        // LEFT
        // -------------------------------

        if (
            state.direction === 'left' ||
            state.direction === 'top-left' ||
            state.direction === 'bottom-left'
        ) {

            width =
                state.startWidth - deltaX;

            x =
                state.startX + deltaX;
        }


        // -------------------------------
        // RIGHT
        // -------------------------------

        if (
            state.direction === 'right' ||
            state.direction === 'top-right' ||
            state.direction === 'bottom-right'
        ) {

            width =
                state.startWidth + deltaX;
        }


        // -------------------------------
        // TOP
        // -------------------------------

        if (
            state.direction === 'top' ||
            state.direction === 'top-left' ||
            state.direction === 'top-right'
        ) {

            height =
                state.startHeight - deltaY;

            y =
                state.startY + deltaY;
        }


        // -------------------------------
        // BOTTOM
        // -------------------------------

        if (
            state.direction === 'bottom' ||
            state.direction === 'bottom-left' ||
            state.direction === 'bottom-right'
        ) {

            height =
                state.startHeight + deltaY;
        }


        // -------------------------------
        // MINIMUM SIZE
        // -------------------------------

        const MIN_WIDTH = 1100;
        const MIN_HEIGHT = 700;


        if (width < MIN_WIDTH) {

            if (
                state.direction === 'left' ||
                state.direction === 'top-left' ||
                state.direction === 'bottom-left'
            ) {

                x =
                    state.startX +
                    (state.startWidth - MIN_WIDTH);
            }

            width = MIN_WIDTH;
        }


        if (height < MIN_HEIGHT) {

            if (
                state.direction === 'top' ||
                state.direction === 'top-left' ||
                state.direction === 'top-right'
            ) {

                y =
                    state.startY +
                    (state.startHeight - MIN_HEIGHT);
            }

            height = MIN_HEIGHT;
        }


      pendingResizeBounds = {
    x,
    y,
    width,
    height
};

if (!resizeFrame) {
    resizeFrame = requestAnimationFrame(() => {

        if (pendingResizeBounds) {
            window.ascend.setWindowBounds(
                pendingResizeBounds
            );
        }

        pendingResizeBounds = null;
        resizeFrame = null;
    });
}
    }
);


// ------------------------------------------
// MOUSE UP
// ------------------------------------------

document.addEventListener(
    'mouseup',
    () => {

        if (!resizeState) {
            return;
        }

        resizeState = null;

        document.body.style.userSelect = '';

        document.body.style.cursor = '';
    }
);
</script>
