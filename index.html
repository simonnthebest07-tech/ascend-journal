      catch(error){ errorEl.textContent=authFriendlyError(error,'recovery'); submit.disabled=false; submit.textContent='Send recovery email'; }
    };
    return;
  }
  if(mode==='update-password'){
    body.innerHTML = '<h1>Choose a new password</h1><p class="auth-sub">This secure recovery session lets you update your password before opening your journal.</p><form id="auth-update-password-form" autocomplete="off"><div class="field"><label class="field-label">New password</label><input type="password" id="auth-new-password" required minlength="8" autocomplete="new-password"></div><div class="field"><label class="field-label">Confirm new password</label><input type="password" id="auth-confirm-password" required minlength="8" autocomplete="new-password"></div><div class="auth-error" id="auth-error"></div><button type="submit" class="btn btn-primary btn-block" id="auth-update-password-submit">Update password</button></form>';
    document.getElementById('auth-update-password-form').onsubmit=async event=>{
      event.preventDefault(); const password=document.getElementById('auth-new-password').value; const confirmation=document.getElementById('auth-confirm-password').value; const errorEl=document.getElementById('auth-error'); const submit=document.getElementById('auth-update-password-submit');
      errorEl.textContent=''; if(password.length<8){ errorEl.textContent='Use at least 8 characters for your new password.'; return; } if(password!==confirmation){ errorEl.textContent='The password confirmation does not match.'; return; }
      submit.disabled=true; submit.textContent='Updating…';
      try{ await Auth.updateRecoveryPassword(password); }catch(error){ errorEl.textContent=authFriendlyError(error,'password'); submit.disabled=false; submit.textContent='Update password'; }
    };
    return;
  }
  const isSignup = mode === 'signup';
  body.innerHTML = `
    <h1>${isSignup ? 'Create your account' : 'Welcome back'}</h1>
    <p class="auth-sub">${isSignup ? 'Your journal, synced everywhere.' : 'Sign in to your ASCEND journal.'}</p>

      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">${isSignup ? 'Sign up' : 'Sign in'}</button>

      ${isSignup ? `Already have an account? <button id="auth-switch-btn">Sign in</button>` : `New here? <button id="auth-switch-btn">Create an account</button> · <button id="auth-recovery-link">Forgot password?</button>`}
    </div>
  `;

  const recoveryLink=document.getElementById('auth-recovery-link'); if(recoveryLink) recoveryLink.onclick=()=>renderAuthForm('recover');
  document.getElementById('auth-form').onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    const submitBtn = document.getElementById('auth-submit');
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = isSignup ? 'Signing up…' : 'Signing in…';
    try{
      if(isSignup){
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){
          body.innerHTML = `<h1>Check your email</h1><p class="auth-sub">We sent a confirmation link to ${esc(email)}. Confirm it, then sign in.</p><button class="btn btn-block" id="auth-back">Back to sign in</button>`;
          document.getElementById('auth-back').onclick = ()=>renderAuthForm('signin');
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
      // onAuthStateChange picks up the session and starts the app.
    }catch(err){
      errEl.textContent = authFriendlyError(err,isSignup?'signup':'signin');
      submitBtn.disabled = false;
      submitBtn.textContent = isSignup ? 'Sign up' : 'Sign in';
    }
  };
}

const Auth = {
  recoverySession:null,
  async init(){
    sb.auth.onAuthStateChange((event, session)=>{
      if(event === 'SIGNED_OUT'){
        CURRENT_USER_ID = null; CURRENT_USER_EMAIL = null; appEntered = false; CloudSync.resetQueueMemory(); this.recoverySession=null;
        showAuthScreen();
      } else if(event === 'PASSWORD_RECOVERY' && session && session.user){
        this.recoverySession=session; clearAuthUrlFragments(); showAuthScreen('update-password');
      } else if((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session && session.user && !this.recoverySession){
        startAppForUser(session.user);
      }
    });
    const { data:{ session } } = await sb.auth.getSession();
    return session;
  },
  async requestPasswordReset(email){
    const {error}=await sb.auth.resetPasswordForEmail(email);
    if(error) throw error;
    return true;
  },
  async updateRecoveryPassword(password){
    const {data,error}=await sb.auth.updateUser({password});
    if(error) throw error;
    const user=(data&&data.user)||(this.recoverySession&&this.recoverySession.user);
    this.recoverySession=null;
    if(!user) throw new Error('Recovery session missing');
    // The recovery event intentionally hides the app shell. Force a safe re-entry
    // after a successful password update even when this browser had been active.
    appEntered=false;
    await startAppForUser(user);
    await SecurityEvents.record('password_updated',{method:'recovery'});
    toast('Password updated. Your journal is available again.','success');
    return user;
  },
  openPasswordResetModal(prefillEmail){
    const email=prefillEmail||CURRENT_USER_EMAIL||'';

  },
  async updatePassword(password){
    const {error}=await sb.auth.updateUser({password});
    if(error) throw error;

  },

  },

    Modal.open({title:'Change password',bodyHTML:'<p class="muted" style="margin-top:0;">Use a new password with at least 8 characters. Your journal data will not change.</p><div class="field"><label class="field-label">New password</label><input type="password" id="account-new-password" minlength="8" autocomplete="new-password"></div><div class="field"><label class="field-label">Confirm new password</label><input type="password" id="account-confirm-password" minlength="8" autocomplete="new-password"></div><div class="hint" id="account-password-error" style="color:var(--negative);"></div>',footerHTML:'<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="account-password-save">Update password</button>',onMount:(overlay,close)=>{ overlay.querySelector('#account-password-save').onclick=async()=>{ const password=overlay.querySelector('#account-new-password').value; const confirmation=overlay.querySelector('#account-confirm-password').value; const errorEl=overlay.querySelector('#account-password-error'); errorEl.textContent=''; if(password.length<8){errorEl.textContent='Use at least 8 characters.';return;} if(password!==confirmation){errorEl.textContent='The password confirmation does not match.';return;} try{await this.updatePassword(password);close();}catch(error){errorEl.textContent=authFriendlyError(error,'password');} }; }});
  },
  async signOut(){
    await SecurityEvents.record('signed_out_current_device',{scope:'local'});
    try{ await sb.auth.signOut({scope:'local'}); }
    catch(e){ console.error(e); }
    CURRENT_USER_ID = null; CURRENT_USER_EMAIL = null; appEntered = false; CloudSync.resetQueueMemory(); State.db = null; State.ui = UIStore.normalize(); State.appMode = DEFAULT_APP_MODE; State.selectedAccountIds = { live:null, backtest:null };

async function migrateLegacyMedia(userId){
  let cached;
  try{ cached = await IDB._cacheAll(); }catch(e){ cached = []; }
  for(const rec of cached){
    try{
      const blob = dataURLtoBlob(rec.dataURL);
      await sb.storage.from('media').upload(`${userId}/${rec.id}`, blob, { upsert:false, contentType: blob.type||'image/png' });
    }catch(e){ /* best-effort: skip files that already exist or fail to upload */ }
  }
}
async function migrateLegacyLocalDataIfNeeded(userId){
  const flagKey = `ascend_migrated_${userId}`;
  if(localStorage.getItem(flagKey)) return false;
  let raw;
  try{ raw = localStorage.getItem(LEGACY_DB_KEY); }catch(e){ raw = null; }
  if(!raw){ localStorage.setItem(flagKey, '1'); return false; }
  let legacyDb;
  try{ legacyDb = JSON.parse(raw); }catch(e){ localStorage.setItem(flagKey, '1'); return false; }
  if(!validateDatabase(legacyDb)){ localStorage.setItem(flagKey, '1'); return false; }
  const alreadyInCloud = await CloudDB.hasAnyCloudData(userId);
  if(alreadyInCloud){ localStorage.setItem(flagKey, '1'); return false; } // don't clobber/duplicate an existing cloud account
  legacyDb = migrateDatabase(legacyDb);
  await CloudDB.pushFullState(userId, legacyDb);
  await migrateLegacyMedia(userId);
  localStorage.setItem(flagKey, '1');
  return true;
}

let appEntered = false;
async function startAppForUser(user){
  if(appEntered) return;
  appEntered = true;
  CURRENT_USER_ID = user.id;
  CURRENT_USER_EMAIL = user.email;
  State.hydrateAppMode();
  State.hydrateSelectedAccounts();
  CloudSync.loadQueue(user.id);
  CloudSync.restoreBaseline(user.id);
  showAppShell();
  applyApplicationMode();
  // Instant paint from local cache (if any) while the cloud load runs.
  const cached = DB.loadCache(user.id);
  if(cached){ State.db=cached; CloudSync.applyQueuedState(State.db); State.hydrateSelectedAccounts(); State.hydrateUI(cached.settings); applyAppearance(); applyNavigationMode(); updateSessionChip(); router(); }
  else { const pc = document.getElementById('page-content'); if(pc) pc.innerHTML = `<div class="empty-state"><p>Loading your journal…</p></div>`; }
  CloudSync.setStatus('saving');
  try{
    const migrated = await migrateLegacyLocalDataIfNeeded(user.id);
    State.db = await CloudDB.loadFullState(user.id);
    State.hydrateSelectedAccounts();
    State.hydrateUI(State.db.settings);
    CloudSync.setBaseline(State.db, CloudDB.consumeLastLoadedRevisions());
    CloudSync.applyQueuedState(State.db); // remote baseline first, then restore durable local intent
    DB.persist(State.db);
    CloudSync.setStatus('synced');
    CloudSync.push(State.db);
    applyAppearance();
    applyNavigationMode();
    updateSessionChip();
    router();
    maybeShowOnboarding();
    if(migrated) toast('Your local journal was migrated to your account', 'success');
    const migReport = State.db._lastMigrationReport;
    if(migReport){
      if(migReport.repaired>0) toast(`Fixed ${migReport.repaired} trade(s) that were unlinked from their account`, 'success');
      if(migReport.unresolved && migReport.unresolved.length>0) toast(`${migReport.unresolved.length} trade(s) still need their account reselected — open them and pick the account again`, 'error');
      delete State.db._lastMigrationReport;
      State.saveNow();
    }
  }catch(e){
    console.error('ASCEND cloud load error', e);
    CloudSync.setStatus('error');
    if(!State.db){ State.db=cached||defaultDB(); State.hydrateSelectedAccounts(); State.hydrateUI(State.db.settings); applyAppearance(); applyNavigationMode(); updateSessionChip(); router(); }
    toast('Could not reach the cloud — showing your last synced copy. Changes will sync once you\'re back online.', 'error');
  }
}

// ==========================================
// ASCEND WINDOW RESIZE ENGINE
// ==========================================

const resizeZones = {
    'resize-top': 'top',
    'resize-bottom': 'bottom',
    'resize-left': 'left',
    'resize-right': 'right',

    'resize-top-left': 'top-left',
    'resize-top-right': 'top-right',
    'resize-bottom-left': 'bottom-left',
    'resize-bottom-right': 'bottom-right'
};


let resizeState = null;
let resizeFrame = null;
let pendingResizeBounds = null;


// ------------------------------------------
// START RESIZE
// ------------------------------------------

Object.entries(resizeZones).forEach(
    ([elementId, direction]) => {

        const element =
            document.getElementById(elementId);

        if (!element) {
            return;
        }

        element.addEventListener(
            'mousedown',
            async (event) => {

                if (event.button !== 0) {
                    return;
                }

                const bridge = window.ascend;
                if (!bridge || !bridge.isElectron || typeof bridge.getWindowBounds !== 'function') {
                    return;
                }

                const bounds = await bridge.getWindowBounds();

                if (!bounds) {
                    return;
                }

                resizeState = {
                    direction,

                    startMouseX: event.screenX,
                    startMouseY: event.screenY,

                    startX: bounds.x,
                    startY: bounds.y,

                    startWidth: bounds.width,
                    startHeight: bounds.height
                };

                document.body.style.userSelect =
                    'none';

                document.body.style.cursor =
                    getResizeCursor(direction);

                event.preventDefault();
            }
        );
    }
);


// ------------------------------------------
// RESIZE CURSOR
// ------------------------------------------

function getResizeCursor(direction) {

    const cursors = {

        top: 'ns-resize',
        bottom: 'ns-resize',

        left: 'ew-resize',
        right: 'ew-resize',

        'top-left': 'nwse-resize',
        'bottom-right': 'nwse-resize',

        'top-right': 'nesw-resize',
        'bottom-left': 'nesw-resize'
    };

    return cursors[direction] || 'default';
}


// ------------------------------------------
// MOUSE MOVE
// ------------------------------------------

document.addEventListener(
    'mousemove',
    async (event) => {

        if (!resizeState) {
            return;
        }

        const state = resizeState;

        const deltaX =
            event.screenX - state.startMouseX;

        const deltaY =
            event.screenY - state.startMouseY;


        let x = state.startX;
        let y = state.startY;

        let width = state.startWidth;
        let height = state.startHeight;


        // -------------------------------
        // LEFT
        // -------------------------------

        if (
            state.direction === 'left' ||
            state.direction === 'top-left' ||
            state.direction === 'bottom-left'
        ) {

            width =
                state.startWidth - deltaX;

            x =
                state.startX + deltaX;
        }


        // -------------------------------
        // RIGHT
        // -------------------------------

        if (
            state.direction === 'right' ||
            state.direction === 'top-right' ||
            state.direction === 'bottom-right'
        ) {

            width =
                state.startWidth + deltaX;
        }


        // -------------------------------
        // TOP
        // -------------------------------

        if (
            state.direction === 'top' ||
            state.direction === 'top-left' ||
            state.direction === 'top-right'
        ) {

            height =
                state.startHeight - deltaY;

            y =
                state.startY + deltaY;
        }


        // -------------------------------
        // BOTTOM
        // -------------------------------

        if (
            state.direction === 'bottom' ||
            state.direction === 'bottom-left' ||
            state.direction === 'bottom-right'
        ) {

            height =
                state.startHeight + deltaY;
        }


        // -------------------------------
        // MINIMUM SIZE
        // -------------------------------

        const MIN_WIDTH = 1100;
        const MIN_HEIGHT = 700;


        if (width < MIN_WIDTH) {

            if (
                state.direction === 'left' ||
                state.direction === 'top-left' ||
                state.direction === 'bottom-left'
            ) {

                x =
                    state.startX +
                    (state.startWidth - MIN_WIDTH);
            }

            width = MIN_WIDTH;
        }


        if (height < MIN_HEIGHT) {

            if (
                state.direction === 'top' ||
                state.direction === 'top-left' ||
                state.direction === 'top-right'
            ) {

                y =
                    state.startY +
                    (state.startHeight - MIN_HEIGHT);
            }

            height = MIN_HEIGHT;
        }


      pendingResizeBounds = {
    x,
    y,
    width,
    height
};

if (!resizeFrame) {
    resizeFrame = requestAnimationFrame(() => {

        if (pendingResizeBounds) {
            const bridge = window.ascend;
            if (bridge && bridge.isElectron && typeof bridge.setWindowBounds === 'function') {
                bridge.setWindowBounds(pendingResizeBounds);
            }
        }

        pendingResizeBounds = null;
        resizeFrame = null;
    });
}
    }
);


// ------------------------------------------
// MOUSE UP
// ------------------------------------------

document.addEventListener(
    'mouseup',
    () => {

        if (!resizeState) {
            return;
        }

        resizeState = null;

        document.body.style.userSelect = '';

        document.body.style.cursor = '';
    }
);

(function initDesktopRendererBridge(){

  const minimizeButton = document.getElementById('window-minimize');

  });
  if(closeButton && typeof bridge.closeWindow === 'function') closeButton.addEventListener('click', ()=>bridge.closeWindow());
  if(typeof bridge.isMaximized === 'function') Promise.resolve(bridge.isMaximized()).then(setMaximizeIcon).catch(()=>{});
  if(typeof bridge.onWindowMaximizedChange === 'function') bridge.onWindowMaximizedChange(setMaximizeIcon);
})();
