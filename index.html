@media(max-width:900px){ .minimal-dashboard-focus,.minimal-dashboard-section.two-col{ grid-template-columns:1fr; } .minimal-metrics{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:640px){ .minimal-dashboard-controls{ align-items:stretch; flex-direction:column; } .minimal-dashboard-controls select{ max-width:none; } .minimal-dashboard-controls .tab-chip-group{ width:100%; overflow-x:auto; } .minimal-account-card,.minimal-next-card{ min-height:164px; } .minimal-trade-row{ grid-template-columns:minmax(0,1fr) auto; gap:8px; } .minimal-trade-row>span:nth-child(2){ display:none; } }

/* badges/tags */
.badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--border); color:var(--text-muted); }
.badge.b-pos{ background:var(--positive-dim); color:var(--positive); border-color:transparent; }
.badge.b-neg{ background:var(--negative-dim); color:var(--negative); border-color:transparent; }
.badge.b-warn{ background:var(--warning-dim); color:var(--warning); border-color:transparent; }
.badge.b-accent{ background:var(--accent-glow); color:var(--accent); border-color:transparent; }
.tag{ display:inline-flex; padding:3px 8px; border-radius:6px; font-size:11px; background:var(--surface-3); color:var(--text-muted); margin:0 4px 4px 0; }

/* table */
.table-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius:var(--radius-m); }
table{ width:100%; border-collapse:collapse; font-size:13px; }
thead th{ text-align:left; font-family:var(--font-display); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); font-weight:500; padding:10px 14px; border-bottom:1px solid var(--border-soft); background:transparent; white-space:nowrap; cursor:pointer; }
tbody td{ padding:11px 14px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
tbody tr{ transition:background var(--anim); cursor:pointer; }
tbody tr:hover{ background:var(--surface-2); }
tbody tr:last-child td{ border-bottom:none; }

/* filter bar */
.filter-bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
.filter-bar select, .filter-bar input{ width:auto; min-width:110px; padding:7px 10px; font-size:12px; }
.filter-bar .search-wrap{ position:relative; flex:1; min-width:180px; }
.filter-bar .search-wrap input{ padding-left:30px; width:100%; }
.filter-bar .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; opacity:.5; }

/* empty state */
.empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
.empty-state .icon-wrap{ width:52px; height:52px; border-radius:var(--radius-md); background:var(--surface-2); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.empty-state h3{ font-family:var(--font-serif); font-style:italic; font-weight:500; margin:0 0 6px; color:var(--text); font-size:22px; letter-spacing:-.005em; }
.empty-state p{ margin:0 0 18px; font-size:13px; max-width:340px; margin-left:auto; margin-right:auto; }

/* modal / drawer */
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(8px) saturate(140%); -webkit-backdrop-filter:blur(8px) saturate(140%); z-index:100; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity var(--anim); }
.overlay.show{ opacity:1; pointer-events:auto; }
.modal{ position:relative; background:var(--surface-3); backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); border:1px solid var(--border); border-radius:var(--radius-l); width:560px; max-width:92vw; max-height:88vh; display:flex; flex-direction:column; transform:translateY(8px) scale(.98); opacity:0; transition:transform var(--anim), opacity var(--anim); box-shadow:0 24px 80px -16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); overflow:hidden; }
.modal::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 35%); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
.overlay.show .modal{ transform:translateY(0) scale(1); opacity:1; }
.modal.modal-lg{ width:820px; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft); }
.modal-header h3{ font-family:var(--font-serif); font-style:italic; margin:0; font-size:22px; font-weight:500; letter-spacing:-.005em; line-height:1.2; }
.modal-title-wrap{ min-width:0; display:flex; flex-direction:column; gap:5px; }
.modal-workspace-context{ font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.workspace-context{ display:flex; align-items:center; gap:7px; min-width:0; padding:4px 8px; border:1px solid var(--border-soft); border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--text); font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap; }
.workspace-context .workspace-context-copy{ color:var(--text-muted); font-size:9px; font-weight:600; letter-spacing:.03em; text-transform:none; overflow:hidden; text-overflow:ellipsis; }
.workspace-context .workspace-context-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex:0 0 6px; }
html[data-app-mode="backtest"] .workspace-context{ border-color:var(--border-accent); }
@media (max-width:760px){ .workspace-context .workspace-context-copy{ display:none; } }
.modal-body{ padding:20px; overflow-y:auto; }
.modal-footer{ padding:16px 20px; border-top:1px solid var(--border-soft); display:flex; justify-content:flex-end; gap:8px; }
.modal-tabs{ display:flex; gap:2px; padding:0 20px; border-bottom:1px solid var(--border-soft); overflow-x:auto; }
.modal-tab{ padding:12px 12px; font-size:12px; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-weight:600; }
.modal-tab.active{ color:var(--text); border-color:var(--accent); }
.modal-tabpanel{ display:none; }
.modal-tabpanel.active{ display:block; }

/* toast */
#toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--surface-3); border:1px solid var(--border); padding:11px 16px; border-radius:var(--radius-s); font-size:13px; box-shadow:var(--shadow-card); display:flex; align-items:center; gap:8px; animation:toastIn .2s ease; }
.toast.t-success{ border-color:rgba(62,207,142,.4); }
.toast.t-error{ border-color:rgba(232,93,93,.4); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* notification center */
.notif-wrap{ position:relative; }
#notif-btn{ position:relative; }
#notif-btn.has-notif{ color:var(--negative); }
.notif-badge{ position:absolute; top:1px; right:1px; min-width:14px; height:14px; padding:0 3px; border-radius:999px; background:var(--negative); color:#fff; font-size:9px; font-weight:700; font-family:var(--font-mono); line-height:14px; text-align:center; box-shadow:0 0 0 2px var(--surface); }
.notif-panel{ position:absolute; top:calc(100% + 10px); right:0; width:320px; max-height:70vh; overflow-y:auto; background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:0 24px 60px -16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); z-index:60; padding:6px; animation:toastIn .16s ease; }
.notif-panel-head{ font-family:var(--font-display); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); font-weight:500; padding:8px 10px 6px; }
.notif-item{ display:flex; align-items:flex-start; gap:10px; padding:10px; border-radius:var(--radius-s); border:1px solid var(--border-soft); background:var(--surface-2); margin-bottom:6px; }
.notif-item:last-child{ margin-bottom:0; }
.notif-item-icon{ flex:0 0 28px; width:28px; height:28px; border-radius:8px; background:var(--negative-dim); color:var(--negative); display:flex; align-items:center; justify-content:center; }
.notif-item-icon svg{ width:14px; height:14px; }
.notif-item-body{ flex:1; min-width:0; }
.notif-item-title{ font-size:12.5px; font-weight:600; color:var(--text); }
.notif-item-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; line-height:1.4; }
.notif-item .notif-resolve{ margin-top:8px; }
.notif-empty{ padding:26px 14px; text-align:center; font-size:12.5px; color:var(--text-faint); }
.field-alert label.field-label{ color:var(--negative); }
.field-alert select{ border-color:var(--negative); box-shadow:0 0 0 1px var(--negative-dim); animation:fieldAlertPulse 1.6s ease-in-out 2; }
@keyframes fieldAlertPulse{ 0%,100%{ box-shadow:0 0 0 1px var(--negative-dim); } 50%{ box-shadow:0 0 0 3px var(--negative-dim); } }
.field-alert-note{ font-size:11px; color:var(--negative); margin-top:4px; }

/* command menu */
#command-overlay{ background:rgba(4,5,7,.72); backdrop-filter:blur(10px) saturate(140%); -webkit-backdrop-filter:blur(10px) saturate(140%); }
#command-overlay .modal{ width:620px; max-width:92vw; align-self:flex-start; margin-top:12vh; background:var(--surface-3); box-shadow:0 30px 100px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(var(--accent-rgb),.06), inset 0 1px 0 rgba(255,255,255,.08); }
.cmd-input{ display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border-soft); }
.cmd-input svg{ width:17px; height:17px; color:var(--text-faint); flex:0 0 auto; }
.cmd-input input{ border:none; background:transparent; font-size:16px; padding:4px 0; letter-spacing:.005em; }
.cmd-input input:focus{ border:none; background:transparent; }
.cmd-input input::placeholder{ color:var(--text-faint); }
.cmd-list{ max-height:420px; overflow-y:auto; padding:10px 10px 6px; }
.cmd-group{ margin-bottom:10px; }
.cmd-group:last-child{ margin-bottom:0; }
.cmd-group-label{ font-family:var(--font-display); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); padding:8px 10px 6px; }
.cmd-item{ display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:var(--radius-s); cursor:pointer; font-size:13px; color:var(--text-muted); transition:background .12s ease, color .12s ease; }
.cmd-item span:not(.k){ color:var(--text); }
.cmd-item svg{ opacity:.75; flex:0 0 auto; }
.cmd-item.sel, .cmd-item:hover{ background:rgba(var(--accent-rgb),.08); }
.cmd-item.sel svg, .cmd-item:hover svg{ opacity:1; color:var(--accent); }
.cmd-item .k{ margin-left:auto; font-size:10px; color:var(--text-faint); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-family:var(--font-mono); }
.cmd-empty{ padding:28px 14px; text-align:center; color:var(--text-faint); font-size:13px; }
.cmd-footer{ display:flex; align-items:center; gap:16px; padding:12px 20px; border-top:1px solid var(--border-soft); }
.cmd-footer .cmd-hint{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-faint); }
.cmd-footer .cmd-hint kbd{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; }
@media (max-width: 640px){
  #command-overlay{ align-items:flex-end; }
  #command-overlay .modal{ width:100vw; max-width:100vw; margin-top:0; align-self:flex-end; max-height:88vh; border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
  .cmd-input{ padding:16px 16px calc(14px + env(safe-area-inset-top)); }
  .cmd-input input{ font-size:16px; } /* prevents iOS auto-zoom on focus */
  .cmd-item{ padding:13px 12px; }
  .cmd-footer{ display:none; } /* keyboard hints are meaningless on touch */
}

/* misc */
.muted{ color:var(--text-muted); }

.faint{ color:var(--text-faint); }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.flex{ display:flex; align-items:center; }
.flex-between{ display:flex; align-items:center; justify-content:space-between; }
.gap-8{ gap:8px; } .gap-12{ gap:12px; } .gap-16{ gap:16px; }
hr.divider{ border:none; border-top:1px solid var(--border-soft); margin:16px 0; }
.two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
.trade-grid{ grid-template-columns:repeat(3,1fr); gap:16px; }
.trade-card{ display:flex; flex-direction:column; padding:18px 18px; cursor:pointer; }
.trade-card:hover{ border-color:var(--card-border-hover); }
.trade-card-top{ display:flex; align-items:center; gap:10px; }
.trade-card-pnl{ margin-left:auto; font-size:18px; font-weight:600; }
.trade-card-meta, .trade-card-prices{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
.trade-card-tags{ display:flex; flex-wrap:wrap; }
.trade-card-lesson{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--border-soft); }
.trade-card-actions{ display:flex; gap:6px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft); }
.trade-card-actions .btn{ flex:1; justify-content:center; }
.chart-container{ width:100%; }
.progress-bar{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.progress-bar .fill{ height:100%; border-radius:999px; background:var(--accent); transition:width .3s ease; }

/* Updates panel — spinning icon reuses the app's existing reduced-motion rules above */
@keyframes updSpin{ to{ transform:rotate(360deg); } }
.upd-spin{ animation:updSpin .9s linear infinite; }
.slider-row{ display:flex; align-items:center; gap:10px; }
.slider-row .val{ width:26px; text-align:right; font-weight:650; font-variant-numeric:tabular-nums; }
.tab-chip-group{ display:flex; gap:6px; flex-wrap:wrap; }
.tab-chip{ padding:6px 12px; border-radius:999px; border:1px solid var(--border); font-size:12px; cursor:pointer; color:var(--text-muted); }
.tab-chip.active{ background:var(--accent-glow); border-color:rgba(var(--accent-rgb),.55); color:var(--accent); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.12); }
.day-cell{ aspect-ratio:1; min-height:38px; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; cursor:pointer; position:relative; border:1px solid transparent; padding:2px; }
.day-cell:hover{ border-color:var(--border); }
.day-cell-day{ font-size:10.5px; font-weight:700; line-height:1; }
.day-cell-pnl{ font-size:8.5px; font-weight:600; line-height:1; letter-spacing:.01em; }
.screenshot-thumb{ width:100%; border-radius:var(--radius-s); border:1px solid var(--border-soft); cursor:zoom-in; display:block; }
.upload-drop{ border:1.5px dashed var(--border); border-radius:var(--radius-s); padding:18px; text-align:center; font-size:12px; color:var(--text-faint); cursor:pointer; }
.upload-drop:hover{ border-color:var(--accent); color:var(--text-muted); }
.media-preview{ width:100%; aspect-ratio:16/9; border-radius:var(--radius-s); overflow:hidden; background:var(--surface-2); margin-bottom:12px; }
.media-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
.trade-card-preview{ margin:-2px -2px 12px; }
.pb-card-preview{ margin-bottom:10px; }
.pm-thumb{ width:44px; height:30px; border-radius:5px; overflow:hidden; background:var(--surface-2); display:inline-block; vertical-align:middle; }
.pm-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

@media (max-width: 1100px){
  #sidebar, #sidebar-scrim, #menu-toggle, #quick-add-btn{
    display:none !important;
  }

  #main{
    margin-left:0;
    padding-top:42px;
  }

  .kpi-row, .kpi-row2{ grid-template-columns:repeat(2,1fr); }
  .two-col{ grid-template-columns:1fr; }
  .trade-grid{ grid-template-columns:repeat(2,1fr); }
  #page-content{ padding:22px 22px calc(96px + env(safe-area-inset-bottom)); }
  table thead{ display:none; }
  .modal{ width:94vw; }
}
@media (max-width: 640px){
  .kpi-row, .kpi-row2, .grid-2, .grid-3, .grid-4{ grid-template-columns:1fr; }
  .trade-grid{ grid-template-columns:1fr; }
  #page-content{ padding:18px 16px calc(92px + env(safe-area-inset-bottom)); }
  .page-header h1{ font-size:24px; }
  #topbar{ padding:0 12px; gap:8px; }
  .topbar-left{ min-width:0; }
  .workspace-context{ display:none; }
  .topbar-right{ gap:4px; flex:0 0 auto; }
  #sync-status, .topbar-right > .topbar-sep:first-of-type{ display:none; }
  .app-mode-switch{ min-width:0; }
  .app-mode-option{ min-width:0; padding:5px 7px; font-size:8px; }
  /* Rank 25 — existing modal workflows become touch-safe bottom sheets. */
  .overlay{ align-items:flex-end; padding:0; }
  .overlay .modal, .overlay .modal.modal-lg{ width:100vw; max-width:100vw; max-height:92vh; border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
  .modal-header{ padding:16px; }
  .modal-body{ padding:16px; -webkit-overflow-scrolling:touch; }
  .modal-footer{ padding:12px 16px calc(12px + env(safe-area-inset-bottom)); flex-wrap:wrap; }
  .modal-footer .btn{ min-height:44px; flex:1 1 132px; justify-content:center; }
  .modal-body input:not([type="checkbox"]):not([type="radio"]), .modal-body select, .modal-body textarea{ min-height:44px; font-size:16px; }
  .modal-body input[type="checkbox"], .modal-body input[type="radio"]{ min-width:20px; min-height:20px; }
  .modal-body .field-row, .modal-body .form-row{ display:grid; grid-template-columns:1fr; gap:12px; }
  .trade-card{ padding:16px; }
  .trade-card-actions{ gap:8px; }
  .trade-card-actions .btn{ min-height:44px; }
  .review-queue-banner .flex-between{ align-items:stretch; flex-direction:column; }
  .review-queue-banner .btn{ min-height:44px; width:100%; justify-content:center; }
}

/* ===================================================================
   MOBILE COMMAND DOCK + MORE SHEET
   Mobile's own navigation system — not a shrunk Command Rail.
   Hidden entirely above 1100px (wide desktop keeps the Command Rail).
   =================================================================== */
#mobile-dock{ display:none; }
@media (max-width: 1100px){
  #mobile-dock{
    display:flex; align-items:stretch; justify-content:space-between;
    position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
    height:60px; padding:0 4px; z-index:45; border-radius:var(--radius-xl);
    background:var(--surface-3); border:1px solid var(--border);
    backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%);
    -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%);
    box-shadow:0 16px 50px -14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
}
.dock-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--text-faint); cursor:pointer; padding:6px 2px; min-width:44px;
  font-family:var(--font-ui); transition:color .15s ease;
}
.dock-item svg{ width:19px; height:19px; }
.dock-item .dock-label{ font-size:9.5px; font-weight:500; letter-spacing:.01em; }
.dock-item:active{ opacity:.7; }
.dock-item.active{ color:var(--accent); }
.dock-item.active .dock-label{ font-weight:600; }
.dock-create{
  flex:0 0 50px; align-self:center; width:50px; height:50px; border-radius:50%; margin-top:-22px;
  background:linear-gradient(135deg, var(--accent), var(--accent-dim)); color:var(--accent-ink);
  box-shadow:0 8px 22px -6px rgba(var(--accent-rgb),.45), 0 0 0 4px var(--bg-0, #050608);
}
html[data-theme="light"] .dock-create{ box-shadow:0 8px 22px -6px rgba(var(--accent-rgb),.30), 0 0 0 4px var(--bg-0); }
.dock-create svg{ width:20px; height:20px; }
.dock-create .dock-label{ display:none; }
.dock-create:active{ transform:scale(.94); }

#mobile-sheet-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.45); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); z-index:91; opacity:0; pointer-events:none; transition:opacity .2s ease; }
#mobile-sheet-scrim.show{ opacity:1; pointer-events:auto; }
#mobile-more-sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:92; max-height:88vh; display:flex; flex-direction:column;
  background:var(--surface-3); border-top:1px solid var(--border); border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%); -webkit-backdrop-filter:blur(calc(var(--glass-blur) + 6px)) saturate(180%);
  box-shadow:0 -20px 60px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); padding-bottom:env(safe-area-inset-bottom);
}
#mobile-more-sheet.show{ transform:translateY(0); }
.msheet-handle{ flex:0 0 auto; display:flex; justify-content:center; padding:10px 0 4px; }
.msheet-handle::before{ content:''; width:36px; height:4px; border-radius:999px; background:var(--border); }
.msheet-brand{ flex:0 0 auto; padding:6px 20px 12px; font-family:var(--font-serif); font-style:italic; font-size:17px; font-weight:500; color:var(--text); }
.msheet-search{ flex:0 0 auto; margin:0 16px 14px; display:flex; align-items:center; gap:9px; padding:11px 13px; border-radius:var(--radius-m); background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-faint); font-size:13px; }
.msheet-search svg{ width:14px; height:14px; flex:0 0 auto; }
.msheet-body{ flex:1; overflow-y:auto; padding:0 12px 18px; -webkit-overflow-scrolling:touch; }
.msheet-group{ margin-bottom:16px; }
.msheet-group-label{ display:flex; align-items:baseline; gap:8px; padding:0 8px 8px; font-family:var(--font-display); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
.msheet-group-label .grp-num{ font-family:var(--font-mono); font-size:10px; opacity:.65; }
.msheet-nav-item{ display:flex; align-items:center; gap:13px; padding:13px 10px; border-radius:var(--radius-m); color:var(--text-muted); font-size:14.5px; font-weight:500; cursor:pointer; min-height:44px; transition:background .15s ease, color .15s ease; }
.msheet-nav-item svg{ width:17px; height:17px; opacity:.8; flex:0 0 17px; }
.msheet-nav-item.active{ background:rgba(var(--accent-rgb),.09); color:var(--text); }
.msheet-nav-item.active svg{ opacity:1; color:var(--accent); }
.msheet-nav-item:active{ background:rgba(var(--accent-rgb),.06); }
.msheet-system{ margin-top:4px; padding-top:14px; border-top:1px solid var(--border-soft); }
.msheet-context{ display:flex; gap:10px; padding:2px 8px 4px; }
.msheet-context .rail-block{ flex:1; padding:12px; border-radius:var(--radius-m); background:var(--surface-2); border:1px solid var(--border-soft); }


/* ===================================================================
   APPLE-STYLE DASHBOARD
   Scoped to .apple-dash so it never affects other pages.
   Design language: Switzer / SF Pro, generous whitespace, frosted glass,
   very large numeric display, soft shadows, no harsh borders, 16-22px
   rounded corners, pill chips, and #F3F8FC frost as the identity color.
   =================================================================== */
.apple-dash{
  --ad-radius-lg: 22px;
  --ad-radius-md: 16px;
  --ad-radius-sm: 12px;
  --ad-pad-lg: 28px;
  --ad-pad-md: 22px;
  --ad-pad-sm: 16px;
  --ad-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px -16px rgba(0,0,0,.55), 0 2px 8px -2px rgba(0,0,0,.35);
  --ad-divider: rgba(255,255,255,.06);
  --ad-tile-bg: rgba(255,255,255,.035);
  --ad-tile-bg-hover: rgba(255,255,255,.055);
  font-family: var(--font-ui);
}

/* HERO CARD — Apple's "Apple Card" / Wallet-style balance card */
.apple-dash .ad-hero{
  position: relative;
  border-radius: var(--ad-radius-lg);
  padding: 36px 36px 32px;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(var(--accent-rgb),.18) 0%, transparent 55%),
    radial-gradient(80% 60% at 0% 100%, rgba(var(--accent-rgb),.08) 0%, transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: var(--ad-shadow);
  overflow: hidden;
  margin-bottom: 22px;
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
}
.apple-dash .ad-hero::before{
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, transparent 30%);
  pointer-events: none; border-radius: inherit;
}
.apple-dash .ad-hero-row{
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
  flex-wrap: wrap; position: relative; z-index: 1;
}
.apple-dash .ad-hero-greeting{
  font-family: var(--font-ui);
  font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 6px;
}
.apple-dash .ad-hero-name{
  font-family: var(--font-serif); font-style: italic; font-weight: 700;
  font-size: 30px; line-height: 1.15; letter-spacing: -.045em;
  color: var(--text); margin-bottom: 28px;
}
.apple-dash .ad-hero-balance-label{
  font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 6px;
}
.apple-dash .ad-hero-balance{
  font-family: var(--font-mono);
  font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  margin-bottom: 8px;
}
.apple-dash .ad-hero-balance.pos{ color: var(--positive); text-shadow: 0 0 32px rgba(var(--accent-rgb),.25); }
.apple-dash .ad-hero-balance.neg{ color: var(--negative); text-shadow: 0 0 28px rgba(var(--negative-rgb),.18); }
.apple-dash .ad-hero-delta{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  background: rgba(255,255,255,.05);
  font-size: 12px; font-weight: 600; font-family: var(--font-mono);
  color: var(--text-muted);
}
.apple-dash .ad-hero-delta.pos{ background: var(--positive-dim); color: var(--positive); }
.apple-dash .ad-hero-delta.neg{ background: var(--negative-dim); color: var(--negative); }

/* Hero right column: session + time */
.apple-dash .ad-hero-right{
  display: flex; flex-direction: column; align-items: flex-end; gap: 18px;
  min-width: 220px;
}
.apple-dash .ad-session{
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 999px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.06);
  font-size: 12px; font-weight: 600;
  color: var(--text);
}
.apple-dash .ad-session .dot{
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-faint);
  box-shadow: 0 0 0 0 rgba(var(--accent-rgb),.6);
}
.apple-dash .ad-session.live .dot{
  background: var(--positive);
  animation: ad-pulse 1.8s ease-out infinite;
}
.apple-dash .ad-session.live{
  background: var(--positive-dim);
  color: var(--positive);
  border-color: transparent;
}
@keyframes ad-pulse{
  0%   { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),.55); }
  70%  { box-shadow: 0 0 0 10px rgba(var(--accent-rgb),0); }
  100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0); }
}
.apple-dash .ad-time{
  text-align: right;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.apple-dash .ad-time-clock{
  font-size: 28px; font-weight: 600; letter-spacing: -.01em; color: var(--text); line-height: 1;
}
.apple-dash .ad-time-tz{
  font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-faint); margin-top: 4px;
}

/* CONTROL ROW — segmented range + account picker (Apple-style segmented control) */
.apple-dash .ad-controls{
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-bottom: 22px; flex-wrap: wrap;
}
.apple-dash .ad-section-title{
  font-family: var(--font-display);
  font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 14px;
}
.apple-dash .ad-segmented{
  display: inline-flex; padding: 3px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 999px;
  gap: 2px;
}
.apple-dash .ad-segmented .ad-seg{
  padding: 6px 13px; border-radius: 999px;
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  cursor: pointer; transition: all .18s ease;
  font-family: var(--font-mono); letter-spacing: .02em;
}
.apple-dash .ad-segmented .ad-seg:hover{ color: var(--text); }
.apple-dash .ad-segmented .ad-seg.active{
  background: rgba(255,255,255,.10);
  color: var(--text);
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 1px 3px rgba(0,0,0,.25);
}
.apple-dash .ad-select{
  padding: 7px 14px; border-radius: 999px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.06);
  color: var(--text); font-size: 12px; font-weight: 600; font-family: var(--font-ui);
  cursor: pointer; outline: none;
  appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238FA39C' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center;
  padding-right: 30px;
}
.apple-dash .ad-select:hover{ background-color: rgba(255,255,255,.08); }

/* KPI TILE GRID — Apple Health rings style */
.apple-dash .ad-kpi-grid{
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
  margin-bottom: 28px;
}
.apple-dash .ad-kpi{
  position: relative;
  border-radius: var(--ad-radius-md);
  padding: var(--ad-pad-md) var(--ad-pad-md) 18px;
  background: var(--ad-tile-bg);
  border: 1px solid rgba(255,255,255,.06);
  box-shadow: var(--ad-shadow);
  transition: all .2s ease;
  cursor: default;
  overflow: hidden;
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
}
.apple-dash .ad-kpi:hover{
  background: var(--ad-tile-bg-hover);
  transform: translateY(-1px);
}
.apple-dash .ad-kpi-label{
  font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
}
.apple-dash .ad-kpi-label .ad-kpi-icon{
  width: 14px; height: 14px; opacity: .55;
}
.apple-dash .ad-kpi-value{
  font-family: var(--font-mono);
  font-size: 30px; font-weight: 600; line-height: 1.05; letter-spacing: -.015em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.apple-dash .ad-kpi-value.pos{ color: var(--positive); }
.apple-dash .ad-kpi-value.neg{ color: var(--negative); }
.apple-dash .ad-kpi-sub{
  font-size: 11.5px; color: var(--text-muted); margin-top: 8px;
  font-weight: 500;
}

/* TWO-COLUMN ROWS */
.apple-dash .ad-row{
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 22px;
}
.apple-dash .ad-card{
  border-radius: var(--ad-radius-md);
  padding: var(--ad-pad-md);
  background: var(--ad-tile-bg);
  border: 1px solid rgba(255,255,255,.06);
  box-shadow: var(--ad-shadow);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
}
.apple-dash .ad-card-head{
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.apple-dash .ad-card-title{
  font-family: var(--font-display);
  font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-muted);
}
.apple-dash .ad-card-desc{
  font-size: 11.5px; color: var(--text-faint); margin-top: 2px;
}
.apple-dash .ad-card-body{ min-height: 0; }

/* BREAKDOWN SEGMENTED */
.apple-dash .ad-breakdown{
  display: flex; align-items: center; gap: 24px;
  padding: 6px 0 0;
}
.apple-dash .ad-breakdown-chart{ flex: 0 0 auto; position: relative; }
.apple-dash .ad-breakdown-legend{ flex: 1; min-width: 0; }
.apple-dash .ad-legend-row{
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--ad-divider);
}
.apple-dash .ad-legend-row:last-child{ border-bottom: none; }
.apple-dash .ad-legend-swatch{
  width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px;
}
.apple-dash .ad-legend-label{ color: var(--text); font-weight: 500; }
.apple-dash .ad-legend-value{
  margin-left: auto; font-family: var(--font-mono); font-weight: 600;
  color: var(--text-muted);
}

/* ACCOUNT PILLS (Apple Card-style) */
.apple-dash .ad-account{
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid var(--ad-divider);
}
.apple-dash .ad-account:last-child{ border-bottom: none; padding-bottom: 0; }
.apple-dash .ad-account-head{
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.apple-dash .ad-account-name{
  font-size: 14px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.apple-dash .ad-account-meta{
  font-size: 11.5px; color: var(--text-faint); font-weight: 500;
}
.apple-dash .ad-account-rows{
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px;
  font-size: 12.5px; color: var(--text-muted);
}
.apple-dash .ad-account-rows b{
  color: var(--text); font-weight: 600; font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.apple-dash .ad-account-rows .pos{ color: var(--positive); }
.apple-dash .ad-account-rows .neg{ color: var(--negative); }
.apple-dash .ad-progress{
  height: 4px; background: rgba(255,255,255,.06);
  border-radius: 999px; overflow: hidden; margin-top: 4px;
}
.apple-dash .ad-progress .bar{
  height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-dim));
  transition: width .4s ease;
}
.apple-dash .ad-progress-label{
  display: flex; justify-content: space-between;
  font-size: 10.5px; color: var(--text-faint); margin-top: 6px;
  font-weight: 500; letter-spacing: .04em;
}

/* STATUS PILL */
.apple-dash .ad-pill{
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
}
.apple-dash .ad-pill.pos{ background: var(--positive-dim); color: var(--positive); }
.apple-dash .ad-pill.neg{ background: var(--negative-dim); color: var(--negative); }
.apple-dash .ad-pill.warn{ background: var(--warning-dim); color: var(--warning); }

/* MODEL TABLE (Apple list style) */
.apple-dash .ad-table{
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.apple-dash .ad-table thead th{
  text-align: left; padding: 0 14px 12px;
  font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-faint); border-bottom: 1px solid var(--ad-divider);
}
.apple-dash .ad-table tbody td{
  padding: 14px; border-bottom: 1px solid var(--ad-divider);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}
.apple-dash .ad-table tbody tr:last-child td{ border-bottom: none; }
.apple-dash .ad-table tbody tr:hover td{ background: rgba(255,255,255,.02); }
.apple-dash .ad-table .ad-name{
  font-family: var(--font-ui); font-weight: 600; color: var(--text);
}
.apple-dash .ad-table .pos{ color: var(--positive); }
.apple-dash .ad-table .neg{ color: var(--negative); }

/* HEATMAP — Apple calendar look */
.apple-dash .ad-heatmap{ padding: 6px 4px 0; }
.apple-dash .ad-heatmap-nav{
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,.05);
  border-radius: 999px; padding: 3px;
}
.apple-dash .ad-heatmap-nav .ad-heatbtn{
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted);
  transition: all .15s ease;
}
.apple-dash .ad-heatmap-nav .ad-heatbtn:hover{ background: rgba(255,255,255,.08); color: var(--text); }
.apple-dash .ad-heatmap-nav .ad-heatlabel{
  font-size: 12.5px; font-weight: 600; color: var(--text);
  font-family: var(--font-display); letter-spacing: .04em;
  padding: 0 8px;
}

/* RESPONSIVE */
@media (max-width: 1100px){
  .apple-dash .ad-kpi-grid{ grid-template-columns: repeat(3, 1fr); }
  .apple-dash .ad-row{ grid-template-columns: 1fr; }
}
@media (max-width: 700px){
  .apple-dash .ad-hero{ padding: 24px 22px 22px; }
  .apple-dash .ad-hero-name{ font-size: 24px; }
  .apple-dash .ad-hero-balance{ font-size: 40px; }
  .apple-dash .ad-hero-right{ min-width: 0; align-items: flex-start; }
  .apple-dash .ad-kpi-grid{ grid-template-columns: repeat(2, 1fr); }
  .apple-dash .ad-row{ grid-template-columns: 1fr; }
  .apple-dash .ad-breakdown{ flex-direction: column; align-items: flex-start; gap: 16px; }
  .apple-dash .ad-account-rows{ grid-template-columns: 1fr; }
}
/* ===== Auth screen ===== */
#auth-screen{ position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; background:var(--bg); background-image:var(--bg-ambient); padding:20px; }
#auth-screen .auth-card{ width:100%; max-width:380px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-l); padding:32px 28px; backdrop-filter:blur(var(--glass-blur)); box-shadow:var(--shadow-card); }
#auth-screen .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
#auth-screen .auth-brand .mark-icon{ width:38px;height:38px;overflow:hidden;border-radius:12px;background:transparent; }
#auth-screen .auth-brand .mark-icon img{ width:100%;height:100%;display:block;object-fit:cover; }
#auth-screen h1{ font-family:var(--font-serif); font-style:italic; font-weight:500; font-size:22px; margin:0 0 4px; color:var(--text); }
#auth-screen .auth-sub{ font-size:12.5px; color:var(--text-muted); margin:0 0 22px; }
#auth-screen .field{ margin-bottom:14px; }
#auth-screen input[type=email], #auth-screen input[type=password], #auth-screen input[type=text]{
  width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s);
  color:var(--text); font:400 13px var(--font-ui); padding:10px 12px; outline:none; transition:border-color var(--anim), background var(--anim);
}
#auth-screen input:focus{ border-color:var(--accent); background:var(--surface-3); }
#auth-screen .auth-error{ font-size:12px; color:var(--negative); margin:2px 0 12px; min-height:14px; }
#auth-screen .auth-switch{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:18px; }
#auth-screen .auth-switch button{ background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;padding:0; }
#auth-screen .btn-block{ width:100%; justify-content:center; }
#auth-screen .auth-loading{ text-align:center; color:var(--text-muted); font-size:13px; }
.sync-dot{ width:6px;height:6px;border-radius:50%; display:inline-block; margin-right:6px; background:var(--text-faint); }
.sync-dot.saving{ background:var(--warning); box-shadow:0 0 0 0 rgba(var(--warning-rgb),.5); animation:syncpulse 1s infinite; }
.sync-dot.synced{ background:var(--positive); }
.sync-dot.error{ background:var(--negative); }
.sync-dot.pending{ background:var(--warning); box-shadow:0 0 0 0 rgba(var(--warning-rgb),.42); animation:syncpulse 1.4s infinite; }
.sync-dot.failed{ background:var(--negative); box-shadow:0 0 0 3px rgba(var(--negative-rgb),.14); }
.sync-dot.conflict{ background:var(--warning); box-shadow:0 0 0 3px rgba(var(--warning-rgb),.16); }
.sync-dot.unprotected{ background:var(--warning); }
@keyframes syncpulse{ 0%{box-shadow:0 0 0 0 rgba(var(--warning-rgb),.45);} 70%{box-shadow:0 0 0 6px rgba(var(--warning-rgb),0);} 100%{box-shadow:0 0 0 0 rgba(var(--warning-rgb),0);} }
/* =========================================================
   ASCEND ELECTRON — CUSTOM WINDOW TITLE BAR
   Must be placed AFTER all other CSS

/* =========================================================
   ASCEND ELECTRON — WINDOW RESIZE ZONES
   ========================================================= */

#resize-top,
#resize-bottom,
#resize-left,
#resize-right,
#resize-top-left,
#resize-top-right,
#resize-bottom-left,
#resize-bottom-right {
    position: fixed;
    z-index: 1000000;

    -webkit-app-region: no-drag;

    pointer-events: auto;
}


/* -----------------------------------------
   TOP
   ----------------------------------------- */

#resize-top {
    top: 0;
    left: 8px;
    right: 8px;
    height: 5px;

    cursor: ns-resize;
}


/* -----------------------------------------
   BOTTOM
   ----------------------------------------- */

#resize-bottom {
    bottom: 0;
    left: 8px;
    right: 8px;
    height: 8px;

    cursor: ns-resize;
}


/* -----------------------------------------
   LEFT
   ----------------------------------------- */

#resize-left {
    top: 8px;
    bottom: 8px;
    left: 0;
    width: 5px;

    cursor: ew-resize;
}


/* -----------------------------------------
   RIGHT
   ----------------------------------------- */

#resize-right {
    top: 8px;
    bottom: 8px;
    right: 0;
    width: 5px;

    cursor: ew-resize;
}


/* -----------------------------------------
   CORNERS
   ----------------------------------------- */

#resize-top-left {
    top: 0;
    left: 0;

    width: 8px;
    height: 8px;

    cursor: nwse-resize;
}

#resize-top-right {
    top: 0;
    right: 0;

    width: 8px;
    height: 8px;

    cursor: nesw-resize;
}

#resize-bottom-left {
    bottom: 0;
    left: 0;

    width: 8px;
    height: 8px;

    cursor: nesw-resize;
}

#resize-bottom-right {
    bottom: 0;
    right: 0;

    width: 8px;
    height: 8px;

    cursor: nwse-resize;
}

/* Web mode deliberately exposes no Electron window controls or resize targets. */
body:not(.ascend-electron) #ascend-titlebar,
body:not(.ascend-electron) #resize-top,
body:not(.ascend-electron) #resize-bottom,
body:not(.ascend-electron) #resize-left,
body:not(.ascend-electron) #resize-right,
body:not(.ascend-electron) #resize-top-left,
body:not(.ascend-electron) #resize-top-right,
body:not(.ascend-electron) #resize-bottom-left,
body:not(.ascend-electron) #resize-bottom-right { display:none !important; }

// ===================== DUAL MODE FOUNDATION =====================
// Application mode is a durable, device-local workspace choice. It is not a

const APP_MODES = Object.freeze({ LIVE:'live', BACKTEST:'backtest' });

const AppModeStore = {

    catch(e){ return DEFAULT_APP_MODE; }
  },
  persist(userId, mode){
    try{ localStorage.setItem(appModeStorageKey(userId), normalizeAppMode(mode)); return true; }

  }
};
// Trade records are classified independently from the active workspace. The
// selector is the single safe way for pages to retrieve live or backtest data.
function normalizeTradeMode(mode){ return normalizeAppMode(mode); }

  const activeMode = normalizeAppMode(mode===undefined ? State.appMode : mode);
  return (trades||[]).filter(trade=>normalizeTradeMode(trade.mode)===activeMode);
}
function getCurrentModeTrades(){ return getModeSafeTrades(State.db, State.appMode); }

// ===================== RANK 6: COMPLETE MODE OWNERSHIP =====================
// Accounts/trades have exact workspace ownership already. Every remaining entity
// now declares an explicit mode; only reference entities may be deliberately Shared.
const MODE_SCOPE_SHARED = 'shared';
const MODE_OWNED_ENTITY_KEYS = Object.freeze(['premarket','dailyReviews','weeklyReviews','monthlyReviews','playbooks','notes']);

function isModeOwnedEntity(key){ return MODE_OWNED_ENTITY_KEYS.includes(key); }

function legacyModeForEntity(key){ return allowsSharedMode(key) ? MODE_SCOPE_SHARED : APP_MODES.LIVE; }
function normalizeOwnedMode(key, value){
  if(value===APP_MODES.LIVE || value===APP_MODES.BACKTEST) return value;

}
function canonicalModeOwnedRecord(key, record){

}
function canonicalizeModeOwnedCollection(key, records){ return (records||[]).map(record=>canonicalModeOwnedRecord(key,record)); }

// Rank 16 — a Playbook is a logical model with immutable user-authored versions.
// Trade links store their own version snapshot so future model edits cannot rewrite
// the process context that was recorded with an historic trade.
const PLAYBOOK_SNAPSHOT_FIELDS=Object.freeze(['name','description','market','direction','session','htfScreenshot','htfRequirements','ltfRequirements','entryConditions','confirmation','stopPlacement','targetLogic','riskRules','invalidations','notes','mode']);

}

// Rank 18 — structured Backtest research remains an additive payload on an
// existing Backtest note. It never imports market data or recommends a decision.
const BACKTEST_RESEARCH_DECISIONS=Object.freeze(['undecided','keep_testing','refine_hypothesis','archive']);
function backtestResearchStatus(research){
  const value=research&&typeof research==='object'?research:{};

// ===================== PHASE 2: MODE-SPECIFIC ACCOUNTS =====================

function weekRangeOf(dateStr){

  const sowSunday = sow === 'Sunday';

function repairTradeAccountLinks(db){
  // Fixes trades whose accountId doesn't match any current account.id (e.g. left over
  // from an account being recreated, an older build that stored the account name
  // instead of its id, or a stale id from a prior export). Never guesses between
  // multiple candidate accounts — only resolves a trade when its intended account
  // can be determined unambiguously from the backup's own data.
  const accountsCount = (db.accounts||[]).length;
  const tradesCount = (db.trades||[]).length;
  if(!db.accounts || !db.trades) return { repaired: 0, unresolved: [], accountsCount, tradesCount, details: [] };
  const byId = new Map(db.accounts.map(a=>[String(a.id).trim(), a]));
  const byName = new Map();
  db.accounts.forEach(a=>{
    const name = (a.accountName||'').trim().toLowerCase();
    if(!name) return;
    byName.set(name, (byName.get(name)||[]).concat(a));
  });
  let repaired = 0;
  const unresolved = [];
  const details = [];
  db.trades.forEach(t=>{
    if(!t.accountId) return;
    const expectedMode = normalizeTradeMode(t.mode);
    const rawId = String(t.accountId).trim();
    const exact = byId.get(rawId);
    if(exact){
      if(normalizeAccountMode(exact.mode)===expectedMode) return;
      unresolved.push(t.id);
      details.push({ tradeId:t.id, from:t.accountId, reason:'account exists in the opposite mode' });
      return;
    }
    // Name repair remains available for legacy backups, but candidates are first
    // restricted to the trade mode. Same-name Live and Backtest accounts can never
    // be confused with one another.
    const candidates=(byName.get(rawId.toLowerCase())||[]).filter(account=>normalizeAccountMode(account.mode)===expectedMode);
    if(candidates.length===1){
      details.push({ tradeId:t.id, from:t.accountId, to:candidates[0].id, reason:'matched by account name within the same mode' });
      t.accountId=candidates[0].id; repaired++; return;
    }
    if(candidates.length>1){
      unresolved.push(t.id);
      details.push({ tradeId:t.id, from:t.accountId, reason:`ambiguous: ${candidates.length} same-mode accounts share that name` });
      return;
    }
    const onlySameModeAccounts=(db.accounts||[]).filter(account=>normalizeAccountMode(account.mode)===expectedMode);
    if(onlySameModeAccounts.length===1){
      details.push({ tradeId:t.id, from:t.accountId, to:onlySameModeAccounts[0].id, reason:'single same-mode account fallback' });
      t.accountId=onlySameModeAccounts[0].id; repaired++; return;
    }
    unresolved.push(t.id);
    details.push({ tradeId:t.id, from:t.accountId, reason:'no same-mode account match' });
  });
  return { repaired, unresolved, accountsCount, tradesCount, details };
}

    const [live, backtest, legacy] = await Promise.all([fetchMode(APP_MODES.LIVE),fetchMode(APP_MODES.BACKTEST),fetchLegacy()]);
    const error=live.error||backtest.error||legacy.error;
    if(error) return { data:null,error };
    const unique=new Map();
    [...(live.data||[]),...(backtest.data||[]),...(legacy.data||[])].forEach(row=>{ const id=row.payload&&row.payload.id; unique.set(id||JSON.stringify(row),row); });

  async loadFullState(userId){
    const [hasTradeModeColumn,hasAccountModeColumn] = await Promise.all([CloudCapabilities.detectTradeModeColumn(),CloudCapabilities.detectAccountModeColumn()]);

      k==='trades' ? this.loadTradeRows(userId,hasTradeModeColumn) : (k==='accounts' ? this.loadAccountRows(userId,hasAccountModeColumn) : sb.from(ENTITY_TABLES[k]).select('payload').eq('user_id', userId).order('created_at', { ascending: true }))

          return Object.assign({}, row.payload, { mode: normalizeAccountMode(sourceMode) });

        const sourceMode = row.payload && row.payload.mode !== undefined ? row.payload.mode : row.mode;

    }

    const legacyAccountIds = (migrated._lastAccountModeMigrationReport||{}).ids || [];
    if(legacyAccountIds.length){
      try{ await this.backfillLegacyAccountModes(userId,migrated.accounts.filter(account=>legacyAccountIds.includes(account.id))); }
      catch(e){ console.warn('ASCEND account-mode backfill deferred; the local migrated data remains safe.',e); }
    }
    if(legacyIds.length){

// Diff-based sync: only changed/removed records are pushed to Supabase, so a save
// never has to reload or rewrite the whole database.
function snapshotEntities(db){
  const snap = {};
  ENTITY_KEYS.forEach(k=>{ snap[k] = new Map((db[k]||[]).map(r=>[r.id, JSON.stringify(r)])); });
  snap.profile = profileSnapshot(db);
  return snap;
}
const CloudSync = {
  _lastSynced: null,
  _pending: false,
  _queued: false,
  setBaseline(db){ this._lastSynced = snapshotEntities(db); },
  setStatus(state){
    const dot = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    if(!dot || !label) return;
    dot.className = 'sync-dot ' + state;
    label.textContent = state==='saving' ? 'Saving…' : state==='error' ? 'Offline' : 'Synced';
  },
  async push(db){
    if(!CURRENT_USER_ID) return;
    if(this._pending){ this._queued = true; return; }
    this._pending = true;
    this.setStatus('saving');
    try{
      const before = this._lastSynced || { profile: null };
      const next = snapshotEntities(db);
      const ops = [];
      ENTITY_KEYS.forEach(k=>{
        const prevMap = before[k] || new Map();
        const nextMap = next[k];
        nextMap.forEach((json, id)=>{ if(prevMap.get(id) !== json) ops.push(CloudDB.upsertRecord(k, JSON.parse(json), CURRENT_USER_ID)); });
        prevMap.forEach((json, id)=>{ if(!nextMap.has(id)) ops.push(CloudDB.deleteRecord(k, id, CURRENT_USER_ID)); });
      });
      if(before.profile !== next.profile) ops.push(CloudDB.saveProfile(CURRENT_USER_ID, db));
      await Promise.all(ops);
      this._lastSynced = next;
      this.setStatus('synced');
    }catch(e){
      console.error('ASCEND cloud sync error', e);
      this.setStatus('error');
      toast('Could not sync to the cloud — your data is safe locally, will retry on next save', 'error');
    }finally{
      this._pending = false;
      if(this._queued){ this._queued = false; this.push(db); }
    }
  }
};


// ===================== RANK 2 — OPTIMISTIC CONCURRENCY =====================
// Revision metadata is deliberately held outside every journal payload. This keeps
// exports/imports backward compatible while allowing every ordinary sync write to
// require the revision observed at the last confirmed cloud hydration.
CloudCapabilities.revisionSupport = null;
CloudCapabilities.detectRevisionSupport = async function(){
  if(this.revisionSupport !== null) return this.revisionSupport;
  const tables = ['profiles'].concat(Object.values(ENTITY_TABLES));
  const checks = await Promise.all(tables.map(table=>sb.from(table).select('revision').limit(1)));
  this.revisionSupport = checks.every(result=>!result.error);
  if(!this.revisionSupport) console.info('ASCEND sync: revision columns unavailable; using the legacy unprotected sync path until Rank 2 migration is present.');
  return this.revisionSupport;
};

CloudDB.loadFullState = async function(userId){
  const [hasTradeModeColumn,hasAccountModeColumn,hasRevision] = await Promise.all([CloudCapabilities.detectTradeModeColumn(),CloudCapabilities.detectAccountModeColumn(),CloudCapabilities.detectRevisionSupport()]);
  const selects = ENTITY_KEYS.map(k=> k==='trades' ? this.loadTradeRows(userId,hasTradeModeColumn,hasRevision) : (k==='accounts' ? this.loadAccountRows(userId,hasAccountModeColumn,hasRevision) : sb.from(ENTITY_TABLES[k]).select(hasRevision ? 'payload,revision,created_at' : 'payload,created_at').eq('user_id',userId).order('created_at',{ascending:true})));
  const profileFields = hasRevision ? 'settings,tags,saved_filters,process_targets,revision,updated_at' : 'settings,tags,saved_filters,process_targets,updated_at';
  const [profileRes,...results] = await Promise.all([sb.from('profiles').select(profileFields).eq('id',userId).maybeSingle(),...selects]);
  results.forEach(result=>{ if(result.error) throw result.error; });
  if(profileRes.error) throw profileRes.error;
  const db = defaultDB();
  const revisions = { profile: hasRevision && profileRes.data ? Number(profileRes.data.revision)||1 : null, entities:{} };
  ENTITY_KEYS.forEach((k,index)=>{
    revisions.entities[k] = new Map();
    db[k] = (results[index].data||[]).map(row=>{
      const payload = row.payload || {};
      if(hasRevision && payload.id) revisions.entities[k].set(payload.id,Number(row.revision)||1);
      if(k==='accounts') return Object.assign({},payload,{mode:normalizeAccountMode(payload.mode!==undefined?payload.mode:row.mode)});
      if(k==='trades') return Object.assign({},payload,{mode:normalizeTradeMode(payload.mode!==undefined?payload.mode:row.mode)});
      return payload;
    });
  });
  if(profileRes.data){
    db.settings=Object.assign(db.settings,profileRes.data.settings||{});
    db.tags=profileRes.data.tags||[];
    db.savedFilters=profileRes.data.saved_filters||[];
    db.processTargets=(profileRes.data.process_targets&&profileRes.data.process_targets.length)?profileRes.data.process_targets:db.processTargets;
  }
  const migrated = migrateDatabase(db);
  const legacyIds=(migrated._lastModeMigrationReport||{}).ids||[];
  const legacyAccountIds=(migrated._lastAccountModeMigrationReport||{}).ids||[];
  if(legacyAccountIds.length){ try{ await this.backfillLegacyAccountModes(userId,migrated.accounts.filter(account=>legacyAccountIds.includes(account.id))); }catch(error){ console.warn('ASCEND account-mode backfill deferred; local migrated data remains safe.',error); } }

CloudDB.fetchRemoteRecord = async function(entityKey,id,userId){
  const table = entityKey==='profile' ? 'profiles' : ENTITY_TABLES[entityKey];
  const fields = entityKey==='profile' ? 'settings,tags,saved_filters,process_targets,revision,updated_at' : 'payload,revision,updated_at';
  const ownerField = entityKey==='profile' ? 'id' : 'id';
  let query = sb.from(table).select(fields).eq(ownerField,id);
  if(entityKey!=='profile') query=query.eq('user_id',userId);
  const { data,error } = await query.maybeSingle();
  if(error) throw error;
  if(!data) return null;
  if(entityKey==='profile') return { record:{settings:data.settings||{},tags:data.tags||[],savedFilters:data.saved_filters||[],processTargets:data.process_targets||[]}, revision:Number(data.revision)||1, updatedAt:data.updated_at||null };
  const record = entityKey==='accounts' ? canonicalAccountRecord(data.payload||{}) : (entityKey==='trades' ? canonicalTradeRecord(data.payload||{}) : data.payload||{});
  return { record,revision:Number(data.revision)||1,updatedAt:data.updated_at||null };
};
CloudDB.writeRecord = async function(entityKey,record,userId,expectedRevision){
  if(isModeOwnedEntity(entityKey) && !isRecordModeValid(entityKey,record)) throw new Error('Record scope is invalid for this journal entity');
  if(entityKey==='trades' && record.accountId && !isTradeAccountModeCompatible(record,State.db)) throw new Error('Trade and account modes must match before cloud sync');
  if(!(await CloudCapabilities.detectRevisionSupport())){ await this._rank1UpsertRecord(entityKey,record,userId); return { applied:true,revision:null,legacy:true }; }
  if(entityKey==='trades') await CloudCapabilities.detectTradeModeColumn();
  if(entityKey==='accounts') await CloudCapabilities.detectAccountModeColumn();
  if(isModeOwnedEntity(entityKey)) await CloudCapabilities.detectCompleteModeOwnership();
  const table=ENTITY_TABLES[entityKey];
  const row=cloudRecord(entityKey,record,userId);
  if(expectedRevision===null || expectedRevision===undefined){
    const {data,error}=await sb.from(table).insert(row).select('revision').maybeSingle();
    if(error){ const remote=await this.fetchRemoteRecord(entityKey,record.id,userId); if(remote) return {applied:false,remote}; throw error; }
    if(!data) return {applied:false,remote:await this.fetchRemoteRecord(entityKey,record.id,userId)};
    return {applied:true,revision:Number(data.revision)||1};
  }
  const {data,error}=await sb.from(table).update(row).eq('id',record.id).eq('user_id',userId).eq('revision',expectedRevision).select('revision').maybeSingle();
  if(error) throw error;
  if(!data) return {applied:false,remote:await this.fetchRemoteRecord(entityKey,record.id,userId)};
  return {applied:true,revision:Number(data.revision)||Number(expectedRevision)+1};
};
CloudDB.deleteRecord = async function(entityKey,id,userId,expectedRevision){

  if(expectedRevision===null) return {applied:true,revision:null};
  const {data,error}=await sb.from(ENTITY_TABLES[entityKey]).delete().eq('id',id).eq('user_id',userId).eq('revision',expectedRevision).select('revision').maybeSingle();
  if(error) throw error;
  if(!data) return {applied:false,remote:await this.fetchRemoteRecord(entityKey,id,userId)};
  return {applied:true,revision:null};
};
CloudDB.saveProfile = async function(userId,db,expectedRevision){

    if(!data) return {applied:false,remote:await this.fetchRemoteRecord('profile',userId,userId)};
    return {applied:true,revision:Number(data.revision)||1};
  }
  const {data,error}=await sb.from('profiles').update(record).eq('id',userId).eq('revision',expectedRevision).select('revision').maybeSingle();
  if(error) throw error;
  if(!data) return {applied:false,remote:await this.fetchRemoteRecord('profile',userId,userId)};

CloudSync._conflicts=[];
CloudSync._revisions={profile:null,entities:{}};
CloudSync.setBaseline=function(db,revisions){
  this._lastSynced=snapshotEntities(db);
  const source=revisions||{profile:null,entities:{}};
  // Revision 1 is the additive migration's default for existing cloud rows. The
  // fallback is used only by deterministic fixtures or immediately after a bulk
  // push; hydrated production rows always supply their authoritative revision.
  this._revisions={profile:source.profile===undefined||source.profile===null?1:source.profile,entities:{}};
  ENTITY_KEYS.forEach(key=>{
    this._revisions.entities[key]=new Map();
    const values=source.entities&&source.entities[key];
    if(values&&typeof values.forEach==='function') values.forEach((revision,id)=>this._revisions.entities[key].set(id,revision));
    (db[key]||[]).forEach(record=>{ if(!this._revisions.entities[key].has(record.id)) this._revisions.entities[key].set(record.id,1); });
  });
};
CloudSync.revisionFor=function(entityKey,id){ return entityKey==='profile' ? this._revisions.profile : ((this._revisions.entities[entityKey]||new Map()).has(id)?this._revisions.entities[entityKey].get(id):null); };
CloudSync._hasConflict=function(entityKey,id){ return this._conflicts.some(conflict=>conflict.entityKey===entityKey&&conflict.id===id); };
CloudSync._upsertBaseline=function(entityKey,id,json,revision){
  if(entityKey==='profile'){ this._lastSynced.profile=json; this._revisions.profile=revision; return; }
  (this._lastSynced[entityKey]||new Map()).set(id,json);
  (this._revisions.entities[entityKey]||new Map()).set(id,revision);
};
CloudSync._removeBaseline=function(entityKey,id){
  if(entityKey==='profile'){ this._lastSynced.profile=null; this._revisions.profile=null; return; }
  (this._lastSynced[entityKey]||new Map()).delete(id);
  (this._revisions.entities[entityKey]||new Map()).delete(id);
};
CloudSync._recordConflict=function(context,result){
  const existing=this._conflicts.find(conflict=>conflict.entityKey===context.entityKey&&conflict.id===context.id);
  const value=Object.assign({},context,{remote:result&&result.remote?result.remote:null,detectedAt:nowISO()});
  if(existing) Object.assign(existing,value); else this._conflicts.push(value);
  this.setStatus('conflict');

      if(aDelete!==bDelete) return aDelete?-1:1;

      return (deletePriority[a.entityKey]===undefined?1:deletePriority[a.entityKey])-(deletePriority[b.entityKey]===undefined?1:deletePriority[b.entityKey]);

CloudSync.push=async function(db){
  if(!CURRENT_USER_ID) return;

  catch(error){
    // A cold start may be offline before capability detection can complete. If this
    // device has a previously confirmed baseline, retain local intent immediately
    // instead of waiting for another edit after connectivity returns.
    if(this._rank3BaselineReady) this.enqueueDiff(db);

  }

};
CloudSync.retryNow=async function(){ this._queue.forEach(entry=>{entry.nextAttemptAt=nowISO();}); this._persistQueue(); await this.processQueue({force:true}); };
CloudSync.cancelQueuedChange=function(entityKey,id){
  const entry=this._entryFor(entityKey,id); if(!entry || this._pending || this._hasConflict(entityKey,id)) return false;
  if(entry.entityKey==='profile'){
    if(entry.baseRecord){ State.db.settings=Object.assign(defaultDB().settings,entry.baseRecord.settings||{}); State.db.tags=entry.baseRecord.tags||[]; State.db.savedFilters=entry.baseRecord.savedFilters||[]; State.db.processTargets=entry.baseRecord.processTargets||defaultDB().processTargets; }
  } else {
    const reverse=Object.assign({},entry,{kind:entry.baseRecord?'write':'delete',localRecord:entry.baseRecord?rank3Clone(entry.baseRecord):null}); this._applyOperationToLocal(reverse,State.db);
  }
  this._removeEntry(entityKey,id); DB.persist(State.db); this._renderStatus(); router(); return true;
};
CloudSync.openQueueReview=function(){

  const entries=this._queue;
  const last=this._lastSuccessfulSync?new Date(this._lastSuccessfulSync).toLocaleString():'Not yet recorded on this device';
  const rows=entries.length?entries.map(entry=>'<div class="card" style="margin:8px 0;padding:11px;"><div style="display:flex;justify-content:space-between;gap:8px;"><b>'+esc(rank3RecordLabel(entry.entityKey))+'</b><span class="badge '+(entry.lastError?'b-neg':'b-accent')+'">'+esc(entry.kind==='delete'?'Delete':entry.kind==='profile'?'Settings':'Save')+'</span></div><div class="hint" style="margin-top:5px;">'+(entry.lastError?'Last issue: '+esc(entry.lastError):'Waiting to sync')+' · '+(entry.attempts?'attempt '+esc(entry.attempts)+'; ':'')+'next retry '+esc(new Date(entry.nextAttemptAt||Date.now()).toLocaleString())+'</div><div style="margin-top:9px;"><button class="btn btn-ghost" data-queue-cancel="'+esc(entry.entityKey)+'" data-queue-id="'+esc(entry.recordId)+'">Cancel local change</button></div></div>').join(''):'<div class="empty-state"><p>No pending operations. Your local cache and cloud baseline agree.</p></div>';
  Modal.open({

  return { accounts:(source.accounts||[]).length, liveAccounts:(source.accounts||[]).filter(account=>normalizeAccountMode(account.mode)===APP_MODES.LIVE).length, backtestAccounts:(source.accounts||[]).filter(account=>normalizeAccountMode(account.mode)===APP_MODES.BACKTEST).length, trades:(source.trades||[]).length, liveTrades:mode.live, backtests:mode.backtest, premarket:(source.premarket||[]).length, dailyReviews:(source.dailyReviews||[]).length, weeklyReviews:(source.weeklyReviews||[]).length, monthlyReviews:(source.monthlyReviews||[]).length, playbooks:(source.playbooks||[]).length, notes:(source.notes||[]).length };

const Trash = {
  async move(entityKey,id){
    if(!CURRENT_USER_ID || !State.db || !ENTITY_KEYS.includes(entityKey)) return false;
    if(!(await RecoveryDB.detect())){ toast('Trash is unavailable until the Rank 4 migration is installed. Nothing was deleted.','error'); return false; }
    const collection=State.db[entityKey]||[]; const index=collection.findIndex(record=>idEq(record.id,id));
    if(index<0) return false;
    const record=rank4Clone(collection[index]); const sourceRevision=CloudSync.revisionFor(entityKey,record.id);
    if(sourceRevision===null || sourceRevision===undefined){ toast('This record has not reached a confirmed cloud baseline yet. Please wait for sync before moving it to Trash.','error'); return false; }
    const deletedAt=nowISO(); const expiresAt=new Date(Date.now()+RANK4_TRASH_RETENTION_DAYS*86400000).toISOString();
    const trash={ id:uid('trash'), user_id:CURRENT_USER_ID, entity_key:entityKey, record_id:record.id, record_payload:record, source_revision:Number(sourceRevision)||1, source_mode:(entityKey==='trades'||entityKey==='accounts')?normalizeAppMode(record.mode):null, source_account_id:entityKey==='trades'?(record.accountId||null):null, deleted_at:deletedAt, expires_at:expiresAt, created_by:'user_delete', metadata:{title:rank4EntityTitle(entityKey,record)} };
    await RecoveryDB.createTrash(trash);
    collection.splice(index,1); syncSelectedAccounts(State.db); DB.persist(State.db); CloudSync.enqueueDiff(State.db); await CloudSync.push(State.db);
    return true;
  },
  async restore(trashId){
    if(!CURRENT_USER_ID || !(await RecoveryDB.detect())) throw new Error('Trash recovery is unavailable.');
    const item=await RecoveryDB.getTrash(trashId,CURRENT_USER_ID); if(!item) throw new Error('This Trash item is no longer available.');
    if(new Date(item.expires_at).getTime()<Date.now()) throw new Error('This Trash item has passed its 30-day restore window.');
    const entityKey=item.entity_key, record=rank4Clone(item.record_payload); if(!ENTITY_KEYS.includes(entityKey)||!record||!record.id) throw new Error('Trash item is invalid.');
    if((State.db[entityKey]||[]).some(current=>idEq(current.id,record.id))) throw new Error('A record with this original ID already exists. ASCEND will not overwrite it.');
    const remote=await CloudDB.fetchRemoteRecord(entityKey,record.id,CURRENT_USER_ID); if(remote) throw new Error('A record with this original ID already exists in the cloud. ASCEND will not overwrite it.');
    const result=await CloudDB.writeRecord(entityKey,record,CURRENT_USER_ID,null); if(!result.applied) throw new Error('A cloud collision prevented restore. Your Trash snapshot remains safe.');

    return record;
  },
  async purgeExpired(trashId){
    const item=await RecoveryDB.getTrash(trashId,CURRENT_USER_ID); if(!item) return false;
    if(new Date(item.expires_at).getTime()>=Date.now()) throw new Error('This item remains restorable until '+new Date(item.expires_at).toLocaleString()+'.');
    await RecoveryDB.deleteTrash(item.id,CURRENT_USER_ID); return true;
  }
};

// ===================== MEDIA (Supabase Storage, IndexedDB as local cache only) =====================
// Same public interface as the old local-only IDB, so every screenshot call site
// (upload fields, previews, import/export, reset) is untouched. Supabase Storage
// (bucket "media", path `${user_id}/${mediaId}`) is now the source of truth;
// IndexedDB just makes repeat reads instant and gives an offline cache.
const IDB = {
  _db: null,
  dbName: LEGACY_MEDIA_DB,
  open(){
    return new Promise((resolve,reject)=>{
      if(this._db && this._db.name === this.dbName) return resolve(this._db);
      this._db = null;
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = (e)=>{ const db = e.target.result; if(!db.objectStoreNames.contains('media')) db.createObjectStore('media',{keyPath:'id'}); };
      req.onsuccess = (e)=>{ this._db = e.target.result; resolve(this._db); };
      req.onerror = (e)=>reject(e);
    });
  },
  async _cachePut(id, dataURL, meta){
    const db = await this.open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction('media','readwrite');
      tx.objectStore('media').put({ id, dataURL, meta: meta||{}, createdAt: nowISO() });
      tx.oncomplete = ()=>resolve(id);
      tx.onerror = (e)=>reject(e);
    });
  },
  async _cacheGet(id){
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readonly');
      const req = tx.objectStore('media').get(id);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>resolve(null);
    });
  },
  async _cacheDelete(id){
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readwrite');
      tx.objectStore('media').delete(id);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  },
  async _cacheAll(){
    // Raw local-only listing, used only for first-login legacy migration.
    const db = await this.open();
    return new Promise((resolve)=>{
      const tx = db.transaction('media','readonly');
      const req = tx.objectStore('media').getAll();
      req.onsuccess = ()=>resolve(req.result||[]);
      req.onerror = ()=>resolve([]);
    });
  },
  async put(id, dataURL, meta){
    await this._cachePut(id, dataURL, meta); // instant local preview
    if(CURRENT_USER_ID){
      try{
        const blob = dataURLtoBlob(dataURL);
        const { error } = await sb.storage.from('media').upload(`${CURRENT_USER_ID}/${id}`, blob, { upsert:true, contentType: blob.type||'image/png' });
        if(error) throw error;
      }catch(e){
        console.error('ASCEND media upload error', e);
        toast('Screenshot saved locally but failed to sync to the cloud','error');
      }
    }
    return id;
  },
  async get(id){
    if(!id) return null;
    const cached = await this._cacheGet(id);
    if(cached) return cached;
    if(!CURRENT_USER_ID) return null;
    try{
      const { data, error } = await sb.storage.from('media').download(`${CURRENT_USER_ID}/${id}`);
      if(error || !data) return null;
      const dataURL = await blobToDataURL(data);
      await this._cachePut(id, dataURL, {});
      return { id, dataURL, meta:{}, createdAt: nowISO() };
    }catch(e){ return null; }
  },
  async delete(id){
    await this._cacheDelete(id);
    if(CURRENT_USER_ID){
      try{ await sb.storage.from('media').remove([`${CURRENT_USER_ID}/${id}`]); }
      catch(e){ console.error('ASCEND media delete error', e); }
    }
    return true;
  },
  async all(){
    // Full set for this user — used by export & reset, so it must include cloud-only
    // items too (not just whatever happens to be cached locally on this device).
    if(!CURRENT_USER_ID) return [];
    try{
      const { data: files, error } = await sb.storage.from('media').list(CURRENT_USER_ID, { limit: 1000 });
      if(error || !files) return [];
      const out = [];
      for(const f of files){
        const rec = await this.get(f.name);

      }

    }catch(e){ return []; }
  },
  async count(){
    if(!CURRENT_USER_ID) return 0;
    try{
      const { data: files, error } = await sb.storage.from('media').list(CURRENT_USER_ID, { limit: 1000 });
      if(error || !files) return 0;
      return files.length;
    }catch(e){ return 0; }
  }
};
// Storage calls cannot join a Postgres transaction. A successful reset/replace
// therefore records an owner-scoped job in the transaction, then this bounded
// processor performs real object removal and reports success only after it returns.
const MediaCleanup = {
  async listPending(){
    if(!CURRENT_USER_ID || !(await CloudCapabilities.detectWorkspaceTransactions())) return [];
    const {data,error}=await sb.from('ascend_media_cleanup_jobs').select('*').eq('user_id',CURRENT_USER_ID).order('created_at',{ascending:true}).limit(20);
    if(error) throw new Error(error.message||'Could not load media cleanup status.');
    return (data||[]).filter(job=>job.status==='pending'||job.status==='failed');
  },
  async updateJob(job,patch){
    const {error}=await sb.from('ascend_media_cleanup_jobs').update(Object.assign({},patch,{updated_at:nowISO()})).eq('id',job.id).eq('user_id',CURRENT_USER_ID);
    if(error) throw new Error(error.message||'Could not update media cleanup status.');
  },
  async processJob(job){
    if(!job || !CURRENT_USER_ID) return {ok:false,removed:0};
    try{
      await this.updateJob(job,{status:'processing',attempted_at:nowISO(),attempts:Number(job.attempts||0)+1,last_error:null});
      const {data:files,error:listError}=await sb.storage.from('media').list(CURRENT_USER_ID,{limit:1000});
      if(listError) throw listError;
      const retained=new Set((Array.isArray(job.retained_media_ids)?job.retained_media_ids:[]).map(value=>String(value)));
      const names=(files||[]).map(file=>String(file.name||'')).filter(name=>name&&!retained.has(name));
      if(names.length){
        const {error:removeError}=await sb.storage.from('media').remove(names.map(name=>`${CURRENT_USER_ID}/${name}`));
        if(removeError) throw removeError;
      }
      await this.updateJob(job,{status:'completed',completed_at:nowISO(),last_error:null});
      return {ok:true,removed:names.length};
    }catch(error){
      try{ await this.updateJob(job,{status:'failed',attempted_at:nowISO(),attempts:Number(job.attempts||0)+1,last_error:String(error&&error.message||error).slice(0,500)}); }catch(updateError){ console.error('ASCEND media cleanup status update error',updateError); }
      return {ok:false,removed:0,error};
    }
  },
  async processJobById(jobId){
    const jobs=await this.listPending(); const job=jobs.find(item=>String(item.id)===String(jobId));
    return job?this.processJob(job):{ok:false,removed:0,error:new Error('Media cleanup job is unavailable.')};
  },
  async pendingCount(){ try{return (await this.listPending()).length;}catch(error){return 0;} }
};

// Reusable async media-preview mounter: fills a `[data-media-id]` container
// with an <img> loaded from IndexedDB. Removes the container entirely if the
// media record is missing so no empty placeholder is left behind.
async function mountMediaPreview(el){
  const mediaId = el && el.dataset ? el.dataset.mediaId : null;
  if(!el) return;
  if(!mediaId){ el.remove(); return; }
  try{
    const rec = await IDB.get(mediaId);
    if(rec && rec.dataURL){
      const img = document.createElement('img');
      img.src = rec.dataURL;
      img.alt = '';
      el.appendChild(img);
    } else {
      el.remove();
    }
  }catch(e){
    el.remove();
  }
}
function mountMediaPreviews(root){
  if(!root) return;
  root.querySelectorAll('[data-media-id]').forEach(mountMediaPreview);
}
